schema: centraldark.webmcp-fragment-bridge.v1
status: CANDIDATE

owners:
  transport: docs/CONSCIENCIA/MCP-FLUXO.md
  cognition: docs/CONSCIENCIA/METACOGNICAO-OPERACIONAL.md
  compiler: .agents/skills/knowledge-compiler/SKILL.md
  executable_bridge: .agents/skills/knowledge-compiler/scripts/fragment-bridge.mjs

intent: >-
  Absorver fragmentos de WebMCP, bundles e envelopes de sessão como matéria de mineração,
  preservando proveniência e deduplicação, e transformá-los em candidatos de rota para o
  MCP e o motor cognitivo existentes sem criar segundo cérebro, segundo MCP ou autoridade nova.

