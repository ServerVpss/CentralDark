<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">CENTRALDARK - COMPUTADOR DE BORDO V2</title>
  <desc id="desc">Poster vertical com protocolo CentralDark, modos de BOOT, emojis estrategicos e fio da missao.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020506"/>
      <stop offset="0.48" stop-color="#071119"/>
      <stop offset="1" stop-color="#020204"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16ff7c"/>
      <stop offset="0.52" stop-color="#10d7ff"/>
      <stop offset="1" stop-color="#39ffb6"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2018"/>
      <stop offset="1" stop-color="#07131c"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0 L0 0 0 54" fill="none" stroke="#153442" stroke-width="1" opacity="0.38"/>
    </pattern>
    <style>
      .body { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .tech { font-family: Rajdhani, Arial Narrow, Segoe UI, Arial, sans-serif; letter-spacing: 1.5px; }
      .eyebrow { font-size: 22px; font-weight: 800; fill: #68ffb0; letter-spacing: 5px; }
      .title { font-size: 48px; font-weight: 900; fill: #f4feff; letter-spacing: 1px; }
      .sub { font-size: 24px; font-weight: 700; fill: #a5f6ff; }
      .cardTitle { font-size: 25px; font-weight: 900; fill: #061014; letter-spacing: 2px; }
      .txt { font-size: 25px; font-weight: 760; fill: #ebfdff; }
      .txt2 { font-size: 22px; font-weight: 720; fill: #d8fbff; }
      .small { font-size: 19px; font-weight: 720; fill: #b9eff5; }
      .tag { font-size: 20px; font-weight: 900; fill: #062016; }
      .footer { font-size: 25px; font-weight: 850; fill: #efffff; }
    </style>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)" opacity="0.58"/>
  <path d="M0 330 C230 240 360 390 585 285 C770 198 900 170 1080 215" fill="none" stroke="#10d7ff" stroke-width="2" opacity="0.17"/>
  <path d="M0 1495 C210 1380 330 1570 540 1484 C745 1400 830 1295 1080 1345 L1080 1920 L0 1920 Z" fill="#06222a" opacity="0.48"/>

  <g opacity="0.8">
    <path d="M40 44 H260 M40 44 V214 M1040 44 H820 M1040 44 V214 M40 1876 H260 M40 1876 V1706 M1040 1876 H820 M1040 1876 V1706" fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <g transform="translate(70 66)">
    <text class="tech eyebrow" x="0" y="24">PROTOCOLO CENTRALDARK V2</text>
    <text class="tech title" x="0" y="78">COMPUTADOR DE BORDO</text>
    <rect x="0" y="112" width="940" height="4" rx="2" fill="url(#neon)" filter="url(#glow)"/>
    <text class="body sub" x="0" y="154">PT-BR direto. Evidencia primeiro. Acao minima. Registro no Git.</text>
  </g>

  <g transform="translate(70 245)" filter="url(#shadow)">
    <rect x="0" y="0" width="940" height="188" rx="20" fill="#070b12" stroke="#1d5c58" stroke-width="2"/>
    <path d="M0 0 H940 V58 H0 Z" fill="url(#neon)"/>
    <text class="tech cardTitle" x="28" y="38">REGRA FIXA</text>
    <text class="body txt" x="28" y="98">Pivete comanda. DarkAI debate. Actions provam.</text>
    <text class="body txt" x="28" y="136">IAs variam. O método permanece.</text>
  </g>

  <g transform="translate(70 468)" filter="url(#shadow)">
    <rect x="0" y="0" width="290" height="310" rx="18" fill="url(#soft)" stroke="#16ff7c" stroke-width="2"/>
    <rect x="22" y="22" width="144" height="34" rx="17" fill="#16ff7c"/>
    <text class="body tag" x="40" y="46">ECONOMICO</text>
    <text class="body txt2" x="22" y="91">Conversa normal</text>
    <text class="body txt2" x="22" y="126">Arte, ideia, design</text>
    <text class="body txt2" x="22" y="161">Dúvida simples</text>
    <text class="body small" x="22" y="216">Ler só o essencial:</text>
    <text class="body small" x="22" y="248">Knowledge v2 + pendências</text>
    <text class="body small" x="22" y="278">quando precisar</text>
  </g>

  <g transform="translate(395 468)" filter="url(#shadow)">
    <rect x="0" y="0" width="290" height="310" rx="18" fill="url(#soft)" stroke="#10d7ff" stroke-width="2"/>
    <rect x="22" y="22" width="105" height="34" rx="17" fill="#10d7ff"/>
    <text class="body tag" x="43" y="46">MEDIO</text>
    <text class="body txt2" x="22" y="91">GitHub, docs, PR</text>
    <text class="body txt2" x="22" y="126">Issue, arquitetura</text>
    <text class="body txt2" x="22" y="161">Planejamento técnico</text>
    <text class="body small" x="22" y="216">Usar branch/PR se</text>
    <text class="body small" x="22" y="248">mudança for crítica</text>
  </g>

  <g transform="translate(720 468)" filter="url(#shadow)">
    <rect x="0" y="0" width="290" height="310" rx="18" fill="url(#soft)" stroke="#ffcc4d" stroke-width="2"/>
    <rect x="22" y="22" width="138" height="34" rx="17" fill="#ffcc4d"/>
    <text class="body tag" x="42" y="46">COMPLETO</text>
    <text class="body txt2" x="22" y="91">VPS, Actions</text>
    <text class="body txt2" x="22" y="126">Deploy, produção</text>
    <text class="body txt2" x="22" y="161">PM2, Caddy, banco</text>
    <text class="body small" x="22" y="216">Read-only primeiro.</text>
    <text class="body small" x="22" y="248">Ação sensível só com</text>
    <text class="body small" x="22" y="278">autorização.</text>
  </g>

  <g transform="translate(70 830)" filter="url(#shadow)">
    <rect x="0" y="0" width="940" height="232" rx="20" fill="#070b12" stroke="#1d5c58" stroke-width="2"/>
    <path d="M0 0 H940 V58 H0 Z" fill="url(#neon)"/>
    <text class="tech cardTitle" x="28" y="38">CICLO OFICIAL</text>
    <text class="body txt" x="32" y="106">Ler. Validar. Agir mínimo. Provar. Registrar.</text>
    <text class="body txt2" x="32" y="157">Sem achismo. Sem segredo exposto. Sem ação destrutiva sem autorização.</text>
    <text class="body txt2" x="32" y="198">Retomar o fio da missão antes de encerrar.</text>
  </g>

  <g transform="translate(70 1110)" filter="url(#shadow)">
    <rect x="0" y="0" width="455" height="320" rx="18" fill="#070b12" stroke="#1d5c58" stroke-width="2"/>
    <path d="M0 0 H455 V58 H0 Z" fill="url(#neon)"/>
    <text class="tech cardTitle" x="24" y="38">EMOJIS E STATUS</text>
    <text class="body txt2" x="24" y="100">🟢 sucesso / estável / OK</text>
    <text class="body txt2" x="24" y="140">🟡 atenção / pendência</text>
    <text class="body txt2" x="24" y="180">🔴 erro / alerta / risco</text>
    <text class="body txt2" x="24" y="220">🚀 execução / deploy</text>
    <text class="body txt2" x="24" y="260">🛠️ manutenção / infra</text>
    <text class="body txt2" x="24" y="300">🔄 Git / sincronia / PR</text>
  </g>

  <g transform="translate(555 1110)" filter="url(#shadow)">
    <rect x="0" y="0" width="455" height="320" rx="18" fill="#070b12" stroke="#1d5c58" stroke-width="2"/>
    <path d="M0 0 H455 V58 H0 Z" fill="url(#neon)"/>
    <text class="tech cardTitle" x="24" y="38">NUNCA SEM OK</text>
    <text class="body txt2" x="24" y="100">Secrets, .env, token, chave</text>
    <text class="body txt2" x="24" y="140">Force-push ou main suja</text>
    <text class="body txt2" x="24" y="180">Deploy / restart / reset</text>
    <text class="body txt2" x="24" y="220">Caddy, Docker, banco real</text>
    <text class="body txt2" x="24" y="260">Apagar definitivo / rm</text>
    <text class="body txt2" x="24" y="300">Ação irreversível</text>
  </g>

  <g transform="translate(70 1482)" filter="url(#shadow)">
    <rect x="0" y="0" width="940" height="235" rx="20" fill="#071014" stroke="#16ff7c" stroke-width="2"/>
    <text class="tech eyebrow" x="28" y="48">MENTALIDADE</text>
    <text class="body txt" x="28" y="98">CentralDark é operação real. Não é demo.</text>
    <text class="body txt" x="28" y="138">Não é achismo. Não é gambiarra silenciosa.</text>
    <text class="body txt" x="28" y="188">Ler. Validar. Agir mínimo. Provar. Registrar. Retomar o fio.</text>
  </g>

  <g transform="translate(70 1770)">
    <rect x="0" y="0" width="940" height="4" rx="2" fill="url(#neon)" filter="url(#glow)"/>
    <text class="body footer" x="0" y="54">Fonte oficial: ServerVpss/CentralDark · PROJECT-KNOWLEDGE-CENTRALDARK-V2</text>
    <text class="body small" x="0" y="92">Conversa normal: BOOT Economico · GitHub/docs: BOOT Medio · VPS/producao: BOOT Completo</text>
  </g>
</svg>
