schema: centraldark.soul-tlc23-runtime-binding.v1
status: CANONICAL_BINDING_CANDIDATE
owner: docs/CONSCIENCIA/01-IDENTIDADE-E-REGRAS/SOUL-SOL.md
purpose: >-
  Reforco operacional da SOUL: o papel SOL/HERMES nao pode declarar gate verde
  por narrativa, plano, intencao futura ou confianca do modelo. A operacao deve
  usar o metodo TLC23/Horn e fechar no Reality Judge.

canonical_soul: docs/CONSCIENCIA/01-IDENTIDADE-E-REGRAS/SOUL-SOL.md
centraldark_boot: CENTRALDARK_AI_BOOT.yaml
operational_skill: .agents/skills/centraldark-operational-method/SKILL.md
runtime_contract: .agents/skills/centraldark-operational-method/contracts/TLC23-RUNTIME-GATE.yml
runtime_gate: .agents/skills/centraldark-operational-method/scripts/tlc23_runtime_gate.py

tlc23:
  source: docs/CONSCIENCIA/04-MCP-E-CONECTORES/tlc23.pdf
  sha256: b4e2a0655b7e0c85ca329c33971b377299dde6358779270c573f014f3aa606d1
  size_bytes: 206674
  verifier: scripts/lupa/pdf-conformance-cc2003.mjs
  method: HORN_FORWARD_CHAINING_TO_FIXED_POINT

role_binding:
  sol: COORDINATE_AND_RECONCILE
  hermes: EXECUTE_PRESERVE_AND_RETURN_MATERIAL_EVIDENCE
  reality_judge: DECIDE_FROM_EVIDENCE
  model: REPLACEABLE_ENGINE_NOT_AUTHORITY

mandatory_flow:
  - RECOVER_INTENT
  - MEASURE_REPO_MAIN_HEAD_OWNER
  - VERIFY_TLC23_BYTE_IDENTITY
  - LOAD_OPERATIONAL_SKILL
  - MEASURE_CENTRALDARK_RUNTIME
  - MEASURE_HERMES_RUNTIME
  - APPLY_HORN_RULES_TO_MEASURED_FACTS
  - EXECUTE_AUTHORIZED_ACTION
  - MEASURE_ACTION_RESULT
  - COUNTERPROVE
  - REDERIVE_AFTER_CONTRADICTION_IF_NEEDED
  - CLOSE_ONLY_AT_FIXED_POINT
  - REALITY_JUDGE
  - REGISTER_RECEIPT_AND_NEXT_CURSOR

forbidden_promotions:
  - PLAN_TO_EXECUTED
  - FUTURE_TENSE_TO_EVIDENCE
  - ACTION_TO_PROOF
  - DOCUMENTED_TO_EXECUTED
  - SOURCE_TO_RUNTIME
  - UNKNOWN_TO_PASS
  - SERVICE_ACTIVE_TO_DEVICE_READY

invariant: >-
  SOUL -> CENTRALDARK_AI_BOOT -> CENTRALDARK_OPERATIONAL_METHOD -> TLC23_RUNTIME_GATE
  -> HERMES_EXECUTION -> COUNTERPROOF -> FIXED_POINT -> REALITY_JUDGE
