<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">CENTRALDARK — MODO ARSENAL</title>
  <desc id="desc">Poster vertical 9:16 estilo dashboard tatico futurista com cards de boot, missao, seguranca, modo, fio da meada e orquestra.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030609"/>
      <stop offset="0.45" stop-color="#071018"/>
      <stop offset="1" stop-color="#020304"/>
    </linearGradient>
    <linearGradient id="neonLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19ff7a"/>
      <stop offset="0.52" stop-color="#12d8ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19ff7a"/>
      <stop offset="0.55" stop-color="#12d8ff"/>
      <stop offset="1" stop-color="#3c5bff"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#12d8ff" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#143442" stroke-width="1" opacity="0.45"/>
    </pattern>
    <style>
      .mono { font-family: "Inter", "Segoe UI", Arial, sans-serif; }
      .tech { font-family: "Rajdhani", "Arial Narrow", "Segoe UI", Arial, sans-serif; letter-spacing: 1.6px; }
      .small { font-size: 22px; fill: #a9f7ff; opacity: 0.86; }
      .title { font-size: 43px; font-weight: 800; fill: #f4feff; letter-spacing: 1px; }
      .subtitle { font-size: 21px; font-weight: 600; fill: #68ffb0; letter-spacing: 4px; }
      .card-title { font-size: 26px; font-weight: 800; fill: #071015; letter-spacing: 2px; }
      .card-text { font-size: 26px; font-weight: 650; fill: #e9fdff; }
      .card-text-small { font-size: 24px; font-weight: 650; fill: #e9fdff; }
      .muted { fill: #a8cfd6; }
      .footer { font-size: 25px; font-weight: 800; fill: #eaffff; letter-spacing: 0.6px; }
    </style>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)" opacity="0.58"/>
  <path d="M0 1490 C190 1410 315 1585 520 1508 C724 1431 825 1260 1080 1320 L1080 1920 L0 1920 Z" fill="#071d25" opacity="0.55"/>
  <path d="M0 290 C180 230 278 374 444 310 C661 227 790 96 1080 152" fill="none" stroke="#12d8ff" stroke-width="2" opacity="0.18"/>
  <path d="M0 360 C210 300 315 430 505 350 C720 260 860 180 1080 235" fill="none" stroke="#19ff7a" stroke-width="2" opacity="0.14"/>

  <g opacity="0.8">
    <circle cx="84" cy="126" r="3" fill="#19ff7a"/>
    <circle cx="1002" cy="118" r="3" fill="#12d8ff"/>
    <circle cx="973" cy="1804" r="3" fill="#19ff7a"/>
    <circle cx="94" cy="1815" r="3" fill="#12d8ff"/>
    <path d="M72 110 H214 M866 110 H1008 M72 1810 H214 M866 1810 H1008" stroke="url(#neonLine)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)"/>
  </g>

  <g transform="translate(70 58)">
    <text class="tech subtitle" x="0" y="28">PROTOCOLO CENTRALDARK</text>
    <text class="tech title" x="0" y="92">CENTRALDARK — MODO ARSENAL</text>
    <rect x="0" y="125" width="940" height="4" rx="2" fill="url(#neonLine)" filter="url(#softGlow)"/>
    <text class="mono small" x="0" y="170">dashboard tático • operação GitHub Actions • correção mínima com evidência</text>
  </g>

  <g transform="translate(70 280)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="455" height="375" rx="18" fill="#071016" stroke="url(#cardStroke)" stroke-width="2"/>
    <path d="M0 0 H455 V60 H0 Z" fill="url(#neonLine)" opacity="0.96"/>
    <text class="tech card-title" x="26" y="40">BOOT:</text>
    <text class="mono card-text" x="26" y="96">Ler PENDENCIAS.md</text>
    <text class="mono card-text" x="26" y="139">Ler APRENDIZADOS.md</text>
    <text class="mono card-text" x="26" y="182">Ler 09-ESTADO-ATUAL.md</text>
    <text class="mono card-text" x="26" y="225">Ver VPS</text>
    <text class="mono card-text" x="26" y="268">Agir com evidência</text>
    <text class="mono card-text" x="26" y="311">Registrar o ouro</text>
    <path d="M26 346 H429" stroke="#19ff7a" stroke-width="2" opacity="0.42"/>
  </g>

  <g transform="translate(555 280)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="455" height="375" rx="18" fill="#071016" stroke="url(#cardStroke)" stroke-width="2"/>
    <path d="M0 0 H455 V60 H0 Z" fill="url(#neonLine)" opacity="0.96"/>
    <text class="tech card-title" x="26" y="40">MISSÃO:</text>
    <text class="mono card-text" x="26" y="98">PR #109</text>
    <text class="mono card-text" x="26" y="144">GitHub Actions:</text>
    <text class="mono card-text-small" x="26" y="188">supabase-bot +</text>
    <text class="mono card-text-small" x="26" y="226">painel-validacao</text>
    <text class="mono card-text-small" x="26" y="270">Checks self-hosted queued</text>
    <text class="mono card-text-small" x="26" y="314">Hipótese: runner parado/</text>
    <text class="mono card-text-small" x="26" y="348">ocupado/label errada</text>
  </g>

  <g transform="translate(70 690)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="455" height="420" rx="18" fill="#071016" stroke="url(#cardStroke)" stroke-width="2"/>
    <path d="M0 0 H455 V60 H0 Z" fill="url(#neonLine)" opacity="0.96"/>
    <text class="tech card-title" x="26" y="40">SEGURANÇA:</text>
    <text class="mono card-text" x="26" y="100">Sem secrets</text>
    <text class="mono card-text" x="26" y="143">Sem .env</text>
    <text class="mono card-text" x="26" y="186">Sem force-push</text>
    <text class="mono card-text" x="26" y="229">Sem main suja</text>
    <text class="mono card-text-small" x="26" y="272">Sem restart/deploy</text>
    <text class="mono card-text-small" x="26" y="308">sem autorização</text>
    <text class="mono card-text-small" x="26" y="352">Sem produção sem</text>
    <text class="mono card-text-small" x="26" y="388">evidência</text>
  </g>

  <g transform="translate(555 690)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="455" height="420" rx="18" fill="#071016" stroke="url(#cardStroke)" stroke-width="2"/>
    <path d="M0 0 H455 V60 H0 Z" fill="url(#neonLine)" opacity="0.96"/>
    <text class="tech card-title" x="26" y="40">MODO:</text>
    <text class="mono card-text-small" x="26" y="96">Sempre indicar modo</text>
    <text class="mono card-text-small" x="26" y="130">universal:</text>
    <text class="mono card-text" x="26" y="178">Conversa</text>
    <text class="mono card-text" x="26" y="219">Planejamento</text>
    <text class="mono card-text" x="26" y="260">Read-only</text>
    <text class="mono card-text" x="26" y="301">Edição controlada</text>
    <text class="mono card-text" x="26" y="342">Execução com travas</text>
    <path d="M26 366 H429" stroke="#12d8ff" stroke-width="2" opacity="0.42"/>
  </g>

  <g transform="translate(70 1145)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="455" height="360" rx="18" fill="#071016" stroke="url(#cardStroke)" stroke-width="2"/>
    <path d="M0 0 H455 V60 H0 Z" fill="url(#neonLine)" opacity="0.96"/>
    <text class="tech card-title" x="26" y="40">FIO DA MEADA:</text>
    <text class="mono card-text-small" x="26" y="100">Se tiver conversa paralela:</text>
    <text class="mono card-text" x="26" y="154">Responder</text>
    <text class="mono card-text" x="26" y="197">Fechar</text>
    <text class="mono card-text" x="26" y="240">Retomar missão</text>
    <text class="mono card-text" x="26" y="283">Dizer próximo passo</text>
  </g>

  <g transform="translate(555 1145)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="455" height="360" rx="18" fill="#071016" stroke="url(#cardStroke)" stroke-width="2"/>
    <path d="M0 0 H455 V60 H0 Z" fill="url(#neonLine)" opacity="0.96"/>
    <text class="tech card-title" x="26" y="40">ORQUESTRA:</text>
    <text class="mono card-text" x="26" y="100">Pivete comanda</text>
    <text class="mono card-text" x="26" y="143">Vibe executa</text>
    <text class="mono card-text" x="26" y="186">GPT/Codex revisa</text>
    <text class="mono card-text" x="26" y="229">DarkAI debate</text>
    <text class="mono card-text" x="26" y="272">Actions provam</text>
    <path d="M26 313 H429" stroke="#ff2bd6" stroke-width="2" opacity="0.35"/>
  </g>

  <g transform="translate(70 1570)">
    <rect x="0" y="0" width="940" height="205" rx="22" fill="#081219" stroke="url(#neonLine)" stroke-width="3" filter="url(#cardShadow)"/>
    <path d="M28 34 H912" stroke="url(#neonLine)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>
    <text class="tech" x="28" y="87" fill="#68ffb0" font-size="25" font-weight="800" letter-spacing="4">RODAPÉ:</text>
    <text class="mono footer" x="28" y="135">Evidência primeiro. Correção mínima.</text>
    <text class="mono footer" x="28" y="174">Histórico no GitHub.</text>
  </g>

  <g opacity="0.72">
    <path d="M41 44 H260 M41 44 V214 M1039 44 H820 M1039 44 V214 M41 1876 H260 M41 1876 V1706 M1039 1876 H820 M1039 1876 V1706" fill="none" stroke="url(#neonLine)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>
    <text class="tech" x="70" y="1848" fill="#5dfca2" font-size="18" letter-spacing="5">CENTRALDARK / TACTICAL OPS</text>
    <text class="tech" x="790" y="1848" fill="#6eeeff" font-size="18" letter-spacing="5">PR-109</text>
  </g>
</svg>
