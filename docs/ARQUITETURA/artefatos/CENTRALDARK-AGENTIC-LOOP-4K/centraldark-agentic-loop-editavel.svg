<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
<rect width="100%" height="100%" fill="#040a0e"/>
<text x="150" y="170" fill="#29df85" font-size="88" font-family="DejaVu Sans" font-weight="700">CENTRALDARK</text>
<text x="150" y="245" fill="#eaf4f0" font-size="46" font-family="DejaVu Sans" font-weight="700">AGENTIC ENGINEERING LOOP — SISTEMA QUE CONSTRÓI O SISTEMA</text>
<text x="150" y="300" fill="#98b3ad" font-size="29" font-family="DejaVu Sans">Pivete comanda • IAs variam • o método permanece • Git registra • Actions provam</text>
<line x1="150" y1="400" x2="3690" y2="400" stroke="#1a8752" stroke-width="4"/>
<text x="210" y="365" fill="#29df85" font-size="38" font-family="DejaVu Sans" font-weight="700">AI / AGENTES</text>
<text x="3110" y="365" fill="#32c2ff" font-size="38" font-family="DejaVu Sans" font-weight="700">API / GITHUB / VPS</text>
<!-- A versão PNG contém o diagrama completo; este SVG é uma base editável limpa. -->
<rect x="150" y="500" width="3540" height="1350" rx="34" fill="#0b161d" stroke="#29df85" stroke-width="3"/>
<text x="240" y="590" fill="#eaf4f0" font-size="38" font-family="DejaVu Sans" font-weight="700">ENTRADA → ORQUESTRAÇÃO → GATES → GITHUB/ACTIONS → VPS → FEEDBACK</text>
<text x="240" y="690" fill="#98b3ad" font-size="30" font-family="DejaVu Sans">Support / Product / Engineer → Kanban Ticket → Engineer Prompt → Start Factory → Factory Router Agent → Pivete Gate</text>
<text x="240" y="790" fill="#98b3ad" font-size="30" font-family="DejaVu Sans">LER → PERGUNTAR → AGIR → PROVAR → REGISTRAR</text>
<text x="240" y="940" fill="#29df85" font-size="34" font-family="DejaVu Sans" font-weight="700">TRILHA 1</text>
<text x="500" y="940" fill="#eaf4f0" font-size="30" font-family="DejaVu Sans">Planner → Build → Test → Engineer Review → Auditor / MetaLupa → Approve / Block</text>
<text x="240" y="1090" fill="#32c2ff" font-size="34" font-family="DejaVu Sans" font-weight="700">TRILHA 2</text>
<text x="500" y="1090" fill="#eaf4f0" font-size="30" font-family="DejaVu Sans">Build → Lint → Format → Test → Review → PR Ready (loops de falha retornam ao Build)</text>
<text x="240" y="1240" fill="#ffd33e" font-size="34" font-family="DejaVu Sans" font-weight="700">TRILHA 3</text>
<text x="500" y="1240" fill="#eaf4f0" font-size="30" font-family="DejaVu Sans">Worktrees paralelas A/B/C → Merge Gate → Ship</text>
<text x="240" y="1440" fill="#ff7e27" font-size="34" font-family="DejaVu Sans" font-weight="700">PAPÉIS FUNCIONAIS</text>
<text x="620" y="1440" fill="#eaf4f0" font-size="30" font-family="DejaVu Sans">Planejador • Executor • Revisor/Crítico • Auditor • Notificador</text>
<text x="240" y="1590" fill="#32c2ff" font-size="34" font-family="DejaVu Sans" font-weight="700">PROVA</text>
<text x="430" y="1590" fill="#eaf4f0" font-size="30" font-family="DejaVu Sans">PR • diff • testes • Actions • logs • health-check • registro canônico</text>
<rect x="0" y="2040" width="3840" height="120" fill="#050f13"/>
<text x="150" y="2115" fill="#ffd33e" font-size="34" font-family="DejaVu Sans" font-weight="700">REGRA DE OURO</text>
<text x="540" y="2115" fill="#eaf4f0" font-size="29" font-family="DejaVu Sans" font-weight="700">Evidência primeiro • Correção mínima • Histórico no Git • Registrar o ouro no final</text>
</svg>
