id: CENTRALDARK_UNIFIED_SURFACE_PARITY_01
status: CONTRACT_FIRST_ENGINE_LATER
created_from: voice_to_text_crystal_2026_09_26
purpose: >
  Unificar Texto, Voz, Work, Desktop, Hermes, SOL, Worker e futuros modelos no
  mesmo funil de intenção, mesmo capability bus e mesma lei de receipt, sem
  criar arquitetura paralela.

core_law:
  INTENT_FIRST: true
  PERTINENCE_FIRST: true
  NO_UNREQUESTED_ADVICE: true
  NO_INVENTED_MISSION: true
  OBSERVATION_NEQ_EXECUTION_REQUEST: true
  EXPLICIT_ORDER_EQ_EXECUTION_REQUEST: true
  CRISTAL_PROVADO_EQ_REPLAY_FIRST: true
  REUSE_BEFORE_CREATE: true
  EVOLVE_EXISTING_BEFORE_CREATE: true
  ONE_OWNER_PER_CAPABILITY: true
  ONE_SYSTEM_ONLY: true
  CURRENT_GT_HISTORY: true
  UNKNOWN_NEQ_PASS: true
  DOCUMENTED_NEQ_EXECUTED: true
  EXISTS_NEQ_RUNNING: true
  REALITY_IS_JUDGE: true

surface_identity_model:
  global_chat_class: CHAT_GLOBAL
  examples:
    - CHATGPT
    - CLAUDE_CHAT
    - GEMINI_CHAT
    - GROK_CHAT
    - FUTURE_CHAT
  invariants:
    BRAND_NE_SURFACE_CLASS: true
    SURFACE_NE_CAPABILITY: true
    SURFACE_NE_EXECUTOR_PROOF: true
    GITHUB_ACCESS_NE_SHELL_ACCESS: true
    REPO_READ_WRITE_NE_HOUSE_EXECUTION: true
    TOOL_CATALOG_NE_TOOL_EXECUTION: true
    TOOLSET_RESOLVED_AT_RUNTIME: true
    CHAT_GLOBAL_WITH_AUTHORIZED_SHELL_GAINS_EXECUTOR_CAPABILITY_IN_SCOPE: true
    LOCAL_TOOL_MISS_NE_GLOBAL_CAPABILITY_MISS: true
    MEASURED_EVIDENCE_OUTRANKS_UNMEASURED_INFERENCE_FOR_SAME_CLAIM_SCOPE_TIME: true
    LOCAL_SHELL_STATE_DOES_NOT_PROVE_REMOTE_OR_MAIN_STATE: true
    LOCAL_HEAD_IS_NOT_CURRENT_MAIN_UNLESS_REMEASURED: true
  rule: >
    Marca e superfície são proveniência; capability é medida no runtime. Uma
    superfície CHAT_GLOBAL pode ser somente consultiva, ter GitHub read/write,
    ou também executar por shell/bridge autorizado. Nenhum desses estados é
    inferido apenas pelo nome da plataforma.

authority_boundary:
  CHEFE_INTENT_IS_AUTHORITY: true
  CHEFE_COMMAND_IS_NOT_MODEL_CLAIM: true
  MODEL_CLAIM_REQUIRES_PROOF: true
  MODEL_MAY_NOT_DOWNGRADE_CHEFE_INTENT_TO_UNKNOWN: true
  UNKNOWN_APPLIES_ONLY_TO_UNMEASURED_EXTERNAL_STATE: true
  EXTERNAL_REALITY_STILL_REQUIRES_MEASUREMENT: true
  rule: >
    A intenção explícita do CHEFE trava o destino; o modelo não a rebaixa para
    UNKNOWN por insegurança própria. O ônus de prova recai sobre claims do
    modelo sobre leitura, execução, mutação, estado externo e resultado.

trigger_master:
  primary: "!CENTRALDARK"
  aliases:
    - CentralDark
    - "#ACORDAR"
    - "!CALIBRAR"
    - "!AUTO_GRILL"
    - "!GRILL_ME"
  semantics: >
    Sob demanda. Não puxa tudo sempre. Quando acionado, passa pelo funil completo
    de intenção e escolhe o menor conjunto de owners/cristais/capacidades
    pertinente ao comando.

intent_gateway:
  pipeline:
    - raw_input
    - normalize_context
    - load_INTENT_CORE
    - load_relevant_crystals
    - self_grill_before_answer
    - intent_score
    - decision_gate
    - owner_existing_first
    - execute_or_ask
    - verify_effect
    - receipt
  confidence_gate:
    high: ">= 0.90 -> execute inside authorized scope"
    medium: "0.70..0.89 -> deepen Auto-Grill"
    low: "< 0.70 -> ask CHEFE"
  multimodal_sources:
    - text
    - voice
    - image
    - video
    - file
    - screenshot
    - runtime_log
    - github
    - desktop_commander
    - mcp
    - obsidian
    - casa
    - vps

crystal_replay_protocol:
  rule: "Cristal provado não é redescoberto; provar somente a integração nova."
  steps:
    - receive_crystal_package_note_script_or_proof
    - identify_id_sha_hash_fingerprint_manifest_receipt
    - locate_equivalent_owner_on_main
    - if_no_direct_owner_find_semantic_equivalent_owner
    - compare_fingerprint_structure_declared_destination
    - plug_only_missing_delta
    - bind_minimum_surface_hook
    - test_live_effect
    - write_receipt
  forbidden:
    - audit_whole_system_without_explicit_order
    - reprove_proven_crystal_without_new_material_evidence
    - create_parallel_owner
    - create_new_architecture_for_old_material
    - loop_around_scope

auto_grill:
  id: CENTRALDARK_AUTO_GRILL_01
  behavior: >
    Antes de perguntar ao CHEFE, entrevistar a si mesmo com contrato, cristais,
    histórico, owners, logs, código e realidade atual.
  self_questions:
    - qual_e_a_intencao_real_do_chefe
    - isso_e_observacao_ou_ordem_explicita
    - existe_cristal_provado
    - qual_e_o_owner_correto
    - o_que_exatamente_mudou
    - qual_e_o_menor_delta_possivel
    - o_que_precisa_ser_testado_agora
    - o_que_nao_precisa_ser_provado_de_novo
    - qual_rota_observa_o_efeito
    - qual_receipt_fecha_a_realidade
  ask_user_only_if: lacuna_real_permanece

gev_jev_adapter:
  id: CENTRALDARK_TYPE_SAFE_INTENT_DECISION_01
  role: optional_type_safe_decision_gate
  not_role:
    - hermes_replacement
    - sol_replacement
    - cockpit
    - full_runtime
    - parallel_system
  contract_first_engine_later: true
  input:
    - intent_summary
    - scope
    - owner_candidate
    - crystal_evidence
    - risk_blast_radius
    - available_routes
  output:
    decision_enum:
      - EXECUTE
      - PROPOSE_ONLY
      - ASK_CHEFE
      - REJECT_OUT_OF_SCOPE
      - PLATFORM_UNAVAILABLE
    confidence: number_0_to_1
    reason: short_auditable
    missing: real_gaps_only

surface_parity:
  surfaces:
    text:
      expected: full_tool_binding_when_connector_exposed
    voice:
      expected: same_actions_as_text_when_platform_supports
      known_gap: voice_tool_binding_may_be_absent
    work:
      expected: heavy_implementation_surface
    desktop:
      expected: local_runtime_execution_and_observation
  tool_call_visibility_contract:
    invariant: "TOOL_CALL_EXECUTED != TOOL_CALL_VISIBLE_IN_SIDEBAR"
    tool_call_execution_is_visibility: false
    missing_renderer_means_execution_absent: false
    tool_result_means_renderer_visible: false
    canonical_trace_chain:
      - SESSION_ID
      - TRACE_ID
      - TOOL_CALL_ID
      - USAGE/TOKENS
      - RECEIPT
    visibility_states:
      - PROVED_BY_PLATFORM_RECEIPT
      - USER_CONFIRMED_VISIBILITY
      - PLATFORM_UNAVAILABLE
      - UNKNOWN
    user_visual_confirmation_is_backend_proof: false
    voice_semantic_binding:
      owner: ".claude/skills/synced/voice-semantic-classifier/SKILL.md"
      reuse_same_visibility_contract: true
      create_parallel_renderer: false
      create_voice_only_trace: false
      surface_id_is_provenance_only: true
      missing_renderer_is_not_execution_failure: true
      tool_result_is_not_renderer_proof: true

  observability_parity:
    same_canonical_session: true
    session_identity: "One SESSION_ID for the same intent/task across Text and Voice; retain SURFACE_ID as provenance."
    shared_ordered_trace: true
    sidebar_visibility:
      sessions: same_canonical_session
      tool_calls: same_ordered_trace
      usage_tokens: same_session_aggregates_and_fields
      receipts: same_session_receipts
    event_fields:
      - SESSION_ID
      - TRACE_ID
      - INTENT_ID
      - TOOL_CALL_ID
      - SURFACE_ID
      - OWNER
      - USAGE
      - RECEIPT_ID
    forbid_voice_only_session_or_trace: true
    if_platform_cannot_expose_required_trace: PLATFORM_UNAVAILABLE
  output_parity:
    same_structured_outcome: true
    canonical_fields:
      - INTENT_ID
      - DECISION
      - OWNER
      - ACTION_RESULT
      - EVIDENCE
      - COUNTERPROOF
      - RECEIPT_ID
      - NEXT_CURSOR
    preserve_intent_owner_action_and_proof: true
    rendering_may_follow_modality: true
    forbid_separate_voice_output_contract: true
  required_capabilities_when_supported:
    - github_read
    - github_write
    - create_update_files
    - create_branch
    - open_pr
    - commit_comment_receipt
    - desktop_commander_read_write_exec
    - centraldark_mcp_calls
    - plugin_creator_create_update
    - artifact_export
    - file_upload_download
    - session_tracing
    - tool_call_tracing
    - usage_tokens_trace
    - runtime_logs
    - health_probes
    - intent_scoring
    - auto_grill
    - gev_jev_typed_decision_adapter
  if_missing:
    mark: PLATFORM_UNAVAILABLE
    forbid:
      - fake_commit_claim
      - fake_file_claim
      - fake_desktop_commander_claim
      - fake_plugin_publish_claim
      - fake_artifact_link_claim

claim_readback:
  binding: scripts/trigger-fabric/rastro_fiscal.py
  CLAIM_WITHOUT_COMMIT_ON_MAIN: INVALID
  VALIDATED_CLAIM_REQUIRES_VALIDATOR_EXIT_0: true
  causal_example: >
    2026-09-26: uma superfície relatou "validou o contrato", mas o validador
    saía FAIL (marcador proibido por trecho casava com a negação "não substitui
    Hermes", e marcadores exigidos não batiam com o texto real). Relato sem
    exit 0 não é PASS.

plugin_publication_gate:
  PLUGIN_ARTIFACT_CREATED_NE_PLUGIN_PUBLISHED: true
  PLUGIN_DIRECTORY_MISS_NEQ_NOT_PUBLISHED: true
  PUBLISHED_PLUGIN_CLAIM_REQUIRES_ID_RELEASE_URL: true
  PLUGIN_SCOPE_MUST_BE_OBSERVED: true
  VOICE_BINDING_PUBLISHED_NE_VOICE_RUNTIME_EXPOSED: true
  pass_requires: [plugin_id, release_id, plugin_url, current_release_readback]
  missing_identifiers_status: UNKNOWN
  rule: >
    Codigo, ZIP, manifest ou archive nao prova plugin publicado. PASS exige
    identidade, release, URL e readback observaveis no escopo real.

execution_strategy:
  mode: hybrid
  worker_cloud_code:
    role: heavy_implementation
    tasks:
      - edit_multiple_files
      - create_plugin_archive
      - run_tests
      - create_adapters
      - publish_capability
      - generate_surface_matrix
      - commit_or_pr_if_authorized
  chat_global:
    role: oracle_and_executor_according_to_measured_authorized_tools
    examples: [chatgpt_text, claude_chat, gemini_chat, grok_chat, future_chat]
  chatgpt_text:
    role: compatibility_surface_example
    class: CHAT_GLOBAL
  voice:
    role: fast_human_surface_requiring_tool_binding
  hermes_casa:
    role: live_local_executor

validation_policy:
  principle: VALIDATION_COST_SHOULD_SCALE_WITH_BLAST_RADIUS
  doc_crystal_fast_path:
    condition:
      - files_under_docs
      - no_runtime_owner_changed
      - no_workflow_changed
      - no_package_or_deploy_changed
    action:
      - allow_main_fast_path
      - minimal_render_parse_validation
      - receipt
  runtime_path:
    condition:
      - src_app_service_changed
      - workflow_changed
      - deploy_changed
      - runtime_owner_changed
    action:
      - owner_test
      - live_counterproof
      - receipt
  crystal_package_path:
    condition:
      - package_internally_tested
      - manifest_or_fingerprint_present
      - destination_mapped
    action:
      - replay_first
      - prove_only_new_fit
      - plug_owner
      - test_live_effect

anti_loop_event_contract:
  required_fields:
    - EVENT_ID
    - SOURCE_ROUTE
    - SOURCE_DEVICE
    - INTENT_ID
    - OWNER
    - TIMESTAMP
    - HASH
    - HOP_COUNT
    - CAUSATION_ID
  rule: >
    If route A receives an event caused by route B, recognize EVENT_ID and
    CAUSATION_ID; do not emit a new event. Update state and receipt only.

worker_deliverables:
  - changed_files
  - text_voice_work_desktop_capability_matrix
  - available_capabilities_by_surface
  - missing_capabilities_by_surface
  - voice_tool_binding_design
  - intent_gateway_contract
  - auto_grill_contract
  - optional_gev_jev_adapter_contract
  - anti_fake_execution_rule
  - anti_loop_event_contract
  - validation_cost_by_blast_radius
  - tests_run
  - receipts
  - PASS_UNKNOWN_BLOCKED
  - NEXT_CURSOR

oracle_surface_contract:
  class: CHAT_GLOBAL
  mode: ADVISORY_READ_ONLY_BY_DEFAULT
  authority: NONE
  current_proven_binding:
    surface: chatgpt_text
    transport: HERMES_DESKTOP_PREVIEW
    preview_open: PASS
    isolated_chat: PASS
    query_submit: PASS
    response_capture: PASS
    provenance_ids: PASS
  required_query_ids:
    - INTENT_ID
    - EVENT_ID
    - CAUSATION_ID
    - SURFACE_ID
  expected_response_fields:
    - CANDIDATE_CLAIM
    - EVIDENCE_LIMIT
    - COUNTERPROOF
    - NEXT_READONLY_PROBE
  boundaries:
    ORACLE_OUTPUT_IS_CANDIDATE: true
    ORACLE_CANNOT_WRITE_CANONICAL_STATE_DIRECTLY: true
    ORACLE_CANNOT_CHOOSE_WRITER: true
    ORACLE_CANNOT_DECLARE_PASS_WITHOUT_REALITY_JUDGE: true
    SOURCE_IS_PROVENANCE_NOT_AUTHORITY: true
    SECRETS_AND_UNNECESSARY_PRIVATE_HISTORY_MUST_NOT_BE_SENT: true
  integration_state:
    ORACLE_QUERY_TRANSPORT: PASS
    ORACLE_RESPONSE_CAPTURE: PASS
    ORACLE_TO_CANONICAL_ENVELOPE: UNKNOWN
    ENVELOPE_TO_RECONCILIATION: UNKNOWN
    RECONCILIATION_TO_WRITER: UNKNOWN
  next_existing_owner: apps/modulos/HERMES-CORE/core/perception-orchestra.mjs
  forbid_new_oracle_engine_without_proven_gap: true

preview_navigation_contract:
  owner: centraldark-oracle-surface
  focused_tab_navigation_phrases: ["abra", "navegue", "vá para"]
  new_tab_phrases: ["abra NOVA ABA", "novo tab", "outra aba"]
  rules:
    NAVIGATE_CURRENT_TAB_NE_OPEN_NEW_PREVIEW_TAB: true
    NEW_TAB_PRESERVE_CURRENT: true
    DISTINCT_LABEL_REQUIRED: true
    NEW_TAB_REQUIRES_READBACK: true
    SITE_TARGET_BLANK_IS_NOT_RELIABLE_TAB_CREATION_PROOF: true
  proven_transport:
    open: desktop_preview
    interact: drive_preview
    readback: desktop_preview

external_surface_candidate_policy:
  surfaces:
    - CHAT_GLOBAL
    - WEB_SEARCH
    - LIBRARY
    - CONNECTORS
    - SITES
    - EXTERNAL_SKILLS
    - AUTHORIZED_BROWSER_SESSION
  rule: EXTERNAL_SURFACE_ENTERS_AS_CANDIDATE
  whole_private_history_auto_ingest: false
  whole_memory_auto_ingest: false
  unknown_connector_auto_access: false
  authenticated_profile_is_binding_not_authority: true
  alternate_browser_surface_requires_own_e2e_proof: true

final_sentence: >
  Nao e dar poder ao modelo. E expor a mesma capability real para qualquer
  modelo autorizado.
