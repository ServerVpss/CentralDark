schema: centraldark.capability-readiness.v1
name: CAPABILITY-READINESS-POLICY
status: CANONICAL
owner: CENTRALDARK_TRIGGER_FABRIC
consumer: MEGAZORD-CENTRALDARK
promoted_by: SEGREDO/CHEFE
promoted_at: 2026-09-14

intent:
  statement: "Estar capacitado para usar uma capacidade não significa manter essa capacidade instalada, carregada ou ativa o tempo todo."
  goal: "Preservar o conteúdo, programação, contratos, adapters, manifests e procedimentos completos para ativação futura sob demanda, sem sobrecarregar Casa ou VPS."

invariants:
  CAPABILITY_CATALOGUED_IS_NOT_INSTALLED: true
  INSTALLED_IS_NOT_LOADED: true
  LOADED_IS_NOT_ACTIVE: true
  ACTIVE_IS_NOT_SELECTED: true
  SELECTED_IS_NOT_EXECUTED: true
  EXECUTED_IS_NOT_PROVEN: true
  DISCOVERED_IS_NOT_REQUIRED: true
  AVAILABLE_IS_NOT_ALWAYS_ON: true
  DISABLED_IS_NOT_FAILURE: true
  OFF_IS_NOT_FAILURE_WHEN_NOT_SELECTED: true
  INACTIVE_UNSELECTED_IS_NEUTRAL: true
  AVAILABLE_OFF_IS_VALID_STATE: true
  FAILURE_REQUIRES_EXPECTED_ACTIVE_CAPABILITY: true
  BUTTON_OFF_IS_STATE_NOT_INCIDENT: true
  LOCAL_MODEL_SUPPORTED_IS_NOT_LOCAL_MODEL_RESIDENT: true
  READINESS_DOES_NOT_REQUIRE_RESOURCE_RESIDENCY: true
  SUBDOMAIN_IS_NOT_NEW_SYSTEM: true
  CAPABILITY_IS_NOT_NEW_PUBLIC_PORT: true
  OAUTH_CONNECTED_IS_NOT_ALWAYS_ACTIVE: true
  EDGE_BLOCKED_CLIENT_IS_NOT_PROVIDER_DOWN: true
  DIRECT_CLIENT_403_IS_NOT_GLOBAL_MCP_FAILURE: true
  LOCAL_FILESYSTEM_ACCESS_IS_SEPARATE_CAPABILITY: true
  OPTIONAL_EXTERNAL_OFF_IS_NOT_GLOBAL_FAILURE: true
  OPTIONAL_EXTERNAL_OFF_MUST_NOT_BLOCK_BOOT: true
  OPTIONAL_EXTERNAL_OFF_WITH_FALLBACK_IS_NON_BLOCKING: true
  REQUIRED_CAPABILITY_FAILURE_NEEDS_FALLBACK_EXHAUSTED: true
  TOOL_CATALOG_IS_NOT_MODEL_CATALOG: true
  MODEL_CATALOG_IS_NOT_TOOL_CATALOG: true
  HERMES_AGENT_BODY_IS_NOT_REPLACEABLE_MODEL: true
  MODEL_IS_REPLACEABLE_ENGINE: true
  GATEWAY_IS_INFERENCE_ROUTE_NOT_AGENT_BODY: true
  NO_PARALLEL_MARKETPLACE: true
  NO_PARALLEL_ROUTER: true

system_topology:
  principle: "ONE SYSTEM; HERMES AS AGENT BODY; ENGINES AND TOOLS ARE PLUGGABLE"
  one_system_only: true
  one_gateway: true
  one_tool_catalog: true
  no_parallel_marketplace: true
  agent_body:
    owner: HERMES
    preserves:
      - SOUL
      - MEMORY
      - WORKSPACE
      - PLANNING
      - LOOPS
      - TOOLS
      - SKILLS
      - EXECUTION
      - CONTINUITY
  inference_gateway:
    role: MODEL_BACKEND_ROUTE
    public_entrypoint: "https://api.centralldark.com"
    replace_agent_body: false
  tool_catalog:
    role: SHARED_CAPABILITY_CATALOG
    preferred_entrypoint: CENTRALDARK_MCP
    clients_may_consume_same_catalog: true
  model_catalog:
    role: REPLACEABLE_INFERENCE_ENGINES
    may_include_external_providers: true
    provider_off_is_router_input: true

capability_classification:
  CORE:
    meaning: "Required for the selected mission path; absence can block only after activation/recovery and applicable fallback fail."
  OPTIONAL_EXTERNAL:
    meaning: "External or plug-in capability that may be off without failing the organism."
    off_state: AVAILABLE_OFF
    blocking: false
    alert_by_default: false
    boot_must_continue: true
  REQUIRED_EXTERNAL:
    meaning: "External capability explicitly required by current intent."
    first_action: TRY_EXISTING_FALLBACK_OR_CANONICAL_ACTIVATION
    block_only_when_no_fallback: true

boot_and_mission_policy:
  optional_external_off:
    classification: AVAILABLE_OFF
    mission_continue: true
    boot_continue: true
    global_health_impact: NONE
  optional_external_failed_with_equivalent_fallback:
    classification: DEGRADED_NON_BLOCKING
    mission_continue: true
    boot_continue: true
    global_health_impact: DEGRADED
  required_capability_unavailable:
    sequence:
      - CONFIRM_CURRENT_INTENT_REQUIRES_CAPABILITY
      - TRY_CANONICAL_ACTIVATION
      - TRY_APPLICABLE_EXISTING_FALLBACK
      - HEALTH_PROBE_SELECTED_PATH
      - BLOCK_ONLY_IF_ALL_APPLICABLE_PATHS_FAIL
    terminal_classification: REQUIRED_UNAVAILABLE
  unknown:
    classification: UNKNOWN
    pass: false
    fail: false
    action: MEASURE_OR_CONTINUE_INDEPENDENT_SAFE_WORK

catalog_contract:
  split_catalogs:
    tool_catalog:
      examples: [GITHUB, VPS, FILES, LOGS, DEPLOY, BROWSER, MEMORY, SKILLS, DATABASES, OBSERVABILITY]
      owner_surface: CENTRALDARK_MCP
    model_catalog:
      examples: [GROK, GPT, CLAUDE, GEMINI, NOUS, ABACUS, OTHER_ENGINES]
      owner_surface: CENTRALDARK_GATEWAY
  discovery_is_not_health: true
  listed_is_not_active: true
  health_is_per_capability: true
  minimum_health_fields:
    - DISCOVERY
    - AUTH
    - HEALTH
    - LAST_PROOF
    - OWNER
    - TARGET_RUNTIME
  catalogue_once_consume_everywhere: true
  client_specific_marketplace_copy: false

hermes_gateway_contract:
  hermes_controls:
    - INTENT_EXECUTION
    - TOOL_SELECTION
    - TOOL_INVOCATION
    - MEMORY
    - WORKSPACE
    - CONTINUITY
  gateway_controls:
    - ENGINE_SELECTION
    - ENGINE_FALLBACK
  forbidden:
    - HERMES_AS_ORDINARY_ENGINE_WHEN_HERMES_IS_CALLER
    - HERMES_TO_GATEWAY_TO_HERMES_RECURSION
    - GATEWAY_REPLACES_HERMES_AGENT_LOOP
  promotion_gate:
    require_end_to_end_proof:
      - TOOLS_FIELD_PRESERVED
      - TOOL_CHOICE_PRESERVED
      - TOOL_CALLS_PRESERVED
      - TOOL_CALL_ID_PRESERVED
      - ARGUMENTS_PRESERVED
      - TOOL_RESULT_CONTINUATION_PRESERVED
      - STREAMING_PRESERVED_WHEN_USED
      - TIMEOUT_AND_ERROR_SEMANTICS_PRESERVED
      - FALLBACK_DOES_NOT_REENTER_CALLER_HERMES
    failure_means: DO_NOT_PROMOTE_GATEWAY_AS_HERMES_BACKEND_YET

readiness_model:
  states:
    CATALOGUED:
      meaning: "Capacidade conhecida, classificada e com owner/destino definido."
    READY_TO_MATERIALIZE:
      meaning: "Código, configuração, adapters, comandos, manifests e testes necessários existem ou têm origem determinística para instalação/ativação."
    INSTALLED:
      meaning: "Dependência/binário/modelo está fisicamente presente no runtime alvo."
    LOADED:
      meaning: "Está consumindo memória/CPU/GPU/disco/processos do runtime."
    ACTIVE:
      meaning: "Serviço/modelo/tool está operacional neste instante."
    SELECTED:
      meaning: "Capability Contract Router escolheu a capacidade para a intenção vigente."
    AVAILABLE_OFF:
      meaning: "Capacidade disponível/instalada porém deliberadamente desligada ou não selecionada; estado neutro, sem incidente."
    REQUIRED_UNAVAILABLE:
      meaning: "A intenção vigente exige a capacidade, mas ela não pôde ser ativada nem substituída por fallback aplicável."
  normal_policy: CATALOGUED_OR_READY_TO_MATERIALIZE
  runtime_residency_policy: ON_DEMAND

inactive_state_semantics:
  principle: OFF_BY_ITSELF_MEANS_ONLY_OFF
  disabled_or_off_without_selection:
    classification: AVAILABLE_OFF
    severity: NONE
    alert: false
    blocker: false
    regression: false
    error: false
    action: CONTINUE_WITH_SELECTED_CAPABILITIES
  selected_or_required_but_off:
    first_action: TRY_CANONICAL_ACTIVATION_OR_EXISTING_FALLBACK
    failure_only_if:
      - CURRENT_INTENT_REQUIRES_CAPABILITY
      - CAPABILITY_SELECTED_OR_REQUIRED
      - ACTIVATION_OR_HEALTH_PROBE_FAILS
      - NO_APPLICABLE_EXISTING_FALLBACK
    classification_when_failure_proven: REQUIRED_UNAVAILABLE
  fallback_semantics:
    disabled_arm_with_equivalent_active_arm: CONTINUE
    one_optional_arm_off_does_not_fail_organism: true
    provider_or_tool_off_is_router_input_not_global_incident: true
  hud_semantics:
    AVAILABLE_OFF: "âšª disponÃ­vel/desligado â€” neutro"
    ACTIVE: "ðŸŸ¢ ativo"
    REQUIRED_UNAVAILABLE: "ðŸ”´ exigido e indisponÃ­vel apÃ³s ativaÃ§Ã£o/fallback falhar"
    UNKNOWN: "âš« ainda nÃ£o medido"
  forbidden_interpretations:
    - DISABLED_IMPLIES_BROKEN
    - BUTTON_OFF_IMPLIES_REGRESSION
    - OPTIONAL_TOOL_OFF_IMPLIES_SYSTEM_FAILURE
    - UNSELECTED_PROVIDER_OFF_IMPLIES_BLOCKER

artifacts_to_preserve_ready:
  - SOURCE_CODE
  - PROGRAMMING_LOGIC
  - SKILLS
  - ADAPTERS
  - CONTRACTS
  - MANIFESTS
  - CONFIG_TEMPLATES
  - INSTALL_RECIPES
  - START_STOP_RECIPES
  - HEALTH_CHECKS
  - TEST_FIXTURES
  - COUNTERPROOF_PROCEDURES
  - VERSION_AND_PROVENANCE
  - RESOURCE_REQUIREMENTS
  - ROLLBACK_PROCEDURES
  - OWNER_AND_HANDOFF_MAPPING

heavy_runtime_policy:
  examples:
    - LOCAL_LLM
    - EMBEDDING_MODEL
    - RERANKER
    - GPU_RUNTIME
    - LARGE_INDEX
    - HEAVY_BROWSER_WORKER
    - OPTIONAL_DATABASE_SERVICE
  default: DO_NOT_INSTALL_OR_LOAD_UNLESS_SELECTED
  selection_requires:
    - CURRENT_INTENT_REQUIRES_CAPABILITY
    - CAPABILITY_ROUTER_SELECTS_IT
    - TARGET_RUNTIME_HAS_RESOURCES
    - RESOURCE_BUDGET_ACCEPTABLE
    - NO_LIGHTER_EQUIVALENT_ALREADY_AVAILABLE
    - INSTALL_OR_START_PATH_KNOWN
    - HEALTH_PROBE_DEFINED
    - STOP_OR_UNLOAD_PATH_KNOWN
  after_use:
    - REMEASURE_NEED
    - STOP_OR_UNLOAD_IF_NO_LONGER_REQUIRED
    - PRESERVE_READY_ARTIFACTS
    - PRESERVE_RECEIPT

local_llm_policy:
  install_all_local_llms: false
  keep_all_local_llms_loaded: false
  keep_all_local_llms_running: false
  catalogue_supported_models: true
  preserve_integration_code: true
  preserve_model_adapter_contracts: true
  preserve_install_and_activation_recipes: true
  preserve_resource_profiles: true
  materialize_only_when_needed: true
  allow_remote_or_existing_engine_when_sufficient: true
  vps_weight_is_selection_factor: true
  house_weight_is_selection_factor: true
  model_is_replaceable_engine: true
  model_is_not_identity: true

resource_budget:
  dimensions:
    - DISK
    - RAM
    - VRAM
    - CPU
    - GPU
    - NETWORK
    - STARTUP_TIME
    - STEADY_STATE_COST
    - PROCESS_COUNT
    - PORTS
  rules:
    CAPABILITY_WITHOUT_BUDGET_FIT: NOT_SELECTED
    HEAVIER_WHEN_LIGHTER_SUFFICIENT: FORBIDDEN
    IDLE_HEAVY_RUNTIME_WITHOUT_CURRENT_NEED: STOP_OR_UNLOAD
    INSTALLATION_MAY_BE_DEFERRED: true
    KNOWLEDGE_AND_CODE_MUST_REMAIN_READY: true

megazord_semantics:
  discover_relevant_resources: true
  catalogue_broad_capabilities: true
  activate_all_discovered: false
  install_all_catalogued: false
  preload_all_models: false
  selection_policy: MINIMUM_SUFFICIENT_SET
  lazy_materialization: true
  lazy_activation: true
  reusable_capability_blueprints: true
  one_system_only: true
  one_writer_per_scope: true

external_capability_binding:
  principle: "INTEGRAR UMA VEZ; AUTORIZAR E ATIVAR SOB DEMANDA"
  provider_binding:
    catalogue_after_discovery: true
    oauth_or_equivalent_binding_supported: true
    binding_does_not_force_activation: true
    connected_provider_is_router_input: true
    direct_provider_access_not_required_when_canonical_mcp_route_exists: true
    client_specific_edge_block_does_not_invalidate_other_working_routes: true
    local_filesystem_requires_explicit_local_bridge_capability: true
  routing:
    preferred_entrypoint: CENTRALDARK_MCP
    preserve_provider_specific_adapters: true
    no_second_router: true
    no_parallel_brain: true
    select_only_when_intent_requires: true
    stop_or_release_when_idle: true
  proof_semantics:
    OAUTH_AUTHORIZE_PASS_IS_BINDING_EVIDENCE: true
    TOKEN_PASS_IS_BINDING_EVIDENCE: true
    TOOLS_LIST_PASS_IS_MCP_CAPABILITY_EVIDENCE: true
    ONE_CLIENT_EDGE_403_IS_EDGE_BLOCKED_NOT_GLOBAL_DOWN: true
    CONNECTED_PROVIDER_IS_NOT_ALL_OPERATIONS_PROVEN: true

public_surface_policy:
  principle: "POUCAS SUPERFICIES PUBLICAS; CAPACIDADES INTERNAS POR BAIXO DOS PANOS"
  public_surfaces:
    human_public: "https://centralldark.com"
    machine_api: "https://api.centralldark.com"
    mcp_external: "https://mcp.centralldark.com/mcp"
  max_normal_public_surfaces: 3
  private_admin_surface: "https://admin.centralldark.com"
  private_admin_not_counted_as_normal_public: true
  total_named_canonical_surfaces: 4
  legacy_hub_surface: "https://hub.centralldark.com"
  legacy_hub_policy: COMPATIBILITY_ONLY_UNTIL_REDIRECT_OR_RETIREMENT
  routing:
    https_public_port: 443
    host_based_routing: true
    subdomain_requires_new_public_port: false
    internal_capability_requires_public_subdomain: false
    internal_capability_requires_public_port: false
    create_public_surface_only_for_real_access_boundary: true
  single_direction_flow:
    permanent: true
    ingress:
      human_public: CENTRALDARK_PUBLIC
      human_admin: CENTRALDARK_HUB
      machine_inference: CENTRALDARK_API
      tools_and_actions: CENTRALDARK_MCP
    canonical_adapter: MCP_CENTRALDARK
    tool_discovery: tools/list
    tool_execution: tools/call
    admin_dispatcher: mcp_admin_call
    internal_capabilities_via_adapter:
      - HERMES
      - ZENDRIVER
      - ELITE_GATEWAY
      - OAUTH_BROKER
      - ARSENAL
      - ARTIFACTS_BUILDER
      - DARKAI
      - LOVABLE_PROXY
      - GITHUB
      - VPS
      - FILES
      - LOGS
      - DEPLOY
      - BROWSER
      - SKILLS
      - MEMORY
    direct_public_subdomain_per_capability: false
    legacy_subdomains_policy: COMPATIBILITY_ONLY_UNTIL_REDIRECT_OR_RETIREMENT
    new_clients_must_use_canonical_surfaces: true
    no_second_router: true
    no_parallel_marketplace: true
    no_client_specific_tool_catalog: true
    hermes_controls_execution: true
    reality_is_judge: true
  admin_surface:
    private_single_owner_intent: true
    edge_basic_auth_or_equivalent_pre_app_gate: REQUIRED
    centraldark_admin_oauth_or_session: REQUIRED
    critical_action_reauthentication: REQUIRED
    vps_root_credentials_in_browser: FORBIDDEN
    default_public_exposure: DENY
    audit_access: true
    rate_limit: true
    controls:
      - ENABLED
      - LOCAL_ONLY
      - LAN_ALLOWED
      - MCP_ONLY
      - PUBLIC
      - OAUTH_REQUIRED
      - ADMIN_REAUTH_REQUIRED
      - AUTO_ACTIVATE_ON_DEMAND
      - STOP_AFTER_USE
      - FALLBACK_ALLOWED
      - RESOURCE_LIMITS
      - HEALTH_STATUS
    public_enable_requires:
      - EXPLICIT_ADMIN_ACTION
      - AUTHENTICATED_ADMIN_SESSION
      - APPLICABLE_EDGE_POLICY
      - AUDIT_RECEIPT
  internal_service_policy:
    screenpipe_default: INTERNAL_BEHIND_MCP
    hub_default: INTERNAL
    models_default: INTERNAL_ON_DEMAND
    adapters_default: INTERNAL
    databases_default: INTERNAL_UNLESS_EXPLICITLY_REQUIRED
    pm2_services_default: INTERNAL

node_dependency_lock_policy:
  purpose: "Reprodutibilidade de dependências; não é controle de acesso."
  package_json_versioned: true
  package_lock_versioned_when_node_owner_uses_npm: true
  ci_install_mode: NPM_CI
  lockfile_change_requires_dependency_review: true
  copy_lockfile_from_unrelated_project: false
  lockfile_is_not_authentication: true
  lockfile_is_not_authorization: true
  auth_gate_and_dependency_lock_are_independent_layers: true

agent_operational_quality:
  intent: "Absorver práticas de arquitetura de agentes como comportamento do ciclo existente, sem criar ferramenta, cérebro, cargo soberano ou pipeline paralelo."
  owner: CENTRALDARK_TRIGGER_FABRIC
  runtime_owner: apps/modulos/fixed-point-fabric/
  metacognition_owner: docs/CONSCIENCIA/METACOGNICAO-OPERACIONAL.md
  new_tool: false
  new_engine: false
  new_authority: false
  ai_architect_semantics:
    classification: GOVERNANCE_VIEW
    creates_new_human_authority: false
    creates_new_agent_identity: false
    purpose:
      - ALIGN_AGENT_BEHAVIOR_WITH_CHEFE_INTENT
      - ALIGN_OUTPUT_WITH_PRODUCT_AND_BUSINESS_CONSTRAINTS
      - KEEP_OWNER_AND_SYSTEM_THEORY_RECONSTRUCTIBLE
  pre_promotion_simulation:
    reuse_existing_test_and_counterproof_harness: true
    implementation_surface: apps/modulos/fixed-point-fabric/tests/test_counterproof.py
    scenario_matrix_required_when_material: true
    persona_is_test_fixture_not_identity: true
    scenario_is_test_input_not_live_state: true
    simulated_pass_is_not_runtime_pass: true
    minimum_scenario_classes:
      - HAPPY_PATH
      - REGRESSION_AFTER_PRIOR_PASS
      - UNKNOWN_DEPENDENCY
      - BLOCKED_EXTERNAL_GATE
      - STALE_EVIDENCE
      - MODEL_OR_PROVIDER_CHANGE_WHEN_APPLICABLE
      - PERMISSION_OR_AUTH_FAILURE_WHEN_APPLICABLE
      - HANDOFF_TO_NEXT_AGENT_WITHOUT_GUESSING
    promotion_requires_real_evidence_after_simulation: true
  closed_loop_improvement:
    enabled_as_existing_method: true
    flow:
      - OBSERVE_REAL_RESULT
      - CAPTURE_EVIDENCE
      - CLASSIFY_DEVIATION
      - MAP_TO_EXISTING_OWNER
      - APPLY_MINIMAL_DELTA
      - RUN_REGRESSION_SCENARIOS
      - COUNTERPROVE
      - REMEASURE_T1
      - REGISTER_LEARNING_DELTA
      - CONTINUE_UNTIL_FIXED_POINT
    conversation_or_runtime_sample_is_evidence_input_not_authority: true
    feedback_without_discriminating_evidence_is_not_learning: true
    past_error_must_improve_future: true
  agent_iceberg:
    visible_surface_is_not_total_cost: true
    below_surface_checks:
      - REGRESSION_TESTS
      - MODEL_MIGRATION_COMPATIBILITY
      - PROVIDER_FALLBACK
      - EXCEPTION_AND_TIMEOUT_HANDLING
      - AUTHORIZATION_BOUNDARIES
      - RESOURCE_BUDGET
      - OBSERVABILITY
      - ROLLBACK
      - DECISION_LINEAGE
      - COGNITIVE_DEBT
      - OWNER_HANDOFF
    simple_ui_does_not_imply_simple_runtime: true
    hidden_complexity_does_not_authorize_new_architecture: true
    response: REUSE_OWNER_AND_TEST_THE_ICEBERG
  proof_boundaries:
    SIMULATION_IS_NOT_PRODUCTION_PROOF: true
    MANY_PERSONAS_IS_NOT_COVERAGE_PROOF: true
    FEEDBACK_LOOP_EXISTS_IS_NOT_FEEDBACK_QUALITY_PROVEN: true
    CONVERSATION_AUDIT_IS_NOT_RUNTIME_HEALTH: true
    MODEL_MIGRATION_IS_NOT_SAFE_UNTIL_REGRESSION_PASS: true
    CI_GREEN_IS_NOT_COGNITIVE_DEBT_CLOSED: true
    FIXED_POINT_REQUIRES_RECONSTRUCTIBLE_THEORY: true

web_retrieval_capability:
  capability_contract:
    name: WEB_SEARCH_EXTRACTION
    owner: CENTRALDARK_TRIGGER_FABRIC
    router: .agents/skills/capability-contract-router/SKILL.md
    provider_is_replaceable: true
    provider_is_not_new_brain: true
    provider_is_not_new_router: true
    provider_is_not_authority: true
    select_minimum_sufficient_provider: true

  firecrawl:
    classification: OPTIONAL_WEB_PROVIDER
    capabilities:
      - WEB_SEARCH
      - WEB_SCRAPE
      - WEB_CRAWL
      - WEB_MAP
      - WEB_INTERACT_WHEN_SUPPORTED
    materialization: ON_DEMAND
    install_globally_by_default: false
    local_house_skill_observed: centraldark-casa-operations
    local_house_observation_status: OBSERVED_NOT_GLOBAL_PROOF
    canonical_repo_copy_of_house_skill_found: false
    do_not_duplicate_house_skill_into_repo_without_owner_reconciliation: true

    authentication_modes:
      keyless:
        status: OFFICIAL_CAPABILITY_AVAILABLE
        role: FIRST_LIGHTWEIGHT_ATTEMPT_WHEN_SUPPORTED_BY_SELECTED_CLIENT
        monthly_free_credit_claim_requires_live_provider_policy: true
      authenticated_api:
        status: SUPPORTED
        secret_name: FIRECRAWL_API_KEY
        secret_must_not_be_persisted_in_repo: true
        api_key_absent_means_provider_auth_unavailable_not_web_capability_unavailable: true
      agent_skill_or_mcp:
        status: SUPPORTED_WHEN_RUNTIME_DISCOVERS_IT
        availability_requires_runtime_measurement: true

    fallback_semantics:
      sequence:
        - EXISTING_WEB_CAPABILITY_ALREADY_AVAILABLE
        - FIRECRAWL_KEYLESS_WHEN_SUPPORTED
        - FIRECRAWL_AUTHENTICATED_WHEN_SECRET_PRESENT
        - OTHER_EXISTING_WEB_PROVIDER
      FIRECRAWL_API_KEY_ABSENT_IS_NOT_GLOBAL_WEB_BLOCKER: true
      FIRECRAWL_FAILURE_IS_NOT_CENTRALDARK_FAILURE: true
      FIRECRAWL_UNAVAILABLE_IS_CAPABILITY_ROUTER_INPUT: true
      NO_SECOND_WEB_PIPELINE: true

    proof_boundaries:
      PACKAGE_INSTALLED_IS_NOT_SEARCH_PROVEN: true
      IMPORT_OK_IS_NOT_REMOTE_API_PROVEN: true
      SEARCH_RESULT_IS_NOT_CRAWL_PROVEN: true
      SCREENSHOT_IS_HOUSE_OBSERVATION_NOT_GLOBAL_RUNTIME_PROOF: true
      PROVIDER_DOCS_IS_NOT_RUNTIME_STATE: true
      LIVE_PROVIDER_PROBE_REQUIRED_FOR_ACTIVE_PASS: true

    ci_boundary:
      FIRECRAWL_IS_NOT_GITHUB_CI: true
      FIRECRAWL_API_KEY_ABSENT_CANNOT_SET_CI_UNKNOWN: true
      GITHUB_CI_MUST_BE_MEASURED_VIA_GITHUB_SURFACE_OR_CANONICAL_CI_OWNER: true

    security:
      never_log_api_key: true
      never_commit_api_key: true
      never_copy_browser_session_secret_to_repo: true
      auth_failure_is_fail_closed_for_that_provider_only: true

  house_observation_2026_09_02:
    source: HERMES_CASA_SCREEN_EVIDENCE
    observed:
      - PYTHON_PACKAGE_INSTALL_REPORTED_SUCCESS
      - PYTHON_IMPORT_REPORTED_OK
      - WEB_SEARCH_RESULT_RENDERED_IN_HERMES_SESSION
      - AUTHENTICATED_API_KEY_NOT_PROVEN_IN_REPO
    interpretation:
      FIRECRAWL_HOUSE_CAPABILITY_CANDIDATE: READY_OR_ACTIVE_LOCALLY_PENDING_LIVE_REMEASURE
