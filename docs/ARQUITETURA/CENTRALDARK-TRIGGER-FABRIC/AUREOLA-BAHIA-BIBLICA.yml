  AUREOLA_MATERIAL_DISCOVERY_EMITS_LEARNING_CANDIDATE: true
  AUREOLA_DISCOVERY_NE_CANONICAL_FACT: true
  MATERIAL_DISCOVERY_REQUIRES_LEARNING_REF: true
  SAME_FINDING_WITHOUT_NEW_EVIDENCE_IS_DEDUPED: true

  EXAMINE_BEFORE_ACCEPT_OR_RECORD: true
