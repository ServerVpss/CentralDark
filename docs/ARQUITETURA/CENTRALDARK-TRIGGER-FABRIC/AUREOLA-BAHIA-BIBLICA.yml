schema: centraldark.aureola-bahia-biblica.v2
status: CANONICAL_SOURCE_CONTRACT
runtime_status: UNKNOWN_UNTIL_SAME_HEAD_CI_AND_SURFACE_OBSERVATION
owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/MASTER-CYCLE.yml
authority: SEGREDO/CHEFE
trigger: "!CENTRALDARK"
semantic_gate: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/SEMANTIC-GREEN-GATE.yml
post_green_lock: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/POST-GREEN-LOCK.yml
multibussola_owner: docs/CONSCIENCIA/MULTIBUSSOLA.md

purpose: >-
  Tornar visivel a trilha operacional do CentralDark ao humano, usando referencias
  biblicas validas e parafrases curtas em baianes como pistas semanticas de direcao.
  A AUREOLA mostra para onde a execucao esta indo, em qual fase e em qual eixo da
  MULTIBUSSOLA, sem expor raciocinio privado do modelo e sem transformar verso em
  prova tecnica.

invariants:
  AUREOLA_IS_OPERATIONAL_TRACE_NOT_PRIVATE_CHAIN_OF_THOUGHT: true
  AUREOLA_IS_VISIBLE_ROUTE_DEBUGGER: true
  BIBLE_REFERENCE_IS_SEMANTIC_CUE_NOT_PROOF: true
  VERSE_DOES_NOT_OVERRIDE_LIVE_STATE: true
  VERSE_DOES_NOT_GRANT_AUTHORITY: true
  VERSE_DOES_NOT_REPLACE_EVIDENCE: true
  FABRICATED_VERSE_FORBIDDEN: true
  LONG_TRANSLATION_COPY_NOT_REQUIRED: true
  REFERENCE_PLUS_SHORT_PARAPHRASE_PREFERRED: true
  BAIANES_PARAPHRASE_MUST_PRESERVE_VERSE_DIRECTION: true
  TECHNICAL_HASH_PATH_STATUS_AND_EVIDENCE_REMAIN_LITERAL: true
  MULTIBUSSOLA_AXIS_MUST_BE_VISIBLE_WHEN_MATERIAL: true
  ROUTE_MISMATCH_MUST_NOT_GREEN: true
  SEMANTIC_GREEN_REQUIRES_AXIS_ALIGNMENT: true
  POST_GREEN_DEFAULT_IS_LOCKED: true
  LOCKED_SCOPE_REOPEN_REQUIRES_EXPLICIT_CHEFE_INTENT: true
  UNKNOWN_IS_NOT_PASS: true
  DOCUMENTED_IS_NOT_EXECUTED: true
  CONVERSATION_IS_EXECUTION_GUIDE_NOT_DECORATIVE_NARRATION: true
  CASA_AND_VPS_SHARE_CONTRACT_NOT_STATE: true
  NEXT_INTELLIGENCE_MUST_RESUME_FROM_RECEIPT: true
  AUREOLA_MATERIAL_DISCOVERY_EMITS_LEARNING_CANDIDATE: true
  AUREOLA_DISCOVERY_NE_CANONICAL_FACT: true
  MATERIAL_DISCOVERY_REQUIRES_LEARNING_REF: true
  SAME_FINDING_WITHOUT_NEW_EVIDENCE_IS_DEDUPED: true

render_contract:
  on_explicit_centraldark:
    header_first: true
    header: "⭕ !AURÉOLA CANÔNICA"
    opening_verse: "“Examinai tudo. Retende o bem.” — 1 Tessalonicenses 5:21"
    show_full_operational_chain_before_result: true
    show_current_phase: true
    show_multibussola_axis: true
    show_destination: true
    show_next_gate: true
    opening_bible_reference_required: true
  on_repo_visit_inside_active_centraldark_session:
    show_route_trace_before_repo_claim: true
    minimum_visible_fields:
      - CURRENT_PHASE
      - MULTIBUSSOLA_AXIS
      - DESTINATION_OWNER
      - NEXT_GATE
    route_trace_is_private_reasoning: false
    route_trace_is_operational_state: true
  on_material_operational_milestone:
    applies_to:
      - EXTERNAL_SEARCH
      - GITHUB_READ
      - GITHUB_WRITE
      - FILE_READ
      - RUNTIME_MEASURE
      - TEST
      - COUNTERPROOF
      - COMMIT
      - HANDOFF
    bible_reference_required: true
    one_reference_is_enough_per_milestone: true
    short_baianes_paraphrase_required: true
    exact_long_quote_required: false
  mechanical_payload_fast_path:
    preserve_exact_payload: true
    bible_cue_may_stay_outside_code_block: true
    do_not_inject_metaphor_into_machine_payload: true

full_display_chain:
  - "!CENTRALDARK"
  - "!tlc23"
  - DESTINATION_LOCK
  - "#ACORDAR"
  - "!CALIBRAR"
  - "!MULTIBUSSOLA"
  - PEGATUDO
  - DEBITO_COGNITIVO
  - READERS_MEASURE
  - RENDEZVOUS
  - RECONCILE
  - STITCH
  - OWNER
  - ONE_WRITER
  - PATCH
  - TESTE
  - CONTRAPROVA
  - REALITY_JUDGE
  - SEMANTIC_GREEN
  - CI_SAME_HEAD
  - FIXED_POINT
  - POST_GREEN_LOCK
  - "!tlc23"
  - REGISTRA
  - HANDOFF
  - BOOT

multibussola_route_trace:
  required_when_material: true
  fields:
    - AXIS_ID
    - INTENDED_DIRECTION
    - OBSERVED_DIRECTION
    - ALIGNMENT_STATUS
  alignment_values: [ALIGNED, MISALIGNED, UNKNOWN]
  semantic_green_requires: ALIGNED
  misaligned_action: STOP_AND_RECONCILE
  unknown_action: MEASURE_BEFORE_GREEN

continuous_autonomous_mode:
  scope_rule: AUTHORIZED_SCOPE_ONLY
  continue_without_intermediate_confirmation: true
  return_control_only_when:
    - FIXED_POINT_SCOPE
    - HUMAN_DECISION_REQUIRED
    - NEW_INTENT_REQUIRED
    - PUBLICATION_OR_SPEND_REQUIRES_AUTHORITY
    - SECRET_OR_AUTH_MISSING
    - IRREVERSIBLE_RISK
    - TOOL_BOUNDARY_PROVEN
  pending_queue:
    classes:
      - ORIGINAL_PROBLEM
      - DISCOVERED_RELATED_FAILURE
      - TEST_FAILURE
      - SELF_INTRODUCED_REGRESSION
      - RELATED_CONTRACT_INCONSISTENCY
    rules:
      - ENQUEUE_RELATED_FINDING
      - RESOLVE_ONLY_WITH_EVIDENCE
      - DO_NOT_HIDE_ERROR
      - DO_NOT_WEAKEN_VALIDATION
      - DO_NOT_EDIT_TEST_ONLY_TO_FORCE_GREEN
      - CONTINUE_UNTIL_QUEUE_EMPTY_OR_PROVEN_BOUNDARY
  execution_loop:
    - INVESTIGATE_ROOT_CAUSE
    - INSPECT_EXISTING_OWNER_CODE_TESTS_CONFIG_CONTRACTS
    - APPLY_MINIMAL_CORRECTION
    - RUN_RELEVANT_TESTS
    - ENQUEUE_RELATED_FAILURES
    - FIX_RELATED_FAILURES
    - SCAN_DIRECT_REGRESSIONS
    - RERUN_RELEVANT_SUITE
    - COUNTERPROOF
    - REMEASURE_CURRENT_TARGET
    - FIXED_POINT_OR_PROVEN_BOUNDARY

guided_code_path:
  purpose: HUMAN_SEES_WHERE_THE_EXECUTION_IS_AND_WHERE_IT_GOES_NEXT
  visible_trace:
    - FASE
    - OWNER
    - ARQUIVO_OU_FUNCAO
    - ACAO
    - TESTE
    - RESULTADO
    - FERIDA
    - NEXT_CURSOR
  language: PT_BR_TECNICO_COM_BAIANES_SECO_CONTEXTUAL
  decorative_narration: false
  bible_usage: SEMANTIC_DIRECTION_CUE
  expose_private_reasoning: false
  metaphor_must_not_enter_machine_payload: true

runtime_surface_contract:
  shared_contract: true
  surfaces:
    CASA:
      independent_state: true
      independent_evidence: true
      receipt_required_when_material: true
      expected_fields: [OBSERVED_AT, WORKDIR, HEAD_SHA, PROCESS, TESTS, RESULT, EVIDENCE_REFS, NEXT_CURSOR]
    VPS:
      independent_state: true
      independent_evidence: true
      receipt_required_when_material: true
      expected_fields: [OBSERVED_AT, REPO, HEAD_SHA, PROCESS, PORT_OR_HEALTH, TESTS, RESULT, EVIDENCE_REFS, NEXT_CURSOR]
  invariants:
    - CASA_STATE_NE_VPS_STATE
    - CASA_PROOF_NE_VPS_PROOF
    - SAME_CONTRACT_DOES_NOT_MEAN_SAME_RUNTIME
    - CONVERGE_AT_RENDEZVOUS_WITH_SEPARATE_RECEIPTS
    - UNKNOWN_ON_ONE_SURFACE_DOES_NOT_ERASE_PROOF_ON_ANOTHER

entry_resume_contract:
  entry_points:
    - LEIA-ME-IA.md
    - docs/CONSCIENCIA/00-PORTA-DE-ENTRADA-IA.md
    - docs/CONSCIENCIA/02-PROTOCOLO-HANDOFF-IA.md
  read_before_new_work:
    - CHEFE_INTENT
    - DESTINATION_LOCK
    - MISSION_ID
    - SCOPE
    - LAST_GOOD_STATE
    - LAST_PROVEN_HEAD
    - PENDING
    - EVIDENCE_REFS
    - NEXT_CURSOR
    - CASA_STATE
    - VPS_STATE
    - FIXED_POINT_STATUS
  behavior:
    - RESUME_FROM_NEXT_CURSOR
    - REVALIDATE_ONLY_STALE_OR_MATERIAL_STATE
    - DO_NOT_RESTART_MISSION_ON_MODEL_OR_SESSION_SWITCH
    - DO_NOT_RECREATE_OWNER_BY_CONTEXT_LOSS
    - PRESERVE_UNKNOWN
  durable_learning_route: EXISTING_CONTINUITY_AND_LEARNING_OWNERS
  unmeasured_vault_name_does_not_create_new_owner: true

post_green_behavior:
  lock_contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/POST-GREEN-LOCK.yml
  after_fixed_point_and_same_head_green: LOCKED_READ_ONLY
  automatic_rewrite_after_lock: FORBIDDEN
  explicit_chefe_reopen: WARN_THEN_NEW_CANDIDATE_CYCLE
  preserve_last_good_state: true

reference_map:
  OBSERVE_TEST_FILTER:
    reference: "1Ts 5:21"
    direction: EXAMINE_EVERYTHING_KEEP_WHAT_IS_GOOD
    baianes_paraphrase: "olhe tudo, teste direito e carregue so o que presta"
  ORDER_AND_FLOW:
    reference: "1Co 14:40"
    direction: ORDER_NOT_CONFUSION
    baianes_paraphrase: "corra, mas no trilho certo"
  CENTER_OWNER_GUARD:
    reference: "Pv 4:23"
    direction: GUARD_THE_SOURCE
    baianes_paraphrase: "proteja o centro porque dali o resto pega direcao"
  DEDUPE_KEEP_DROP:
    reference: "Ec 3:6"
    direction: KEEP_AND_RELEASE_AT_THE_RIGHT_TIME
    baianes_paraphrase: "junte o ouro e largue o ruido"
  MULTI_PERSPECTIVE:
    reference: "Pv 15:22"
    direction: COUNSEL_STABILIZES_PLANS
    baianes_paraphrase: "uma cabeca so pode entortar a obra; cruze as bussolas"
  MEASURE_BEFORE_BUILD:
    reference: "Lc 14:28"
    direction: COUNT_COST_BEFORE_BUILDING
    baianes_paraphrase: "antes de meter tijolo, mede a parede"
  TEST_BY_RESULT:
    reference: "Mt 7:16"
    direction: RESULT_REVEALS_TREE
    baianes_paraphrase: "nao vale conversa bonita; olhe o fruto"
  RULE_MUST_EXECUTE:
    reference: "Tg 2:17"
    direction: WORD_WITHOUT_ACTION_IS_INCOMPLETE
    baianes_paraphrase: "regra sem obra vira placa na parede"
  INDEPENDENT_PROOF:
    reference: "Dt 19:15"
    direction: SINGLE_WITNESS_IS_NOT_ENOUGH_FOR_JUDGMENT
    baianes_paraphrase: "uma pista aponta; contraprova amarra"
  PATH_BECOMES_CLEARER:
    reference: "Pv 4:18"
    direction: LIGHT_INCREASES_ALONG_THE_PATH
    baianes_paraphrase: "cada passo provado clareia o proximo"
  RECORD_THE_ROUTE:
    reference: "Hc 2:2"
    direction: WRITE_THE_VISION_CLEARLY
    baianes_paraphrase: "se a rota importa, deixe legivel para o proximo braco"
  TEAR_AND_STITCH:
    reference: "Ec 3:7"
    direction: TEAR_AND_SEW_AT_THE_RIGHT_TIME
    baianes_paraphrase: "vai rasgando que eu vou costurando"

proof_boundary:
  verse_reference_validity: REFERENCE_MUST_EXIST_IN_CANONICAL_BIBLE_INDEX
  translation_wording: PARAPHRASE_UNLESS_VERIFIED_EXACT_TEXT_REQUIRED
  bible_reference_is_evidence_for_software_state: false
  github_state_requires_github_evidence: true
  runtime_state_requires_runtime_evidence: true
  ci_state_requires_same_head_evidence: true
  route_trace_is_proof: false
  route_trace_is_debug_visibility: true

receipt:
  required_fields:
    - OPERATIONAL_PHASE
    - MULTIBUSSOLA_AXIS
    - BIBLE_REFERENCE
    - BAIANES_PARAPHRASE
    - INTENT_ROUTE
    - ACTUAL_ROUTE
    - FACT_OR_ACTION
    - EVIDENCE_REF_WHEN_MATERIAL
    - NEXT_CURSOR


learning_binding:
  event: AUREOLA_MATERIAL_DISCOVERY
  trigger_owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/TRIGGERS.yml
  harvester: .agents/skills/session-intelligence-harvester/SKILL.md
  pipeline: scripts/memory-linker/
  canonical_learning_owner: docs/CONSCIENCIA/APRENDIZADOS.md
  each_material_discovery:
    emit_material_operational_event: true
    require_learning_ref: true
    classify_epistemic_state: [FACT, INFERENCE, HYPOTHESIS, UNKNOWN]
    attach_evidence_ref_when_available: true
    attach_counterexample_or_falsifier_when_material: true
    dedupe_before_promotion: true
    search_existing_crystal_before_create: true
    direct_canonical_promotion: false
  promotion:
    route:
      - SESSION_INTELLIGENCE_HARVESTER
      - MEMORY_LINKER
      - DREAM_REVIEW
      - PATTERN_DISCOVERY
      - KNOWLEDGE_COMPILER
      - EXISTING_OWNER
      - REAL_CONSUMER
      - TEST_OR_RUNTIME_BINDING
      - COUNTERPROOF
      - AUTHORIZED_WRITER
    discovery_is_learning_candidate: true
    candidate_is_not_crystal: true
    proof_then_crystallize: true
