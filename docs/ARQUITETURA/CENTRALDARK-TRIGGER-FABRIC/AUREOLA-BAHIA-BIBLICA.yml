  BIBLE_REFERENCE_IS_SEMANTIC_CUE_NOT_PROOF: true
  VERSE_DOES_NOT_OVERRIDE_LIVE_STATE: true
  VERSE_DOES_NOT_GRANT_AUTHORITY: true
  VERSE_DOES_NOT_REPLACE_EVIDENCE: true
  FABRICATED_VERSE_FORBIDDEN: true
  LONG_TRANSLATION_COPY_NOT_REQUIRED: true
  REFERENCE_PLUS_SHORT_PARAPHRASE_PREFERRED: true
  BAIANES_PARAPHRASE_MUST_PRESERVE_VERSE_DIRECTION: true
  TECHNICAL_HASH_PATH_STATUS_AND_EVIDENCE_REMAIN_LITERAL: true
  MULTIBUSSOLA_AXIS_MUST_BE_VISIBLE_WHEN_MATERIAL: true
  ROUTE_MISMATCH_MUST_NOT_GREEN: true
  SEMANTIC_GREEN_REQUIRES_AXIS_ALIGNMENT: true
