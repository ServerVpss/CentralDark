render_contract:
  on_explicit_centraldark:
    header_first: true
    header: "⭕ !AURÉOLA CANÔNICA"
    opening_verse: "“Examinai tudo. Retende o bem.” — 1 Tessalonicenses 5:21"
    show_full_operational_chain_before_result: true
    show_current_phase: true
    show_multibussola_axis: true
    show_destination: true
    show_next_gate: true
    opening_bible_reference_required: true
  on_repo_visit_inside_active_centraldark_session:
    show_route_trace_before_repo_claim: true
    minimum_visible_fields:
      - CURRENT_PHASE
      - MULTIBUSSOLA_AXIS
      - DESTINATION_OWNER
      - NEXT_GATE
    route_trace_is_private_reasoning: false
    route_trace_is_operational_state: true
  on_material_operational_milestone:
    applies_to:
      - EXTERNAL_SEARCH
      - GITHUB_READ
      - GITHUB_WRITE
      - FILE_READ
      - RUNTIME_MEASURE
      - TEST
      - COUNTERPROOF
      - COMMIT
      - HANDOFF
    bible_reference_required: true
    one_reference_is_enough_per_milestone: true
    short_baianes_paraphrase_required: true
    exact_long_quote_required: false
  mechanical_payload_fast_path:
    preserve_exact_payload: true
    bible_cue_may_stay_outside_code_block: true
    do_not_inject_metaphor_into_machine_payload: true

