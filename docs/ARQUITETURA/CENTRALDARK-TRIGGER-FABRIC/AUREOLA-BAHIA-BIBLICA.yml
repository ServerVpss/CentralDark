      independent_state: true
      independent_evidence: true
      receipt_required_when_material: true
      expected_fields: [OBSERVED_AT, WORKDIR, HEAD_SHA, PROCESS, TESTS, RESULT, EVIDENCE_REFS, NEXT_CURSOR]
    VPS:
      independent_state: true
      independent_evidence: true
      receipt_required_when_material: true
      expected_fields: [OBSERVED_AT, REPO, HEAD_SHA, PROCESS, PORT_OR_HEALTH, TESTS, RESULT, EVIDENCE_REFS, NEXT_CURSOR]
  invariants:
    - CASA_STATE_NE_VPS_STATE
    - CASA_PROOF_NE_VPS_PROOF
    - SAME_CONTRACT_DOES_NOT_MEAN_SAME_RUNTIME
    - CONVERGE_AT_RENDEZVOUS_WITH_SEPARATE_RECEIPTS
    - UNKNOWN_ON_ONE_SURFACE_DOES_NOT_ERASE_PROOF_ON_ANOTHER

