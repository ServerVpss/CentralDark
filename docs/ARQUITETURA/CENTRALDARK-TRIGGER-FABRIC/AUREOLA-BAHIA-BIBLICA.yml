multibussola_route_trace:
  required_when_material: true
  fields:
    - AXIS_ID
    - INTENDED_DIRECTION
    - OBSERVED_DIRECTION
    - ALIGNMENT_STATUS
  alignment_values: [ALIGNED, MISALIGNED, UNKNOWN]
  semantic_green_requires: ALIGNED
  misaligned_action: STOP_AND_RECONCILE
  unknown_action: MEASURE_BEFORE_GREEN

continuous_autonomous_mode:
  scope_rule: AUTHORIZED_SCOPE_ONLY
  continue_without_intermediate_confirmation: true
  return_control_only_when:
    - FIXED_POINT_SCOPE
    - HUMAN_DECISION_REQUIRED
    - NEW_INTENT_REQUIRED
    - PUBLICATION_OR_SPEND_REQUIRES_AUTHORITY
    - SECRET_OR_AUTH_MISSING
    - IRREVERSIBLE_RISK
    - TOOL_BOUNDARY_PROVEN
  pending_queue:
    classes:
      - ORIGINAL_PROBLEM
      - DISCOVERED_RELATED_FAILURE
      - TEST_FAILURE
      - SELF_INTRODUCED_REGRESSION
      - RELATED_CONTRACT_INCONSISTENCY
    rules:
      - ENQUEUE_RELATED_FINDING
      - RESOLVE_ONLY_WITH_EVIDENCE
      - DO_NOT_HIDE_ERROR
      - DO_NOT_WEAKEN_VALIDATION
      - DO_NOT_EDIT_TEST_ONLY_TO_FORCE_GREEN
      - CONTINUE_UNTIL_QUEUE_EMPTY_OR_PROVEN_BOUNDARY
  execution_loop:
    - INVESTIGATE_ROOT_CAUSE
    - INSPECT_EXISTING_OWNER_CODE_TESTS_CONFIG_CONTRACTS
    - APPLY_MINIMAL_CORRECTION
    - RUN_RELEVANT_TESTS
    - ENQUEUE_RELATED_FAILURES
    - FIX_RELATED_FAILURES
    - SCAN_DIRECT_REGRESSIONS
    - RERUN_RELEVANT_SUITE
    - COUNTERPROOF
    - REMEASURE_CURRENT_TARGET
    - FIXED_POINT_OR_PROVEN_BOUNDARY

guided_code_path:
