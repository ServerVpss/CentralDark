schema: centraldark.proven-deterministic-lock.v1
status: CANDIDATE_UNTIL_SAME_HEAD_GATES
owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC
authority: SEGREDO/CHEFE

purpose: >-
  Tornar aprendizado comprovado reutilizavel e deterministico sem reabrir
  raciocinio ja selado. O lock protege claim+owner; melhoria mensuravel pode
  reabrir o mesmo claim somente com a mesma chave e causa explicita.

invariants:
  one_system_only: true
  reuse_before_create: true
  unknown_is_not_pass: true
  action_is_not_proof: true
  learning_never_discarded: true
  proven_becomes_deterministic_candidate: true
  deterministic_requires_real_consumer: true
  deterministic_requires_positive_negative_test: true
  deterministic_requires_verifiable_receipt: true
  same_head_required_when_ci_is_claimed: true
  sealed_claim_default: LOCKED_READ_ONLY
  no_new_information: REUSE_PROOF
  failed_candidate: REFUTED_MINERAL
  unresolved_candidate: UNRESOLVED_MINERAL

lock_identity:
  key_material: [CLAIM_KEY, OWNER]
  algorithm: SHA256
  stable_across_sessions: true
  model_switch_changes_key: false
  provider_switch_changes_key: false
  chat_switch_changes_key: false
  syntax_switch_changes_key: false

seal_requires:
  - CLAIM_KEY
  - OWNER
  - PROOF_TARGET
  - EVIDENCE_REF
  - OBSERVED_AT
  - STATE_PROVED
  - COUNTERPROOF_PASS
  - RECEIPT_REF

reopen_requires_all:
  - SAME_LOCK_KEY
  - REOPEN_CAUSE_REF
  - MATERIAL_IMPROVEMENT
  - COUNTERPROOF_PLAN
  - CURRENT_TARGET_REMEASURED

reopen_denied_when:
  - DIFFERENT_LOCK_KEY
  - NO_NEW_INFORMATION
  - STYLE_ONLY_CHANGE_WITHOUT_CAPABILITY_GAIN
  - REPEATED_CLAIM_WITHOUT_NEW_EVIDENCE
  - MODEL_ONLY_DISAGREEMENT

proven_fast_path:
  semantic_name: PROVEN_SEALED_FAST_PATH
  content_identity: SHA256
  filename_is_identity: false
  same_content_sha_different_filename: SAME_ARTIFACT_KEEP_PROVENANCE
  reuse_requires: [SEALED_PROVEN, SAME_LOCK_KEY, SAME_MATERIAL_SIGNATURE, NO_MATERIAL_CONTRADICTION]
  on_reuse:
    route: DETERMINISTIC_FAST_PATH
    llm_required: false
    rewalk_full_repository: false
  reopen_when: [MATERIAL_SIGNATURE_CHANGED, MATERIAL_UNKNOWN, MATERIAL_CONTRADICTION, OWNER_GAP, NEW_CAPABILITY_DELTA]
  on_reopen:
    scope: AFFECTED_CONE_ONLY
    first_route: DETERMINISTIC_RECONCILIATION
    llm_route: ONLY_IF_UNRESOLVED_AFTER_DETERMINISTIC_RECONCILIATION
    unaffected_sealed_claims_remain_locked: true
  consumers:
    applies_to_bound_hub_api_connector_engine: true
    known_signature_without_llm: true
    consumer_is_not_new_authority: true
  tlc23:
    canonical_filename: TLC23.pdf
    source_sha256: b4e2a0655b7e0c85ca329c33971b377299dde6358779270c573f014f3aa606d1
    upload_suffix_is_alias_only: true
    method: HORN_FORWARD_CHAINING_TO_FIXED_POINT


derived_oracle:
  new_agent: false
  source: [PROVEN_CLAIMS_LOCK, CURRENT_LIVE_STATE, MATERIAL_SIGNATURE, OWNER_MAP]
  known_sealed_same_signature: DETERMINISTIC_FAST_PATH
  changed_or_unknown: REOPEN_AFFECTED_CONE_ONLY
  ai_role: RESOLVE_ONLY_UNCLOSED_FRONTIER
  output: [ROUTE, OWNER, CLAIM_STATE, AFFECTED_CONE, PROOF_TARGET, NEXT_CURSOR]
  output_is_proof: false

checkpoint_policy:
  family_owner: docs/BRAIN/02-ENTRADA/CHECK-LIST-DIARIO.md
  cadences: [DAILY, WEEKLY, FIFTEEN_DAYS, MONTHLY]
  time_elapsed_alone_reopens_claim: false
  same_signature: REUSE_PROOF
  changed_signature: INVALIDATE_DEPENDENTS_ONLY
  receipt: [OBSERVED_AT, HEAD_SHA, MATERIAL_SIGNATURE, CONTENT_SHA256, OWNER, EVIDENCE_REF, NEXT_CURSOR]

repository_link_policy:
  input: GITHUB_REPOSITORY_URL
  mining_owner: docs/BRAIN/01-CONCEITOS/05-MINERACAO/MINERACAO_API_FIRST_DELTA_ONLY.md
  router_owner: .agents/skills/capability-contract-router/SKILL.md
  history_owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/PEGATUDO-HISTORY.yml
  mode: API_FIRST_METADATA_FIRST_DELTA_ONLY
  panel_role: PROJECTION_NOT_AUTHORITY
  source_url_is_permission: false
  same_revision_and_fingerprint: NO_REMINING
  source_changed: MINE_DELTA_ONLY
  absorb_only_proven_delta: true
  abandoned_internal_branches: PEGATUDO_HISTORY
  no_parallel_evaluator: true

trigger_loader:
  owner: scripts/trigger-fabric/centraldark_full_trigger_boot.py
  sources:
    - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/TRIGGERS.yml
    - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/MASTER-CYCLE.yml
    - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/ENGINE_BINDING.yml
  command_entry_normalization:
    ignore_case: true
    leading_bang_or_hash_equivalent: true
    unicode_accents_normalized: true
    prose_mentions_do_not_activate: true
    line_start_or_explicit_command_context_required: true
  load_full_registry: true
  execute_all_phases_blindly: false
  execute_materially_applicable_only: true
  verses_are_presentation_and_orientation: true
  verse_change_must_not_change_chefe_intent: true

canonical_flow:
  - DESTINATION_LOCK
  - ACORDAR
  - CALIBRAR
  - MULTIBUSSOLA
  - META_LUPA
  - RECONCILIAR
  - DELTA_UTIL
  - CONTRAPROVA
  - REMEDICAO
  - SEMANTIC_GREEN
  - FIXED_POINT
  - POST_GREEN_LOCK
  - REGISTRA
  - BOOT

promotion:
  proven_learning_flow:
    - MATERIAL
    - CLASSIFY
    - FIND_EXISTING_OWNER
    - TEST
    - COUNTERPROOF
    - REALITY_JUDGE
    - PROVED
    - DETERMINISTIC_IMPLEMENTATION
    - POSITIVE_NEGATIVE_TEST
    - RECEIPT
    - CLAIM_SEAL
    - REUSE_PROOF
  improvement_flow:
    - SEALED_CLAIM
    - SAME_LOCK_KEY
    - REOPEN_CAUSE_REF
    - MATERIAL_IMPROVEMENT
    - TARGETED_REVALIDATION
    - COUNTERPROOF
    - NEW_RECEIPT
    - RESEAL_SAME_CLAIM

fixed_point:
  stop_when:
    - NO_NEW_INFORMATION
    - FIXED_POINT
    - HUMAN_FRONTIER
    - BLOCKED_WITH_EXPLICIT_CAUSE
  infinite_retry_without_information_gain: FORBIDDEN
  reopen_entire_system_for_local_delta: FORBIDDEN
  invalidate_only_dependent_claims: true
