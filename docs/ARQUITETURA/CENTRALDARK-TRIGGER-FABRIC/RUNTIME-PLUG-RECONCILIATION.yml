schema: centraldark.runtime-plug-reconciliation.v2
name: RUNTIME-PLUG-RECONCILIATION
status: ROUND_TRIP_RECONCILED
owner: CENTRALDARK_TRIGGER_FABRIC
scope: "Reclassificar arquitetura + runtime plug por prova distribuída em main, branch, runtime, logs e harness. Ausência em um arquivo nunca equivale automaticamente a ausência no sistema."

proof_rule:
  FILE_LOCAL_ABSENCE_IS_NOT_SYSTEM_ABSENCE: true
  MAIN_EVIDENCE_HAS_HIGHEST_REPO_WEIGHT: true
  RUNTIME_LOG_CAN_PROVE_EXECUTION_WITHOUT_PROVING_MAIN: true
  HARNESS_PASS_CAN_PROVE_COMPONENT_WITHOUT_PROVING_GLOBAL_RUNTIME: true
  PR_BRANCH_CAN_PROVE_IMPLEMENTED_CANDIDATE_WITHOUT_PROVING_PROMOTION: true
  DERIVED_GRAPH_TRAVERSAL_IS_NOT_SEMANTIC_CAUSALITY: true
  UNKNOWN_IS_NOT_PASS: true

review_method:
  forward: MANY_POINTS_TO_NUCLEUS
  reverse: NUCLEUS_TO_MANY_POINTS
  adaptive_fronts_max: 10
  fronts:
    - BOOT_IDENTITY
    - INTENT_MASTER_CYCLE
    - MEMORY_GRAPH
    - CAPABILITY_ROUTING
    - RUNTIME_ENGINE
    - TOOLS_SENSORS
    - HANDOFF_CONTINUITY
    - WRITER_EXECUTION
    - PROOF_JUDGE
    - CI_DEPLOY_RESIDUAL
  rendezvous_requires_same_denominator: true
  no_information_gain: DROP_DUPLICATE

