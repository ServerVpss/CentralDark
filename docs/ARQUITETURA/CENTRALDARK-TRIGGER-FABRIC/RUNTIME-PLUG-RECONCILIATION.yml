many_to_few:
  formula: "CATALOGUED_POINTS -> 10_FRONTS -> DEDUPE -> OWNERS -> CAPABILITIES -> MINIMUM_RUNTIME_SET -> NUCLEUS"

few_to_many:
  formula: "NUCLEUS -> OWNERS -> CAPABILITIES -> RUNTIMES_TOOLS -> EVIDENCE -> CATALOGUED_POINTS"

rendezvous:
  require_same_universe: true
  require_same_material_unknown_set: true
  require_no_fragment_drop: true
  require_no_semantic_edge_pollution: true
  divergence: META_LUPA_RECONCILE_AND_REPEAT

next_delta:
  principle: "Only residual executable/live gaps remain; do not rebuild proven architecture."
  actions:
    - WIRE_NEW_SELF_TESTS_INTO_EXISTING_PORTA_DE_ENTRADA
    - FEED_LIVE_HOST_RESOURCE_PROBE_TO_CONFORMANCE_CHECKER
