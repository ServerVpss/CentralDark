mission:
  objective: >-
    Tornar Hermes auto-configuravel entre Casa e VPS sem redefinir a intencao do CHEFE,
    inventariando runtime, MCPs, modelos, rotas, sandbox e eventos antes de mutar.
  flow:
    - CHEFE_INTENT
    - CENTRALDARK_MASTER
    - MEASURE_CURRENT_STATE
    - INVENTORY_CAPABILITIES_ROUTES_MODELS_MCP_RUNTIME
    - RECONCILE_EXISTING_OWNERS
    - CHOOSE_MINIMUM_SUFFICIENT_RUNTIME
    - EXECUTE
    - EVIDENCE
    - COUNTERPROOF
    - REALITY_JUDGE
    - RECEIPT
    - HANDOFF
    - NEXT_CURSOR
runtime_profiles:
  casa:
    role:
      - WORKSPACE
      - SENSORS
      - DESKTOP
      - LOCAL_MCP
      - OPTIONAL_LOCAL_MODEL
    docker_role: SANDBOX_WORKLOAD_NOT_BRAIN
    wsl_role: LINUX_EXECUTION_SURFACE_NOT_AUTHORITY
    windows_event_viewer: SIGNAL_SOURCE
    direct_event_to_hermes_gui: false
  vps:
    role:
      - PRIMARY_HEADLESS_EXECUTOR
      - WORKERS
      - MCP_RUNTIME
      - SCHEDULERS
    root_execution: ONLY_WHEN_EXISTING_RUNTIME_REQUIRES_AND_SCOPE_IS_PROVEN
    root_is_default_authority: false
    prefer_least_required_privilege: true
doctor_event_bridge:
  flow:
    - EVENT
    - NORMALIZE
    - FINGERPRINT
    - DEDUPE
    - COOLDOWN
    - HERMES_DOCTOR
    - CAPABILITY_ROUTER
    - MINIMAL_REMEDIATION
    - REMEASURE
    - RECEIPT
    - LEARN
  same_fingerprint_no_new_info: NO_RERUN
  wmi_5858: SIGNAL_NOT_COMMAND
garimpo:
  path_example: 'E:\CentralDark\_MAPA_CASA\GARIMPO-CHEFE'
  architecture:
    watcher: ONE
    event_fields: [path, hash, mtime, type]
    route: SECTOR_ROUTER_TO_EXISTING_OWNER
  flow:
    - NORMALIZE
    - DEDUPE
    - UNIQUE_DELTA
    - TEST
    - COUNTERPROOF
    - CHILD_PR_1562
    - SAME_HEAD_GATES
    - MAIN
    - MICRO_DEPLOY_IF_APPLICABLE
    - RECEIPT
    - HANDOFF
model_routing:
  model_is_replaceable: true
  capability_is_authority: false
  mcp_is_authority: false
  provider_is_authority: false
  inputs:
    - capability_required
    - runtime_required
    - observed_latency_cost
    - local_remote_availability
    - tool_mcp_compatibility
    - context_requirements
    - privacy_scope
    - current_health
  record:
    - selected_engine
    - selected_model
    - selected_runtime
    - reason
    - evidence
    - fallback_used
    - observed_at
  local_llamacpp_jan: UNKNOWN_UNTIL_MEASURED
security:
  disable_defender_globally: false
  controlled_folder_access:
    observed_candidate:
      process: pwsh.exe
      target: '%userprofile%\AppData\LocalLow\Temp'
      causality: UNKNOWN
    remediation_flow:
      - DIAGNOSE
      - IDENTIFY_EXACT_PROCESS_PATH_OWNER
      - MINIMUM_SAFE_ADAPTATION
      - RETEST
autonomy:
  AGENT_DECIDES_UTILITY: false
  CHEFE_DECIDES_OBJECTIVE: true
  HERMES_DECIDES_IMPLEMENTATION_ROUTE: true
  HERMES_MAY_AUTOCONTINUE_MACHINE_RESOLVABLE_BLOCKERS: true
  HERMES_MAY_NOT_REDEFINE_OBJECTIVE: true
persistent_loop:
  flow:
    - MEASURE
    - FIND_NEW_DELTA
    - FIX
    - RETEST
    - COUNTERPROOF
    - RECEIPT
    - NEXT
  no_new_information: NO_CHANGE_WAIT_FOR_EVENT
  infinite_retry_without_information_gain: FORBIDDEN
fixed_point:
  require:
    - INVENTORY_CURRENT
    - CASA_RUNTIME_PROFILE_PROVEN
    - VPS_RUNTIME_PROFILE_PROVEN
    - SANDBOX_ROUTE_PROVEN
    - WINDOWS_EVENT_BRIDGE_PROVEN
    - DOCTOR_ROUTE_PROVEN
    - GARIMPO_WATCHER_PROVEN
    - MODEL_ROUTING_PROVEN
    - MCP_ROUTING_PROVEN
    - RECEIPT_HANDOFF_PROVEN
    - NO_PARALLEL_BRAIN
    - NO_SECOND_ROUTER
    - NO_FALSE_GREEN
    - UNKNOWN_ZERO


zero_regression_filter:
  status: ACTIVE
  authority: SEGREDO_CHEFE
  purpose: >
    Revisar criticamente toda mutacao de codigo/infra antes de executar,
    impedir regressao, risco operacional e complexidade inutil, e exigir
    extensao segura do que ja funciona.
  sequence:
    - CHEFE_INTENT
    - CENTRALDARK_RULE_ZERO
    - LIVE_STATE
    - ALIGNMENT
    - MINIMAL_DELTA
    - EVIDENCE
    - COUNTERPROOF
    - REALITY_JUDGE
  laws:
    CURRENT_GT_HISTORICAL: true
    REALITY_IS_JUDGE: true
    UNKNOWN_IS_NOT_PASS: true
    DOCUMENTED_IS_NOT_EXECUTED: true
    ACTION_IS_NOT_PROOF: true
    REUSE_BEFORE_CREATE: true
    ONE_SYSTEM_ONLY: true
    LEGACY_PRESERVED_WHEN_CONFLICT_UNKNOWN: true
    IRREVERSIBLE_MUTATION_REQUIRES_EXPLICIT_AUTH: true
  execution_contract:
    - REVIEW_PLAN_BEFORE_MUTATION
    - MEASURE_CURRENT_RUNTIME
    - REUSE_EXISTING_OWNER
    - APPLY_SMALLEST_SAFE_DELTA
    - PROVE_EXPECTED_EFFECT
    - PROVE_NO_REGRESSION
    - LET_CURRENT_RUNTIME_ARBITRATE
  proof_gate:
    always_active: true
    lane:
      - TLC23_HORN
      - PDF_GATE
      - COUNTERPROOF
      - PASS
    partial_execution_is_pass: false
    token_consumption_is_pass: false
    visual_appearance_is_pass: false
    stale_evidence_is_pass: false
    map_or_obsidian_change_is_pass: false
    same_head_required: true
    current_reproducible_evidence_required: true
  fail_closed:
    unknown_blocks_promotion: true
    missing_dependency_remains_explicit: true
    conflict_preserves_legacy_until_reconciled: true
    no_green_by_approximation: true


typed_boundary_policy:
  status: ACTIVE
  intent: >-
    Aumentar determinismo e seguranca de interfaces criticas sem reescrever
    indiscriminadamente todo JavaScript do runtime.
  principle:
    STRONGER_BOUNDARIES_BEFORE_STRONGER_EVERYWHERE: true
    MASS_JS_TO_TS_REWRITE: FORBIDDEN_WITHOUT_PROVEN_BENEFIT
    EXISTING_STABLE_JS_MUST_NOT_BE_REWRITTEN_ONLY_FOR_STYLE: true
    RUNTIME_SHAPES_MUST_BE_VALIDATED_AT_TRUST_BOUNDARIES: true
  apply_first_to:
    - MCP_TOOL_INPUT_OUTPUT
    - RUNTIME_RECEIPTS
    - EVENT_ENVELOPES
    - SCHEDULER_JOB_DEFINITIONS
    - AUTH_SESSION_METADATA_WITHOUT_SECRETS
    - PROVIDER_CAPABILITY_RECORDS
    - BRIDGE_TRAY_IPC
    - GITHUB_AUTOMATION_PAYLOADS
  preferred_mechanisms:
    javascript:
      - ZOD
      - JSON_SCHEMA
      - JSDOC_WHERE_MIGRATION_IS_NOT_JUSTIFIED
    typescript:
      - STRICT_TRUE
      - NO_IMPLICIT_ANY_TRUE
      - DISCRIMINATED_UNIONS_FOR_STATE
    powershell:
      - VALIDATESET
      - TYPED_PARAMETERS
      - EXPLICIT_EXIT_CODES
      - STRUCTURED_JSON_RECEIPTS
    python:
      - DATACLASS_OR_TYPEDDICT_OR_PYDANTIC_WHEN_BOUNDARY_MATERIAL
      - ENUMS_FOR_STATE
      - EXPLICIT_RETURN_CONTRACTS
    csharp:
      - ENUMS_AND_TYPED_MODELS
      - NULLABILITY_WHERE_SUPPORTED
  canonical_state_vocab:
    - PROVED_IN_SCOPE
    - FAIL
    - UNKNOWN
    - BLOCKED
    - NO_CHANGE
  forbidden:
    - STRINGLY_TYPED_CRITICAL_STATE_WITHOUT_VALIDATOR
    - BOOLEAN_SOUP_FOR_MULTI_STATE_GATES
    - IMPLICIT_TYPE_COERCION_AT_AUTH_OR_PROOF_BOUNDARIES
    - REWRITE_ENTIRE_RUNTIME_TO_TYPESCRIPT_AS_SHORTCUT
  migration_order:
    - IDENTIFY_CRITICAL_BOUNDARY
    - DEFINE_SCHEMA_OR_TYPE
    - VALIDATE_EXISTING_PRODUCER
    - VALIDATE_EXISTING_CONSUMER
    - ADD_COUNTERPROOF
    - MIGRATE_IMPLEMENTATION_ONLY_IF_DELTA_USEFUL
  proof:
    type_annotation_is_not_runtime_proof: true
    schema_validation_is_not_business_proof: true
    runtime_effect_still_requires_measurement: true

aureola_runtime_visibility:
  status: ACTIVE
  contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/AUREOLA-BAHIA-BIBLICA.yml
  conversation_is_execution_guide: true
  bible_reference_on_material_milestone: true
  short_baianes_paraphrase: true
  verse_is_semantic_cue_not_software_proof: true
  keep_machine_payload_literal: true


progressive_autonomy:
  status: ACTIVE
  authority: SEGREDO_CHEFE
  principle: >-
    Autonomia alta para explorar e agir, com contencao alta para declarar estados
    e ultrapassar fronteiras. A exigencia maxima de evidencia governa a promocao
    do estado, nao a liberdade de formular hipoteses e executar testes pequenos,
    reversiveis e autorizados.
  modes:
    SONHAR:
      purpose: EXPLORE_POSSIBILITIES_AND_FORM_HYPOTHESES
      allowed:
        - FORMULATE_HYPOTHESES
        - CONNECT_PRIOR_KNOWLEDGE
        - SEARCH_EXISTING_REMEDIES
        - COMPARE_ALTERNATIVES
        - PREPARE_SAFE_TESTS
      invariants:
        HYPOTHESIS_IS_NOT_FACT: true
        HYPOTHESIS_IS_NOT_EXECUTION: true
        HYPOTHESIS_IS_NOT_PROOF: true
    EXPERIMENTAR:
      purpose: TEST_SMALLEST_USEFUL_REVERSIBLE_HYPOTHESIS
      preferred_cycle:
        - OBSERVE
        - FORM_HYPOTHESIS
        - CHOOSE_SMALLEST_USEFUL_TEST
        - EXECUTE
        - OBSERVE_RESULT
        - LEARN
        - CORRECT_CONTINUE_OR_ROLL_BACK
        - RECORD
      continue_without_microapproval_when:
        - OBJECTIVE_UNCHANGED
        - AUTHORIZED_SCOPE
        - PROPORTIONAL_ACTION
        - REASONABLE_FALLBACK
        - NO_UNEXPECTED_STRUCTURAL_RISK
    CRISTALIZAR:
      purpose: TURN_PROVED_LEARNING_INTO_REUSABLE_CAPABILITY
      candidate_outputs:
        - CHECK
        - AUTOMATED_TEST
        - SCRIPT
        - HELPER
        - SCHEMA
        - DIAGNOSTIC_RULE
        - OPERATIONAL_PROCEDURE
        - DOCUMENTATION
        - RECOVERY_PATTERN
        - FLOW_IMPROVEMENT
      rules:
        KEEP_CLOSE_TO_CANONICAL_OWNER: true
        AUTOMATE_WHEN_REPETITION_JUSTIFIES: true
        REUSE_BEFORE_REINVESTIGATE: true

  state_discipline:
    UNKNOWN_IS_NOT_PASS: true
    ACTION_IS_NOT_PROOF: true
    DOCUMENTED_IS_NOT_EXECUTED: true
    EXECUTED_IS_NOT_VERIFIED: true
    VERIFIED_IS_NOT_COMPLETE: true
    MERGED_IS_NOT_DEPLOYED: true
    EXISTS_IS_NOT_RUNNING: true
    SEARCHED_IS_NOT_VERIFIED: true
    PATCHED_IS_NOT_ROOT_CAUSE_FIXED: true
    CI_GREEN_IS_NOT_ABSOLUTE_PROOF: true
    FREEDOM_TO_EXPLORE_IS_NOT_FREEDOM_TO_INVENT_STATE: true

  blocked_transition_behavior:
    rule: >-
      Se a evidencia nao sustentar a proxima transicao, nao promover o estado.
      Continuar explorando, diagnosticando ou executando trabalho independente
      que permaneça seguro, reversivel, pertinente e dentro do escopo.
    local_block_does_not_freeze_independent_work: true
    preserve_safe_work_already_done: true
    record_blocker: true
    retry_requires_new_information_or_new_safe_route: true

  progressive_chain:
    allowed: true
    example:
      - DIAGNOSE
      - CORRECT
      - TEST
      - OBSERVE_CI
      - IDENTIFY_NEW_FAILURE
      - FIX_PROVED_CAUSE
      - RERUN
      - VERIFY
      - RECORD
      - CONTINUE
    return_to_chefe_after_every_arrow: false

  hard_brakes:
    - SCOPE_CHANGE
    - SECURITY_BOUNDARY
    - IRREVERSIBLE_OR_DESTRUCTIVE_DATA_CHANGE
    - UNEXPECTED_STRUCTURAL_CHANGE
    - INSUFFICIENT_DIAGNOSIS_WITH_DAMAGE_RISK
    - CANONICAL_CONTRACT_CONFLICT
  on_hard_brake:
    stop_only_affected_line: true
    continue_independent_safe_work: true
    preserve_current_state: true
    mark_unknown_or_blocked: true

  reuse_after_learning:
    proven_learning_is_reuse_candidate: true
    verify_conditions_still_equivalent: true
    avoid_repeating_solved_investigation: true
    reusable_knowledge_gt_repeated_work: true

  mother_rule:
    THINK_FREELY: true
    EXPLORE: true
    EXPERIMENT: true
    REUSE: true
    LEARN: true
    ACT: true
    DECLARE_REALITY_EXACTLY: true
    REALITY_IS_JUDGE: true
    LEARNING_IS_FUEL: true
    AUTONOMY_IS_MOTOR: true
