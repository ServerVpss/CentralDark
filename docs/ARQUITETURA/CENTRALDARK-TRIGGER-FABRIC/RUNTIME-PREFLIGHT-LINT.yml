schema: centraldark.runtime-preflight-lint.v1
status: CANDIDATE_UNTIL_EXECUTABLE_CONSUMER
owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC
authority: SEGREDO/CHEFE

purpose: >-
  Bloquear falso-verde em fan-out Casa/VPS/API/GitHub quando o erro está no
  wrapper, na interpolação host->shell, em variável reservada, ou em cron path
  drift. Este contrato não cria novo executor; ele é preflight obrigatório para
  o executor existente antes de mutação, deploy, kill, sync ou claim verde.

scope:
  applies_to:
    - multi_shell_fanout
    - powershell_probe
    - bash_probe
    - runtime_health_claim
    - cron_runtime_claim
    - desktop_bridge_ownership_claim
    - vps_sync_or_fast_forward
  does_not_execute_runtime: true
  read_only_by_default: true

invariants:
  current_over_plan: true
  unknown_is_not_pass: true
  wrapper_parse_fail_is_not_target_fail: true
  invalid_probe_must_not_become_fact: true
  no_kill_without_handoff_proof: true
  no_sync_dirty_worktree_without_preserving_delta: true
  no_secret_printing: true

lint_rules:
  host_template_interpolation:
    detect:
      - "${...} inside command text generated by JS/template host"
      - "unescaped shell expansion consumed before target shell"
    verdict: FAIL_CLOSED
    learned_from:
      - "2026-09-20 JS wrapper swallowed shell ${PIPESTATUS[0]}"
      - "2026-09-20 JS wrapper parsed shell ${...} before fan-out"

  powershell_automatic_variable_collision:
    detect:
      - "$pid used as mutable local variable in PowerShell"
    reason: "$PID is automatic and case-insensitive; $pid collides with it"
    replacement: "$currentPid or explicit non-reserved variable name"
    verdict: FAIL_CLOSED

  cron_path_drift:
    detect:
      - "crontab references script path that does not exist"
      - "systemd/watchdog references missing script"
    verdict: RUNTIME_DEBT
    pass_requires:
      - script_exists
      - executable_or_interpreter_invocation_valid
      - log_no_recent_not_found

  bridge_ownership:
    detect:
      - "multiple Desktop Commander remote chains"
    verdict: UNKNOWN_UNTIL_PROFILE_MAPPING
    pass_requires:
      - pid_parent_tree
      - package_version
      - profile_or_session
      - socket_state
      - handoff_or_canary_before_kill

  council_runtime:
    detect:
      - "legacy Arsenal ports down"
      - "Grupo Evolução cron/event path active"
    verdict: SPLIT_STATUS_ALLOWED
    pass_requires:
      - distinguish_legacy_council_from_current_council
      - current_status_file
      - last_success_or_failure_log
      - telegram_delivery_state

required_receipt_fields:
  - observed_at
  - surface
  - command_class
  - wrapper_lint_result
  - target_runtime_result
  - invalidated_probe_if_any
  - unknowns_remaining
  - next_cursor

promotion:
  executable_consumer_required: true
  same_head_ci_required_when_claimed: true
  runtime_green_requires_preflight_green: true
  preflight_green_does_not_imply_runtime_green: true
