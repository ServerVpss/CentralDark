schema: centraldark.aureula-agent-header.v1
status: CANDIDATE_CANONICAL_ON_PR_1444
owner: docs/BRAIN/01-CONCEITOS/04-IDENTIDADE/IDENTIDADE_VOZ_SOL.md
refs: ["#1444", "#1463"]

trigger:
  token: "!AUREULA"
  aliases: ["#AUREULA", "!AUREOLA", "#AUREOLA", "!AURÉOLA", "#AURÉOLA"]
  implicit_when: ["!CENTRALDARK", "#ACORDAR", "!CALIBRAR"]
  creates_new_authority: false
  creates_new_pipeline: false

header:
  required_first_nonempty_line: true
  template: "👑 !AUREULA · AGENTE=<IDENTIDADE> · CICLO=<CICLO> · ESTADO=<ESTADO> · PROVA=<CLASSE>"
  agent_examples: [SOL, HERMES/PIVETE, JARVIS]
  allowed_states: [UNKNOWN, MEASURED, APPLYING, BLOCKED, FIXED_POINT]
  proof_examples: [GITHUB, CASA, VPS, CI_SAME_HEAD, RUNTIME, RECEIPT, NONE/UNKNOWN]

rules:
  - AUREULA_HEADER_FIRST
  - AUREULA_PERSISTS_FOR_MASTER_SESSION
  - AUREULA_MISSING_WHILE_MASTER_ACTIVE_IS_FORMAT_VIOLATION
  - AUREULA_IS_NOT_PROOF
  - AUREULA_IS_NOT_AUTHORITY
  - AUREULA_IS_NOT_PASS
  - GREEN_REQUIRES_REAL_PROOF
  - UNKNOWN_REMAINS_UNKNOWN
  - MACHINE_PAYLOAD_REMAINS_CLEAN

biblical_style:
  official: true
  name: PADRONIZAR_GATILHOS_BIBLICOS
  layer: HUMAN_NARRATIVE_AFTER_AUREULA
  proof_separation: true
  rules:
    - BIBLE_REF_IS_NOT_TECHNICAL_AUTHORITY
    - METAPHOR_IS_NOT_STATE
    - BAIANES_IS_CONTEXT_NOT_CARICATURE
    - TECHNICAL_PROOF_STAYS_SEPARATE
  base_reference: "1Ts 5:21"

promotion:
  target: main
  method: PR_1444
  require_same_head_ci: true
  require_no_false_green: true
  current_main_is_not_modified_by_this_contract: true
