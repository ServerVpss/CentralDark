schema: centraldark.engine-binding.v3
contract_owner: LEIA-ME-IA.md
trigger_fabric_owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/CONTRACT.yml
binding_mode: LOAD_REFERENCE
copy_brain: false
engine_is_owner: false

engines:
  grok_build:
    role: REPLACEABLE_ENGINE
    may_operate_via: [github_tools, filesystem_when_available, tests]
    inherits: [LEIA-ME-IA.md, AGENTS.md, Trigger Fabric]
    memory_parallel: false
    new_permission: false
    runtime_specific_claims: MUST_BE_MEASURED
    invocation_proven: false
  mistral_vibe:
    role: CURRENT_INTERACTIVE_ENGINE_WHEN_ACTIVE
    may_operate_via: [filesystem, terminal, git, tests]
    inherits: [LEIA-ME-IA.md, AGENTS.md, Trigger Fabric]
    runtime_specific_claims: MUST_BE_MEASURED
  openai:
    role: REPLACEABLE_ENGINE
    transport_owner: apps/modulos/elite-gateway/scripts/centraldark_omni_router.py
    runtime_specific_claims: MUST_BE_MEASURED
  claude_code:
    role: REPLACEABLE_ENGINE
    transport_owner: apps/modulos/elite-gateway/scripts/centraldark_omni_router.py
    runtime_specific_claims: MUST_BE_MEASURED
  nous:
    role: REPLACEABLE_ENGINE
    transport_owner: apps/modulos/elite-gateway/scripts/centraldark_omni_router.py
    runtime_specific_claims: MUST_BE_MEASURED
  local_ai_future:
    role: FUTURE_LOCAL_CAPABILITY
    status: DEFERRED_UNTIL_MEASURED
    active_now: UNKNOWN
    configured_is_active: false
    health_is_invocation_proof: false
    must_not_route_by_default_until_invocation_proven: true
  other_models:
    role: REPLACEABLE_ENGINE
    inherits: [LEIA-ME-IA.md, AGENTS.md, Trigger Fabric]

agent_runtimes:
  hermes:
    role: EXECUTION_CONTINUITY_RUNTIME
    owner: PIVETE/HERMES
    prompt_consumer: apps/modulos/HERMES-CORE/prompts/hermes-core.md
    transport_owner: apps/modulos/HERMES-CORE
    required_for: [hermes_mission_routing, hermes_session_continuity, hermes_runtime_memory, hermes_hooks, hermes_scheduler, hermes_learning_transfer_test]
    model_catalog_member: false
    selectable_as_engine: false
    active_now: NOT_PROVEN_BY_THIS_DOCUMENT

mandatory_inheritance:
  - GLOBAL_CONTRACT_ENFORCER
  - DELTA_CONTINUO_GLOBAL
  - FIXED_HUD_LIVE_DATA
  - POMBO64_TRACE
  - DESTINATION_LOCK
  - CENTRALDARK_MASTER_CYCLE
  - ACORDAR
  - CALIBRAR
  - MULTIBUSSOLA
  - AUREOLA_BAHIA_BIBLICA
  - SEMANTIC_GREEN_GATE
  - META_LUPA_PROPORTIONAL
  - RECONCILIAR
  - DELTA_UTIL
  - CONTRAPROVA
  - REMEDICAO
  - FIXED_POINT
  - POST_GREEN_LOCK
  - REGISTRA
  - RASTRO
  - BOOT
  - DISTINCT_ENGINEERING_COMPILER_ON_MATERIAL_GAP
  - CAPABILITY_CONTRACT_ROUTER
  - MEGAZORD_CENTRALDARK_AUTO_COMPOSITION
  - SPIRAL_TRAVERSAL_FORWARD_REVERSE
  - RUNTIME_PLUG_CONTRACT
  - RUNTIME_PREFLIGHT_LINT
  - SIGNAL_TERRITORY_CRYSTALLIZATION
  - FIXED_POINT_10X12_ADVERSARIAL_WHEN_CRYSTALLIZING
  - ONE_WRITER_PER_SCOPE
  - OUTPUT_GUARD
  - REALITY_JUDGE
  - RECEIPT_AND_CONTINUATION
  - MATERIAL_INGEST_NO_SILENT_DROP
  - ARTIFACT_PROPERTIES_WHEN_DERIVED
  - SELF_HEALING_FAILURE_LOOP
  - FAILURE_SIGNATURE_REUSE
  - TEMPORARY_EXTERNAL_WATCH
  - ANY_PR_OR_COMMIT_GATE
  - CANONICAL_SELF_HOSTED_RUNNER_POLICY
  - MODEL_TOUCH_EVIDENCE_WHEN_CONFIGURED
  - UNIVERSAL_EVOLUTION_CARACOL

megazord_binding:
  name: MEGAZORD-CENTRALDARK
  contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/MEGAZORD-CENTRALDARK.yml
  capability_router: .agents/skills/capability-contract-router/SKILL.md
  runtime_plug: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/RUNTIME-PLUG-CONTRACT.yml
  spiral_traversal: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/SPIRAL-TRAVERSAL.yml
  activation: AUTO
  user_repetition_required: false
  control_plane_required: true
  target_runtime_may_be_absent_before_selection: true
  activate_when_all: [CONTROL_PLANE_PRESENT, CANONICAL_CONTEXT_DISCOVERABLE, CAPABILITY_ROUTER_DISCOVERABLE]
  resource_discovery: [MCP, CENTRALDARK_HUB, CENTRALDARK_API, GITHUB, FILES, MEMORY, CONNECTORS, RUNTIME, CI, TOOLS, MODELS, ADAPTERS, SCREENPIPE, FUTURE_DISCOVERED_CAPABILITIES]
  catalogue_relevant_metadata: true
  preload_all_bodies: false
  context_policy: MINIMUM_SUFFICIENT_CONTEXT
  discover_relevant_resources: true
  activate_all_resources: false
  selection_policy: MINIMUM_SUFFICIENT_SET
  configured_is_available: false
  discovered_is_available: false
  availability_requires_measurement: true
  required_capability_gap: FAIL_CLOSED
  one_system_only: true
  one_writer_per_scope: true
  reality_is_judge: true
  unknown_is_not_pass: true
  house_runtime_test_is_material_boundary: true
  main_is_consequence: true
  deploy_is_consequence: true


memory_binding:
  owner: .agents/skills/brain-memory/SKILL.md
  required_by_all_engines: true
  applies_to: [CHATGPT, CLAUDE, HERMES, GROK, GEMINI, CODEX, NOUS, LOCAL_MODELS, FUTURE_ENGINES]
  current_engine_included: true
  engine_switch_changes_memory_contract: false
  chat_ack_is_durable_memory: false
  session_context_is_durable_memory: false
  provider_local_memory_is_canonical: false
  centraldark_durable_memory_is_primary: true
  chefe_correction_preference_or_rule_auto_ingest: true
  reuse_existing_memory_owner: true
  create_parallel_memory: false
  write_when_authorized_writer_available: true
  unavailable_writer_behavior: EXISTING_AUTHORIZED_DURABLE_ROUTE_OR_UNKNOWN
  saved_claim_requires: [LOCATION, READBACK]
  unknown_is_not_pass: true

runtime_preflight_binding:
  contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/RUNTIME-PREFLIGHT-LINT.yml
  executable_consumer: scripts/trigger-fabric/centraldark_full_trigger_boot.py#cmd_preflight_lint
  required_by_all_engines: true
  creates_new_executor: false
  applies_before: [MUTATION, DEPLOY, KILL, RESTART, DIRTY_SYNC, MULTI_SHELL_FANOUT, RUNTIME_GREEN_CLAIM]
  fail_closed_on: [PREFLIGHT_CONTRACT_INVALID, HOST_TEMPLATE_INTERPOLATION_RISK, POWERSHELL_PID_AUTOMATIC_VARIABLE_COLLISION, MISSING_REQUIRED_PATH]
  wrapper_parse_fail_is_not_target_fail: true
  invalid_probe_must_not_become_fact: true
  external_tool_host_must_invoke_when_applicable: true
  runtime_executor_hard_enforcement: UNKNOWN_UNTIL_PROVEN

runtime_plug_binding:
  contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/RUNTIME-PLUG-CONTRACT.yml
  conformance: scripts/trigger-fabric/runtime_plug_conformance.py
  selector: .agents/skills/capability-contract-router/scripts/route_capabilities.py
  control_plane_can_precede_target_runtime: true
  target_runtime_materialization: ON_DEMAND
  transport_adapter_required: true
  shared_heavy_runtime_consumer_lease: true
  unload_only_when_consumer_count_zero: true
  swap_preserves: [INTENT, STATE, EVIDENCE_REFS, WRITER_SCOPE, PROOF_TARGET, RECEIPT, GLOBAL_GATE_RECEIPT, HUD_STATE_HASH, NEXT_CURSOR, SPIRAL_CURSOR, UNRESOLVED_SET]
  forward_reverse_swap_conformance_required: true

spiral_binding:
  contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/SPIRAL-TRAVERSAL.yml
  verifier: scripts/trigger-fabric/spiral_traversal.py
  navigation_overlay_only: true
  semantic_edge_mutation: false
  graph_force_mutation: false
  all_catalogued_metadata_reachable: true
  full_body_preload: false
  forward_reverse_required: true
  adaptive_fronts_max: 10
  no_fragment_drop: true

master_cycle_binding:
  contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/MASTER-CYCLE.yml
  resolver: scripts/trigger-fabric/centraldark_master_cycle.py
  global_contract: docs/CONSCIENCIA/CONTRATO-RECONCILIACAO-ANTES-DE-CRIAR.json
  global_contract_enforcer: scripts/agent-call.mjs
  deploy_gate: scripts/vps/deploy-guards-dispatcher.sh
  future_executor_requires_global_gate: true
  mutation_without_global_entry_gate: FAIL_CLOSED
  delta_continuo_required: true
  hud_fixed_live_data_required: true
  explicit_trigger: "!CENTRALDARK"
  plain_word_centraldark_does_not_trigger: true
  expands_to: [ACORDAR, CALIBRAR, MULTIBUSSOLA, AUREOLA_BAHIA_BIBLICA, META_LUPA, RECONCILIAR, DELTA_UTIL, CONTRAPROVA, REMEDICAO, SEMANTIC_GREEN, FIXED_POINT, POST_GREEN_LOCK, REGISTRA, RASTRO, BOOT]
  session_state_consumer: scripts/trigger-fabric/centraldark_master_cycle.py#resolve_with_session_state
  session_state_requires_caller_file: true
  explicit_activation_requires_chefe_provenance: true
  negated_or_discussed_master_does_not_activate: true
  all_phases_considered: true
  phase_execution_is_adaptive: true
  master_trigger_is_authority: false
  master_trigger_is_mutation_permission: false
  pr_mother_provenance: 1189
  source_prs_reconciled: [1115, 1157, 1161, 1166, 1167, 1168, 1169, 1170, 1172, 1189, 1240, 1241, 1243, 1245, 1269, 1300, 1314, 1330, 1335, 1336, 1339, 1349, 1350, 1354]
  second_semantic_owner: FORBIDDEN
  graph_is_derived_not_authority: true
  valuable_memory_requires_properties: true

aureola_semantic_lock_binding:
  visible_route_contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/AUREOLA-BAHIA-BIBLICA.yml
  semantic_green_contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/SEMANTIC-GREEN-GATE.yml
  semantic_green_runtime: apps/modulos/HERMES-CORE/core/semantic-green-gate.mjs
  post_green_lock_contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/POST-GREEN-LOCK.yml
  post_green_lock_runtime: apps/modulos/HERMES-CORE/core/scope-lock-gate.mjs
  applies_to_all_engines: true
  model_switch_changes_contract: false
  provider_switch_changes_contract: false
  skin_switch_changes_contract: false
  operational_trace_is_private_reasoning: false
  operational_trace_is_visible_debug_route: true
  multibussola_axis_required_for_semantic_green: true
  same_head_ci_required_before_lock: true
  post_green_default: LOCKED_READ_ONLY
  locked_scope_mutation_without_explicit_chefe_intent: DENY
  explicit_reopen: WARN_THEN_NEW_CANDIDATE_CYCLE
  previous_last_good_state_preserved: true

model_touch_binding:
  router: apps/modulos/elite-gateway/scripts/centraldark_omni_router.py
  evidence_owner: supabase/functions/_shared/evidence-envelope.mjs
  evidence_entry: supabase/functions/agent-log/index.ts
  event: model_touch
  telemetry_is_optional_when_endpoint_unconfigured: true
  telemetry_delivery_status_must_be_observable: true
  telemetry_failure_is_provider_failure: false
  telemetry_failure_may_be_hidden: false
  mission_id_fabrication: FORBIDDEN
  secrets_in_event: FORBIDDEN

self_healing_binding:
  applies_to: [PR, COMMIT, CI, TOOL_ERROR, TEST_FAILURE, RUNTIME_DRIFT, OPERATIONAL_FAILURE, RED_ISSUE, RED_PR_OR_FAILED_CHECK, CAPABILITY_GAP, SIGNAL_STATE_CHANGE, TERRITORY_ROUTE_CHANGE]
  engine_must:
    - MEASURE_CURRENT_STATE
    - CLASSIFY_FAILURE_SIGNATURE
    - SEARCH_EXISTING_CRYSTAL
    - IDENTIFY_CAUSE
    - CHOOSE_DISCRIMINATING_TEST
    - EXECUTE_MINIMAL_SAFE_REMEDIATION
    - RETEST
    - COUNTERPROOF
    - REALITY_JUDGE
    - WRITE_RECEIPT
    - PROMOTE_LAST_GOOD_STATE
    - CONTINUE_NEXT_CURSOR
  same_failure_no_new_information: REUSE_CRYSTAL_NOT_RETHINK
  unknown: SEARCH_REALITY
  human_return_before_fixed_point: FORBIDDEN_UNLESS_HUMAN_FRONTIER

universal_evolution_binding:
  marker: UNIVERSAL_EVOLUTION_CARACOL
  applies_to:
    - ALL_CURRENT_SKILLS
    - ALL_FUTURE_DISCOVERED_SKILLS
    - CURRENT_ARCHITECTURE
    - FUTURE_DISCOVERED_ARCHITECTURE
    - PR
    - COMMIT
    - CI
    - ERROR
    - LEARNING
    - COGNITIVE_ARTIFACT
    - WORKFLOW
    - JOB
    - RUNNER
    - ZORD
    - ADAPTER
    - PROVIDER
    - TOOL
    - RUNTIME
  discovery_owner: .agents/skills/capability-contract-router/SKILL.md
  control_plane_owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/CONTRACT.yml
  automatic_for_discovered_capability: true
  user_repetition_required: false
  future_skill_must_inherit_control_plane: true
  future_architecture_must_bind_existing_control_plane: true
  future_capability_must_route_through_capability_router: true
  second_brain_router_or_judge: FORBIDDEN
  new_owner_requires_real_gap: true
  reuse_before_create: true
  one_system_only: true
  one_writer_per_scope: true
  learning_never_discarded: true
  failed_candidate: REFUTED_MINERAL
  unresolved_candidate: UNRESOLVED_MINERAL
  proven_improvement: CRYSTAL_GOLD
  same_failure_no_new_information: REUSE_CRYSTAL_NOT_RETHINK
  caracol:
    mode: FORWARD_REVERSE_UNTIL_FIXED_POINT
    trigger_on: [NEW_HEAD, OWNER_DRIFT, RUNTIME_DRIFT, ARCHITECTURE_DRIFT, EVIDENCE_DRIFT, NEW_CAPABILITY, TEST_FAILURE, TOOL_ERROR]
    return_to_last_proven_cursor: true
    preserve_independent_proof: true
    invalidate_only_dependent_stale_claims: true
    remeasure_affected_cone_only: true
    continue_next_cursor: true
    no_infinite_retry_without_information_gain: true
  stop_conditions: [FIXED_POINT, HUMAN_FRONTIER, BLOCKED_WITH_EXPLICIT_CAUSE, NO_NEW_INFORMATION]
  gate: ANY_PR_OR_COMMIT_GATE
  hard_guarantee_requires: [REAL_CONSUMER, POSITIVE_NEGATIVE_TEST, BLOCKING_GATE_WHEN_APPLICABLE, VERIFIABLE_RECEIPT]

external_dependency_watch_binding:
  marker: TEMPORARY_EXTERNAL_WATCH
  applies_to: [PR, CI, DEPENDABOT, EXTERNAL_JOB, ASYNC_PROVIDER, THIRD_PARTY_EXECUTOR]
  trigger_when:
    - ACTION_ALREADY_DISPATCHED
    - EXTERNAL_EXECUTOR_OWNS_NEXT_STATE
    - PENDING_REQUIRES_OBSERVATION_NOT_REPEAT
  engine_must:
    - MEASURE_CURRENT_STATE_ONCE
    - DEDUPE_REPEATED_SIGNAL
    - CREATE_TEMPORARY_READ_ONLY_WATCH_WHEN_MONITORING_INTENT_IS_EXPLICIT
    - BOUND_WATCH_BY_TERMINAL_CONDITION_AND_TIMEOUT
    - STOP_ON_CONFIRMED_TERMINAL_CONDITION
    - REMEASURE_LIVE_SOURCE
    - WRITE_RECEIPT
    - DELETE_OR_EXPIRE_TEMPORARY_WATCH_RESOURCE
    - VERIFY_TEMPORARY_WATCH_CLEANUP
    - CONTINUE_NEXT_CURSOR
  engine_must_not:
    - REPEAT_ALREADY_DISPATCHED_COMMAND_WITHOUT_NEW_INFORMATION
    - ASK_CHEFE_TO_CHOOSE_EQUIVALENT_LOW_RISK_IMPLEMENTATION_DETAILS
    - TURN_OBSERVATION_INTO_MUTATION
    - CREATE_PERSISTENT_DAEMON_FOR_EPHEMERAL_WAIT
    - CLAIM_TERMINAL_SUCCESS_FROM_TIMEOUT_OR_SILENCE
  authorization:
    unsolicited_monitor_creation: FORBIDDEN
    monitoring_intent_required: true
    explicit_same_mission_monitoring_intent_authorizes_temporary_watch_without_per_step_reask: true
    temporary_watch_does_not_authorize_target_mutation: true
  proof:
    terminal_condition_must_be_observed_on_live_source: true
    unknown_is_not_pass: true
    same_signal_without_new_information: DROP_DUPLICATE
    self_cleanup_must_be_verified: true

semantic_crystal_binding:
  architecture: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/SIGNAL-TERRITORY-CAPABILITY-CRYSTAL.md
  gap_compiler: .agents/skills/distinct-engineering-compiler/SKILL.md
  capability_router: .agents/skills/capability-contract-router/SKILL.md
  signal_territory_crystallizer: .agents/skills/signal-territory-crystallizer/SKILL.md
  fixed_point_reference: .agents/skills/distinct-engineering-compiler/references/signal-territory-fixed-point.md
  deterministic_tool: scripts/trigger-fabric/semantic_crystal_tool.py
  signal_is_cause: false
  role_is_identity: false
  name_is_capability: false
  fixed_point_is_main: false

ci_runner_binding:
  github_hosted: FORBIDDEN
  default: [self-hosted, Linux]
  platform_specific: SELF_HOSTED_ONLY_WITH_CAPABILITY_PROOF
  root_workflow_gate: scripts/trigger-fabric/verify_repo_contract.py
  pull_request_and_commit_entry: .github/workflows/porta-de-entrada.yml

hard_guarantee_boundary:
  prose_contract_only: BEST_EFFORT
  hard_guarantee_requires: [REAL_CONSUMER, POSITIVE_NEGATIVE_TEST, BLOCKING_GATE_WHEN_APPLICABLE, VERIFIABLE_RECEIPT]

ci_consumers:
  - .github/workflows/porta-de-entrada.yml
  - .github/workflows/autonomia-promocao.yml
  - .github/workflows/trigger-fabric-package.yml

labels:
  canonical_taxonomy: docs/CONSCIENCIA/GITHUB-LABELS-OPERACIONAIS.md
  authority: "👑 PERMITO-SEGREDO"
  confirmed_result: "✅ PR CONFIRMADO"
  label_is_authority: false


rastro_binding:
  token: "🔏 !RASTRO"
  owner: "AGENTS.md"
  inherited_by_all_engines: true
  response_without_trace: INVALID
  required_on_write_claim: [COMMIT_SHA, PATH, LINK, READBACK]
  memory_claim_requires_location: true
