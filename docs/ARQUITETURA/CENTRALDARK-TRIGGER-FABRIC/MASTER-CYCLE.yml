  remote_write_gate: [REPO_CONFIRMED, PR_CONFIRMED, CURRENT_HEAD_KNOWN, AUTHORIZED_WRITE_ROUTE, BRANCH_POLICY_PASS, NO_WRITER_COLLISION, NO_SECRET_EXPOSURE]
