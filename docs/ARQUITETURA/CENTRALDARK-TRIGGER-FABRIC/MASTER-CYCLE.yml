  runtime_preflight_consumer: scripts/trigger-fabric/centraldark_full_trigger_boot.py#cmd_preflight_lint
  runtime_preflight_required_before: [MUTATION, DEPLOY, KILL, RESTART, DIRTY_SYNC, MULTI_SHELL_FANOUT, RUNTIME_GREEN_CLAIM]
  runtime_preflight_unknown_or_fail: FAIL_CLOSED
  runtime_preflight_does_not_replace_target_runtime_test: true
  read_only_can_observe_without_mutation_gate: true
