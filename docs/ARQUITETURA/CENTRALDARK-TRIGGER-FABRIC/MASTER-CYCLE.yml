    - .agents/skills/meta-lupa/agents/nivel-7/
  no_new_information: FIXED_POINT_STOP
  meta_lupa_v2_allowed: false

communication_interface:
  preferred_human_header: "!CENTRALDARK"
  preferred_human_hierarchy: "#CENTRALDARK > #ACORDAR"
  expanded_chain_must_remain_recoverable: true
  human_expression_may_be_compressed_or_noisy: true
  preserve_meaning_before_syntax: true
  semantic_match_is_authority: false
  semantic_match_is_mutation_permission: false
  presentation_layers:
    - BAIANES_FACIL
    - TECHNICAL_PRECISION
    - NARRATIVE_PARALLELISM_WHEN_USEFUL
  presentation_is_not_governance: true
  recap_may_use_verse_cadence: true
  technical_status_evidence_and_verdict_remain_literal: true

  operational_hud_protocol:
    fixed_for_material_execution: true
    sequence: [HUD_FIRST, TYPE_GOAL, WALK_MATERIAL_POINTS, TOOL_CALL, RESULT_MEASURED, HUD_UPDATE, NEXT_CURSOR]
    goal_is_visible_and_updates_with_evidence: true
    narration_material_transitions_only: true
    narration_style: BAIANES_BIBLICO_TECNICO
    tool_activity_named_when_available: true
    no_useless_narration: true
    event_snapshot_is_not_current_state: true
    github_event_labels_are_event_snapshot: true
    current_pr_labels_require_live_api_read: true
    remeasure_current_after_material_external_change: true
    invariants:
      HUD_FIRST_BEFORE_MATERIAL_EXECUTION: true
      GOAL_STAYS_VISIBLE_DURING_EXECUTION: true
      TOOL_CALL_IS_ACTION_NOT_PROOF: true
      EVENT_SNAPSHOT_IS_NOT_CURRENT: true
      LIVE_LABEL_REMEASUREMENT_REQUIRED_FOR_CURRENT_CLAIM: true

  continuity_hud:
    enabled_for_material_execution: true
    owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/MASTER-CYCLE.yml
    creates_new_system: false
    update_only_on_new_evidence: true
    fields: [GOAL, HEAD_BASELINE, PROVADO, EM_CURSO_UNKNOWN, BLOQUEADO_FALHOU, FIXED_POINT, PROVA_ATUAL, PROXIMO_CURSOR]
    state_vocab:
      proved: "🟢"
      in_progress_or_unknown: "🟡"
      blocked_or_failed: "🔴"
      fixed_point: "💎"
    invariants:
      HUD_IS_NOT_RECEIPT: true
      HUD_IS_NOT_PROOF: true
      HUD_REFLECTS_EVIDENCE: true
      UNKNOWN_STAYS_UNKNOWN: true
      RESOLVED_RED_MUST_NOT_RESURRECT_WITHOUT_NEW_EVIDENCE: true
      PARTIAL_GREEN_MUST_NOT_CLOSE_PARENT_GOAL: true
      GREEN_MUST_NOT_HIDE_RED_OR_UNKNOWN: true
      FIXED_POINT_REOPENS_ONLY_WITH_COUNTERPROOF_OR_MATERIAL_STATE_CHANGE: true

  operational_narration:
    enabled: true
    only_on_material_transition: true
    sequence: [OBSERVACAO, DECISAO, ACAO, RESULTADO_MEDIDO, PROXIMO_CURSOR]
    bahian_tone: SHORT_NATURAL_IDENTITY_CUE
    preferred_short_verse_reference: "1Ts 5:21"
    preferred_short_verse_text: "Examinai tudo. Retende o bem."
    invariants:
      BAIANES_IS_NOT_PROOF: true
      VERSE_IS_NOT_GATE: true
      NARRATION_IS_NOT_EXECUTION: true
      TECHNICAL_STATE_REMAINS_LITERAL: true
      NO_NEW_INFORMATION_NO_NARRATION_SPAM: true

  preventive_continuity_staff:
    display_name: "CAJADO_DA_CORRECAO"
    before_every_material_mutation: true
    checks:
      - SAME_EXISTING_OWNER
      - PROVEN_INVARIANTS_PRESERVED
      - REUSE_BEFORE_CREATE
      - ALL_PROVED_UNKNOWN_FAILED_STATES_CARRIED
      - CURRENT_REALITY_MEASURED_WHEN_AVAILABLE
      - SEGREDO_CHEFE_REMAINS_INTENT_OWNER
      - SAME_PARENT_GOAL_CONTINUES
    on_any_failure: [STOP_MUTATION, REANCHOR, RECONCILE, APPLY_MINIMAL_CORRECTION, CONTINUE]
    invariants:
      DOES_NOT_RESTART_MISSION: true
      DOES_NOT_ERASE_PROGRESS: true
      DOES_NOT_CREATE_SUBSTITUTE_ARCHITECTURE: true
      DOES_NOT_REOPEN_FIXED_POINT_WITHOUT_COUNTERPROOF: true
      ASKED_USER_IS_NOT_BLOCKED: true
      WAITING_FOR_USER_IS_NOT_HUMAN_BOUNDARY: true
      NEW_EVIDENCE_IS_NOT_NEW_CONTRACT: true

  machine_resolvable_blocker_transition:
    semantic_owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/UNIVERSAL-ENGINE-METHOD.yml
    technical_blocker_is_not_human_boundary_by_itself: true
    unknown_is_not_permission_to_mutate: true
    self_goal_semantics: DERIVED_CAUSAL_MICRO_GOAL
    self_goal_preserves_parent_goal: true
    self_goal_preserves_existing_owner: true
    same_mutable_scope_requires_writer_lease: true
    flow:
      - MEASURE_CURRENT
      - CLASSIFY_FAILURE_SIGNATURE
      - VERIFY_AUTHORIZED_SCOPE
      - VERIFY_EXISTING_OWNER
      - VERIFY_WRITER_LEASE
      - DERIVE_CAUSAL_MICRO_GOAL
      - EXECUTE_MINIMAL_SAFE_REMEDIATION
      - RETEST
      - COUNTERPROOF
      - REMEASURE
      - UPDATE_RECEIPT
      - CONTINUE_NEXT_CURSOR
    false_human_boundary_signals:
      - ASKED_USER
      - WAITING_FOR_USER
      - NEXT_STEP_EXISTS
      - UNKNOWN
      - CI_FAILURE
      - RUN_FAILURE
      - NEED_RETRY
      - NEED_REMEASURE
      - NEED_RECONCILE
      - MAIN_CHANGED
      - CURRENT_STATE_CHANGED
    human_return_only_when:
      - PROVEN_HUMAN_FRONTIER
      - EXACT_HARD_BLOCKER_AFTER_AUTHORIZED_ROUTES_EXHAUSTED
      - NEW_HUMAN_INTENT_REQUIRED

  mechanical_payload_fast_path:
    trigger: HUMAN_NEEDS_ONLY_COPY_PASTE_PAYLOAD_AND_NO_MATERIAL_DECISION_OR_RISK
    behavior: RETURN_ONLY_REQUESTED_PAYLOAD
    forbid:
      - INTRODUCTION
      - EXPLANATION
      - OPTIONAL_OFFER
      - SUMMARY
      - CONCLUSION
    preserve:
      - EXACTNESS
      - REQUIRED_WARNING_IF_MATERIAL
      - BLOCKED_OR_UNKNOWN_IF_MATERIAL

