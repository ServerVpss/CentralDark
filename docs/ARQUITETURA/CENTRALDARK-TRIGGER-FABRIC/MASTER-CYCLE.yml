schema: centraldark.master-cycle.v1
status: CANONICO
runtime_status: UNPROVEN_UNTIL_OBSERVED
owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/TRIGGERS.yml
authority: SEGREDO/CHEFE
pr_mother_provenance: 1189
baseline_policy: CURRENT_MAIN
master_trigger: "!CENTRALDARK"
master_trigger_requires_explicit_marker: true
plain_word_centraldark_does_not_trigger: true

purpose: >-
  Comprimir o ciclo operacional completo da Casa em um unico gatilho humano,
  preservar a intencao vigente do SEGREDO/CHEFE, reconciliar passado, presente
  e futuro sem criar segundo cerebro/router/judge, e promover somente delta
  reutilizavel que sobreviva a prova, contraprova e remedicao.

expands_to:
  - ACORDAR
  - CALIBRAR
  - MULTIBUSSOLA
  - META_LUPA
  - RECONCILIAR
  - CONTRAPROVA
  - REMEDICAO
  - FIXED_POINT
  - REGISTRA
  - BOOT

canonical_chain: "#ACORDAR -> !CALIBRAR -> !MULTIBUSSOLA -> !META_LUPA -> !RECONCILIAR -> !CONTRAPROVA -> !REMEDICAO -> !FIXED_POINT -> !REGISTRA -> !BOOT"

phase_contracts:
  ACORDAR:
    meaning: RECOVER_LIVE_STATE
    owner: "LEIA-ME-IA.md + AGENTS.md"
  CALIBRAR:
    meaning: ALIGN_INTENT_ROLE_SCOPE_TOOLS_PROOF
    owner: "LEIA-ME-IA.md + AGENTS.md"
  MULTIBUSSOLA:
    meaning: MULTIAXIS_MATERIAL_PERCEPTION
    owner: docs/CONSCIENCIA/MULTIBUSSOLA.md
  META_LUPA:
    meaning: FALSIFY_INTERPRETATION_AND_PROOF
    owner: .agents/skills/meta-lupa/SKILL.md
    ontology: TECHNIQUE_NOT_AGENT
  RECONCILIAR:
    meaning: REUSE_PAST_AND_CURRENT_PROVEN_DELTA_BEFORE_CREATE
    owner: docs/CONSCIENCIA/CONTRATO-RECONCILIACAO-ANTES-DE-CRIAR.json
  CONTRAPROVA:
    meaning: INDEPENDENT_OR_DISCRIMINATING_COUNTERPROOF
    owner: docs/CONSCIENCIA/PROOF-OWNERSHIP.json
    provider: REPLACEABLE_BY_CAPABILITY
  REMEDICAO:
    meaning: MEASURE_T0_TO_T1
    owner: docs/CONSCIENCIA/REMEDICAO.md
  FIXED_POINT:
    meaning: STOP_ONLY_AT_LOCAL_FIXED_POINT_OR_PROVEN_FRONTIER
    owner: Trigger Fabric
  REGISTRA:
    meaning: WRITE_RECEIPT_LEARNING_PROVENANCE_NEXT_CURSOR_AND_PROMOTE_WHEN_AUTHORIZED
    owner: continuity + learning owners
    promotion:
      target: main
      method: squash
      only_if:
        - SAME_SCOPE_INTENT_AUTHORIZED
        - APPLICABLE_GATES_PASS
        - NO_WRITER_CONFLICT
        - NO_MATERIAL_UNKNOWN
      no_reask_same_scope: true
  BOOT:
    meaning: RETURN_NEXT_CYCLE_RECOVERABLE
    owner: LEIA-ME-IA.md
    runtime_restart_implied: false

execution_model:
  human_intent_owner: SEGREDO/CHEFE
  coordinator: SOL
  executor: PIVETE/HERMES_OR_CAPABLE_PROVIDER
  model_is_replaceable: true
  intention_must_be_preserved: true
  perception_material_is_separate_capability: true
  meta_lupa_is_technique_not_agent: true
  counterproof_provider_is_replaceable: true
  reality_is_judge: true
  graph_is_derived_not_authority: true
  parallel_perception: true
  serialized_mutation: true
  one_writer_per_scope: true
  one_core_many_arms: true
  model_vote_as_truth: false
  fanout_growth_requires_information_gain: true
  recursion_depth_is_progress: false

architecture_flow:
  - CHEFE_INTENT
  - SOL_T0
  - CENTRALDARK_MASTER_CYCLE
  - META_LUPA
  - CAPABILITY_ROUTER
  - JARVIS_ONE_CORE_MANY_ARMS
  - AGENT_CALL_AND_HUB_MISSION
  - OMNI_ROUTER
  - REPLACEABLE_ENGINES
  - OVERCLOCK_ROLE_TAXONOMY
  - ENXAME_FANOUT_FANIN
  - ARSENAL_COUNCIL
  - HERMES_N7_WORKERS
  - TOOLS_APIS_BUILDERS
  - EXECUTION
  - CAUSAL_TRACE
  - EVIDENCE_ENVELOPE
  - RENDEZVOUS_DEDUPE
  - META_LUPA_HARVEST
  - DREAM_REVIEW
  - PATTERN_DISCOVERY
  - EVOLUTION_CANDIDATE
  - EVOLUTION_GATES
  - ONE_WRITER
  - BEFORE_AFTER_EXPERIMENT
  - SELF_VERIFICATION
  - COUNTERPROOF
  - REGRESSION_GATE
  - PROOF_OWNERSHIP
  - REALITY_JUDGE
  - PROMOTE_OR_REJECT_ROLLBACK
  - MISSION_FIXED_POINT
  - REGISTRO_DO_OURO
  - NEXT_ACORDAR

trace_and_harvest:
  invariant: "QUEM_TOCA_NA_META_LUPA_DEIXA_RASTRO"
  model_touch_owner: apps/modulos/elite-gateway/scripts/centraldark_omni_router.py
  evidence_owner: supabase/functions/_shared/evidence-envelope.mjs
  evidence_entry: supabase/functions/agent-log/index.ts
  persistence: public.agent_events
  flow:
    - MODEL_OR_ENGINE_INVOCATION
    - OMNI_ROUTER_RECEIPT
    - MODEL_TOUCH_EVENT
    - EVIDENCE_ENVELOPE
    - CAUSAL_DEDUPE
    - META_LUPA_HARVEST
    - DELTA_CANDIDATE
  fields_when_observed:
    - engine
    - resolved_model
    - mission_id
    - trace_id
    - request_id
    - correlation_id
    - writer_scope
    - sha
    - latency_ms
    - tokens
    - cost
    - result
    - fallback_used
    - action_is_proof
  rules:
    configured_is_invocation_proven: false
    telemetry_delivery_is_provider_success: false
    evidence_delivery_failure_may_hide: false
    action_is_proof: false
    secret_redaction_required: true
    mission_id_must_not_be_fabricated: true

role_taxonomy:
  source_provenance_pr: 1300
  owner_behavior: JARVIS_AND_CAPABILITY_ROUTER
  tiers:
    SCOUT: DISCOVER_READ_ONLY
    BUILDER: EXECUTE_WITH_WRITER_SCOPE
    REVIEWER: REVIEW_OR_JUDGE_WITHOUT_WRITER_COLLISION
  taxonomy_named_is_agent_implemented: false
  catalog_is_capability: false
  second_orchestrator_created: false

self_improvement:
  owner: "METACOGNICAO + META_LUPA + EVOLUTION_GATES"
  meta_lupa_final: false
  evolution_mode: EVENT_DRIVEN
  mission_fixed_point_stops_learning_capacity: false
  flow:
    - META_LUPA_TRACE
    - EVALUATION
    - EXPERIMENTATION
    - SELF_VERIFICATION
    - META_IMPROVEMENT
    - CROSS_META_REFINEMENT
    - EVOLUTION_GATE
    - COUNTERPROOF
    - REGRESSION
    - REALITY_JUDGE
    - PROMOTE_OR_REJECT
  canonical_gates:
    - .agents/skills/meta-lupa/scripts/evolution_gate.py
    - .agents/skills/meta-lupa/scripts/evolution_series_gate.py
    - .agents/skills/meta-lupa/scripts/agi_claim_gate.py
    - .agents/skills/meta-lupa/agents/nivel-7/
  no_new_information: FIXED_POINT_STOP
  meta_lupa_v2_allowed: false

communication_interface:
  preferred_human_header: "!CENTRALDARK"
  expanded_chain_must_remain_recoverable: true
  human_expression_may_be_compressed_or_noisy: true
  preserve_meaning_before_syntax: true
  semantic_match_is_authority: false
  semantic_match_is_mutation_permission: false
  presentation_layers:
    - BAIANES_FACIL
    - TECHNICAL_PRECISION
    - NARRATIVE_PARALLELISM_WHEN_USEFUL
  presentation_is_not_governance: true
  recap_may_use_verse_cadence: true
  technical_status_evidence_and_verdict_remain_literal: true
  mechanical_payload_fast_path:
    trigger: HUMAN_NEEDS_ONLY_COPY_PASTE_PAYLOAD_AND_NO_MATERIAL_DECISION_OR_RISK
    behavior: RETURN_ONLY_REQUESTED_PAYLOAD
    forbid:
      - INTRODUCTION
      - EXPLANATION
      - OPTIONAL_OFFER
      - SUMMARY
      - CONCLUSION
    preserve:
      - EXACTNESS
      - REQUIRED_WARNING_IF_MATERIAL
      - BLOCKED_OR_UNKNOWN_IF_MATERIAL

delta_harvest:
  canonical_signal: "!DELTA UTILS"
  semantic_aliases:
    - "!DELTA UTILS"
    - "!DELTAUTILS"
    - DELTAUTILS
    - "!DELTA UTIL"
    - "!DELTAUTIL"
    - DELTAUTIL
    - "!DELTAUTIL"
    - "DELTA UTIL"
    - "DELTA UTILS"
    - "DELTA DE AGORA"
    - "TOMA ESSE DELTA"
    - "PEGA O DELTA"
  mode: DELTA_HARVEST
  intent: USE_ONLY_WHAT_IS_USEFUL_NOW_WITHOUT_BREAKING_EXISTING_INTENT
  invariants:
    preserve_human_intent: true
    zero_regression: true
    reuse_before_create: true
    no_v1_v2_v3: true
    one_system_only: true
    route_to_existing_owner: true
    same_active_pr_when_writer_scope_matches: true
    trigger_match_is_not_new_authority: true
    trigger_match_is_not_unrelated_mutation_permission: true
  material_classification:
    repetition_pure: DROP
    useful_delta: ABSORB
    correction: UPDATE_BELIEF
    contradiction: META_LUPA_THEN_RECONCILE
    new_proof: REPLACE_STALE_PROOF_WHEN_SAME_TARGET
    newer_state: CURRENT_EVIDENCE_WINS
  useful_delta_requires_any:
    - NEW_CAPABILITY
    - NEW_EVIDENCE
    - CORRECTION
    - NEWER_STATE
    - CONTRADICTION_WITH_INFORMATION_GAIN
    - REMOVAL_OF_DUPLICATION
    - BETTER_OWNER_BINDING
    - LOWER_COMPLEXITY_WITH_EQUAL_OR_GREATER_CAPABILITY
  interesting_alone_is_useful_delta: false
  destination:
    resolver: .agents/skills/capability-contract-router/SKILL.md
    rule: EXISTING_OWNER_FIRST
    minimum_sufficient_capability_set: true
  receipt_fields:
    - SOURCE
    - CLASSIFICATION
    - INFORMATION_GAIN
    - DESTINATION_OWNER
    - ACTION
    - EVIDENCE_REF
    - NEXT_CURSOR

cross_chat_recovery:
  mode: READ_ONLY_CONTEXT_RECOVERY
  use_when_accessible: true
  recover_before_reask: true
  sources:
    - CHATGPT_HISTORY
    - CHATGPT_SAVED_MEMORY
    - CONVERSATION_LIBRARY
  rules:
    - "CROSS_CHAT = CONTEXT + PROVENANCE + CANDIDATE_DELTA"
    - "CROSS_CHAT != CURRENT_STATE"
    - "HISTORY != CURRENT_STATE"
    - "UNRECOVERED_CROSS_CHAT -> UNKNOWN"
    - "GITHUB_MUST_NOT_SUBSTITUTE_MISSING_CHAT_MEMORY"
    - "DEDUPE_REPETITION_BEFORE_CRYSTALLIZE"
    - "CONTRADICTION -> META_LUPA + RECONCILE"
    - "CURRENT_LIVE_EVIDENCE_OVERRIDES_STALE_CHAT_STATE"
  may_write_canonical_directly: false
  crystal_destination: EXISTING_OWNER_AFTER_EVIDENCE_AND_DEDUPE

semantic_memory_links:
  owner: docs/CONSCIENCIA/ARTEFATOS/TECNICAS-DE-LINKAGEM-SEMANTICA.md
  properties_contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/ARTIFACT-PROPERTIES.yml
  quality_over_quantity: true
  typed_relations_when_useful: true
  semantic_link_is_proof: false
  graph_is_authority: false
  musical_metaphor_is_navigation_only: true

transversal_lenses:
  dimensions:
    DEPENDENCIA: "o que isto precisa para funcionar ou provar?"
    DECADENCIA: "o que pode ter ficado stale, vencido ou divergido?"
    CADENCIA: "quando e por qual evento precisa ser medido de novo?"
  planes:
    KNOWLEDGE: "o que sabemos e com qual evidencia?"
    EXECUTION: "o que realmente executou e qual efeito observavel ocorreu?"
    CONFIG_ORIGIN: "qual owner/configuracao/origem causou ou governa o comportamento?"
  matrix_mode: TRANSVERSAL_WHEN_MATERIAL
  creates_new_phase: false
  creates_new_brain: false

adaptive_rules:
  all_phases_are_considered: true
  no_op_phase_may_return: SKIP_JUSTIFICADO
  no_new_information: NO_CHANGE
  unknown: NEVER_PASS
  explicit_master_trigger_does_not_expand_authority: true
  explicit_master_trigger_does_not_imply_mutation: true

