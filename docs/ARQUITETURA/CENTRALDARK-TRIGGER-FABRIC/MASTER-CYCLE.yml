local_ai_measurement_policy:
  runtime_status: UNKNOWN
  deferred_until_measured: true
  configured_is_active: false
  repository_reference_is_runtime_proof: false
  health_is_provider_invocation_proof: false
  promotion_requires:
    - LIVE_TARGET_IDENTIFIED
    - ENGINE_BINARY_OR_ENDPOINT_OBSERVED
    - INVOCATION_OBSERVED
    - RECEIPT_BOUND_TO_ENGINE_AND_MODEL
    - COUNTERPROOF_SURVIVED
  until_then:
    - DO_NOT_ROUTE_BY_DEFAULT
    - DO_NOT_CLAIM_LOCAL_AI_ACTIVE
    - PRESERVE_AS_FUTURE_CAPABILITY

artifact_memory:
  properties_contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/ARTIFACT-PROPERTIES.yml
  valuable_delta_only: true
  register_between_engines: true
  graph_update_after_proven_effect: true
  graph_is_authority: false
  history_is_current_state: false

hard_guarantee_boundary:
  prose_only: NOT_ENOUGH
  required_for_global_blocking:
    - REAL_CONSUMER
    - POSITIVE_NEGATIVE_TEST
    - EXISTING_GATE_BINDING
    - VERIFIABLE_RECEIPT
    - MAIN_PROTECTION_OR_EQUIVALENT_ENFORCEMENT

fixed_point:
  mission_only: true
  learning_capacity_event_driven: true
  requires:
    - INTENT_PRESERVED
    - OWNER_RESOLVED
    - ONE_WRITER_PER_SCOPE
    - CLAIMS_BOUND_TO_APPLICABLE_EVIDENCE
    - COUNTERPROOF_SURVIVED
    - NO_CRITICAL_REGRESSION
    - NO_MATERIAL_UNKNOWN_FOR_SCOPE
    - NO_NEW_INFORMATION
