schema: centraldark.master-cycle.v1
status: CANONICO
runtime_status: UNPROVEN_UNTIL_OBSERVED
owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/TRIGGERS.yml
authority: SEGREDO/CHEFE
pr_mother_provenance: 1189
baseline_policy: CURRENT_MAIN
master_trigger: "!CENTRALDARK"
master_trigger_aliases: ["!CENTRALDARK", "#CENTRALDARK"]
master_trigger_requires_explicit_marker: true
plain_word_centraldark_does_not_trigger: true
bot_entry_activates_master_session: true
explicit_trigger_activates_master_session: true
master_session_remains_active: true
subsequent_chefe_material_is_delta_candidate: true
subsequent_chefe_material_is_active_intent_delta_first: true
preserve_compatible_active_intent: true
recalculate_intent_alignment_each_material_turn: true
intent_replacement_requires: EXPLICIT_REPLACE_OR_PROVEN_MATERIAL_INCOMPATIBILITY
pertinence_first: true
minimum_sufficient_loop: true
triggers_are_conditional_not_ritual: true

master_precedence:
  human_notation: "#CENTRALDARK > #ACORDAR"
  executable_master_trigger: "!CENTRALDARK"
  relation: MASTER_UMBRELLA_CONTAINS_ACORDAR_PHASE
  centraldark_master_is_above_acordar: true
  acordar_is_subphase_not_peer_master: true
  rename_executable_master_trigger: false
  zero_regression_preserves_existing_master_token: true
  existing_runtime_proof:
    - scripts/trigger-fabric/test_centraldark_master_cycle.py#test_acordar_enters_centraldark_master_funnel
    - scripts/trigger-fabric/centraldark_master_cycle.py#MASTER_INGRESS_ALIASES

purpose: >-
  Comprimir o ciclo operacional completo da Casa em um unico gatilho humano,
  preservar a intencao vigente do SEGREDO/CHEFE, reconciliar passado, presente
  e futuro sem criar segundo cerebro/router/judge, e promover somente delta
  reutilizavel que sobreviva a prova, contraprova e remedicao.

expands_to:
  - TLC23_OPEN
  - DESTINATION_LOCK
  - ACORDAR
  - CALIBRAR
  - MULTIBUSSOLA
  - PEGATUDO
  - DEBITO_COGNITIVO
  - READERS_MEASURE
  - META_LUPA
  - RENDEZVOUS
  - RECONCILE
  - DELTA_UTIL
  - OWNER
  - ONE_WRITER
  - PATCH
  - TESTE
  - CONTRAPROVA
  - REMEDICAO
  - REALITY_JUDGE
  - FIXED_POINT
  - TLC23_CLOSE
  - REGISTRA
  - RASTRO
  - HANDOFF
  - BOOT

canonical_human_chain: "#CENTRALDARK -> #ACORDAR -> !CALIBRAR -> !MULTIBUSSOLA -> !META_LUPA -> !RECONCILIAR -> !DELTAUTIL -> !CONTRAPROVA -> !REMEDICAO -> !FIXED_POINT -> !REGISTRA -> !RASTRO -> !BOOT"
canonical_machine_chain: "!CENTRALDARK -> TLC23_OPEN -> DESTINATION_LOCK -> ACORDAR -> CALIBRAR -> MULTIBUSSOLA -> PEGATUDO -> DEBITO_COGNITIVO -> READERS_MEASURE -> META_LUPA -> RENDEZVOUS -> RECONCILE -> DELTA_UTIL -> OWNER -> ONE_WRITER -> PATCH -> TESTE -> CONTRAPROVA -> REMEDICAO -> REALITY_JUDGE -> FIXED_POINT -> TLC23_CLOSE -> REGISTRA -> RASTRO -> HANDOFF -> BOOT"
canonical_chain: "!CENTRALDARK -> TLC23_OPEN -> DESTINATION_LOCK -> ACORDAR -> CALIBRAR -> MULTIBUSSOLA -> PEGATUDO -> DEBITO_COGNITIVO -> READERS_MEASURE -> META_LUPA -> RENDEZVOUS -> RECONCILE -> DELTA_UTIL -> OWNER -> ONE_WRITER -> PATCH -> TESTE -> CONTRAPROVA -> REMEDICAO -> REALITY_JUDGE -> FIXED_POINT -> TLC23_CLOSE -> REGISTRA -> RASTRO -> HANDOFF -> BOOT"
canonical_visual_chain: "⭕ !AURÉOLA CANÔNICA → 👑 !CENTRALDARK → 🌅 #ACORDAR → 🎯 !CALIBRAR → 🧭 !MULTIBUSSOLA → 🔎 !META_LUPA → 🔄 !RECONCILIAR → 💎 !DELTAUTIL → 🧪 !CONTRAPROVA → 📏 !REMEDICAO → 📍 !FIXED_POINT → 🧾 !REGISTRA → 🔏 !RASTRO → 🚀 !BOOT"
aureola_visible_route_debugger:
  contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/AUREOLA-BAHIA-BIBLICA.yml
  visible_fields: [CURRENT_PHASE, MULTIBUSSOLA_AXIS, DESTINATION_OWNER, NEXT_GATE]
  material_fields: [ACTION, PROOF, WOUND, NEXT_CURSOR]
  compare: [INTENT_ROUTE, ACTUAL_ROUTE]
  mismatch_action: STOP_AND_RECONCILE
  route_trace_is_private_reasoning: false
  route_trace_is_technical_proof: false
  bible_reference_is_semantic_cue_not_proof: true
  material_discovery_is_learning_candidate_not_fact: true

continuous_delta_contract:
  scope: ACTIVE_MASTER_SESSION
  input_owner: SEGREDO/CHEFE
  every_material_is_processed: true
  every_material_is_fact: false
  every_material_is_persisted: false
  language_is_identity: false
  typo_is_rejection: false
  time_bucket_is_authority: false
  newest_unproved_claim_wins: false
  newest_proved_state_wins: true
  number_of_windows_is_vote: false
  number_of_messages_is_vote: false
  correlated_views_are_independent_proofs: false
  screenshot_proves: VISIBLE_MANIFESTATION_ONLY
  runtime_claim_requires_runtime_evidence: true
  DELTA_CONTINUO_REQUIRED: true
  NEW_MATERIAL_RESTARTS_MISSION: false
  cross_chat_transport_requires_channel_evidence: true
  process: [CAPTURE, LINK_DESTINATION, LINK_TO_ACTIVE_GOAL, DEDUPE, CLASSIFY, FIND_OWNER, PROVE_OR_PRESERVE_UNKNOWN, ABSORB_MINIMAL_DELTA, COUNTERPROVE, REMEASURE, UPDATE_HUD, PERSIST_NEXT_CURSOR]
  classifications: [DUPLICATE, PARTIAL, NEW, SUPERSEDED, CANDIDATE, UNKNOWN, PROVED]

phase_contracts:
  ACORDAR:
    meaning: RECOVER_LIVE_STATE
    owner: "LEIA-ME-IA.md + AGENTS.md"
    parent: CENTRALDARK_MASTER
    precedence: "CENTRALDARK_MASTER > ACORDAR"
  CALIBRAR:
    meaning: ALIGN_INTENT_ROLE_SCOPE_TOOLS_PROOF
    owner: "LEIA-ME-IA.md + AGENTS.md"
    emoji: "🎯"
    intent_alignment:
      threshold_percent: 80
      percentage_means: INTERPRETATION_ALIGNMENT_NOT_RUNTIME_PASS
      inputs: [CURRENT_EXPLICIT_INTENT, RECOVERED_APPLICABLE_CONTEXT, COMPATIBLE_PRIOR_LEARNING, CANONICAL_RULES, CURRENT_REALITY]
      subtract: [MATERIAL_AMBIGUITY, MATERIAL_CONTRADICTION]
      new_teaching: REMIX_MINIMUM_DELTA_IN_EXISTING_RULE
      output: [REFINED_INTENT, INTENT_ALIGNMENT_CONFIDENCE_PERCENT]
      gte_threshold_and_scope_authorized: EXECUTE_MINIMUM_COMPLETE_PATH
      below_threshold_or_material_contradiction: ASK_ONLY_INDISPENSABLE_GAP
      continuous_recalibration: true
      new_chefe_material: DELTA_TO_ACTIVE_INTENT_FIRST
      preserve_compatible_active_intent: true
      replacement_requires: EXPLICIT_REPLACE_OR_PROVEN_MATERIAL_INCOMPATIBILITY
      pertinence_first: true
      minimum_sufficient_loop: true
      triggers_are_conditional_not_ritual: true
      do_not_parrot_chefe: true
      align_thought_not_wording: true
  MULTIBUSSOLA:
    meaning: MULTIAXIS_MATERIAL_PERCEPTION
    owner: docs/CONSCIENCIA/MULTIBUSSOLA.md
  META_LUPA:
    meaning: FALSIFY_INTERPRETATION_AND_PROOF
    owner: .agents/skills/meta-lupa/SKILL.md
    ontology: TECHNIQUE_NOT_AGENT
  RECONCILIAR:
    meaning: REUSE_PAST_AND_CURRENT_PROVEN_DELTA_BEFORE_CREATE
    owner: docs/CONSCIENCIA/CONTRATO-RECONCILIACAO-ANTES-DE-CRIAR.json
  DELTA_UTIL:
    meaning: PROCESS_ALL_CHEFE_MATERIAL_AND_ABSORB_ONLY_PROVEN_INFORMATION_GAIN
    owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/MASTER-CYCLE.yml#continuous_delta_contract
    facts_are_not_created_by_recency_repetition_or_screen: true
  CONTRAPROVA:
    meaning: INDEPENDENT_OR_DISCRIMINATING_COUNTERPROOF
    owner: docs/CONSCIENCIA/PROOF-OWNERSHIP.json
    provider: REPLACEABLE_BY_CAPABILITY
  REMEDICAO:
    meaning: MEASURE_T0_TO_T1
    owner: docs/CONSCIENCIA/REMEDICAO.md
  FIXED_POINT:
    meaning: STOP_ONLY_AT_LOCAL_FIXED_POINT_OR_PROVEN_FRONTIER
    owner: Trigger Fabric
  REGISTRA:
    meaning: WRITE_RECEIPT_LEARNING_PROVENANCE_NEXT_CURSOR_AND_PROMOTE_WHEN_AUTHORIZED
    owner: continuity + learning owners
    promotion:
      target: main
      method: squash
      only_if:
        - SAME_SCOPE_INTENT_AUTHORIZED
        - APPLICABLE_GATES_PASS
        - NO_WRITER_CONFLICT
        - NO_MATERIAL_UNKNOWN
      no_reask_same_scope: true
  RASTRO:
    token: "!RASTRO"
    owner: "AGENTS.md + docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/RASTRO.md"
    purpose: "SELAR_PROVA_E_RASTREABILIDADE_ANTES_DO_PROXIMO_CICLO"
    required_output: [COMMIT_SHA, PATH, LINK, READBACK, MEMORY_LOCATION_WHEN_CLAIMED]
    response_without_trace: INVALID
    applies_to_all_engines: true

  BOOT:
    meaning: RETURN_NEXT_CYCLE_RECOVERABLE
    owner: LEIA-ME-IA.md
    runtime_restart_implied: false

supporting_methods:
  FABLE_LOOP:
    meaning: READ_ONLY_CALIBRATION_AND_STABILIZATION
    owner: .agents/skills/fable-loop/SKILL.md
    ontology: METHOD_NOT_AGENT_OR_ROUTER
    mode: READ_ONLY_CALIBRATION
    default_routing: false
    may_write_canonical: false
    promotion_gate: META_LUPA_SAME_CONTROL
  COT_REACT_LOOP:
    meaning: CONTROLLED_OPERATIONAL_TRACE_DURING_COMPLEX_MULTI_TOOL_EXECUTION
    owner: .agents/skills/cot-react-loop/SKILL.md
    ontology: METHOD_NOT_AGENT_OR_ROUTER
    mode: PLAN_ACT_OBSERVE_CRITIQUE_REFINE_DECIDE
    default_routing: MATERIAL_COMPLEX_EXECUTION_ONLY
    may_write_canonical: false
    grants_authority: false
    private_chain_of_thought_exposed: false
    record_only: [DECISAO, EVIDENCIA, ACAO, RESULTADO, LACUNA, PROXIMO_TESTE]
    promotion_gate: META_LUPA_SAME_CONTROL

measure_before_creation_semantic_binding:
  owner: AGENTS.md#medir-antes-de-criar--melhorar-o-que-ja-existe
  formula: "REUSE_BEFORE_CREATE + UNKNOWN != PASS + DOCUMENTED != EXECUTED + REALITY = JUDGE"
  verse_reference: "1Ts 5:21"
  verse_semantic: "EXAMINAR_TUDO_RETENDE_O_BEM"
  meaning: "medir e comparar toda capacidade existente; preservar UNKNOWN; distinguir documentação de execução; reter somente o que a realidade provar útil"
  applies_to: [ALL_CURRENT_AND_FUTURE_AGENTS, ALL_CURRENT_AND_FUTURE_ENGINES, ALL_CURRENT_AND_FUTURE_CLIS]
  sequence: [MEASURE_EXISTING_REALITY, FIND_EXISTING_OWNER, REUSE_BEFORE_CREATE, PRESERVE_UNKNOWN, REQUIRE_EXECUTION_PROOF, COUNTERPROVE, RETAIN_PROVEN_GOOD]
  verse_is_semantic_cue_not_proof: true
  creates_new_owner: false
  improves_existing_owner: true

execution_model:
  human_intent_owner: SEGREDO/CHEFE
  coordinator: SOL
  executor: PIVETE/HERMES_OR_CAPABLE_PROVIDER
  model_is_replaceable: true
  intention_must_be_preserved: true
  perception_material_is_separate_capability: true
  meta_lupa_is_technique_not_agent: true
  counterproof_provider_is_replaceable: true
  reality_is_judge: true
  graph_is_derived_not_authority: true
  parallel_perception: true
