schema: centraldark.master-cycle.v1
status: CANONICO
runtime_status: UNPROVEN_UNTIL_OBSERVED
owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/TRIGGERS.yml
authority: SEGREDO/CHEFE
pr_mother_provenance: 1189
baseline_policy: CURRENT_MAIN
master_trigger: "!CENTRALDARK"
master_trigger_aliases: ["!CENTRALDARK", "#CENTRALDARK"]
master_trigger_requires_explicit_marker: true
plain_word_centraldark_does_not_trigger: true
bot_entry_activates_master_session: true
explicit_trigger_activates_master_session: true
master_session_remains_active: true
subsequent_chefe_material_is_delta_candidate: true

master_precedence:
  human_notation: "#CENTRALDARK > #ACORDAR"
  executable_master_trigger: "!CENTRALDARK"
  relation: MASTER_UMBRELLA_CONTAINS_ACORDAR_PHASE
  centraldark_master_is_above_acordar: true
  acordar_is_subphase_not_peer_master: true
  rename_executable_master_trigger: false
  zero_regression_preserves_existing_master_token: true
  existing_runtime_proof:
    - scripts/trigger-fabric/test_centraldark_master_cycle.py#test_acordar_enters_centraldark_master_funnel
    - scripts/trigger-fabric/centraldark_master_cycle.py#MASTER_INGRESS_ALIASES

purpose: >-
  Comprimir o ciclo operacional completo da Casa em um unico gatilho humano,
  preservar a intencao vigente do SEGREDO/CHEFE, reconciliar passado, presente
  e futuro sem criar segundo cerebro/router/judge, e promover somente delta
  reutilizavel que sobreviva a prova, contraprova e remedicao.

expands_to:
  - ACORDAR
  - CALIBRAR
  - MULTIBUSSOLA
  - META_LUPA
  - RECONCILIAR
  - DELTA_UTIL
  - CONTRAPROVA
  - REMEDICAO
  - FIXED_POINT
  - REGISTRA
  - BOOT

canonical_human_chain: "#CENTRALDARK -> #ACORDAR -> !CALIBRAR -> !MULTIBUSSOLA -> !META_LUPA -> !RECONCILIAR -> !DELTAUTIL -> !CONTRAPROVA -> !REMEDICAO -> !FIXED_POINT -> !REGISTRA -> !BOOT"
canonical_machine_chain: "!CENTRALDARK -> #ACORDAR -> !CALIBRAR -> !MULTIBUSSOLA -> !META_LUPA -> !RECONCILIAR -> !DELTAUTIL -> !CONTRAPROVA -> !REMEDICAO -> !FIXED_POINT -> !REGISTRA -> !BOOT"
canonical_chain: "!CENTRALDARK -> #ACORDAR -> !CALIBRAR -> !MULTIBUSSOLA -> !META_LUPA -> !RECONCILIAR -> !DELTAUTIL -> !CONTRAPROVA -> !REMEDICAO -> !FIXED_POINT -> !REGISTRA -> !BOOT"

continuous_delta_contract:
  scope: ACTIVE_MASTER_SESSION
  input_owner: SEGREDO/CHEFE
  every_material_is_processed: true
  every_material_is_fact: false
  every_material_is_persisted: false
  language_is_identity: false
  typo_is_rejection: false
  time_bucket_is_authority: false
  newest_unproved_claim_wins: false
  newest_proved_state_wins: true
  number_of_windows_is_vote: false
  number_of_messages_is_vote: false
  correlated_views_are_independent_proofs: false
  screenshot_proves: VISIBLE_MANIFESTATION_ONLY
  runtime_claim_requires_runtime_evidence: true
  cross_chat_transport_requires_channel_evidence: true
  process: [CAPTURE, LINK_DESTINATION, DEDUPE, CLASSIFY, FIND_OWNER, PROVE_OR_PRESERVE_UNKNOWN, ABSORB_MINIMAL_DELTA, COUNTERPROVE, REMEASURE]
  classifications: [DUPLICATE, PARTIAL, NEW, SUPERSEDED, CANDIDATE, UNKNOWN, PROVED]

phase_contracts:
  ACORDAR:
    meaning: RECOVER_LIVE_STATE
    owner: "LEIA-ME-IA.md + AGENTS.md"
    parent: CENTRALDARK_MASTER
    precedence: "CENTRALDARK_MASTER > ACORDAR"
  CALIBRAR:
    meaning: ALIGN_INTENT_ROLE_SCOPE_TOOLS_PROOF
    owner: "LEIA-ME-IA.md + AGENTS.md"
  MULTIBUSSOLA:
    meaning: MULTIAXIS_MATERIAL_PERCEPTION
    owner: docs/CONSCIENCIA/MULTIBUSSOLA.md
  META_LUPA:
    meaning: FALSIFY_INTERPRETATION_AND_PROOF
    owner: .agents/skills/meta-lupa/SKILL.md
    ontology: TECHNIQUE_NOT_AGENT
  RECONCILIAR:
    meaning: REUSE_PAST_AND_CURRENT_PROVEN_DELTA_BEFORE_CREATE
    owner: docs/CONSCIENCIA/CONTRATO-RECONCILIACAO-ANTES-DE-CRIAR.json
  DELTA_UTIL:
    meaning: PROCESS_ALL_CHEFE_MATERIAL_AND_ABSORB_ONLY_PROVEN_INFORMATION_GAIN
    owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/MASTER-CYCLE.yml#continuous_delta_contract
    facts_are_not_created_by_recency_repetition_or_screen: true
  CONTRAPROVA:
    meaning: INDEPENDENT_OR_DISCRIMINATING_COUNTERPROOF
    owner: docs/CONSCIENCIA/PROOF-OWNERSHIP.json
    provider: REPLACEABLE_BY_CAPABILITY
  REMEDICAO:
    meaning: MEASURE_T0_TO_T1
    owner: docs/CONSCIENCIA/REMEDICAO.md
  FIXED_POINT:
    meaning: STOP_ONLY_AT_LOCAL_FIXED_POINT_OR_PROVEN_FRONTIER
    owner: Trigger Fabric
  REGISTRA:
    meaning: WRITE_RECEIPT_LEARNING_PROVENANCE_NEXT_CURSOR_AND_PROMOTE_WHEN_AUTHORIZED
    owner: continuity + learning owners
    promotion:
      target: main
      method: squash
      only_if:
        - SAME_SCOPE_INTENT_AUTHORIZED
        - APPLICABLE_GATES_PASS
        - NO_WRITER_CONFLICT
        - NO_MATERIAL_UNKNOWN
      gate_classification:
        MATERIAL_REQUIRED:
          meaning: WORKFLOW_DECLARED_IN_PROMOTION_DENOMINATOR
          queued_pending_blocks: true
          skipped_without_explicit_not_applicable_proof_blocks: true
          must_pass_on_current_head: true
        INFORMATIONAL:
          meaning: WORKFLOW_OUTSIDE_PROMOTION_DENOMINATOR
          queued_pending_blocks: false
          failure_blocks_by_itself: false
        NOT_APPLICABLE_PROVEN:
          meaning: EXPLICIT_SCOPE_PROOF_REQUIRED
          skipped_alone_is_proof: false
      invariants:
        queued_is_not_pass: true
        queued_is_not_automatic_blocker_when_informational: true
        pending_is_not_automatic_blocker_when_informational: true
        latest_run_wins_same_workflow: true
        older_pass_must_not_mask_newer_skipped_failure_or_cancelled: true
        conflict_resolution_is_not_approval: true
        sync_is_not_approval: true
        squash_is_promotion_not_conflict_remedy: true
        head_change_invalidates_only_head_bound_proof: true
      no_reask_same_scope: true
  BOOT:
    meaning: RETURN_NEXT_CYCLE_RECOVERABLE
    owner: LEIA-ME-IA.md
    runtime_restart_implied: false

supporting_methods:
  FABLE_LOOP:
    meaning: READ_ONLY_CALIBRATION_AND_STABILIZATION
    owner: .agents/skills/fable-loop/SKILL.md
    ontology: METHOD_NOT_AGENT_OR_ROUTER
    mode: READ_ONLY_CALIBRATION
    default_routing: false
    may_write_canonical: false
    promotion_gate: META_LUPA_SAME_CONTROL
  COT_REACT_LOOP:
    meaning: CONTROLLED_OPERATIONAL_TRACE_DURING_COMPLEX_MULTI_TOOL_EXECUTION
    owner: .agents/skills/cot-react-loop/SKILL.md
    ontology: METHOD_NOT_AGENT_OR_ROUTER
    mode: PLAN_ACT_OBSERVE_CRITIQUE_REFINE_DECIDE
    default_routing: MATERIAL_COMPLEX_EXECUTION_ONLY
    may_write_canonical: false
    grants_authority: false
    private_chain_of_thought_exposed: false
    record_only: [DECISAO, EVIDENCIA, ACAO, RESULTADO, LACUNA, PROXIMO_TESTE]
    promotion_gate: META_LUPA_SAME_CONTROL

execution_model:
  human_intent_owner: SEGREDO/CHEFE
  coordinator: SOL
  executor: PIVETE/HERMES_OR_CAPABLE_PROVIDER
  model_is_replaceable: true
  intention_must_be_preserved: true
  perception_material_is_separate_capability: true
  meta_lupa_is_technique_not_agent: true
  counterproof_provider_is_replaceable: true
  reality_is_judge: true
  graph_is_derived_not_authority: true
  parallel_perception: true
  serialized_mutation: true
  one_writer_per_scope: true
  role_is_discovered_from_capability_gap: true
  role_claim_without_evidence_is_invalid: true
  owner_must_exist_before_role_claim: true
  writer_must_be_measured_before_mutation: true
  one_core_many_arms: true
  model_vote_as_truth: false
  fanout_growth_requires_information_gain: true
  recursion_depth_is_progress: false

  EXECUTION_LOOP:
  - MEASURE_CURRENT_STATE
  - MULTIBUSSOLA
  - META_LUPA
  - FABLE_LOOP
  - COT_REACT_LOOP
  - SEARCH_EXISTING_CRYSTAL
  - SEARCH_EXISTING_OWNER
  - CLASSIFY_FAILURE_SIGNATURE
  - IDENTIFY_CAUSE
  - CHOOSE_DISCRIMINATING_TEST
  - EXECUTE_MINIMAL_SAFE_REMEDIATION
  - RETEST
  - COUNTERPROOF
  - VERTEX_INVERSO
  - REMEASURE_AFFECTED_CONE
  - REALITY_JUDGE
  - CLAIM_SEAL
  - WRITE_RECEIPT
  - NEXT_CURSOR

