schema: centraldark.deploy-readiness.v1
name: DEPLOY_READINESS
status: CANONICAL
owner: docs/CONSCIENCIA/03-FLUXO-DEPLOY.md
intent_authority: SEGREDO/CHEFE

principle:
  statement: "Usar cedo, provar antes de promover, corrigir ao vivo com amarelos explícitos."
  local_test_ready_is_not_production_ready: true
  percent_is_not_proof: true
  unknown_is_not_pass: true
  merged_is_not_deployed: true
  workflow_green_is_not_runtime_proof: true

maturity_model:
  purpose: "Permitir uso controlado entre 80% e 90% quando o denominador estiver definido e nenhum requisito crítico estiver quebrado."
  controlled_use:
    recommended_range_percent: [80, 90]
    allowed_when:
      - DENOMINATOR_DEFINED
      - CORE_PATH_WORKS
      - NO_CRITICAL_SAFETY_BLOCKER
      - ROLLBACK_OR_RECOVERY_PATH_KNOWN
      - FAILURES_AND_UNKNOWNS_VISIBLE
    remaining_noncritical_work: TEST_LIVE_LOCAL_AND_ONLINE
  main_promotion:
    percentage_alone: INSUFFICIENT
    required:
      - APPLICABLE_TESTS
      - SAME_HEAD_EVIDENCE_WHEN_CODE_CHANGED
      - NO_KNOWN_CRITICAL_REGRESSION
      - ONE_WRITER_PER_SCOPE
      - COUNTERPROOF_WHEN_MATERIAL
      - MAIN_GATE_APPLICABLE
    noncritical_yellow_allowed: true
  production_ready:
    requires_runtime_receipt_when_runtime_claimed: true
    requires_sha_artifact_deploy_runtime_chain: true

micro_deploy:
  default_preference: true
  policy: CAUSAL_SCOPE_FIRST
  choose_when:
    - OWNER_IDENTIFIED
    - COMPONENT_BUILDABLE_OR_DEPLOYABLE_IN_ISOLATION
    - CONTRACT_BOUNDARIES_STABLE
    - AFFECTED_DEPENDENCIES_KNOWN
    - ROLLBACK_SAME_SCOPE_EXISTS
    - RUNTIME_RECEIPT_CAN_BIND_TO_SOURCE_SHA
  receipt_fields:
    - MICRO_DEPLOY_ID
    - INTENT_GOAL
    - COMPONENT
    - OWNER
    - SOURCE_SHA
    - ARTIFACT
    - GATES_HEAD_EXATO
    - PREVIOUS_RUNTIME
    - NEW_RUNTIME
    - RESULT
    - ROLLBACK_TARGET
    - LOG_SOURCE
    - RUNTIME_RECEIPT
    - NEXT_CURSOR

full_deploy:
  default: false
  choose_only_when:
    - SHARED_DEPENDENCY_CHANGED
    - GLOBAL_CONTRACT_OR_SCHEMA_CHANGED
    - ARTIFACT_IS_MONOLITHIC
    - MIGRATION_REQUIRES_GLOBAL_COORDINATION
    - RUNTIME_CANNOT_PROMOTE_COMPONENT_ISOLATED
    - PARTIAL_DEPLOY_WOULD_CREATE_INCOMPATIBILITY
    - REALITY_JUDGE_PROVES_CROSS_COMPONENT_CAUSAL_CONE
  percentage_threshold_alone: forbidden

live_testing:
  after_controlled_use: true
  surfaces:
    - LOCAL
    - ONLINE
    - APP
    - WEB
    - OBSIDIAN
    - API
    - HERMES
  failure_semantics:
    noncritical_failure: YELLOW_OR_RED_LOCAL_EDGE
    global_red_only_when_global_requirement_broken: true
    failure_is_sensor_when_safe_route_exists: true
  caracol_reverse:
    on_material_divergence: true
    return_to_last_good_state: true
    preserve_independent_proof: true

main_direction:
  canonical_branch: main
  all_proven_reusable_delta_destination: EXISTING_OWNER_ON_MAIN
  raw_material_destination: NOT_MAIN
  candidate_destination: KNOWLEDGE_HUB
  promotion_path:
    - CANDIDATE
    - OWNER
    - TEST
    - COUNTERPROOF
    - MAIN_GATE
    - MAIN
    - MICRO_DEPLOY_OR_FULL_DEPLOY
    - RUNTIME_RECEIPT

forbidden:
  - PERCENTAGE_WITHOUT_DENOMINATOR_AS_PROOF
  - DISABLE_JUDGE_TO_GET_GREEN
  - BYPASS_GATE_TO_HIDE_FAILURE
  - FULL_DEPLOY_BY_HABIT
  - DIRECT_RAW_WEBHOOK_TO_MAIN
  - DIRECT_OBSIDIAN_NOTE_TO_MAIN
  - PROVIDER_RESULT_AS_AUTHORITY

slogan:
  technical: "80–90% CAN BE CONTROLLED-USE READY; MAIN STILL REQUIRES APPLICABLE PROOF"
  operational: "BOTA PRA VIVER CEDO, MAS O VERDE DA MAIN TEM RECIBO"
