architecture_name:
  canonical: MODEL_AGNOSTIC_AGENTIC_SYSTEM
  subtitle: DETERMINISTIC_CORE_PLUS_ON_DEMAND_INTELLIGENCE
  short_ptbr: Sistema agentico independente do modelo, com nucleo deterministico e inteligencia sob demanda.
  core_claim: >-
    A CentralDark nao precisa caber dentro de uma IA. As IAs entram dentro da CentralDark
    como capacidades substituiveis do organismo, acionadas quando o nucleo deterministico
    nao cobre a situacao.
  chef_formula:
    - CHEFE_DEFINE_INTENCAO
    - CENTRALDARK_PRESERVA_CONHECIMENTO
    - HERMES_EXECUTA_O_QUE_JA_SABE
    - IA_LOCAL_OU_EXTERNA_COMPLEMENTA_O_QUE_FALTA
    - REALIDADE_COMPROVA

model_positioning:
  model_is_not_whole_brain: true
  model_is_capability_inside_organism: true
  centraldark_runs_without_model_for_known_recipes: true
  local_or_external_ai_can_be_swapped: true
  memory_is_not_model_weights: true
  memory_is_supplied_by_library_recipes_and_receipts: true
  no_need_to_rebuild_organism_when_model_changes: true
  scripts_and_state_machines_are_not_self_learning_ai: true
  scripts_and_state_machines_are_operational_base_for_agentic_system: true

organism_map:
  CHEFE:
    role: INTENCAO_E_AUTORIDADE
  CENTRALDARK:
    role: SISTEMA_INTELIGENTE_MODEL_AGNOSTIC
    parts:
      HERMES_TYPED_CORE:
        - Scripts
        - State machines
        - Proven recipes
        - Deterministic execution
      MEMORIA:
        - Aprendizados
        - Lembrancas
        - Experiencia acumulada
        - Receipts
      FERRAMENTAS:
        - MCP
        - GitHub
        - Telegram
        - WhatsApp
        - Casa
        - VPS
      INTELLIGENCE_MODE:
        - IA local
        - IA externa
        - SOL / Oraculo
        - Contraprova interpretativa
  REALIDADE:
    role: JUDGE

work_split:
  receita_conhecida: HERMES_PLUS_SCRIPT
  verificar_estados: RECONCILIADOR
  recuperar_conhecimento: MEMORIA
  interpretar_situacao_nova: IA_LOCAL_OU_SOL
  problema_complexo: IA_ESPECIALIZADA
  comprovar_resultado: TESTES_PLUS_REALIDADE

owner_chain:
  soul: docs/CONSCIENCIA/01-IDENTIDADE-E-REGRAS/SOUL-SOL.md
  rules: RULES.md
  agents: AGENTS.md
  runtime_owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/HERMES-AUTOCONFIG-RUNTIME.yml
  executor_owner: apps/modulos/HERMES-CORE/
  prompt_owner: apps/modulos/HERMES-CORE/prompts/hermes-core.md

measurement:
  result: POSSIBLE_WITH_EXISTING_OWNERS
  no_new_runtime_required: true
  no_new_brain_required: true
  no_new_router_required: true
  no_new_script_required_for_contract: true
  reason:
    - SOUL already binds SOL as coordinator and HERMES as executor.
    - RULES already defines model as replaceable motor and Hermes as executor continuity.
    - AGENTS already prefers small explicit capabilities over generic unrestricted execution.
    - HERMES-AUTOCONFIG-RUNTIME already includes SCRIPT_EXECUTORS and structural-events-only logging.
    - hermes-core prompt already carries REUSE_BEFORE_CREATE, ONE_SYSTEM_ONLY and executor selection by capability/scope.

canonical_delta:
  default_mode: HERMES_TYPED_CORE
  intelligence_mode: ON_DEMAND_ONLY
  default_requires_ai: false
  ai_is_module_not_motor: true
  script_state_machine_is_default: true
  template_response_allowed_without_ai: true
  deterministic_command_router_first: true
  existing_proven_recipe_first: true

modes:
  HERMES_TYPED_CORE:
    description: Bot/script/state-machine executor for already proven CentralDark recipes.
    enabled_by_default: true
    may:
      - match command or event to proven recipe
      - measure real state
      - classify by fixed rule
      - execute allowed deterministic action
      - emit typed receipt
      - answer by template without model inference
    must_not:
      - invent new architecture
      - override CHEFE intent
      - claim PASS without readback
      - mutate live organ outside owner/gate
      - use AI when deterministic recipe already covers the task

  HERMES_INTELLIGENCE_MODE:
    description: Model-assisted reasoning only when explicitly triggered or when fixed rules are insufficient.
    enabled_by_default: false
    activation_aliases:
      - /intelligence
      - /oraculo
      - /sol
      - /analisa
      - /decide
      - /meta
      - /contraprova
    enters_when:
      - CHEFE explicitly requests intelligence/oracle/reasoning
      - ambiguity cannot be resolved by machine measurement
      - no proven recipe covers the event
      - counterproof requires interpretation beyond fixed templates
    exits_to:
      - HERMES_TYPED_CORE
      - EXACT_BLOCKER_RECEIPT
      - FIXED_POINT

routing_rule:
  formula: >-
    If proven recipe exists, run deterministic typed core.
    If ambiguity is machine-resolvable, measure and continue.
    If new reasoning is required, enter intelligence mode.
    If live organ is affected, require owner, gate, proof and receipt.
  pseudo_flow:
    - EVENT_OR_COMMAND
    - INTENT_CLASSIFY
    - LOOKUP_PROVEN_RECIPE
    - MEASURE_CURRENT
    - IF_RECIPE_MATCH_THEN_TYPED_EXECUTE
    - IF_AMBIGUOUS_AND_MACHINE_RESOLVABLE_THEN_MEASURE
    - IF_REASONING_REQUIRED_THEN_INTELLIGENCE_MODE
    - EFFECT_READBACK
    - RECEIPT

interface_targets:
  allowed_surfaces:
    - Telegram
    - WhatsApp
    - Discord
    - Web cockpit
    - CLI
    - HUD
    - GitHub webhook
    - Terminal Casa
  rule: Surface is transport, not brain. Same typed core, same owners, same receipts.

receipt_contract:
  required_fields:
    - INTENT_ID
    - MODE
    - COMMAND_OR_EVENT
    - OWNER
    - MAIN_SHA_OR_RUNTIME_SHA
    - CURRENT
    - ACTION
    - EFFECT_READBACK
    - STATUS
    - NEXT_CURSOR
  statuses:
    - PASS
    - UNKNOWN
    - BLOCKED
    - NOOP

risk_controls:
  UNKNOWN_IS_NOT_PASS: true
  DOCUMENTED_IS_NOT_EXECUTED: true
  REGISTERED_IS_NOT_CONSUMED: true
  MERGED_IS_NOT_DEPLOYED: true
  ONE_SYSTEM_ONLY: true
  REUSE_BEFORE_CREATE: true
  ONE_WRITER_PER_SCOPE: true
  NO_PARALLEL_BRAIN: true
  NO_PARALLEL_ROUTER: true
  AI_DOES_NOT_SELF_AUTHORIZE: true

next_cursor:
  goal: Bind this crystal into the existing HERMES-AUTOCONFIG/HERMES-CORE consumer path without creating parallel runtime.
  minimum_delta:
    - add pointer from HERMES-AUTOCONFIG-RUNTIME.yml reuses/contracts list
    - add prompt invariant to apps/modulos/HERMES-CORE/prompts/hermes-core.md
    - add deterministic self-test for routing rule if code path already exists

