    RECIPE_MUST_HAVE_PROVENANCE_AND_OWNER: true
    RECIPE_VERSION_AND_ENVIRONMENT_MUST_MATCH: true
    REVALIDATE_LIVE_PRECONDITIONS_BEFORE_EFFECTS: true
    REPLAY_CANNOT_BYPASS_CHEFE_AUTHORIZATION: true
    REPLAY_CANNOT_BYPASS_EXISTING_GATES: true
    REPLAY_MUST_NOT_REPEAT_APPLIED_SIDE_EFFECTS: true
    UNKNOWN_OR_STALE_RECIPE_MUST_NOT_AUTO_EXECUTE: true
    FAILED_PRECONDITION_RETURNS_MEASURE_OR_BLOCKED_RECEIPT: true
    OUTPUT_TEXT_IS_NOT_EXECUTION_PROOF: true
    KAIZEN_LEARNING_TRANSFER_REQUIRES_NEXT_EVENT_COUNTERPROOF: true
  required_receipt:
    - INTENT_ID
    - RECIPE_REF_AND_VERSION
    - OWNER
    - SOURCE_EVIDENCE_AND_PROVENANCE
    - CURRENT_FINGERPRINT
    - MODE
    - GATE_AND_AUTHORIZATION
    - ACTION_AND_IDEMPOTENCY_KEY
    - EFFECT_READBACK_AND_COUNTERPROOF
    - STATUS
    - NEXT_CURSOR
  proof_scope:
    contract: DOCUMENTED_IN_PR_1804
    consumer_prompt_pointer: REQUIRES_READBACK
    deterministic_router_existing_test: PASS_RECORDED_FOR_PRIOR_ROUTING_SCOPE
    actual_recipe_retrieval_and_replay_e2e: UNKNOWN
    interruption_recovery_no_duplicate_effect: UNKNOWN
    next_mission_kaizen_transfer: UNKNOWN
  next_runtime_probe:
