# PAPAGAIO FIEL TIPADO: comportamento do mesmo Hermes, nao um novo bot ou modo de inferencia.
papagaio_fiel_typed_replay:
  status: CONTRACT_RECORDED_RUNTIME_E2E_UNKNOWN
  capability: VERIFIED_PROCEDURAL_EXPERIENCE_REUSE
  execution_owner: apps/modulos/HERMES-CORE/
  canonical_owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/HERMES-TYPED-CORE-SCRIPT-FIRST.yml
