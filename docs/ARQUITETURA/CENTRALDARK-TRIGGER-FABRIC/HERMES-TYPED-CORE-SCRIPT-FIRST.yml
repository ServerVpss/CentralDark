    continuity: docs/CONSCIENCIA/02-PROTOCOLO-HANDOFF-IA.md
  separation_of_duties:
    PAPAGAIO_FIEL: retrieve matching proven procedure and its provenance
    HERMES_TYPED_CORE: measure and execute authorized verified recipe deterministically
    INTELLIGENCE_MODE: reason only on uncovered novelty or explicit CHEFE request
    REALITY_JUDGE: counterprove resulting effects
    KAIZEN: promote tested reusable delta to existing owner
  meaning:
    PAPAGAIO_MODE_OFF: forbid empty repetition invented proof and returning mechanical work to CHEFE
    PAPAGAIO_FIEL: faithful typed reuse of verified experience not blind repetition
    PAPAGAIO_ON_LOOP_RECEIPTS: historical testimony only not proof of runtime replay
  procedure:
    - CHEFE_INTENT
    - LOOKUP_EXISTING_LEARNING_AND_RECIPE
    - CHECK_RECIPE_SIGNATURE_VERSION_OWNER_PROVENANCE
    - MEASURE_CURRENT_AND_MATCH_PRECONDITIONS
    - IF_PROVEN_MATCH_THEN_HERMES_TYPED_CORE_WITHOUT_AI
    - IF_MACHINE_RESOLVABLE_THEN_REMEASURE_AND_RECONCILE
    - IF_NOVEL_OR_EXPLICIT_REQUEST_THEN_INTELLIGENCE_MODE
    - APPLY_EXISTING_AUTHORIZATION_SCOPE_AND_WRITER_GATE
    - EXECUTE_ONCE_WITH_IDEMPOTENCY_OR_EFFECT_DEDUPLICATION
    - READBACK_AND_COUNTERPROOF
    - RECEIPT_WITH_SHA_AND_NEXT_CURSOR
    - KAIZEN_REUSE_ONLY_AFTER_TESTED_TRANSFER
  replay_invariants:
