schema: centraldark.checker-contract.v1
status: CANDIDATE_CANONICAL_ON_PR_1444
owner:
  policy: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC
  runtime: scripts/checker
  reality_judge: REALIDADE
refs: ["#1444", "#1463"]

principles:
  one_checker_system_only: true
  reuse_existing_checker_owner: true
  checker_is_not_second_brain: true
  checker_is_not_second_orchestrator: true
  checker_does_not_mutate_by_default: true
  current_gt_history: true
  unknown_is_not_pass: true
  action_is_not_proof: true
  documented_is_not_executed: true
  every_material_state_transition_requires_checker: true

continuous_delta:
  phrase: "DELTA ÚTIL aplicado, fluxo anterior continua"
  apply_delta_to_active_flow: true
  previous_flow_continues: true
  reset_mission_on_delta: false
  reset_next_cursor_on_delta: false
  dedupe_before_absorb: true
  existing_owner_first: true
  useful_delta_only: true

state_machine:
  states: [PROVED, BROKEN, BLOCKED, UNKNOWN]
  green_only_when: PROVED
  pending_is: UNKNOWN
  queued_is: UNKNOWN
  cancelled_is: UNKNOWN
  skipped_requires_non_applicability_proof: true

checkpoint_flow:
  - CHECK_CURRENT_STATE
  - PRECHECK
  - ACTION
  - POSTCHECK
  - CONSUMER_CHECK
  - COUNTERPROOF
  - REMEASURE
  - RECEIPT
  - NEXT_CURSOR

mandatory_checkpoints:
  - BOT_ENTRY
  - SESSION_RESUME
  - EACH_MASTER_PHASE
  - EACH_GATE
  - BEFORE_MUTATION
  - AFTER_MUTATION
  - BEFORE_DEPENDENCY_CHANGE
  - AFTER_DEPENDENCY_CHANGE
  - BEFORE_INSTALL
  - AFTER_INSTALL
  - BEFORE_UPDATE
  - AFTER_UPDATE
  - BEFORE_DEPLOY
  - AFTER_DEPLOY
  - APP_START
  - APP_RESTART_AFTER_UPDATE

installer_contract:
  preflight_required: true
  dependency_precheck_required: true
  dependency_postcheck_required: true
  install_postcheck_required: true
  consumer_check_required: true
  final_checker_required: true
  cannot_declare_complete_on_error: true
  owner: install.sh + scripts/checker/run-all.sh

update_contract:
  current_version_checkpoint: true
  candidate_validation_required: true
  candidate_digest_when_possible: true
  last_known_good_or_backup_required: true
  pre_install_checkpoint: true
  restart_required_for_apply: true
  post_restart_version_reconciliation: true
  post_update_health_required_before_green: true
  failed_postcheck_must_not_be_hidden: true
  owner_desktop: apps/modulos/Bolt/source/electron/main/utils/auto-update.ts

ci_gate_contract:
  same_head_required: true
  queued_is_not_fail_functional: true
  cancelled_is_not_fail_functional: true
  infra_failure_must_be_separated_from_code_failure: true
  checker_receipt_required_when_material: true

receipt:
  format: JSONL_OR_EXISTING_SANITIZED_REPORT
  required_fields:
    - step_id
    - phase
    - status
    - observed_at
    - evidence_digest
    - action_is_proof
    - unknown_is_not_pass
    - next_cursor_when_work_remains
  secret_redaction_required: true

runtime_binding:
  boot_owner: CENTRALDARK_AI_BOOT.yaml
  master_cycle_owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/MASTER-CYCLE.yml
  continuous_delta_owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/DELTA-CONTINUO.md
  checker_runner: scripts/checker/run-all.sh
  step_checker: scripts/checker/step-checker.mjs
  state_checker: scripts/checker/00-state.sh
  contract_checker: scripts/checker/14-checker-contract.sh

invariants:
  - "CHECKER_BEFORE_CLAIM=true"
  - "CHECKER_AFTER_ACTION=true"
  - "CHECKER_FAILURE_DOES_NOT_STOP_UNRELATED_SAFE_FLOW=true"
  - "DELTA_UTIL_DOES_NOT_RESET_ACTIVE_FLOW=true"
  - "SAME_FAILURE_NO_NEW_INFO_REUSES_RECEIPT=true"
  - "NO_V2_V3_PARALLEL_CHECKER=true"
  - "REALITY_IS_JUDGE=true"
