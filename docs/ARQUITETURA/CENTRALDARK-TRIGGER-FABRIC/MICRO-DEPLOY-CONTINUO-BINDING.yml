schema: centraldark.micro-deploy-continuo-binding.v1
updated: 2026-10-23
status: CANONICAL_TRIGGER_FABRIC_BINDING
authority: SEGREDO/CHEFE
owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/
canonical_rule: docs/CONSCIENCIA/01-IDENTIDADE-E-REGRAS/REGRA-MICRO-DEPLOY-CONTINUO-POR-PASS-COMPROVADO.md
truth_rule: REALIDADE_IS_JUDGE
purpose: Amarrar a regra global de micro-deploy continuo no plano operacional do Trigger
  Fabric para que qualquer PASS comprovado avance no menor escopo material sem esperar
  perfeicao global e sem liberar falso-verde.
activation:
  on_any_new_material_delta: true
  novelty_feeds_pr_mother_1562: true
  novelty_waits_for_pass: false
  novelty_waits_for_merge: false
  novelty_waits_for_deploy: false
  on_pass_comprovado: true
  on_unknown: false
  on_visual_badge_only: false
  on_action_required: false
  on_documentation_only_with_runtime_scope: false
novelty_ledger:
  target: PR_MAE_1562
  mode: APPEND_ONLY
  states:
  - PASS
  - FAIL
  - UNKNOWN
  - BLOCKED
  - STALE
  exact_repeat_may_dedupe: true
  no_secret_leak: true
  chain:
  - QUALQUER_NOVIDADE_REAL
  - CLASSIFICAR_ESTADO
  - ANEXAR_EVIDENCIA
  - RECEIPT_PR_MAE
  - NEXT_CURSOR
formula:
- QUALQUER_PASS_COMPROVADO
- MICRO_DEPLOY_DO_ESCOPO_AFETADO
- HEALTH_OU_PROVA_RUNTIME
- RECEIPT_PR_MAE
- NEXT_TIK_TAK
scope_routes:
  PASS_COMPROVADO_MCP: MICRO_DEPLOY_MCP
  PASS_COMPROVADO_BOT: MICRO_DEPLOY_BOT
  PASS_COMPROVADO_HERMES: MICRO_DEPLOY_HERMES
  PASS_COMPROVADO_PLUGIN: MICRO_DEPLOY_PLUGIN
  PASS_COMPROVADO_DOC_ONLY: DEPLOY_NOT_APPLICABLE_WITH_RECEIPT
required_chain:
- PR_FILHO_CHECK_DETERMINISTICO_PASS
- MERGE_SQUASH_OU_PROMOCAO_AUTORIZADA
- MAIN
- MICRO_DEPLOY_VPS_DO_ESCOPO
- HEALTH_OU_PROVA_RUNTIME
- RECEIPT_PR_MAE
- NEXT_TIK_TAK
locks:
  CI_DOES_NOT_REQUIRE_GLOBAL_PERFECTION: true
  UNRELATED_UNKNOWN_DOES_NOT_BLOCK_PROVEN_SCOPE: true
  FAILED_CHECK_BLOCKS_ONLY_ITS_SCOPE: true
  PROVEN_SCOPE_CAN_PROGRESS: true
  REFINE_AFTER_MICRO_DEPLOY: true
  PASS_VISUAL_BADGE_ONLY: false
  ACTION_REQUIRED_IS_NOT_PASS: true
  UNKNOWN_IS_NOT_PASS: true
  LOCAL_PROOF_WITH_RUNTIME_SCOPE_REQUIRES_RUNTIME_PROOF: true
  NO_SECRET_LEAK: true
  NO_BLIND_RESET: true
  NO_BLIND_PULL_OVER_DIRTY_RUNTIME: true
  MERGED_IS_NOT_DEPLOYED: true
  ACTION_IS_NOT_PROOF: true
  DOCUMENTED_IS_NOT_EXECUTED: true
receipt_minimum_fields:
- START_HEAD
- SOURCE_REF
- COMMIT_SHA
- MAIN_HEAD
- SCOPE
- DEPLOY_ACTION
- RUNTIME_HEALTH
- RUNTIME_SHA_OR_RUNTIME_VERSION
- SECRET_EXPOSED=false
- RESULT
- NEXT_CURSOR
consumers:
  bot: apps/bot-telegram/CENTRALDARK-MANDATORY-RULES.yml
  claude: CLAUDE.md
  readme: README.md
  memory: docs/CONSCIENCIA/05-APRENDIZADOS/MICRO-DEPLOY-CONTINUO-POR-PASS-COMPROVADO.md
  live_editing_skill: .agents/skills/centraldark-operational-method/Skills/centraldark-live-editing-fabric/SKILL.md
non_goals:
- criar segundo motor
- reiniciar tudo
- promover UNKNOWN para PASS
- tratar merge como deploy
- tratar documento como runtime executado
light_deploy_ssh_law:
  canonical: true
  authority: SEGREDO/CHEFE
  source_rule: docs/CONSCIENCIA/03-FLUXO-DEPLOY.md
  default_ci: MVP_FAST_LOOP
  deep_ci: ON_DEMAND_OR_MATERIAL_SECURITY_RISK
  material_security_gates_required: true
  control_plane: MCP_CENTRALDARK
  transport_target: MCP_CENTRALDARK_VPS_DIRECT
  transport_runtime_status: MCP_NATIVE_READ_VERIFIED_DEPLOY_PENDING
  hosted_billing_blocked: true # historico: workflow hospedado aposentado
  github_actions_required: false
  github_hosted_runner_required: false
  native_executor_tool: centraldark_deploy_micro_fallback
  native_executor_script: scripts/vps/main-pinned-microdeploy.sh
  legacy_ssh_workflow: DISABLED
  attempted_probe_run_id: 39912949599
  ssh_probe_runtime_pass: false
  no_production_mutation: true
  github_actions_auto_deploy: PAUSED
  source_ref: main
  required_inputs:
    - SOURCE_SHA
    - OWNER
    - FILESET_CAUSAL
  execution:
    build_location: VPS
    tests: SCOPE_APPLICABLE
    scratch: SINGLE_REUSABLE_WORKTREE
    writer: SINGLE_PER_SCOPE
    promotion: CAUSAL_FILESET_ONLY
    restart: OWNER_ONLY
    health: REQUIRED
    receipt: REQUIRED
    rollback: REQUIRED_ON_FAILURE
  locks:
    NO_NEW_PARALLEL_EXECUTOR: true
    NO_ARBITRARY_SHELL_FROM_EVENT: true
    VERIFY_SSH_HOST_IDENTITY: true
    NO_SECRET_ECHO: true
    NO_BLIND_PULL_OVER_DIRTY_RUNTIME: true
    NO_RUNNER_DELETION_BY_FILE_COMMIT: true
    UNKNOWN_IS_NOT_PASS: true
  reused_assets:
    runner_wake_only: .github/workflows/vps-wake-hosted-ssh.yml
    retired_ssh_workflow: .github/workflows/vps-ssh-exec.yml
    microdeploy_runtime: scripts/vps/main-pinned-microdeploy.sh
    receipt_owner: docs/CONSCIENCIA/MICRO-DEPLOY/
live_editing_default:
  official: true
  mode: CENTRALDARK_LIVE_EDITING_FABRIC
  human_contract: docs/CONSCIENCIA/MICRO-DEPLOY/CENTRALDARK-LIVE-EDITING-FABRIC.md
  machine_contract: docs/CONSCIENCIA/MICRO-DEPLOY/CENTRALDARK-LIVE-EDITING-FABRIC.json
  binding: docs/CONSCIENCIA/MICRO-DEPLOY/CENTRALDARK-LIVE-EDITING-FABRIC.yml
  skill: .agents/skills/centraldark-operational-method/Skills/centraldark-live-editing-fabric/SKILL.md
  operational_default: true
  ci_policy:
    MVP_FAST_LOOP_IS_DEFAULT: true
    CI_DEEP_LOOP_IS_PRESS_MODE: true
    CI_DEEP_LOOP_REQUIRES_CHEFE_INTENT: true
  secret_transit:
    EPHEMERAL_AS_TRANSIT: true
    NO_SECRET_ECHO: true
    NO_SECRET_COMMIT: true
    NO_SECRET_RECEIPT_VALUE: true
    SCRUB_CONTROLLED_LOGS_AFTER_USE: true
  scratch_worktree:
    canonical_path: <caminho-vps>
    single_reusable: true
    lock_required: true
    reset_before_use: true
    reset_after_use: true
fallback:
  official: true
  mode: MAIN_PINNED_RUNTIME_FAST_PATH
  human_contract: docs/CONSCIENCIA/MICRO-DEPLOY/MAIN-PINNED-RUNTIME-FAST-PATH-FALLBACK.md
  machine_contract: docs/CONSCIENCIA/MICRO-DEPLOY/MAIN-PINNED-RUNTIME-FAST-PATH-FALLBACK.json
  binding: docs/CONSCIENCIA/MICRO-DEPLOY/MAIN-PINNED-RUNTIME-FAST-PATH-FALLBACK.yml
  skill: .agents/skills/main-pinned-runtime-fast-path/SKILL.md
  hook: scripts/hooks/pre-push.main-pinned-runtime-fast-path.sh
  activate_when_primary:
  - FAIL
  - BLOCKED
  locks:
    SOURCE_MUST_EXIST_IN_MAIN: true
    SAME_SHA_REQUIRED: true
    OWNER_SCOPE_REQUIRED: true
    CAUSAL_FILESET_ONLY: true
    PRIMARY_PIPELINE_FAILS_DO_NOT_BECOME_FIXED_BY_FALLBACK: true
  scratch_worktree:
    canonical_path: <caminho-vps>
    single_reusable: true
    lock_required: true
    reset_before_use: true
    receipt_before_cleanup: true
    reset_after_use: true
    dirty_handoff_forbidden: true
