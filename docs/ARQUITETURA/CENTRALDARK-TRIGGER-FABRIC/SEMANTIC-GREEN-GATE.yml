schema: centraldark.semantic-green-gate.v2
status: CANONICAL_SOURCE_CONTRACT
runtime_status: UNKNOWN_UNTIL_SAME_HEAD_CI
owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/MASTER-CYCLE.yml
authority: SEGREDO/CHEFE
runtime_validator: apps/modulos/HERMES-CORE/core/semantic-green-gate.mjs

purpose: >-
  Impedir verde semantico quando trilha, verso, direcao, intencao vigente,
  eixo da MULTIBUSSOLA e estilo humano nao convergem. Referencia biblica valida
  mas usada na fase errada, em eixo errado ou apontando para outra direcao deve
  falhar deterministicamente.

formula:
  required_all:
    - TRAIL_PHASE_ALLOWED
    - VERSE_REFERENCE_VALID
    - VERSE_DIRECTION_ALLOWED_FOR_PHASE
    - INTENT_ROUTE_MATCH
    - MULTIBUSSOLA_AXIS_ALIGNMENT
    - HUMAN_STYLE_MATCH
    - TECHNICAL_PROOF_SEPARATE
  all_true: SEMANTIC_GREEN
  any_false: SEMANTIC_FAIL
  missing_or_unknown: SEMANTIC_UNKNOWN

invariants:
  VERSE_VALID_ALONE_IS_NOT_GREEN: true
  STYLE_MATCH_ALONE_IS_NOT_GREEN: true
  TRAIL_MATCH_ALONE_IS_NOT_GREEN: true
  INTENT_OWNER_IS_SEGREDO_CHEFE: true
  MODEL_CANNOT_REWRITE_INTENT: true
  MODEL_CANNOT_SELF_APPROVE_SEMANTIC_GREEN: true
  VERSE_DOES_NOT_REPLACE_TECHNICAL_EVIDENCE: true
  TECHNICAL_GREEN_DOES_NOT_IMPLY_SEMANTIC_GREEN: true
  SEMANTIC_GREEN_DOES_NOT_IMPLY_RUNTIME_GREEN: true
  MULTIBUSSOLA_AXIS_ALIGNMENT_REQUIRED: true
  MULTIBUSSOLA_MISALIGNED_IS_FAIL: true
  MULTIBUSSOLA_UNKNOWN_IS_NOT_GREEN: true
  UNKNOWN_IS_NOT_PASS: true
  FAIL_CLOSED: true

human_style:
  canonical_profile: BAIANES_FACIL
  teaching_grammar_owner: docs/CONSCIENCIA/01-IDENTIDADE-E-REGRAS/SOL-GRAMATICA-DE-ENSINO.yml
  accepts: [BAIANES_FACIL, PTBR_TECNICO_DIRETO]
  must_preserve:
    - CHEFE_INTENT
    - DIRECTNESS
    - TECHNICAL_LITERALITY_FOR_PROOF
    - REGIONAL_METAPHOR_WHEN_CONTEXTUAL
  style_is_authority: false

multibussola_alignment:
  owner: docs/CONSCIENCIA/MULTIBUSSOLA.md
  required_fields: [multibussola_axis_id, multibussola_alignment]
  alignment_values: [ALIGNED, MISALIGNED, UNKNOWN]
  green_requires: ALIGNED
  missing_axis: UNKNOWN
  misaligned_axis: FAIL
  purpose: >-
    Mostrar em qual eixo a execucao esta sendo julgada e impedir que uma seta
    tecnicamente valida caminhe para fora da direcao vigente do SEGREDO/CHEFE.
  axis_is_private_reasoning: false
  axis_is_operational_trace: true

phase_direction_map:
  ACORDAR: [EXAMINE_EVERYTHING_KEEP_WHAT_IS_GOOD, ORDER_NOT_CONFUSION]
  DESTINATION_LOCK: [GUARD_THE_SOURCE, ORDER_NOT_CONFUSION]
  PEGATUDO: [EXAMINE_EVERYTHING_KEEP_WHAT_IS_GOOD, KEEP_AND_RELEASE_AT_THE_RIGHT_TIME]
  DEBITO_COGNITIVO: [EXAMINE_EVERYTHING_KEEP_WHAT_IS_GOOD, COUNSEL_STABILIZES_PLANS]
  READERS_MEASURE: [COUNT_COST_BEFORE_BUILDING, EXAMINE_EVERYTHING_KEEP_WHAT_IS_GOOD]
  RENDEZVOUS: [COUNSEL_STABILIZES_PLANS, SINGLE_WITNESS_IS_NOT_ENOUGH_FOR_JUDGMENT]
  RECONCILE: [KEEP_AND_RELEASE_AT_THE_RIGHT_TIME, ORDER_NOT_CONFUSION]
  STITCH: [TEAR_AND_SEW_AT_THE_RIGHT_TIME, WRITE_THE_VISION_CLEARLY]
  OWNER: [GUARD_THE_SOURCE, ORDER_NOT_CONFUSION]
  ONE_WRITER: [ORDER_NOT_CONFUSION, GUARD_THE_SOURCE]
  PATCH: [COUNT_COST_BEFORE_BUILDING, WORD_WITHOUT_ACTION_IS_INCOMPLETE]
  TESTE: [RESULT_REVEALS_TREE, EXAMINE_EVERYTHING_KEEP_WHAT_IS_GOOD]
  CONTRAPROVA: [SINGLE_WITNESS_IS_NOT_ENOUGH_FOR_JUDGMENT, EXAMINE_EVERYTHING_KEEP_WHAT_IS_GOOD]
  REALITY_JUDGE: [RESULT_REVEALS_TREE, SINGLE_WITNESS_IS_NOT_ENOUGH_FOR_JUDGMENT]
  FIXED_POINT: [LIGHT_INCREASES_ALONG_THE_PATH, RESULT_REVEALS_TREE]
  REGISTRA: [WRITE_THE_VISION_CLEARLY, KEEP_AND_RELEASE_AT_THE_RIGHT_TIME]
  RASTRO: [WRITE_THE_VISION_CLEARLY, ORDER_NOT_CONFUSION]
  HANDOFF: [WRITE_THE_VISION_CLEARLY, ORDER_NOT_CONFUSION]
  BOOT: [LIGHT_INCREASES_ALONG_THE_PATH, ORDER_NOT_CONFUSION]

intent_match:
  required_fields: [mission_id, intent_id, intent_route, phase]
  comparison: EXACT_NORMALIZED_ROUTE_OR_EXPLICIT_ALLOWED_CHILD
  implicit_goal_rewrite: FORBIDDEN
  missing_intent_route: UNKNOWN

verse_registry_source: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/AUREOLA-BAHIA-BIBLICA.yml
post_green_lock: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/POST-GREEN-LOCK.yml
semantic_result_values: [GREEN, FAIL, UNKNOWN]

negative_counterproof:
  verse_real_wrong_phase_must_fail: true
  verse_real_wrong_direction_must_fail: true
  correct_verse_wrong_intent_must_fail: true
  correct_verse_wrong_multibussola_axis_must_fail: true
  missing_multibussola_axis_must_be_unknown: true
  correct_trail_wrong_style_must_fail: true
  missing_technical_proof_boundary_must_not_green: true
