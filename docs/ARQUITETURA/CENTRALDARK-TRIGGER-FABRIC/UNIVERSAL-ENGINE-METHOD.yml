  arbitrary_percent_forbidden: true
  percent_requires_explicit_denominator: true
  layout_change_requires_explicit_chefe_authorization: true

trace_pombo64_contract:
  marker: CENTRALDARK_HASH_TIME_POMBO64_TRACE_REQUIRED
  observed_at_iso8601_with_offset: true
  observed_at_utc: true
  trace_id_formula: SHA256_OBSERVED_PHASE_DIRECTION_OBJECT_OWNER_HEAD_DEPENDENCY_24
  event_id_format: CD-YYYYMMDDTHHMMSSO-TRACE24
  pombo_mode: CHECKSUM_ON
