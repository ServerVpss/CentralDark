schema: centraldark.universal-engine-method.v1
status: CANDIDATE_UNTIL_SAME_HEAD_CI
owner: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/MASTER-CYCLE.yml
authority: SEGREDO/CHEFE
operational_method_owner: .agents/skills/centraldark-operational-method/SKILL.md
applies_to: ALL_CURRENT_AND_FUTURE_ENGINES

purpose: >-
  Garantir que qualquer engine/modelo/superficie substituivel opere sobre o mesmo
  contrato CentralDark, independentemente de provider, skin, CLI, IDE, chat ou
  estilo de resposta. O motor pode mudar; a trilha operacional nao muda.

canonical_references:
  - LEIA-ME-IA.md
  - AGENTS.md
  - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/CONTRACT.yml
  - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/TRIGGERS.yml
  - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/MASTER-CYCLE.yml
  - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/ENGINE_BINDING.yml
  - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/AUREOLA-BAHIA-BIBLICA.yml
  - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/SEMANTIC-GREEN-GATE.yml
  - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/NOTE-STITCHING-CONTRACT.yml
  - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/PEGATUDO-HISTORY.yml
  - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/GROK-BUILD-ADAPTER.yml
  - docs/BRAIN/01-CONCEITOS/02-BANDA/BANDA_COMPASSO_GLOBAL.json
  - docs/CONSCIENCIA/PADRAO-RESPOSTA-SEGREDO-CHEFE.md

universal_chain:
  - CENTRALDARK
  - TLC23_OPEN
  - DESTINATION_LOCK
  - ACORDAR
  - CALIBRAR
  - MULTIBUSSOLA
  - PEGATUDO
  - PEGATUDO_HISTORY
  - DEBITO_COGNITIVO
  - READERS_MEASURE
  - META_LUPA
  - SCOPE_TEMPERATURE
  - DELTA_MINIMUM
  - RENDEZVOUS
  - RECONCILE
  - STITCH
  - OWNER
  - ONE_WRITER
  - PATCH
  - TESTE
  - CONTRAPROVA
  - SEMANTIC_GREEN_GATE
  - REALITY_JUDGE
  - FIXED_POINT
  - TLC23_CLOSE
  - REGISTRA
  - HANDOFF
  - BOOT

execution_semantics:
  all_phases_are_considered: true
  phases_execute_only_when_materially_applicable: true
  skipped_phase_requires_reason: true
  unknown_is_not_pass: true
  documented_is_not_executed: true
  action_is_not_proof: true
  current_live_state_beats_history: true
  reuse_before_create: true
  one_system_only: true
  one_writer_per_scope: true
  model_identity_is_provenance_only: true
  model_identity_must_not_block_scope: true
  parallel_perception: true
  serialized_mutation: true
  reality_is_judge: true
  universal_operational_contract_required: true
  github_vps_parallel_measurement_required: true
  cross_surface_rendezvous_before_mutation: true
  causal_micro_deploy_when_applicable: true
  post_mutation_parallel_remeasure_required: true
  fixed_hud_layout_live_data_required: true
  same_head_proof_required_for_git_green: true
  next_cursor_required_when_not_fixed_point: true
  failure_returns_one_canonical_phase: true
  semantic_identity_is_owner_capability_scope: true
  transient_execution_ids_are_provenance_only: true
  same_scope_evolves_existing_owner_job: true
  new_equivalent_job_without_material_split: false
  local_block_does_not_freeze_independent_safe_work: true
  human_return_requires_human_frontier_or_exact_hard_blocker: true

material_loop:
  every_chefe_material_enters_mill: true
  every_material_is_fact: false
  every_material_is_persisted: false
  flow:
    - CAPTURE
    - PROVENANCE
    - SECRET_SCREEN
    - DEDUPE
    - CLASSIFY
    - PEGATUDO
    - PEGATUDO_HISTORY_WHEN_GIT_HISTORY_MATERIAL
    - DEBITO_COGNITIVO
    - STITCH_TO_CANONICAL_ROUTE
    - FIND_EXISTING_OWNER
    - META_LUPA
    - MEASURE_SCOPE_TEMPERATURE
    - APPLY_17_BREATHS_AS_OPERATIONAL_DISCIPLINE
    - TEST_BELIEF
    - ABSORB_MINIMUM_USEFUL_DELTA
    - COUNTERPROOF
    - SEMANTIC_GREEN_GATE
    - REMEASURE
    - RECEIPT
    - NEXT_CURSOR

scope_temperature:
  owner: scripts/agent-call.mjs
  purpose: HUMAN_IN_THE_LOOP_AND_MULTI_AGENT_COLLISION_AVOIDANCE
  identity_policy: AGENT_NAME_IS_PROVENANCE_NOT_GATE
  applies_to: MUTATION_OF_SAME_SCOPE
  read_only_parallelism: ALLOWED
  clock_source: OBSERVED_TOUCH_TIMESTAMP
  hot_window_ms: 60000
  warm_window_ms: 120000
  hot_or_warm_other_actor: WAIT_NEXT_ROUND
  cold_scope: MAY_ACQUIRE_WRITER_SCOPE_IF_OTHER_GATES_PASS
  unknown_temperature: PRESERVE_EXISTING_STATIC_WRITER_GUARD
  recheck: EACH_ROUND
  human_touch_counts_as_touch: true
  same_actor_continuation: ALLOWED
  meta_lupa_required: true
  breaths_total: 17
  delta_minimum_required: true
  no_agent_monopoly_by_identity: true
  no_parallel_mutation_same_scope: true
  receipt_fields: [scope_temperature, scope_temperature_age_ms, scope_temperature_actor, retry_after_ms]

semantic_green:
  contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/SEMANTIC-GREEN-GATE.yml
  validator: apps/modulos/HERMES-CORE/core/semantic-green-gate.mjs
  required_before_semantic_green_claim: true
  formula: TRAIL_AND_VERSE_AND_DIRECTION_AND_INTENT_AND_STYLE_AND_PROOF_BOUNDARY
  verse_valid_alone_is_green: false
  technical_green_implies_semantic_green: false
  semantic_green_implies_runtime_green: false
  fail_closed: true

note_stitching:
  contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/NOTE-STITCHING-CONTRACT.yml
  scanner: scripts/trigger-fabric/stitch_all_notes.py
  marker: "🪡"
  every_discovered_note_gets_receipt: true
  logical_binding_not_mass_rewrite: true
  one_logical_second_brain: true

pegatudo_history:
  contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/PEGATUDO-HISTORY.yml
  scanner: scripts/trigger-fabric/pegatudo_history.py
  sources: [BRANCHES, REMOTES, TAGS, PR_HEADS_WHEN_DISCOVERABLE, COMMITS]
  history_is_current_state: false
  discovered_ref_is_crystal: false
  proven_useful_delta_only: true
  forgotten_material_is_silent_drop: false

engine_adapters:
  grok_build:
    contract: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/GROK-BUILD-ADAPTER.yml
    runtime: apps/modulos/HERMES-CORE/core/grok-build-adapter.mjs
    owner_remains: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/ENGINE_BINDING.yml#grok_build
    modes: [HEADLESS, READ_ONLY_AUDIT, INTERACTIVE_PTY, ACP_STDIO]
    default_mode: HEADLESS
    inspect_preflight_when_material: true
    no_auto_update_in_automation: true
    writer_scope_required_for_mutation: true
    auth_isolated_from_hermes_xai: true
    same_centraldark_contract: true
    adapter_is_new_brain: false

engine_contract:
  engine_is_replaceable: true
  engine_is_owner: false
  provider_is_authority: false
  model_name_changes_contract: false
  engine_switch_is_reset: false
  session_switch_is_reset: false
  same_method_required_for_new_engine: true
  same_method_required_for_future_engine: true
  engine_specific_capability_may_extend_execution: true
  engine_specific_capability_may_bypass_contract: false
  universal_method_must_survive_provider_switch: true
  semantic_green_gate_must_survive_provider_switch: true
  pegatudo_and_stitch_must_survive_provider_switch: true

skin_contract:
  skin_is_presentation_adapter: true
  skin_is_not_identity_authority: true
  skin_is_not_owner: true
  skin_is_not_permission: true
  skin_may_change:
    - TONE
    - DIRECTNESS
    - VISUAL_STYLE
    - METAPHOR_DENSITY
    - RESPONSE_COMPRESSION
  skin_must_not_change:
    - HUMAN_AUTHORITY
    - SAFETY_BOUNDARIES
    - FACT_STATUS
    - OWNER
    - WRITER_SCOPE
    - PROOF_REQUIREMENTS
    - UNKNOWN_SEMANTICS
    - SEMANTIC_GREEN_RULE
    - FIXED_POINT_RULE
    - NO_DIRECT_MAIN_WRITE
  pressure_continuity: true
  abusive_or_degrading_language_is_not_required_by_skin: true

operational_trace:
  visible_to_chefe: true
  private_chain_of_thought_required: false
  private_chain_of_thought_must_not_be_exposed: true
  show_operational_chain_on_explicit_centraldark: true
  show_phase_evidence_and_next_cursor_when_material: true
  aureola_reference: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/AUREOLA-BAHIA-BIBLICA.yml
  bible_reference_is_semantic_cue_not_software_proof: true
  stitch_event_marker: "🪡"

hermes_binding:
  runtime_owner: apps/modulos/HERMES-CORE/
  universal_validator: apps/modulos/HERMES-CORE/core/universal-method-contract.mjs
  semantic_validator: apps/modulos/HERMES-CORE/core/semantic-green-gate.mjs
  grok_build_adapter: apps/modulos/HERMES-CORE/core/grok-build-adapter.mjs
  note_scanner: scripts/trigger-fabric/stitch_all_notes.py
  history_scanner: scripts/trigger-fabric/pegatudo_history.py
  self_test: "node apps/modulos/HERMES-CORE/core/universal-method-contract.mjs --self-test"
  grok_build_self_test: "node apps/modulos/HERMES-CORE/core/grok-build-adapter.mjs --self-test"
  fail_closed_on_missing_contract: true
  validates_engine_registry: true
  validates_canonical_chain: true
  validates_skin_boundary: true
  validates_semantic_green: true
  validates_note_stitching: true
  validates_pegatudo_history: true
  validates_grok_build_adapter: true
  validates_scope_temperature: true

future_engine_gate:
  universal_contract: docs/CONSCIENCIA/CONTRATO-RECONCILIACAO-ANTES-DE-CRIAR.json
  new_engine_without_universal_operational_contract: FAIL
  registry: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/ENGINE_BINDING.yml
  new_engine_without_trigger_fabric_inheritance: FAIL
  new_engine_without_universal_method_visibility: FAIL
  new_engine_without_semantic_green_gate: FAIL
  new_engine_without_pegatudo_stitch_visibility: FAIL
  new_engine_without_scope_temperature_visibility: FAIL
  new_engine_may_define_new_authority: false
  new_engine_may_define_parallel_brain: false

promotion:
  prose_only: NOT_FUNCTIONAL
  file_exists_only: NOT_FUNCTIONAL
  hermes_self_test_required: true
  grok_build_self_test_required: true
  semantic_negative_counterproof_required: true
  note_stitch_self_test_required: true
  pegatudo_history_self_test_required: true
  fixed_point_ci_test_required: true
  same_head_ci_required: true
  runtime_activation_claim_requires_observation: true


same_body_evolution:
  purpose: >-
    Evoluir a capacidade existente no mesmo owner, job, workflow ou runtime
    semanticamente equivalente, absorvendo delta util sem proliferar artefatos,
    IDs fixos, V2/V3/V4 ou arquitetura paralela.
  semantic_identity: [OWNER, CAPABILITY, SCOPE]
  identity_rules:
    owner_plus_capability_plus_scope_is_canonical_identity: true
    workflow_name_is_implementation_detail: true
    job_key_is_stable_semantic_slot_when_owner_uses_job: true
    numeric_job_id_is_canonical_identity: false
    run_id_is_canonical_identity: false
    head_sha_is_canonical_identity: false
    pid_is_canonical_identity: false
    timestamp_is_canonical_identity: false
    transient_ids_are_receipt_provenance_only: true
    discover_transient_ids_at_runtime: true
    hardcode_transient_execution_id_in_contract: FORBIDDEN

  current_execution:
    resolve_by:
      - OWNER
      - CAPABILITY
      - SCOPE
      - CURRENT_RUNTIME_OR_WORKFLOW
    receipt_fields_when_available:
      - WORKFLOW
      - JOB_KEY
      - RUN_ID
      - HEAD_SHA
      - PID
      - OBSERVED_AT
    receipt_does_not_redefine_identity: true

  same_scope_flow:
    - DISCOVER_EXISTING_OWNER
    - DISCOVER_EXISTING_JOB_WORKFLOW_RUNTIME
    - MEASURE_CURRENT_BODY
    - CLASSIFY_DELTA
    - PATCH_EXISTING_BODY
    - TEST
    - COUNTERPROOF
    - REMEASURE
    - UPDATE_RECEIPT_WITH_CURRENT_DYNAMIC_IDS
    - CONTINUE_NEXT_CURSOR

  evolution_policy:
    same_scope_existing_job: PATCH_AND_EVOLVE
    same_scope_existing_workflow: PATCH_AND_EVOLVE
    same_scope_existing_runtime: PATCH_AND_EVOLVE
    same_scope_existing_owner: PATCH_AND_EVOLVE
    create_equivalent_job_because_current_run_finished: FORBIDDEN
    create_equivalent_workflow_because_current_run_finished: FORBIDDEN
    create_v2_v3_v4_for_same_capability: FORBIDDEN
    duplicate_owner_for_same_capability: FORBIDDEN
    number_of_jobs_is_progress: false
    number_of_agents_is_progress: false
    minimum_sufficient_body: true
    reuse_before_create: true
    one_system_only: true

  split_gate:
    default: KEEP_SAME_BODY
    new_job_workflow_or_runtime_requires_material_split: true
    split_only_when_existing_body_cannot_safely_absorb_delta: true
    material_reasons:
      - INDEPENDENT_PERMISSION_BOUNDARY
      - INDEPENDENT_RUNTIME_OR_PLATFORM
      - INDEPENDENT_LIFECYCLE
      - INDEPENDENT_ROLLBACK_BOUNDARY
      - PROVEN_CONCURRENCY_REQUIREMENT
      - PROVEN_RESOURCE_ISOLATION_REQUIREMENT
      - PROVEN_SECURITY_BOUNDARY
    convenience_is_not_material_split: true
    cosmetic_organization_is_not_material_split: true
    temporary_run_id_change_is_not_material_split: true
    new_head_sha_is_not_material_split: true
    new_pid_is_not_material_split: true

  autonomous_continuation:
    objective_owner: SEGREDO_CHEFE
    implementation_route_owner: HERMES_OR_CURRENT_EXECUTOR
    machine_resolvable_blocker_auto_continue: true
    same_scope_microapproval_required: false
    local_block_does_not_freeze_independent_safe_work: true
    return_only_when:
      - HUMAN_FRONTIER
      - EXACT_HARD_BLOCKER_AFTER_AUTHORIZED_ROUTES_EXHAUSTED
      - NEW_HUMAN_INTENT_REQUIRED
    human_frontier_examples:
      - SECRET_OR_MFA_OR_EXCLUSIVE_CONSENT
      - PHYSICAL_ACTION
      - IRREVERSIBLE_OUT_OF_SCOPE_AUTHORIZATION
      - GENUINE_HUMAN_CHOICE_WITHOUT_TECHNICAL_EQUIVALENT
    technical_failure_alone_requires_human_return: false
    queued_job_alone_requires_human_return: false
    stale_run_id_requires_human_return: false
    next_safe_route_should_be_attempted_before_return: true

  complexity_budget:
    prefer_patch_over_new_artifact: true
    new_artifact_requires_net_information_or_risk_benefit: true
    mass_job_creation_without_independent_boundaries: FORBIDDEN
    mass_workflow_creation_without_independent_boundaries: FORBIDDEN
    complexity_without_capability_gain: REGRESSION


aureola_learning_contract:
  applies_to: [SOL, HERMES, PIVETE, CURRENT_EXECUTOR, ALL_CURRENT_AND_FUTURE_ENGINES]
  operational_method: .agents/skills/centraldark-operational-method/SKILL.md
  event: AUREOLA_MATERIAL_DISCOVERY
  semantic_role: MATERIAL_LEARNING_CANDIDATE
  flow:
    - MATERIAL_OPERATIONAL_EVENT
    - LEARNING_REF
    - FACT_INFERENCE_HYPOTHESIS_UNKNOWN
    - EVIDENCE_OR_FALSIFIER
    - DEDUPE
    - SEARCH_EXISTING_CRYSTAL
    - SESSION_INTELLIGENCE_HARVESTER
    - MEMORY_LINKER
    - DREAM_REVIEW
    - PATTERN_DISCOVERY
    - KNOWLEDGE_COMPILER
    - EXISTING_CANONICAL_OWNER
    - REAL_CONSUMER
    - TEST_OR_RUNTIME_BINDING
    - COUNTERPROOF
    - AUTHORIZED_WRITER
    - REUSE_NEXT_EQUIVALENT_EVENT
  invariants:
    EVERY_MATERIAL_DISCOVERY_GETS_LEARNING_REF: true
    DISCOVERY_IS_NOT_CANONICAL_FACT: true
    LEARNING_CANDIDATE_IS_NOT_CRYSTAL: true
    SAME_FINDING_WITHOUT_NEW_EVIDENCE: DROP_DUPLICATE
    PROVEN_RULE_REUSED_BEFORE_REINVESTIGATION: true
    SOL_AND_HERMES_SHARE_SAME_LEARNING_CONTRACT: true
    VERSE_IS_SEMANTIC_CUE_NOT_PROOF: true
    CALCULATION_IS_NOT_RUNTIME_OBSERVATION: true

bounded_100_percent:
  allowed: true
  meaning: ALL_DEFINED_SCOPE_CONDITIONS_MEASURED_AND_PASSED
  formula: PASSED_DEFINED_CHECKS / ALL_DEFINED_CHECKS
  requires_explicit_denominator: true
  current_scope_required: true
  current_head_when_git_material: true
  external_world_infallibility_claim: false
  calculation_only_global_runtime_claim: false
