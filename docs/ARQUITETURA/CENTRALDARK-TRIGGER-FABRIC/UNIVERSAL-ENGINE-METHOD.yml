  marker: CENTRALDARK_WHOLE_HOUSE_ONE_DIRECTION_REQUIRED
  status: MANDATORY_GLOBAL
  scope: ENTIRE_CENTRALDARK
  scope_id: canon/centraldark-universal-contract-20260919
  authority: SEGREDO/CHEFE
  one_direction: true
  no_parallel_contract: true
  active_promotion_lane: canon/centraldark-universal-contract-20260919
