  dns_record: PASS
  tailscale_serve_resource: PASS
  connector_process: RUNNING_NOW
  fallback_proxy_process: RUNNING_NOW
  system_autostart: UNKNOWN
  systemd_available: false
  sudo_available: false

invariants:
  no_dns_owner_duplication: true
