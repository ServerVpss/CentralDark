  decisions: [REUSE, REFINE, ABSORB, DEFER, REJECT]

documentation:
  one_canonical_owner_per_subject: true
  stores: [architecture, decisions, pending, evidence, lessons, operations, handoff, manifests]
  pending_registry_required: true
  stale_detection: true
  reconciliation:
    repo_vs_docs: true
    docs_vs_runtime: true
    issue_vs_code: true
    pr_vs_main: true

memory_system:
  graph_rag: PRESERVE_AND_REUSE
  memory_linker: ENABLED
  obsidian: INTEGRATED_OR_RECONCILE
  memory_dream: BACKGROUND_CONSOLIDATION
  evolution_ledger: ENABLED
  retrieval: LOAD_RELEVANT_CONTEXT_ONLY
  forbidden: LOAD_ENTIRE_BRAIN_FOR_EVERY_REQUEST

missions:
  route: /missions
  required_fields: [mission_id, intent, sector, owner, writer, executor, judge, source_head, target, proof_target, status]
  state_machine: [CREATED, MEASURING, RUNNING, TESTING, COUNTERPROOF, BLOCKED, PROVEN, CLOSED]

voice_sol:
  route: /voice
  inputs: [voice, text]
  outputs: [text, speech]
  voice_to_mission: true
  flow: [RECEIVE_INTENT, PARSE, RESOLVE_ROUTE, CREATE_OR_UPDATE_MISSION, EXECUTE, REPORT]
  direct_bridge: FALLBACK_ONLY_WHEN_NEEDED

agent_orchestration:
  same_model_multiple_roles_allowed: true
  multiple_providers_required: false
  escalation:
    level_0: { method: deterministic, use_when: known_mechanical }
    level_1: { agents: 1, use_when: normal_analysis }
    level_2: { agents: 2, use_when: review_needed }
    level_3: { agents: 4, use_when: critical }
    level_swarm: { engine: ENXAME, use_when: broad_but_bounded }
    level_omega: { engine: OMEGA, use_when: adversarial_final_counterproof }

