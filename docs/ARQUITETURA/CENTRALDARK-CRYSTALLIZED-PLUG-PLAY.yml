    evidence: "📜 Evidence"
    settings: "⚙ Configurações"

inventory_engine:
  global_search: true
  indexes: [id, title, sector, owner, capability, tag, hash, pombo_id, state, date]
  filters: [sector, status, environment, risk, owner, engine, active, locked, capability_type]
  sort: [name_asc, name_desc, id_asc, id_desc, date_newest, date_oldest, hash, status, sector, dependency_count]
  views: [cards, table, tree, graph, timeline, rooms]

forge:
  id: FORGE-01
  purpose: [build, inspect, repair, harden, crystallize, package, verify]
  preserve_existing_identity: true
  visual_policy:
    style: professional_youthful_forge
    preserve_existing_three_skins: true
    improve_without_losing_originality: true
  forge_card_fields: [item_id, owner, status, health, heat, revision, hash, pombo_id, last_test, repair_action]

maintenance:
  id: MAINTENANCE-01
  route: /maintenance
  mode: GAMIFIED_ADMIN
  actions: [scan, repair, backup, restore, synchronize, verify, lock, unlock_with_reason]
  experience:
    XP_enabled: true
    XP_sources: [successful_repair, verified_backup, regression_removed, documentation_reconciled, dependency_fixed]
    levels: [INSPECTION, REPAIR, HARDENED, CONSOLIDATED]
  safety:
    no_fake_game_state: true
    game_ui_does_not_override_reality: true

backup:
  internal: true
  local_sync: true
  repository_sync_supported: true
  plugin_backup: true
  metadata_required: [source, destination, timestamp, sha256, pombo_id, revision, restore_test]
  copied_is_not_proven: true
  restore_test_required: true

repository_importer:
  id: REPO-IMPORTER-01
  route: /capabilities/import
  input: [repository_url, optional_ref]
  action_button: "⛏ GARIMPAR"
  pipeline:
