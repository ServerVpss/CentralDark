schema: centraldark.architecture/v1
kind: CRYSTALLIZED_PLUG_AND_PLAY
status: CANDIDATE_ARCHITECTURE
authority: SEGREDO/CHEFE
authority_marker: PERMITO-SEGREDO
source_session: 2026-09-07

baseline:
  repository: ServerVpss/CentralDark
  pull_request: 1445
  branch: feat/omniroute-capability-surface-722
  measured_head_before_this_commit: 462b884baa9a6844bb64fb442948ece4b106b92d
  measured_base_main: b3de3d82067c9476657d8fff3c6115f05afa079a
  mergeable_before_this_commit: true
  draft_before_this_commit: false
  runtime_claim: UNKNOWN_UNTIL_REMEASURED

confidence:
  architectural_confidence_target: 0.90
  classification: DESIGN_CONFIDENCE_NOT_RUNTIME_PROOF
  rule: "90% basta para cristalizar estrutura; os 10% restantes dependem de visualização e runtime vivo."

intent:
  one_system: true
  preserve_all_useful_gold: true
  nothing_material_left_behind: true
  reuse_before_create: true
  improve_existing_first: true
  no_parallel_products: true
  no_v2_v3: true
  no_blind_overwrite: true
  unknown_is_not_pass: true
  merged_is_not_deployed: true
  documented_is_not_executed: true
  button_exists_is_not_runtime_proof: true
  locality_first: true
  causal_cone_only: true
  expand_scope_only_if_causal: true

public_surface:
  identity: CentralDark
  rule: ONE_PUBLIC_DOOR
  target_domain: centralldark.com
  routes:
    home: /
    admin: /admin
    cockpit: /cockpit
    rooms: /rooms
    missions: /missions
    router: /roteador
    api: /api
    mcp: /mcp
    voice: /voice
    graph: /graph
    maintenance: /maintenance
    capabilities: /capabilities
    evidence: /evidence
  internal_services:
    allowed_multiple_ports: true
    allowed_multiple_processes: true
    allowed_multiple_containers: true
    rule: "interno pode ser distribuído; externamente continua uma Casa."

core:
  id: CORE-CENTRALDARK-01
  responsibilities:
    - intent_resolution
    - context_resolution
    - policy
    - authorization
    - routing
    - orchestration
    - state
    - evidence_linking
    - reconciliation
  invariants:
    SECOND_ROUTER: false
    SECOND_BRAIN: false
    SECOND_MCP: false
    SECOND_HUB: false
    SECOND_APP: false
  master_flow:
    - INTENT
    - RESOLVE_ROUTE
    - RESOLVE_SECTOR
    - RESOLVE_OWNER
    - EXECUTE
    - TEST
    - COUNTERPROOF
    - REALITY_JUDGE
    - RECEIPT

components:
  hub:
    id: HUB-CONTEXT-01
    purpose:
      - context
      - connectors
      - state
      - safe_snapshots
      - capability_registry
      - admin_projection

  omni_router:
    id: ROUTER-OMNI-01
    existing_owner: apps/modulos/elite-gateway/scripts/centraldark_omni_router.py
    public_surface: /roteador
    capabilities:
      - chat
      - responses
      - streaming
      - models
      - provider_selection
      - fallback
      - free_only
      - health
      - model_touch
      - capability_routing
    engines_are_replaceable: true
    engine_is_authority: false

  api:
    id: API-CENTRAL-01
    one_api_surface: true
    no_parallel_gateway_identity: true

  mcp:
    id: MCP-CENTRAL-01
    one_mcp_surface: true
    tools_can_have_multiple_owners: true
    second_mcp_forbidden: true

  evidence:
    id: EVIDENCE-CORE-01
    stores:
      - receipts
      - logs
      - hashes
      - test_results
      - runtime_observations
      - counterproof
      - provenance

  reality_judge:
    id: REALITY-JUDGE-01
    verdicts:
      - PROVADO
      - QUEBRADO
      - EVIDENCIA_FALTANTE
      - UNKNOWN
    forbidden:
      - false_green
      - narrative_only_pass

trigger_fabric:
  id: TRIGGER-FABRIC-01
  inputs:
    webhook: { enabled: true, role: reacao_imediata }
    cron: { enabled: true, role: patrulha_periodica }
    repository_dispatch: { enabled: true }
    health_events: { enabled: true }
    runtime_signals: { enabled: true }
  signal_watcher:
    id: SIGNAL-WATCHER-01
    flow:
      - INGEST
      - REDACT
      - CLASSIFY
      - RESOLVE_SECTOR
      - RESOLVE_OWNER
      - CALCULATE_CAUSAL_CONE
      - TEST
      - COUNTERPROOF
      - RECEIPT
      - NOTIFY
  locality_policy:
    default: WAKE_AFFECTED_ROOM_ONLY
    expansion_condition: CAUSE_CROSSES_SECTOR_BOUNDARY
    expansion_action: WAKE_DEPENDENT_ROOM
    wake_every_agent_for_every_change: false

buzz:
  id: BUZZ-ROOMS-01
  state: RESERVE_REFERENCE
  role:
    - workspace
    - rooms
    - event_view
    - agent_roster_view
    - evidence_view
    - mission_view
  reuse:
    hub: true
    evidence: true
    trigger_fabric: true
  create_new_event_bus: false
  room_contract:
    metadata_required:
      - sector_id
      - owner
      - state
      - hash
      - pombo_id
      - revision
      - lock_state
      - last_seen
      - evidence_ref
    roles:
      P1: executor_investigator
      P2: reviewer
      P3: counterproof_adversarial
      P4: final_local_validator
    modes:
      MINIMAL: [P1]
      REVIEW: [P1, P2]
      CRITICAL: [P1, P2, P3]
      FULL: [P1, P2, P3, P4]
      SWARM: ENXAME
      OMEGA: OMEGA_ADVERSARIAL
    closure_requires:
      - test
      - counterproof_when_applicable
      - receipt

sectors:
  security:
    id: SECURITY-01
    room: buzz/security
    capabilities: [authentication, authorization, permissions, secret_policy, audit, security_events]
    lockable: true
  backend:
    id: BACKEND-01
    room: buzz/backend
    capabilities: [services, workers, queues, database_interfaces, api_logic, integrations]
    lockable: true
  routing:
    id: ROUTING-01
    room: buzz/routing
    capabilities: [omni_router, models, providers, fallback, cost_policy, capability_router]
    lockable: true
  memory:
    id: MEMORY-01
    room: buzz/memory
    capabilities: [memory_linker, graph_rag, knowledge_graph, obsidian, canonical_docs, learned_patterns, memory_dream]
    lockable: true
  voice_sol:
    id: VOICE-SOL-01
    room: buzz/voice
    capabilities: [microphone, speech_to_text, text_input, text_to_speech, mission_control, sol_bridge]
    lockable: true
  runtime:
    id: RUNTIME-01
    room: buzz/runtime
    capabilities: [vps, containers, services, deploy, rollback, health, logs]
    lockable: true
  github:
    id: GITHUB-01
    room: buzz/github
    capabilities: [repository, branches, issues, pull_requests, workflows, releases, provenance]
    lockable: true
  forge:
    id: FORGE-01
    room: buzz/forge
    capabilities: [maintenance, backup, repair, install, uninstall, integrity_check, package_validation]
    lockable: true
  capability_lab:
    id: CAPABILITY-LAB-01
    room: buzz/capabilities
    capabilities: [external_source_ingestion, repository_analysis, gold_extraction, compatibility, owner_discovery, adaptation, crystallization]
    lockable: true

capability_inventory:
  BUZZ: { state: RESERVE, preserved: true, role: rooms_event_view }
  GROK_BUILD: { state: CANDIDATE, preserved: true, engine_is_authority: false, activation: ON_DEMAND }
  LOCAL_AI: { state: DEFERRED, preserved: true, activate_when_measured: true }
  ODS: { state: DEFERRED, preserved: true }
  OPENMAUSBOT: { state: RESERVE, preserved: true, role: agent_roster_ux_reference }
  OPEN_LOVABLE: { state: RESERVE, preserved: true, role: builder_pattern_reference }
  AI-OX: { state: CANDIDATE, preserved: true, adapter_required: true }
  OMEGA: { state: AVAILABLE, role: adversarial_autocorrection }
  ENXAME: { state: AVAILABLE_OR_RESERVED, role: multi_agent_execution_mode }
  FUTURE_ENGINES: { state: RESERVE }

capability_states:
  AVAILABLE: catalogado_e_disponivel
  DEFERRED: preservado_aguarda_medicao_ou_necessidade
  RESERVE: referencia_ou_plano_preservado
  CANDIDATE: pode_entrar_mediante_gate
  LOADED: carregado_no_processo
  ACTIVE: executando_agora
  UNAVAILABLE: nao_disponivel_no_ambiente_medido
  REJECTED: nao_deve_ser_usado_neste_estado

absorption_pipeline:
  accepted_sources:
    - github_repository
    - local_repository
    - zip
    - docs
    - drive_document
    - conversation
    - screenshot
    - architecture_reference
    - api_spec
  stages:
    - REGISTER_SOURCE
    - READ_END_TO_END
    - INVENTORY_ARCHITECTURE
    - EXTRACT_CAPABILITIES
    - CLASSIFY_PEPITAS
    - COMPARE_WITH_CENTRALDARK
    - RESOLVE_EXISTING_OWNER
    - MAP_COMPATIBILITY
    - ADAPT_IN_PLACE
    - REGISTER_ADMINISTRABLE
    - TEST_EXACT_HEAD
    - COUNTERPROOF
    - CRYSTALLIZE
    - RECEIPT
    - DISCARD_TEMPORARY_CARCASS_WHEN_SAFE
  inspect_end_to_end:
    - architecture
    - backend
    - frontend_when_needed
    - modules
    - routes
    - APIs
    - configs
    - dependencies
    - states
    - buttons_and_effects
    - data_model
    - tests
    - integrations
  decisions:
    - NATIVE
    - OWNER_EXISTS
    - ADAPTATION_REQUIRED
    - OWNER_DISCOVERY_REQUIRED
    - RUNTIME_UNKNOWN
  forbidden:
    - second_router
    - second_hub
    - second_mcp
    - duplicate_service
    - v2
    - v3
    - final_final

source_policy:
  study_architecture_and_behavior: true
  preserve_provenance_when_material_reuse_occurs: true
  prefer_adaptation_or_reimplementation_in_centraldark_owner: true
  no_blind_copy: true

plug_play_contract:
  required_files:
    - manifest.yml
    - capabilities.yml
    - owners.yml
    - dependencies.yml
    - install.yml
    - uninstall.yml
    - rollback.yml
    - tests.yml
    - receipt.yml
  lifecycle:
    install_idempotent: true
    upgrade_preserve_state: true
    uninstall_remove_only_owned_material: true
    repair_scoped: true
    rollback_required: true
  manifest_fields:
    - package_id
    - sector_id
    - component_id
    - owner
    - version
    - revision
    - created_at
    - source_sha
    - package_sha256
    - manifest_sha256
    - parent_package_sha256
    - delta_manifest_sha256
    - dependencies
    - consumers
    - install_hooks
    - uninstall_hooks
    - rollback_hooks
    - tests
    - lock_policy

pombo:
  display_name_format: POMBO64-YYYYMMDD-HHMM
  example_display_name: POMBO64-20260907-0208
  policy:
    POMBO_ID_IMMUTABLE: true
    REVISION_MONOTONIC: true
    date_time_name_is_locator_not_identity: true
    checksum_alone_is_not_genealogy: true
    one_package_per_crystallization: true
  identity:
    POMBO_ID: POMBO-CENTRALDARK
    REVISION: MONOTONIC
  integrity_required:
    - PACKAGE_SHA256
    - MANIFEST_SHA256
    - PARENT_PACKAGE_SHA256
    - DELTA_MANIFEST_SHA256
  envelope:
    checksum_location: external
    reason: avoid_self_reference
  package_contains:
    - manifest
    - sector_inventory
    - component_inventory
    - hashes
    - receipts
    - dependencies
    - install_map
    - rollback_map

locks:
  states:
    OPEN: mudanca_permitida_no_writer_correto
    STABLE: funcional_observavel_ainda_evolutivo
    CONSOLIDATED: nao_tocar_sem_causa_material
    SEALED: alteracao_exige_gate_explicito
  opening_conditions:
    - proven_regression
    - dependency_break
    - security_issue
    - explicit_new_requirement
    - runtime_drift
  forbidden_reasons:
    - curiosity_only
    - refactor_for_style_only
    - parallel_rewrite
    - version_bump_without_value

admin:
  id: ADMIN-CENTRALDARK-01
  route: /admin
  auth_required: true
  one_registry: true
  auto_render_cards: true
  sector_card_fields:
    - id
    - owner
    - state
    - hash
    - pombo_id
    - revision
    - lock_state
    - last_seen
    - evidence_ref
  navigation:
