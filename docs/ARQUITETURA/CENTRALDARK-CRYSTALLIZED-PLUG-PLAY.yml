hermes_reconciliation_command:
  name: CENTRALDARK_CRYSTALLIZED_RECONCILE
  command: |
    !CENTRALDARK
    #ACORDAR
    !CALIBRAR
    !MULTIBUSSOLA
    !META_LUPA
    !RECONCILIAR

    INTENT=RECONCILE_CRYSTALLIZED_PLUG_PLAY_ARCHITECTURE
    REPO=ServerVpss/CentralDark
    PR=1445
    CONTRACT=docs/ARQUITETURA/CENTRALDARK-CRYSTALLIZED-PLUG-PLAY.yml

    RULES:
      MEASURE_FIRST=true
      REUSE_BEFORE_CREATE=true
      ONE_SYSTEM_ONLY=true
      NO_V2_V3=true
      NO_BLIND_OVERWRITE=true
      UNKNOWN_IS_NOT_PASS=true
      PRESERVE_ALL_USEFUL_GOLD=true
      ONE_WRITER_PER_SCOPE=true
      CAUSAL_CONE_ONLY=true
      EXPAND_ONLY_IF_CAUSAL=true

    EXECUTION:
      1. medir main + HEAD exato do PR #1445
      2. inventariar owners existentes para cada nó deste contrato
      3. classificar cada nó como NATIVE | OWNER_EXISTS | ADAPTATION_REQUIRED | OWNER_DISCOVERY_REQUIRED | RUNTIME_UNKNOWN
      4. garimpar branches/issues/PRs antigos somente por delta exclusivo
      5. não ressuscitar branch inteira quando a main já venceu
      6. preservar Buzz, Grok Build, IA local, ODS, OpenMausBot, Open-Lovable, AI-OX, Enxame e Omega
      7. registrar cada capacidade administrável no registry existente
      8. dar a cada setor ID + owner + hash + POMBO_ID + revision + lock_state + evidence_ref
      9. conectar Admin/Cockpit/Rooms/Voice/Missions/Forge/Maintenance ao mesmo Core
      10. rodar testes do cone causal e contraprova no HEAD exato
      11. criar receipt e pacote POMBO externo com linhagem
      12. bloquear setores consolidados apenas depois de prova
      13. deixar runtime/visualização não medidos como UNKNOWN, nunca PASS
      14. parar quando a arquitetura estiver >=90% reconciliada e listar somente o delta visual/runtime restante

    OUTPUT:
      SOURCE_OF_TRUTH_MATRIX
      OWNERSHIP_MATRIX
      CAPABILITY_MATRIX
      ADMINISTRABLE_MATRIX
      BRANCH_GOLD_MATRIX
      POMBO_LINEAGE
      TEST_RECEIPTS
      RUNTIME_UNKNOWN_LIST
      VISUAL_REMAINING_DELTA
      FINAL_VERDICT

final_gate:
  architecture:
    one_system_only: required
    reuse_before_create: required
    no_parallel_v2_v3: required
    all_material_gold_classified: required
    every_sector_has_id_owner_hash_pombo_lock: required
    admin_projection_defined: required
    rollback_defined: required
    evidence_path_defined: required
  runtime:
    full_runtime_required_for_architecture_commit: false
    unknown_runtime_must_remain_unknown: true
  closure:
    architectural_target: ">=90%"
    remaining: VISUAL_AND_RUNTIME_REMEASUREMENT

