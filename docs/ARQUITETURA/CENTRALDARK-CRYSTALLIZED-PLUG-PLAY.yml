    missions: "🧭 Missões"
    rooms: "🐝 Buzz / Salas"
    agents: "🤖 Agentes"
    routing: "🔀 Router / Modelos"
    providers: "🌐 Providers"
    security: "🔐 Segurança"
    automation: "📡 Automação"
    memory: "🧠 Memória"
    voice: "🎙 Voz / SOL"
    graph: "🕸 Grafo"
    runtime: "🖥 Runtime"
    github: "🐙 GitHub"
    capability_lab: "⛏ Garimpo"
    forge: "🔥 Forja"
