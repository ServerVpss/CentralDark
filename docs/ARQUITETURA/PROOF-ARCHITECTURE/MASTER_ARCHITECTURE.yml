
architecture:
  name: CENTRALDARK
  mode: ONE_CANONICAL_SYSTEM_MANY_CONSUMERS
  mutation_in_this_package: false

roles:
  SEGREDO_CHEFE:
    defines: [INTENT, DESTINATION, HUMAN_LIVED_EVENT, FINAL_HUMAN_AUTHORIZATION]
  SYSTEM:
    defines: [GITHUB_STATE, CI_STATE, DEPENDABOT_STATE, FILE_HASH, MEASURED_RUNTIME_STATE]
  SOL:
    role: COORDINATE_AND_RECONCILE
    forbidden: [INVENT_THIRD_REALITY, STEAL_AUTHORSHIP, CHANGE_DESTINATION, SELF_APPROVE]

invariants:
  REUSE_BEFORE_CREATE: true
  ONE_SYSTEM_ONLY: true
  ONE_WRITER_PER_SCOPE: true
  PARALLEL_PERCEPTION: true
  SERIALIZED_MUTATION: true
  UNKNOWN_IS_NOT_PASS: true
  HISTORY_IS_NOT_CURRENT_STATE: true
  DOCUMENTED_IS_NOT_EXECUTED: true
  ACTION_IS_NOT_PROOF: true
  MODEL_CONSENSUS_IS_NOT_REALITY: true
  NO_V1_V2_V3_V4_PARALLEL_CANON: true
