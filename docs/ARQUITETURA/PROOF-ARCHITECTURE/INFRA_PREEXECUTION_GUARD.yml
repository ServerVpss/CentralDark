
INFRA_PREEXECUTION_GUARD:
  mutation_default: DENY_UNTIL_REVIEWED
  EXTEND_WHAT_WORKS: true
  REPLACE_WORKING_SYSTEM: false
  REUSE_BEFORE_CREATE: true
  NO_V3_V4_PARALLEL_ARCHITECTURE: true
  PRESERVE_LEGACY_ARCHITECTURE: true
  PRESERVE_DATABASE: true
  ONE_WRITER_PER_SCOPE: true

  before_execution:
    - LOCK_INTENT_AND_DESTINATION
    - MEASURE_LIVE_STATE
    - INVENTORY_DEPENDENCIES_AND_OWNERS
    - IDENTIFY_DATABASE_AND_LEGACY_BOUNDARIES
    - DEFINE_MINIMAL_DELTA
    - DEFINE_REVERSAL_PATH
    - DEFINE_REGRESSION_DENOMINATOR
    - RUN_COUNTERPROOF
    - REQUIRE_MATERIAL_AUTHORIZATION

  promotion:
    ZERO_KNOWN_REGRESSION_IN_DEFINED_DENOMINATOR: true
    UNKNOWN_MATERIAL: 0
    LEGACY_BEHAVIOR_PRESERVED_WHERE_IN_SCOPE: true
    DATABASE_INTEGRITY_PRESERVED_WHERE_IN_SCOPE: true

  rule:
    ABSOLUTE_ZERO_REGRESSION_WITHOUT_DENOMINATOR: FORBIDDEN
