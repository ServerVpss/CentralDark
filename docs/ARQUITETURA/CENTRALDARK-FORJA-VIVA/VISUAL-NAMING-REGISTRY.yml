schema: centraldark.forja-viva.visual-naming-registry.v1
status: CANDIDATE_UNTIL_TESTED_ON_RUNTIME
owner: docs/ARQUITETURA/CENTRALDARK-FORJA-VIVA/FORJA_VIVA_CONTINUIDADE.md
authority: SEGREDO/CHEFE

rules:
  visual_name_is_identity_authority: false
  visual_name_is_new_agent: false
  visual_name_is_new_brain: false
  visual_name_is_proof: false
  human_facing_version_suffix_forbidden: true
  one_visual_identity_owner: true
  capability_base_icon_is_global: true
  visual_surface_mode: HYBRID
  same_capability_same_base_icon_across_internal_surfaces: true
  surface_may_change: [badge, status, accent, action]
  surface_must_not_replace_base_icon_for_same_capability: true
  browser_or_external_favicon_is_canonical_identity: false
  browser_or_external_favicon_semantics: THIRD_PARTY_PROJECTION_ONLY

entries:
  - id: FORJA_VIVA_ICON
    canonical_name: "Capetinha da Forja"
    kind: VISUAL_IDENTITY
    semantic_role: "forja viva / temperatura / respiração / trabalho em andamento"
    owner_reused: docs/ARQUITETURA/CENTRALDARK-FORJA-VIVA/FORJA_VIVA_CONTINUIDADE.md
    runtime_binding: EXISTING_FORJA_VIVA_SURFACES
    status: CANDIDATE_UNTIL_RENDERED_AND_OBSERVED

  - id: FORJA_SKIN
    canonical_name: "Forja"
    kind: VISUAL_SKIN
    aliases: ["forge"]
    status: DEFINED_NOT_GLOBAL_PASS

  - id: OPERATIONAL_SKIN
    canonical_name: "Operacional"
    kind: VISUAL_SKIN
    aliases: ["operational"]
    status: DEFINED_NOT_GLOBAL_PASS

  - id: EMERALD_SKIN
    canonical_name: "Emerald"
    kind: VISUAL_SKIN
    aliases: ["emerald"]
    status: DEFINED_NOT_GLOBAL_PASS

  - id: FORJA_OPERATOR_EMOJI_ALIASES
    canonical_name: "Forja Viva — atalhos por capacidade no HUD"
    kind: EXISTING_CAPABILITY_VISUAL_ALIASES
    semantic_role: "símbolos acionam somente seleção de receita visível; execução é posterior e autorizada"
    owner_reused: "docs/CONSCIENCIA/PADRAO-EMOJIS.md"
    cockpit_consumer: "apps/instinto-superior/src/components/central/HudDeterministico.tsx"
    groups:
      diagnostico: ["🔧", "🪛"]
      manutencao: ["🛠️", "👨🏻‍🔧"]
      observacao: ["👀", "👁️"]
      linhagem: ["🪡", "🎄"]
      retomada: ["🌞", "🌟", "✨"]
      forja: ["☄️", "🔥", "⚒️"]
    command_map_is_allowlisted: true
    string_or_emoji_is_shell_command: false
    command_execute_on_click: false
    visual_cannot_grant_permission: true
    runtime_proof_required: true
    source_state: SOURCE_DEFINED
    status: NOT_PROVEN_ON_RUNTIME
