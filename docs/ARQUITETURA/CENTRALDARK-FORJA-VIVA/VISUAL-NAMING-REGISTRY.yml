    runtime_binding: EXISTING_FORJA_VIVA_SURFACES
    status: CANDIDATE_UNTIL_RENDERED_AND_OBSERVED

  - id: FORJA_SKIN
    canonical_name: "Forja"
    kind: VISUAL_SKIN
    aliases: ["forge"]
    status: DEFINED_NOT_GLOBAL_PASS

  - id: OPERATIONAL_SKIN
    canonical_name: "Operacional"
    kind: VISUAL_SKIN
    aliases: ["operational"]
    status: DEFINED_NOT_GLOBAL_PASS

  - id: EMERALD_SKIN
    canonical_name: "Emerald"
    kind: VISUAL_SKIN
    aliases: ["emerald"]
