schema: centraldark.forja-viva.visual-naming-registry.v1
status: CANDIDATE_UNTIL_TESTED_ON_RUNTIME
owner: docs/ARQUITETURA/CENTRALDARK-FORJA-VIVA/FORJA_VIVA_CONTINUIDADE.md
