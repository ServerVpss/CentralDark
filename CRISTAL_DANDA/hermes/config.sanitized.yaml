model:
  default: auto
  provider: centraldark-router
  api_mode: chat_completions
providers:
  centraldark-router:
    name: CentralDark Omni Router
    base_url: http://127.0.0.1:8099/v1
    key_env: CENTRALDARK_ROUTER_KEY
    default_model: auto
  chatgpt-zendrive:
    name: ChatGPT ZenDrive
    base_url: https://api.centralldark.com/v1
    key_env: CENTRALDARK_ARSENAL_KEY
    default_model: gpt-5.5
    models:
      - gpt-5.5
      - gpt-5.6-sol
      - gpt-5.6-luna
      - grok-4.6
      - arsenal-router
  hermesone:
    name: Hermes One
    base_url: https://inference.hermesone.org/v1
    key_env: HERMESONE_API_KEY
  abacus:
    name: abacus
    base_url: https://api.centralldark.com/v1
    key_env: CENTRALDARK_ARSENAL_KEY
    default_model: gpt-5.3-codex
  centraldark:
    name: CentralDark Gateway
    base_url: https://api.centralldark.com/v1
    key_env: CENTRALDARK_ARSENAL_KEY
    default_model: arsenal-router
  arsenal:
    name: Arsenal Lovable (Edge)
    base_url: https://kagejpghnwdfymddwxuf.supabase.co/functions/v1/arsenal-proxy/v1
    key_env: ARSENAL_PROXY_KEY
    default_model: gemini-3.1-pro-preview
    extra_headers:
      x-arsenal-key: <RECRIAR_LOCALMENTE>
  gemini:
    name: Google Generative Language
    base_url: https://generativelanguage.googleapis.com/v1beta
    auth_section: gemini
    default_model: gemini-3.6-flash
agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium
  personalities:
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 100
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
prompt_caching:
  cache_ttl: 5m
auxiliary:
  vision:
    provider: custom:routellm-(abacus-ai)
    model: route-llm
    timeout: 120
    download_timeout: 30
  compression:
    provider: gemini
    model: gemini-3.1-flash-lite
  skills_hub:
    provider: custom:routellm-(abacus-ai)
    model: gpt-5.6-sol
    timeout: 30
  title_generation:
    provider: openrouter
    model: inclusionai/ling-3.0-flash:free
  curator:
    provider: openrouter
    model: google/gemma-4-26b-a4b-it:free
  web_extract:
    provider: openrouter
    model: inclusionai/ling-3.0-flash:free
  flush_memories:
    provider: custom:routellm-(abacus-ai)
    model: gemini-2.5-flash
    timeout: 30
  session_search:
    provider: custom:routellm-(abacus-ai)
    model: gpt-5.6-sol
    timeout: 30
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  background_process_notifications: all
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
tts:
  provider: edge
  edge:
    voice: pt-BR-FranciscaNeural
    speed: 1
  speed: 1
  providers:
    hermes-studio:
      type: command
      command: 'curl --config "%USERPROFILE%\.hermes-web-ui\runtime\hermes-studio-voice.curlrc"
        --request POST --header "Content-Type: text/plain; charset=utf-8" --data-binary
        @{input_path} --output {output_path} "http://127.0.0.1:8648/api/hermes/voice/proxy/default/v1/tts"'
      output_format: mp3
      timeout: 120
      voice_compatible: true
stt:
  enabled: true
  local:
    model: base
  openai:
    model: whisper-1
  provider: local
voice:
  auto_tts: true
context:
  engine: compressor
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
moa:
  default_preset: default
  active_preset: ''
  presets:
    default:
      reference_models:
        - provider: openai-codex
          model: gpt-5.5
        - provider: openrouter
          model: deepseek/deepseek-v4-pro
        - provider: custom:routellm-(abacus-ai)
          model: gemini-3-pro-image
      aggregator:
        provider: openai-codex
        model: gpt-5.6-luna
      max_tokens: <RECRIAR_LOCALMENTE>
      enabled: true
      reference_temperature: 0.6
      aggregator_temperature: 0.4
skills:
  creation_nudge_interval: 15
approvals:
  destructive_slash_confirm: false
command_allowlist:
  - script execution via -e/-c flag
kanban:
  orchestrator_profile: default
  default_assignee: default
code_execution:
  mode: project
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 33
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
platforms:
  api_server:
    enabled: true
    extra:
      port: 8642
      host: 127.0.0.1
  telegram:
    enabled: false
mcp_servers:
  hermes-studio-api:
    command: C:\Program Files\nodejs\node.exe
    args:
      - %USERPROFILE%\AppData\Roaming\npm\node_modules\hermes-web-ui\bin\hermes-studio-mcp.mjs
      - api
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8648
      HERMES_WEB_UI_HOME: %USERPROFILE%\.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: %USERPROFILE%\.hermes-web-ui
      HERMES_WEB_UI_PROFILE: default
      HERMES_MCP_SERVER_NAME: hermes-studio-api
      HERMES_MCP_TOOLSET: api
      HERMES_WEB_UI_MANAGED_MCP: '1'
    enabled: true
  hermes-studio-browser:
    command: C:\Program Files\nodejs\node.exe
    args:
      - %USERPROFILE%\AppData\Roaming\npm\node_modules\hermes-web-ui\bin\hermes-studio-mcp.mjs
      - browser
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8648
      HERMES_WEB_UI_HOME: %USERPROFILE%\.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: %USERPROFILE%\.hermes-web-ui
      HERMES_WEB_UI_PROFILE: default
      HERMES_MCP_SERVER_NAME: hermes-studio-browser
      HERMES_MCP_TOOLSET: browser
      HERMES_WEB_UI_MANAGED_MCP: '1'
    enabled: true
  hermes-studio-devices:
    command: C:\Program Files\nodejs\node.exe
    args:
      - %USERPROFILE%\AppData\Roaming\npm\node_modules\hermes-web-ui\bin\hermes-studio-mcp.mjs
      - devices
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8648
      HERMES_WEB_UI_HOME: %USERPROFILE%\.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: %USERPROFILE%\.hermes-web-ui
      HERMES_WEB_UI_PROFILE: default
      HERMES_MCP_SERVER_NAME: hermes-studio-devices
      HERMES_MCP_TOOLSET: devices
      HERMES_WEB_UI_MANAGED_MCP: '1'
    enabled: true
  hermes-studio-use:
    command: C:\Program Files\nodejs\node.exe
    args:
      - %USERPROFILE%\AppData\Roaming\npm\node_modules\hermes-web-ui\bin\hermes-studio-mcp.mjs
      - use
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8648
      HERMES_WEB_UI_HOME: %USERPROFILE%\.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: %USERPROFILE%\.hermes-web-ui
      HERMES_WEB_UI_PROFILE: default
      HERMES_MCP_SERVER_NAME: hermes-studio-use
      HERMES_MCP_TOOLSET: use
      HERMES_WEB_UI_MANAGED_MCP: '1'
    enabled: true
  centraldark:
    url: https://mcp.centralldark.com/admin/mcp
    auth: oauth
    enabled: true

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4