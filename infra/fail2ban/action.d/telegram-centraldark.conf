# Fail2Ban action — CentralDark Telegram (segurança)
# Repo: infra/fail2ban/action.d/telegram-centraldark.conf
# VPS:  /etc/fail2ban/action.d/telegram-centraldark.conf
#
# Notifica ban/unban via infra/fail2ban/notify-ban.sh
# Preferência: GUARDA_TELEGRAM_BOT_TOKEN (@Guardiaonotify_bot)

[Definition]

norestored = 1

actionstart =

actionstop =

actioncheck =

actionban = /root/CentralDark/infra/fail2ban/notify-ban.sh ban <name> <ip> <failures> <bantime>

actionunban = /root/CentralDark/infra/fail2ban/notify-ban.sh unban <name> <ip>

[Init]
