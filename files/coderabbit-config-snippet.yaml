# Snippet para incluir em .coderabbit.yaml ou em configs de deploy
coderabbit_bridge:
  enabled: true
  env:
    RABBIT_A_URL: "https://rabbit-a.example/api/status"
    RABBIT_B_URL: "https://rabbit-b.example/api/status"
    CENTRALDARK_API_URL: "https://centraldark.example/api/integrations/coderabbit"
    DEPENDA_BOT_URL: "https://dependa-bot.example/webhook"
    INTERVAL_SECONDS: 300  # 5 minutes
  deploy:
    systemd_service: |
      [Unit]
      Description=Coderabbit Bridge
      After=network.target
      [Service]
      ExecStart=/usr/bin/node /opt/centraldark/scripts/coderabbit-bridge.mjs
      Restart=on-failure
      User=root
      [Install]
      WantedBy=multi-user.target
