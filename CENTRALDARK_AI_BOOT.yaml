          \]
        posterior_odds_latex: |-
          \[
          O(H\mid E_1,\ldots,E_n)
          =
          O(H)\prod_{i=1}^{n}LR_i
          \]
        posterior_probability_latex: |-
          \[
          P(H\mid E)
          =
          \frac{O(H\mid E)}
          {1+O(H\mid E)}
          \]
        binary_entropy_latex: |-
          \[
          \mathcal{H}(p)
          =
          -p\log_2 p-(1-p)\log_2(1-p)
          \]
        information_gain_latex: |-
          \[
          IG
          =
          \mathcal{H}(p_{prior})
          -
          \mathcal{H}(p_{posterior})
          \]
        reanchor_uplift_latex: |-
          \[
          \Delta_{reanchor}
          =
          P(A=1\mid T=1)
          -
          P(A=1\mid T=0)
          \]
        reanchor_risk_ratio_latex: |-
          \[
          RR_{reanchor}
          =
          \frac{P(A=1\mid T=1)}
          {P(A=1\mid T=0)}
          \]
        beta_prior_latex: |-
          \[
          \theta=P(A=1\mid T=1),
          \qquad
          \theta\sim\operatorname{Beta}(\alpha_0,\beta_0)
          \]
        beta_posterior_latex: |-
          \[
          \theta\mid D
          \sim
          \operatorname{Beta}(\alpha_0+s,\beta_0+f)
          \]
        beta_posterior_mean_latex: |-
          \[
          \mathbb{E}[\theta\mid D]
          =
          \frac{\alpha_0+s}
          {\alpha_0+\beta_0+s+f}
          \]
        posterior_superiority_latex: |-
          \[
          P(\theta_1>\theta_0\mid D)
          \]
        brier_score_latex: |-
          \[
          BS
          =
          \frac{1}{N}
          \sum_{i=1}^{N}(p_i-y_i)^2
          \]
        decision_threshold_latex: |-
          \[
          p^*
          =
          \frac{C_{FP}}
          {C_{FP}+C_{FN}}
          \]
        value_of_information_latex: |-
          \[
          VOI
          =
          L_{before}
          -
          L_{after}
          -
          C_{test}
          \]
