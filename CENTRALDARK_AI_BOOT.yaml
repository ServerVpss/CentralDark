    marker: "LANGUAGE_MODEL_SELECTION_READY"
    mode: "ADAPTIVE"
    models_available:
      - model: "haiku"
        context_token_limit: 200000
        speed: "fast"
        use_when: "Tarefas simples, análise rápida, debug, coding pequeninhas"
      - model: "opus-magus"
        context_token_limit: 1000000
        speed: "high_capability"
        use_when: "Arquitetura, design, grandes refactorings, multi-front coordination"
      - model: "thinking-mode"
        context_token_limit: 200000
        speed: "deliberate"
        use_when: "Contradictions, complex tracing, proof assembly, when stakes are high"
    selection_rule: |
      Tarefa simples (< 1h estimated, single-front) → haiku (fast + cheap).
      Tarefa grande (> 1h, multi-front, design, architecture) → opus-magus (high reasoning).
      Tarefa ambígua, contradições, ou prove-it-demanded → thinking-mode (deliberate reasoning).
      Default: haiku (depois escale se bloqueado).
    active_model_this_session: "haiku-4.5-20251001"

