COMANDO_EXECUTÁVEL:
  shell: powershell
  politica_padrao: SOMENTE_LEITURA
  instrucoes: >
    Executar na Casa SEGREDO. O script audita o alvo
    por padrão. Para clicar, habilitar as duas variáveis
    de autorização no início, após conferir janela,
    controle, monitor e efeito esperado.

  script: |
    $ErrorActionPreference = "Stop"

    # CONFIGURAÇÃO EDITÁVEL
    $Repo = "F:\CentralDark"
    $Janela = "Cockpit CentralDark"
    $Controle = "Estado do MCP"

    # Dupla trava: leitura por padrão
    $ExecutarClique = $false
    $AutorizacaoConfirmada = $false

    # OWNERS EXISTENTES
    $Metodo = Join-Path $Repo `
      ".agents\skills\centraldark-operational-method"

    $Skill = Join-Path $Metodo "SKILL.md"

    $Monitores = Join-Path $Metodo `
      "scripts\Identify-CentralDarkMonitors.ps1"

    $Cursor = Join-Path $Metodo `
      "Skills\centraldark-hermes-visual-computer-use\scripts\blink_cursor.py"

    $MCP = Join-Path $Repo "apps\modulos\mcp"
    $Cockpit = Join-Path $Repo "apps\instinto-superior"

    # GATE 01 — CAMINHOS
    foreach ($p in @(
      $Repo, $Skill, $Monitores, $Cursor,
      $MCP, $Cockpit
    )) {
      if (-not (Test-Path -LiteralPath $p)) {
        throw "UNKNOWN: caminho ausente: $p"
      }
    }

    # GATE 02 — FONTE E WORKTREE
    $HEAD = (& git -C $Repo rev-parse HEAD).Trim()
    if ($LASTEXITCODE -ne 0) {
      throw "UNKNOWN: Git indisponível"
    }

    $Dirty = @(& git -C $Repo status --short)
    $Python = (Get-Command python -ErrorAction Stop).Source

    # GATE 03 — UI AUTOMATION
    Add-Type -AssemblyName UIAutomationClient
    Add-Type -AssemblyName UIAutomationTypes
    Add-Type -AssemblyName System.Windows.Forms
    Add-Type -AssemblyName System.Drawing

    $Root = [System.Windows.Automation.AutomationElement]::RootElement

    $Windows = @(
      $Root.FindAll(
        [System.Windows.Automation.TreeScope]::Children,
        [System.Windows.Automation.Condition]::TrueCondition
      ) | Where-Object {
        $_.Current.Name -like "*$Janela*"
      }
    )

    if ($Windows.Count -ne 1) {
      throw "UNKNOWN: janela ausente ou ambígua"
    }

    $Window = $Windows[0]

    $Condicao = [System.Windows.Automation.PropertyCondition]::new(
      [System.Windows.Automation.AutomationElement]::NameProperty,
      $Controle
    )

    $Botoes = @(
      $Window.FindAll(
        [System.Windows.Automation.TreeScope]::Descendants,
        $Condicao
      ) | Where-Object {
        $_.Current.ControlType -eq
          [System.Windows.Automation.ControlType]::Button
      }
    )

    if ($Botoes.Count -ne 1) {
      throw "UNKNOWN: botão ausente ou ambíguo"
    }

    $Botao = $Botoes[0]

    if (-not $Botao.Current.IsEnabled) {
      throw "FAIL: botão desabilitado"
    }

    $Estado = "AUDITADO_SEM_CLIQUE"

    if ($ExecutarClique) {
      if (-not $AutorizacaoConfirmada) {
        throw "BLOQUEADO: autorização não confirmada"
      }

      # GATE 04 — TORNAR VISÍVEL
      if ($Botao.Current.IsOffscreen) {
        $Scroll = $Botao.GetCurrentPattern(
          [System.Windows.Automation.ScrollItemPattern]::Pattern
        )
        $Scroll.ScrollIntoView()
      }

      # GATE 05 — REVALIDAR RETÂNGULO
      $Rect = $Botao.Current.BoundingRectangle

      if ($Botao.Current.IsOffscreen -or
          $Rect.IsEmpty -or
          $Rect.Width -le 0 -or
          $Rect.Height -le 0) {
        throw "UNKNOWN: controle não está visível"
      }

      $X = [int][Math]::Round(
        $Rect.Left + $Rect.Width / 2
      )
      $Y = [int][Math]::Round(
        $Rect.Top + $Rect.Height / 2
      )

      # GATE 06 — HIT TEST
      $Ponto = [System.Windows.Point]::new($X, $Y)
      $Hit = [System.Windows.Automation.AutomationElement]::FromPoint(
        $Ponto
      )

      if ($Hit.Current.Name -ne $Controle) {
        throw "FAIL: elemento sob o cursor não corresponde ao alvo"
      }

      # GATE 07 — MAPEAMENTO CANÔNICO
      $Tela = [System.Windows.Forms.Screen]::FromPoint(
        [System.Drawing.Point]::new($X, $Y)
      )

      $MapaBruto = @(
        & powershell.exe -NoProfile -NonInteractive `
          -File $Monitores -ListWindows
      )

      if ($LASTEXITCODE -ne 0) {
        throw "UNKNOWN: mapeamento de monitores falhou"
      }

      $Mapa = @(
        $MapaBruto |
          Where-Object { $_ -match '^\s*\{' } |
          ForEach-Object { $_ | ConvertFrom-Json }
      )

      $MonitorAlvo = @(
        $Mapa | Where-Object {
          $_.device -eq $Tela.DeviceName
        }
      )

      if ($MonitorAlvo.Count -ne 1) {
        throw "UNKNOWN: número do monitor não comprovado"
      }

      $Numero = [int]$MonitorAlvo[0].monitor
      if ($Numero -lt 1) {
        throw "UNKNOWN: número de monitor inválido"
      }

      # GATE 08 — CLIQUE PELO OWNER EXISTENTE
      & $Python $Cursor `
        --mode click `
        --monitor $Numero `
        --pid $Window.Current.ProcessId `
        --hwnd $Window.Current.NativeWindowHandle `
        --x $X `
        --y $Y

      if ($LASTEXITCODE -ne 0) {
        throw "FAIL: executor visual retornou erro"
      }

      # O retorno do executor não prova o efeito.
      $Estado = "DISPATCHED_EFFECT_UNKNOWN"
    }

    # RECIBO DE LEITURA — SEM GRAVAR ARQUIVO
    [pscustomobject]@{
      schema = "centraldark.rov.receipt.v1"
      objetivo = $Controle
      janela = $Window.Current.Name
      pid = $Window.Current.ProcessId
      hwnd = $Window.Current.NativeWindowHandle
      alvo_unico = $true
      visivel = -not $Botao.Current.IsOffscreen
      head = $HEAD
      dirty_count = $Dirty.Count
      clique_solicitado = $ExecutarClique
      status = $Estado
      efeito_independente = "UNKNOWN"
      horario_utc = [DateTime]::UtcNow.ToString("o")
    } | ConvertTo-Json -Depth 5

