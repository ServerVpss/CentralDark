COMANDO_EXECUTÁVEL:
  shell: powershell
  modo_padrao: AUDIT
  instrucao: "Na Casa, editar somente variaveis iniciais; por padrao NENHUM clique."
  script: |
    $ErrorActionPreference = 'Stop'
    $Repo = 'F:\CentralDark'
    $WindowTitle = 'CentralDark'
    $ControlName = 'Estado do MCP'
    $Mode = 'AUDIT'          # AUDIT ou CLICK
    $Autorizacao = ''        # Para CLICK: CHEFE_AUTORIZOU_CLIQUE

    $Method = Join-Path $Repo '.agents\skills\centraldark-operational-method'
    $Owner = Join-Path $Method 'SKILL.md'
    $Resolver = Join-Path $Method 'scripts\Identify-CentralDarkMonitors.ps1'
    $Cursor = Join-Path $Method 'Skills\centraldark-hermes-visual-computer-use\scripts\blink_cursor.py'
    foreach ($p in @($Repo,$Owner,$Resolver,$Cursor)) {
      if (-not (Test-Path -LiteralPath $p)) { throw "UNKNOWN: caminho ausente: $p" }
    }
    $Head = (& git -C $Repo rev-parse HEAD)
    if ($LASTEXITCODE -ne 0) { throw 'UNKNOWN: Git nao respondeu' }
    $Before = @(& powershell.exe -NoProfile -NonInteractive -File $Resolver -ResolveControl -WindowTitle $WindowTitle -ControlName $ControlName)
    if ($LASTEXITCODE -ne 0 -or $Before.Count -eq 0) { throw 'BLOCKED: alvo nao comprovado' }
    try { $Target = $Before[-1] | ConvertFrom-Json }
    catch { throw 'BLOCKED: resultado UIAutomation invalido' }
    if ($Target.input_dispatched -ne $false -or [int]$Target.pid -le 0 -or [int]$Target.hwnd -le 0 -or [int]$Target.monitor -le 0) {
      throw 'BLOCKED: janela/monitor/alvo sem prova atual'
    }

    $ActionStatus = 'AUDIT_ONLY'
    if ($Mode -eq 'CLICK') {
      if ($Autorizacao -ne 'CHEFE_AUTORIZOU_CLIQUE') { throw 'BLOCKED: falta autorizacao explicita' }
      & python $Cursor --mode click --window-title $WindowTitle --control-name $ControlName
      if ($LASTEXITCODE -ne 0) { throw 'FAIL: executor Cua retornou erro' }
      $ActionStatus = 'DISPATCHED_EFFECT_UNKNOWN'
    } elseif ($Mode -ne 'AUDIT') {
      throw 'BLOCKED: modo desconhecido'
    }
    [pscustomobject]@{
      schema = 'centraldark.rov.receipt.v1'
      objetivo = $ControlName
      head = ($Head | Select-Object -First 1)
      window = $WindowTitle
      pid = $Target.pid
      hwnd = $Target.hwnd
      monitor = $Target.monitor
      modo = $Mode
      resultado_execucao = $ActionStatus
      readback_visual = 'UNKNOWN'
      prova_runtime = 'UNKNOWN'
      time_utc = [datetime]::UtcNow.ToString('o')
    } | ConvertTo-Json -Depth 5

LÓGICA_DO_COMANDO:
  - "01 Verifica os owners reais e coleta HEAD sem tocar no checkout."
  - "02 Usa ResolveControl do script canônico para identificar janela e botão."
  - "03 Bloqueia alvo ambiguo, ausente ou sem IDs reais."
  - "04 Em AUDIT apenas informa identidade e contexto."
  - "05 Em CLICK autorizado, chama blink_cursor.py existente com resolucao dinamica."
  - "06 Retorno do clique fica DISPATCHED_EFFECT_UNKNOWN ate contraprova."

