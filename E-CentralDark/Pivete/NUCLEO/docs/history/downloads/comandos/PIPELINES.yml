schema_version: 2
pipelines:
  url_or_podcast:
    stages: [DISCOVER, LOCATE_CANONICAL_SOURCE, TRANSCRIPT_OR_TEXT, PROVENANCE, DEDUPE, EXTRACT, FORJA, REVIEW_IF_REQUIRED, CRYSTALLIZE]
  file:
    stages: [FILE_SECURITY_GATE, PARSE, PROVENANCE, DEDUPE, EXTRACT, FORJA, REVIEW_IF_REQUIRED, CRYSTALLIZE]
  personal_session:
    stages: [SESSION_SCOPE, CAPTURE, CHUNK, TRANSCRIBE, NORMALIZE, DEDUPE, CLASSIFY, EXTRACT, FORJA, SESSION_SUMMARY, CRYSTALLIZE]
  external_human_radar:
    stages: [DISCOVER, SOURCE_IDENTITY, PROVENANCE, FINGERPRINT, DEDUPE, CLAIMS, LENS_PACKET, CONFLICT, TEST, CANDIDATE_DELTA]
  memory_promotion:
    stages: [CANDIDATE, OWNER_RESOLUTION, COUNTERPROOF, VALIDATE, SINGLE_WRITER, NUCLEO_WRITE, READBACK, OBSIDIAN_PROJECTION, RECEIPT]
backpressure:
  bounded_queue: true
  information_gain_required_for_retry: true
  blind_retry: forbidden
