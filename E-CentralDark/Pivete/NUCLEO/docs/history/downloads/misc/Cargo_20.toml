# standalone stress test for the Live Text bridge race; excluded from the
# app workspace so it never affects app builds. macOS only.
[workspace]

[package]
name = "livetext-stress"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "livetext-stress"
path = "src/main.rs"

[[bin]]
name = "livetext-frame-scope"
path = "src/bin/frame-scope.rs"

[[bin]]
name = "livetext-window-scope"
path = "src/bin/window-scope.rs"

[[bin]]
name = "livetext-interactive"
path = "src/bin/interactive.rs"

[profile.release]
debug = true
workspace = true }

[dev-dependencies]
serde = { workspace = true }
criterion = { workspace = true }
serial_test = "3.2.0"

[[bench]]
name = "events"
harness = false
}
zerocopy = { version = "0.7.32" }

tokio = { workspace = true }
tokio-util = "0.7"

tracing = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
criterion = { workspace = true }
oasgen = { workspace = true }
tracing-subscriber = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }

[dev-dependencies]
screenpipe-core = { path = "../screenpipe-core" }
screenpipe-secrets = { path = "../screenpipe-secrets" }
tempfile = { workspace = true }

[[bench]]
name = "db_benchmarks"
harness = false

[[bench]]
name = "new_db_benchmark"
harness = false
