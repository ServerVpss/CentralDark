[package]
name = "sentinela-session-mesh"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0 OR MIT"
description = "Fail-closed session security and network resilience primitives"

[dependencies]
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
hkdf = "0.12.4"
hmac = "0.12.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rustls = { version = "0.23.20", default-features = false, features = ["ring", "std"] }
sha2 = "0.10.8"
subtle = "2.6.1"
thiserror = "1.0.69"
tokio = { version = "1.43.0", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.1"

[dev-dependencies]
hex = "0.4.3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "abort"
strip = "symbols"

[profile.dev]
overflow-checks = true

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
