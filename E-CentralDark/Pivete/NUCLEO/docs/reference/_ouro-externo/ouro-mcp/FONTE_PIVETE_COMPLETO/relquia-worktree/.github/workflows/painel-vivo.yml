name: painel-vivo

on:
  workflow_dispatch:
    inputs:
      evento:
        description: 'Título do acontecimento'
        required: true
      detalhe:
        description: 'Detalhe em linguagem simples'
        required: false
        default: ''
      area:
        description: 'Área do projeto'
        required: false
        default: 'Projeto'
      geral:
        description: 'Progresso geral 0-100'
        required: false
        default: ''
      marco:
        description: 'Marco para atualizar/criar'
        required: false
        default: ''
      marco_pct:
        description: 'Progresso do marco 0-100'
        required: false
        default: ''
      marco_status:
        description: 'done, doing, next ou later'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: painel-vivo
  cancel-in-progress: false

jobs:
  atualizar-painel:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Atualizar painel vivo no owner canônico
        env:
          PAINEL_EVENTO: ${{ inputs.evento }}
          PAINEL_EVENTO_DETALHE: ${{ inputs.detalhe }}
          PAINEL_EVENTO_AREA: ${{ inputs.area }}
          PAINEL_GERAL: ${{ inputs.geral }}
          PAINEL_MARCO: ${{ inputs.marco }}
          PAINEL_MARCO_PCT: ${{ inputs.marco_pct }}
          PAINEL_MARCO_STATUS: ${{ inputs.marco_status }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: node apps/modulos/status/atualizar-painel-vivo.mjs

      - name: Commit painel vivo sem colisão silenciosa
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CentralDark Bot'
          git config user.email 'actions@github.com'
          git add -- apps/modulos/status/painel-data.json
          if git diff --cached --quiet; then
            echo 'PAINEL_VIVO_NO_CHANGE=1'
            exit 0
          fi
          git commit -m "chore(painel): atualizar mapa vivo

          Co-authored-by: SegredoiDev <segredounlock@users.noreply.github.com>"

          BASE_SHA=$(git rev-parse HEAD^)
          git fetch --no-tags origin main
          REMOTE_SHA=$(git rev-parse FETCH_HEAD)
          if [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
            echo "PAINEL_VIVO_BLOCKED_DIVERGENCE base=$BASE_SHA remote=$REMOTE_SHA"
            exit 1
          fi
          echo "🚪 Gate global pré-main"
          node scripts/lupa/validar-continuidade-global.mjs
          node scripts/lupa/validar-porta-de-entrada.mjs
          git push origin HEAD:main
