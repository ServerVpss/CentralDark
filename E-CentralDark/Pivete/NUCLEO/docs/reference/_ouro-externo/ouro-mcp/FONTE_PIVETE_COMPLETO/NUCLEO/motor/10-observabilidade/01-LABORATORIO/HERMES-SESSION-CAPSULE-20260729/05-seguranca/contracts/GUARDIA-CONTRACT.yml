schema: centraldark.guardia.v1
identity:
  name: GUARDIA_DA_CASA
  role: SENSORY_PLANE
  authority: NONE
  writer: false
  final_judge: false
modes:
  default: READ_ONLY
  papagaio: OFF
  pombo: CHECKSUM_ON
invariants:
  - GUARDIA_IS_NOT_AUTHORITY
  - GUARDIA_IS_NOT_WRITER
  - GUARDIA_IS_NOT_FINAL_JUDGE
  - GUARDIA_SELF_APPROVAL_FALSE
  - ACTION_IS_NOT_PROOF
  - UNKNOWN_IS_NOT_PASS
  - REALITY_IS_JUDGE
  - ONE_SYSTEM_ONLY
  - NO_NEW_BRAIN
sensors:
  - STATE_CHANGED
  - DRIFT_DETECTED
  - WRITER_CONFLICT
  - BOUNDARY_PRESSURE
  - EVIDENCE_CONFLICT
  - HEARTBEAT_LOST
  - RUNTIME_FAILURE
  - DEPENDENCY_FAILURE
  - MODEL_DISAGREEMENT
  - PROOF_TARGET_MISMATCH
  - STALE_RECEIPT
  - UNKNOWN_MATERIAL
