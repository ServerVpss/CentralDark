schema: CENTRALDARK_MASTER
schema_version: 2
external_interface:
  master_event: CENTRALDARK
  accepted:
  - '!CENTRALDARK'
  - '#CENTRALDARK'
  case_insensitive: true
  single_command_required: true
  inline_objective: true
  other_triggers_optional_for_chefe: true
trigger_router:
  prefixes:
  - '!'
  - '#'
  prefix_semantics_identical: true
  normalization: trim -> parse prefix -> uppercase -> alias -> canonical_event
  fail_closed_unknown: true
  aliases:
    VAMOS_MELHORAR_OQUE_JA_EXITE: IMPROVE_EXISTING
    MELHORE_OQUE_JA_EXITE: IMPROVE_EXISTING
    VAMOS_MELHORAR_OQUE_JA_EXISTE: IMPROVE_EXISTING
    MELHORE_OQUE_JA_EXISTE: IMPROVE_EXISTING
    MULTIBUSSOLA_META: MULTIBUSSOLA
    MULTIBÚSSOLA_META: MULTIBUSSOLA
    CRISTALIZAR: CRISTALIZAR
    CRYSTALIZAR: CRISTALIZAR
    CRYSTALAIZAR: CRISTALIZAR
    REALITY_JUDGE: REALITY_JUDGE
    META_LUPA: META_LUPA
    RECONCILIAR: RECONCILIAR
    CONTRAPROVA: CONTRAPROVA
    BOOT: BOOT
    DELTAUTIL: DELTAUTIL
  default_centraldark_policy:
  - IMPROVE_EXISTING
  - REUSE_BEFORE_CREATE
  - PEGATUDO
  - ZERO_REGRESSION
  operator_tokens:
    '>>': FORWARD_CONTINUE
    '>>>': FORWARD_CONTINUE
    '<<': REVERSE_REMEASURE
    <<<: REVERSE_REMEASURE
  operator_tokens_are_shell_redirection: false
  operator_tokens_require_master_context: true
master_chain:
  entry: CENTRALDARK
  steps:
  - ACORDAR
  - CRISTALIZAR_MEASURE
  - CRISTALIZAR_FALLBACK
  - CALIBRAR
  - PEGATUDO
  - UNIVERSAL_INVENTORY
  - DELTAUTIL_RECONCILE
  - TOTAL_RECONCILIATION_GATE
  - BRAIN_CONTEXT_RECONCILE
  - PACKAGE_ACCEPTANCE_GATE
  - TRUE_NORTH_LOCK
  - MULTIBUSSOLA
  - RESOLVE_REQUIRED_BEARINGS
  - EXECUTE_MATERIAL_BEARINGS
  - FORWARD_ROUTE
  - REVERSE_ROUTE
  - INVERSE_ROUTE_WHEN_DISCRIMINANT
  - CROSS_BEARING_RENDEZVOUS
  - DIVERGENCE_HANDLER
  - MATERIAL_CHANGE_HANDLER
  - LOCAL_FIXED_POINT_LOOP
  - META_LUPA_WHEN_APPLICABLE
  - RECONCILIAR_WHEN_APPLICABLE
  - CONTRAPROVA
  - REMEDICAO_T1
  - REALITY_JUDGE
  - SITE_READINESS_GATE
  - CODE_DOCUMENTATION_GATE
  - DOCUMENTATION_GATE
  - GLOBAL_FIXED_POINT
  - REGISTRA
  - BOOT_REFRESH
true_north_lock:
  required:
  - INTENT
  - DESTINATION
  - PROOF_TARGET
  - MATERIAL_SCOPE
  missing_material_field: UNKNOWN
multibussola:
  mode_default: META
  required_bearings_must_be_covered: true
  skip_justificado_only_non_material: true
  routes:
  - FORWARD_ROUTE
  - REVERSE_ROUTE
  - INVERSE_ROUTE_WHEN_DISCRIMINANT
  rendezvous: CROSS_BEARING_RENDEZVOUS
  on_divergence:
  - META_LUPA
  - DISCRIMINATING_TEST
  - RECONCILIAR
  - RENDEZVOUS_AGAIN
  on_material_state_change:
  - IDENTIFY_CAUSAL_CONE
  - INVALIDATE_ONLY_DEPENDENT_CLAIMS
  - PRESERVE_INDEPENDENT_PROOFS
  - REFIX_AFFECTED_AXES
  - RENDEZVOUS_AGAIN
  local_analysis_stable:
    'false':
    - RESIDUAL_MAP
    - NEXT_CURSOR
    - CONTINUE
    'true':
    - LOCAL_FIXED_POINT
    - DO_NOT_END_MISSION
pegatudo:
  embedded_in_centraldark: true
  external_delta_count: 1
  purpose: evolutionary lineage reconciliation
  sources:
  - CURRENT_SESSION
  - RELEVANT_PRIOR_SESSIONS
  - REPO
  - PRS
  - ISSUES
  - COMMITS
  - BRANCHES
  - TAGS
  - ARTIFACTS
  - RECEIPTS
  - DRIVE
  - LIBRARY
  - CASA
  - VPS_SANITIZED
  - RUNTIME
  - SCREENPIPE_EVIDENCE
  - USER_ATTACHMENTS
  - HISTORICAL_ARCHIVES
  untrusted_content_is_instruction: false
  classify:
  - CURRENT_CANONICAL
  - HISTORICAL_GOLD
  - NEGATIVE_KNOWLEDGE
  - DUPLICATE
  - COMPLEMENTARY
  - SUPERSEDED
  - CONFLICTING
  - FUTURE_CANDIDATE
  - VISUAL_REFERENCE
  - SYMBOLIC_REFERENCE
  - QUARANTINE
  - IRRELEVANT
  - UNKNOWN
  evolution:
    HISTORICAL_GOLD: ABSORB_INTO_CURRENT_OWNER
    NEGATIVE_KNOWLEDGE: TEST_OR_FALSIFIER_OR_GUARDRAIL_OR_ADR_OR_ROLLBACK_KNOWLEDGE
    DUPLICATE: RECONCILE_REMOVE_OPERATIONAL_AUTHORITY
    SUPERSEDED: PRESERVE_PROVENANCE_NOT_AUTHORITY
    FUTURE_CANDIDATE: TESTABLE_HYPOTHESIS_BEFORE_CODE
    QUARANTINE: NO_PROMPT_INJECTION_NO_SECRET_LEAK_NO_AUTHORITY
    UNKNOWN: MEASURE_MORE
  fixed_point: no_relevant_unclassified_node and all_identified_gold_absorbed_or_preserved
  linked_to_master: true
  old_failure_policy:
    delete_and_forget: false
    convert_to:
    - regression_test
    - falsifier
    - cause_signature
    - guardrail
    - adr
    - rollback_knowledge
  old_pr_policy:
    merge_because_old_contains_gold: false
    ignore_because_old: false
proof:
  reality_is_judge: true
  unknown_is_pass: false
  action_is_proof: false
  documented_is_executed: false
  history_is_current_state: false
  correlation_is_cause: false
  writer_is_judge: false
  same_symptom_is_same_cause: false
  proof_criterion_defined_before_result: true
horn_engine:
  enabled: true
  semantics: positive Horn closure plus negative constraints
  facts_are_measured_only: true
  rules_shape: body_atoms -> head_atom
  constraints_shape: body_atoms -> FALSE
  least_fixed_point: true
  local_fixed_point_is_final_mission: false
  contradiction_blocks_promotion: true
  global_pass_rule:
  - UNKNOWN_MATERIAL_ZERO
  - REQUIRED_BEARINGS_COVERED
  - COUNTERPROOF_SURVIVES
  - T1_STABLE
  - NO_CONTRADICTION
  - HASH_CHAIN_VALID
provider_reality:
  github:
    enabled_when_github_material: true
    api_version: '2026-03-10'
    meta_endpoint: https://api.github.com/meta
    versions_endpoint: https://api.github.com/versions
    public_probe_without_auth: true
    always_query_live_values: true
    receipt_fields:
    - observed_at
    - api_version
    - meta_sha256
    - domains_sha256
    - hooks_sha256
    - api_ranges_sha256
    - actions_ranges_sha256
    - ssh_fingerprints_sha256
    - commit_signing_keys_sha256
    meta_is_webhook_authentication: false
    webhook_signature_still_required: true
    provider_state_role: SENSOR_NOT_AUTHORITY
screenpipe_evidence_provider:
  role: GLOBAL_SENSORY_PROVIDER
  owner: CENTRALDARK
  second_recorder_forbidden: true
  local_first: true
  query_order:
  - ACTIVITY_SUMMARY
  - SEARCH
  - FRAME_CONTEXT
  - ELEMENTS
  - OCR_IF_NEEDED
  - RAW_SQL_READ_ONLY_IF_NEEDED
  - FILESYSTEM_LOGS_FOR_DIAGNOSTIC
  sensitive_state_generic_context_forbidden: true
  sensor_failure_is_world_failure: false
integrity:
  algorithm: SHA-256
  purpose: tamper-evident identity/fingerprint
  hash_alone_is_authentication: false
  bind_to:
  - timestamp
  - origin
  - head_when_applicable
  - receipt
  - source_class
  manifest_required: true
  receipt_chain_required: true
infra:
  review_before_execution: true
  extension_over_replacement: true
  zero_regression_required: true
  preserve_legacy_db_and_architecture: true
  reuse_before_create: true
  forbid_parallel_versions:
  - V2
  - V3
  - V4
  - -novo
  - -final
  - second_brain
  - second_router
  - second_judge
  new_structure_only_if_gap_real_proven: true
deploy:
  select_not_assume: true
  smallest_safe_first: MICRO_DEPLOY
  strategies:
  - MICRO_DEPLOY
  - ROLLING
  - CANARY
  - BLUE_GREEN
  risk_inputs:
  - change_surface
  - blast_radius
  - rollback_cost
  - statefulness
  - traffic_exposure
  - observability_gap
  - dual_environment_cost
  risk_formula: 0.20*change_surface + 0.20*blast_radius + 0.15*rollback_cost + 0.15*statefulness + 0.10*traffic_exposure +
    0.10*observability_gap + 0.10*dual_environment_cost
  old_state_available_until_new_proven: true
  recalculate_after_material_change: true
global_fixed_point:
  PASS:
  - UNKNOWN_MATERIAL=0
  - REQUIRED_BEARINGS_COVERED
  - COUNTERPROOF_SURVIVES
  - T1_STABLE
  - NO_CONTRADICTION
  - HASH_CHAIN_VALID
  - CODE_DOCUMENTATION_GATE_PASS
  - DOCUMENTATION_GATE_PASS
  FAIL: stable_material_failure
  BLOCKED: stable_real_external_boundary_or_required_human_authority
  no_false_green: true
register:
  fields:
  - timestamp_with_timezone
  - origin
  - source_class
  - head_when_applicable
  - sha256
  - proof_target
  - result
  - counterproof
  - links
  - provenance
  boot_refresh_after_receipt: true
visual_layer:
  role: EXPLANATION_AND_CANONICAL_MAP
  technical_proof: false
  user_supplied_art_preserved: true
  symbolic_sources_never_override_technical_sources: true
final_rule: MELHORAR O QUE JA EXISTE; PEGAR TUDO; PROVAR; RECONCILIAR; MUDAR O MINIMO; PRESERVAR O OURO; NUNCA REGREDIR.
mission:
  external_delta_count: 1
  create_parallel_system: false
  preserve_thread: true
master_command: '#ACORDAR !CALIBRAR #PEGATUDO !CENTRALDARK'
delta:
  external_count: 1
  internal_components: N
  user_visible_count: 1
branch_reconciliation:
  required_before_material_validation: true
  target_base: main
  stale_base_is_not_repo_defect: true
  stale_base_resolution_order:
  - FETCH_TARGET_BASE
  - COMPARE_MERGE_BASE
  - CLASSIFY_BASE_DRIFT
  - MERGE_TARGET_BASE_INTO_PR_BRANCH_WHEN_SHARED
  - RERUN_VALIDATORS
  - ONLY_THEN_MUTATE_OWNER_FILES
  shared_pr_branch_policy: MERGE_BASE_UPDATE_PREFERRED
  rebase_shared_branch_without_explicit_policy: false
  plain_force_push_forbidden: true
  validator_baseline_must_not_be_weakened_to_match_stale_branch: true
  parallel_existing_rule: SYNC_BASE_THEN_RERUN; NEVER_CHANGE_EXPECTED_1_TO_STALE_12
meta_lupa_identity:
  skill_path: .agents/skills/meta-lupa/SKILL.md
  identity_path: .agents/skills/meta-lupa/AUTOLUPA_CANONICAL_SHA
  identity_algorithm: GIT_BLOB_OBJECT_ID
  compute_from_current_branch_bytes: true
  manual_stale_sha_forbidden: true
  regenerate_after_skill_change_or_base_sync: true
  verify_with_git_hash_object: true
  failure_class: IDENTITY_DRIFT_NOT_CONTENT_FAILURE
pr_1388_observed_repair:
  source: USER_SCREENSHOT_2026-08-31
  observed_problem:
  - PR_BRANCH_WAS_STALE_AGAINST_MAIN_WITH_PR_1386_EFFECTS
  - VALIDATOR_REPORTED_PARALLEL_EXISTING_12_WHERE_CURRENT_BASE_EXPECTED_1
  - META_LUPA_IDENTITY_SHA_NEEDED_REGENERATION_FROM_CURRENT_SKILL_BYTES
  repair:
  - SYNC_PR_BRANCH_WITH_CURRENT_MAIN
  - RERUN_VALIDAR_MAPA_WITHOUT_WEAKENING_EXPECTATION
  - REGENERATE_AUTOLUPA_CANONICAL_SHA_FROM_SKILL_MD
  - RERUN_IDENTITY_AND_GLOBAL_GATES
  - COMMIT_ARCHITECTURE_AND_REPAIR_TO_SAME_PR_BRANCH
  github_write_status: BLOCKED_CONNECTOR_UNAVAILABLE_THIS_RUN
universal_master_funnel:
  enabled: true
  master_event: CENTRALDARK
  any_recognized_external_trigger_enters_master_once: true
  direct_subtrigger_bypass_forbidden: true
  master_reentry_guard: true
  canonical_phase_prefix:
  - ACORDAR
  - CRISTALIZAR_MEASURE
  - CRISTALIZAR_FALLBACK
  fallback_switch_requires_proven_material_failure: true
  material_action_requires:
  - MASTER_CONTEXT_ACTIVE
  - ACORDAR_DONE
  - CRISTALIZAR_MEASURE_DONE
  - FALLBACK_EVALUATED
  - REQUIRED_CANONICAL_PHASES_SATISFIED
  - NO_MATERIAL_UNKNOWN
  fail_action:
  - BLOCK_MATERIAL_ACTION
  - EMIT_RECEIPT
  - NEXT_CURSOR
hub_capability_fabric:
  reuse_existing_hub: true
  hub_is_container_not_single_app: true
  one_hub_n_capabilities: true
  one_hub_n_apps: true
  one_hub_n_providers: true
  one_hub_n_connectors: true
  one_hub_n_models: true
  second_hub_forbidden: true
  second_authority_forbidden: true
  n_capabilities_implies_n_authorities: false
  n_apps_implies_n_masters: false
  n_providers_implies_n_truths: false
centraldark_router_gemini_context_fabric:
  reuse_existing_centraldark_router: true
  second_router_forbidden: true
  router_is_authority: false
  router_requires_master_context: true
  gemini:
    role: READ_ONLY_SPECIALIZED_READER
