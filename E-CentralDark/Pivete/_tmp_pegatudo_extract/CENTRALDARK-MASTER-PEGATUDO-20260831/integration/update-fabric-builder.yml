schema: CENTRALDARK_UPDATE_FABRIC_BUILDER
schema_version: 1
mode: EXTEND_EXISTING_ONLY
owner: DELTAUTIL
master: CENTRALDARK
activation: CONDITIONAL
ingress:
  channels:
  - DRIVE
  - GITHUB
  - CLI
  - TERMINAL
  - SSH
  - AUTHORIZED_WEBHOOK
  - HUB_UPLOAD
  normalize_to: UPDATE_CANDIDATE
  secret_scrub_required: true
  idempotency_required: true
reconcile:
  flow:
  - MEASURE_SOURCE
  - CLASSIFY
  - DEDUPE
  - REALITY_SCOPE_GATE
  - EXISTING_OWNER_MATCH
  - COMPARE_REVISIONS
  - WRITE_MISSING_DELTA_ONLY
  bidirectional: true
  source_priority_is_not_authority: true
  conflict: STOP_WRITE_AND_RECONCILE
package:
  logical_id: CENTRALDARK-MASTER-PEGATUDO
  update_in_place: true
  new_parallel_package_for_same_lineage: false
  dated_ledger: releases/YYYY-MM-DD/
  current_pointer: releases/CURRENT.yml
  distribution_generated_on_demand: true
builder:
  reuse_existing: true
  role: FACTORY_NOT_AUTHORITY
  outputs:
  - SITE
  - MODULE
  - INFRA_PIECE
  - UI_COMPONENT
  - DISTRIBUTION_PACKAGE
  required_before_promotion:
  - MANIFEST
  - DEPENDENCIES
  - DOCUMENTATION
  - TESTS
  - COUNTERPROOF
  - RECOVERY_OR_ROLLBACK
  - RECEIPT
  deploy_requires_explicit_intent: true
review_blocks:
  fields:
  - date_key
  - human_datetime
  - author_alias
  - source
  - revision_or_head
  - delta_digest
  - proof
  - review_status
  - next_cursor
  many_reviewers_allowed: true
  one_writer_per_conflict_scope: true
documentation_gate:
  required: true
  update_admin_panel: true
  show:
  - WHAT_CHANGED
  - WHY
  - OWNER
  - SOURCE
  - AUTHOR_OR_ALIAS
  - REVISION
  - TESTS
  - RISK
  - RECOVERY
  - NEXT_CURSOR
source_roles:
  GITHUB_LIVE: DESIRED_VERSIONED_TRUTH
  CASA_LIVE: ACTUAL_STATE_SENSOR
  VPS_LIVE: ACTUAL_STATE_SENSOR
  DRIVE_CENTRALDARK: DURABLE_LIBRARY_AND_MIRROR_NOT_CANONICAL
webhook_reconcile:
  role: ACCELERATOR_NOT_SOLE_RECONCILER
  signature_required_when_supported: true
  scope_binding_required: true
  idempotency_required: true
  boot_or_periodic_reconcile_required: true
  event_triggers_measure_not_blind_apply: true
scope_collision_guard:
  enabled: true
  bind_declared_repo_owner_runtime_before_promotion: true
  project_specific_port_or_webhook_becomes_global_truth: false
