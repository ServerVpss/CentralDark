model:
  default: nous/tencent/hy3:free
  provider: centraldark-router
  base_url: http://127.0.0.1:8099/v1
  aliases:
    free-tier-centraldark: nous/tencent/hy3:free
  key_env: CENTRALDARK_ARSENAL_KEY
  api_key: local-no-auth
providers:
  centraldark:
    name: CentralDark Gateway
    base_url: https://api.centralldark.com/v1
    key_env: CENTRALDARK_ARSENAL_KEY
    default_model: arsenal-router
  centraldark-router:
    base_url: http://127.0.0.1:8099/v1
    api_key: local-no-auth
    default_model: auto
    extra_body:
      stream: false
    models:
      - auto
      - openai/zai-org/glm-5.2
      - claude-code
      - hermes/hermes
      - nous/tencent/hy3:free
      - nous/upstage/solar-pro4:free
      - nous/meituan/longcat-2.0:free
      - nous/inclusionai/ling-3.0-flash-fin:free
      - nous/poolside/laguna-s-2.1:free
      - nous/stepfun/step-3.7-flash:free
      - nous/poolside/laguna-xs-2.1:free
fallback_providers: []
terminal:
  cwd: E:\CentralDark\workspace
  font_family: ''
web:
  backend: firecrawl
browser:
  cloud_provider: browser-use
display:
  timestamps: true
  skin: mono
  runtime_footer:
    enabled: true
tts:
  provider: edge
  edge:
    voice: pt-BR-FranciscaNeural
  openai:
    voice: ash
  gemini:
    voice: Kore
  xai:
    language: pt
stt:
  provider: local
  local:
    model: base
  openai:
    model: gpt-4o-mini-transcribe
voice:
  auto_tts: true
wake_word:
  enabled: true
memory:
  memory_char_limit: 8200
  user_char_limit: 2375
moa:
  presets:
    default:
      reference_models:
        - provider: openai-codex
          model: gpt-5.5
          enabled: true
        - provider: openai-api
          model: openai/gpt-4
          enabled: true
        - provider: openrouter
          model: anthropic/claude-opus-4.8
          enabled: true
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: openai-codex
      model: gpt-5.5
      enabled: true
    - provider: openai-api
      model: openai/gpt-4
      enabled: true
    - provider: openrouter
      model: anthropic/claude-opus-4.8
      enabled: true
  aggregator:
    provider: openrouter
    model: anthropic/claude-opus-4.8
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  enabled: true
timezone: Brazil/DeNoronha
command_allowlist:
  - git force push short flag (rewrites remote history)
  - script execution via -e/-c flag
security:
  redact_secrets: true
kanban:
  orchestrator_profile: ''
  default_assignee: default
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
    openclaw_residue_cleanup: true
_config_version: 33
image_gen:
  use_gateway: true
platform_toolsets:
  cli:
    - bfl
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
known_plugin_toolsets:
  cli:
    - spotify
known_builtin_toolsets:
  cli:
    - bfl
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
