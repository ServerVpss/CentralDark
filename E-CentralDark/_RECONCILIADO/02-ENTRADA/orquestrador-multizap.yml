name: Orquestrador MultiZap

on:
  workflow_dispatch:
    inputs:
      tarefa:
        description: 'Tarefa inicial do auto-orquestrador'
        required: true
        default: '070-consolidar-qr-temporario'
      max_steps:
        description: 'Limite de etapas automáticas'
        required: true
        default: '10'

permissions:
  contents: read
  actions: read

jobs:
  orquestrar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Executar auto-orquestrador na VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST_LOVABLE }}
          username: ${{ secrets.VPS_USER_LOVABLE }}
          key: ${{ secrets.VPS_SSH_KEY_LOVABLE }}
          script: |
            set -euo pipefail

            TAREFA="${{ github.event.inputs.tarefa }}"
            MAX_STEPS_INPUT="${{ github.event.inputs.max_steps }}"
            BASE="/root/Multizap"
            REPO="$BASE/apps/clone-deck"

            echo "=== ORQUESTRADOR MULTIZAP WORKFLOW ==="
            echo "Tarefa inicial: $TAREFA"
            echo "Max steps: $MAX_STEPS_INPUT"

            cd "$REPO"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            if [ ! -f "scripts/ia/auto-orquestrador.sh" ]; then
              echo "FALHA: scripts/ia/auto-orquestrador.sh nao encontrado"
              exit 1
            fi

            chmod +x scripts/ia/auto-orquestrador.sh

            echo "Executando auto-orquestrador..."
            MAX_STEPS="$MAX_STEPS_INPUT" bash scripts/ia/auto-orquestrador.sh "$TAREFA"

            echo ""
            echo "=== ULTIMO RESUMO DO AUTO-ORQUESTRADOR ==="
            LAST_SUMMARY="$(find "$BASE/revisoes" -maxdepth 3 -type f -path '*/auto-orquestrador/resumo.md' | sort | tail -n 1 || true)"

            if [ -n "$LAST_SUMMARY" ] && [ -f "$LAST_SUMMARY" ]; then
              echo "Resumo: $LAST_SUMMARY"
              sed -n '1,180p' "$LAST_SUMMARY"
            else
              echo "ATENCAO: resumo do auto-orquestrador nao encontrado"
              exit 1
            fi
