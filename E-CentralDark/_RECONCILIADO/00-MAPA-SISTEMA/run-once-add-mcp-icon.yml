name: Run once - add MCP icon

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-once-add-mcp-icon.yml

permissions:
  contents: write

concurrency:
  group: run-once-add-mcp-icon
  cancel-in-progress: false

jobs:
  add-mcp-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add CentralDark MCP icon
