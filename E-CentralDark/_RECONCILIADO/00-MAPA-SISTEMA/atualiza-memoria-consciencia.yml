name: Atualiza memória do agente (estado atual)

on:
  schedule:
    - cron: '0 */6 * * *'   # a cada 6 horas
  workflow_dispatch:         # botão pra rodar manual

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  atualiza-estado:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}


      - name: Reconstruir chave SSH da VPS (mesmo método do setup-vps-ssh.sh)
        env:
          VPS_SSH_KEY_LOVABLE: ${{ secrets.VPS_SSH_KEY_LOVABLE }}
        run: |
          set -e
          if [ -z "$VPS_SSH_KEY_LOVABLE" ]; then
            echo "::error::secret VPS_SSH_KEY_LOVABLE vazia"
            exit 1
          fi
          python3 - <<'PY'
          import os, re, base64, textwrap
          raw = os.environ["VPS_SSH_KEY_LOVABLE"]
          s = raw.replace("\\n", "\n")
          if "BEGIN" in s and s.count("\n") > 3:
              key = s.strip() + "\n"
          else:
              m = re.search(r"(-----BEGIN [^-]+-----)(.*?)(-----END [^-]+-----)", s, re.S)
              if m:
                  header, body, footer = m.group(1), m.group(2), m.group(3)
                  body = re.sub(r"\s+", "", body)
                  wrapped = "\n".join(textwrap.wrap(body, 70))
                  key = f"{header}\n{wrapped}\n{footer}\n"
              else:
                  b64 = re.sub(r"\s+", "", s)
                  decoded = base64.b64decode(b64).decode("utf-8")
                  key = decoded.strip() + "\n"
          with open("/tmp/vps_key", "w") as f:
              f.write(key)
          os.chmod("/tmp/vps_key", 0o600)
          print(f"chave reconstruída: {len(key)} bytes, {key.count(chr(10))} linhas")
          PY
          # valida formato sem expor a chave
          ssh-keygen -y -f /tmp/vps_key >/dev/null
          echo "chave SSH válida"
          mkdir -p ~/.ssh
          ssh-keyscan -H 89.117.78.124 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Coletar estado da VPS
        id: coleta
        run: |
          set +e
          SSH_OPTS="-i /tmp/vps_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          PM2_RAW=$(ssh $SSH_OPTS root@89.117.78.124 "pm2 jlist 2>/dev/null" || echo "[]")
          echo "$PM2_RAW" > /tmp/pm2.json

          DATA=$(date -u -d '-3 hours' +"%Y-%m-%d %H:%M BRT")

          ONLINE=$(echo "$PM2_RAW" | python3 -c "import sys,json; d=json.load(sys.stdin); print('\n'.join(f'- \`{p[\"name\"]}\`' for p in d if p.get('pm2_env',{}).get('status')=='online'))" 2>/dev/null || echo "(falha ao ler PM2)")
          PARADOS=$(echo "$PM2_RAW" | python3 -c "import sys,json; d=json.load(sys.stdin); print('\n'.join(f'- \`{p[\"name\"]}\`' for p in d if p.get('pm2_env',{}).get('status')!='online'))" 2>/dev/null || echo "(nenhum)")

          {
            echo "# 09 — Estado atual (snapshot vivo)"
            echo ""
            echo "> Atualizado automaticamente pelo workflow \`atualiza-memoria-consciencia.yml\`."
            echo ""
            echo "**Última atualização:** $DATA"
            echo ""
            echo "## Serviços PM2"
            echo ""
            echo "🟢 Online:"
            echo "$ONLINE"
            echo ""
            echo "🔴 Parado / outro estado:"
            echo "$PARADOS"
            echo ""
            echo "## Pendências"
            echo ""
            echo "Ver lista completa em \`docs/PENDENCIAS.md\`."
            echo ""
            echo "## URLs importantes"
            echo ""
            echo "- App preview: https://crm-bot.lovable.app"
            echo "- MCP: https://mcp.centralldark.com (health: \`/health\`)"
            echo "- Repo: https://github.com/segredounlock/clone-deck"
          } > docs/CONSCIENCIA/09-ESTADO-ATUAL.md

      - name: Commit e push se mudou
        run: |
          git config user.name "SegredoDev"
          git config user.email "segredounlock@users.noreply.github.com"
          if ! git diff --quiet docs/CONSCIENCIA/09-ESTADO-ATUAL.md; then
            git add docs/CONSCIENCIA/09-ESTADO-ATUAL.md
            git commit -m "chore(agente): atualiza estado da VPS

          Co-authored-by: SegredoDev <segredounlock@users.noreply.github.com>"
            git push
          else
            echo "Nada mudou."
          fi
