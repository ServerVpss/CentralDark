name: Deploy fallback (so roda se o principal falhar)

# Dispara APENAS quando "Deploy Clone Deck" termina com falha.
# Assim a aba Actions nao mostra dois deploys verdes em paralelo
# parecendo duplicado. Camada 3 (cron na VPS) continua como rede final.

on:
  workflow_run:
    workflows: ["Deploy Clone Deck"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fallback
  cancel-in-progress: false

jobs:
  fallback:
    # so executa se o deploy principal falhou (ou foi cancelado/timed_out)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resumo do disparo
        run: |
          echo "### Deploy fallback acionado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Motivo: deploy principal terminou com **${{ github.event.workflow_run.conclusion }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit alvo: \`${{ github.event.workflow_run.head_sha || github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vou rodar SSH idempotente na VPS pra garantir o deploy." >> "$GITHUB_STEP_SUMMARY"

      - name: Reconstruir chave SSH da VPS
        env:
          VPS_SSH_KEY_LOVABLE: ${{ secrets.VPS_SSH_KEY_LOVABLE }}
        run: |
          set -e
          if [ -z "$VPS_SSH_KEY_LOVABLE" ]; then
            echo "::error::secret VPS_SSH_KEY_LOVABLE vazia"
            exit 1
          fi
          python3 - <<'PY'
          import os, re, base64, textwrap
          raw = os.environ["VPS_SSH_KEY_LOVABLE"]
          s = raw.replace("\\n", "\n")
          if "BEGIN" in s and s.count("\n") > 3:
              key = s.strip() + "\n"
          else:
              m = re.search(r"(-----BEGIN [^-]+-----)(.*?)(-----END [^-]+-----)", s, re.S)
              if m:
                  header, body, footer = m.group(1), m.group(2), m.group(3)
                  body = re.sub(r"\s+", "", body)
                  wrapped = "\n".join(textwrap.wrap(body, 70))
                  key = f"{header}\n{wrapped}\n{footer}\n"
              else:
                  b64 = re.sub(r"\s+", "", s)
                  decoded = base64.b64decode(b64).decode("utf-8")
                  key = decoded.strip() + "\n"
          with open("/tmp/vps_key", "w") as f:
              f.write(key)
          os.chmod("/tmp/vps_key", 0o600)
          print(f"chave reconstruída: {len(key)} bytes, {key.count(chr(10))} linhas")
          PY
          ssh-keygen -y -f /tmp/vps_key >/dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -H 89.117.78.124 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Conferir saude do webhook
        id: check
        env:
          ESPERADO: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set +e
          HEALTH=$(curl -fsS --max-time 5 https://hook.multizap.dev/health || echo "")
          echo "health=$HEALTH"
          echo "rodar_ssh=true" >> "$GITHUB_OUTPUT"

      - name: Rodar pull idempotente na VPS (fallback)
        if: steps.check.outputs.rodar_ssh == 'true'
        run: |
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR root@89.117.78.124 \
            'bash /root/Multizap/apps/clone-deck/scripts/clone-deck-gh-pull-with-deploy.sh' \
            | sed -E 's/(token|password|authorization|apikey|api_key|secret|BOT_TOKEN)[^ ,"]+/\1***OCULTO***/Ig'

      - name: Validar que o commit chegou na VPS
        if: steps.check.outputs.rodar_ssh == 'true'
        env:
          ESPERADO: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          REMOTO=$(ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR root@89.117.78.124 \
            'cd /root/Multizap/apps/clone-deck && git rev-parse HEAD')
          echo "esperado: $ESPERADO"
          echo "vps     : $REMOTO"
          {
            echo ""
            echo "### Resultado"
            echo ""
            echo "- esperado: \`$ESPERADO\`"
            echo "- vps    : \`$REMOTO\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$REMOTO" != "$ESPERADO" ]; then
            echo "::warning::VPS em commit diferente do esperado. Camada 3 (cron) cobre em ate 1 min."
            echo "- status : ⚠️ divergente — cron VPS cobre em ate 1 min" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ VPS sincronizada no commit correto"
            echo "- status : ✅ VPS sincronizada (deploy unico efetivo)" >> "$GITHUB_STEP_SUMMARY"
          fi
