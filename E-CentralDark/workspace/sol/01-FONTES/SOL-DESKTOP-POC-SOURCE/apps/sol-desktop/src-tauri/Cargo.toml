[package]
name = "sol-desktop"
version = "0.1.0"
description = "SOL Voice-First desktop proof for CentralDark"
authors = ["SEGREDO/CHEFE + CentralDark"]
edition = "2021"

[lib]
name = "sol_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
