<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lab Jarvis v3 — Babylon.js WebGPU</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#020806;color:#d1fae5;font-family:ui-monospace,Menlo,monospace;overflow:hidden}
  #canvas{position:fixed;inset:0;width:100%;height:100%;outline:none;touch-action:none}
  #hud{position:fixed;top:12px;left:12px;padding:10px 14px;border:1px solid #10b98155;background:#052e2b99;
       border-radius:8px;font-size:12px;letter-spacing:.12em;backdrop-filter:blur(6px);z-index:10}
  #hud b{color:#10b981}
  #tag{position:fixed;top:12px;right:12px;padding:6px 12px;border:1px solid #10b98155;background:#052e2b99;
       border-radius:999px;font-size:11px;letter-spacing:.2em;color:#6ee7b7;z-index:10}
  #back{position:fixed;bottom:12px;left:12px;color:#6ee7b7;text-decoration:none;font-size:12px;letter-spacing:.15em;
        border:1px solid #10b98155;padding:6px 12px;border-radius:6px;background:#052e2b99;z-index:10}
  #back:hover{color:#10b981}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <div>L A B · J A R V I S · <b>V3</b></div>
  <div style="margin-top:6px;opacity:.7">Engine: <b id="engine">detectando…</b></div>
  <div style="opacity:.7">Nós: <b id="nodes">0</b> · FPS: <b id="fps">0</b></div>
</div>
<div id="tag">BABYLON · PBR · THIN INSTANCES</div>
<a id="back" href="/jarvis-lab/comparador.html">◂ COMPARADOR</a>

<script>
(async () => {
  const canvas = document.getElementById('canvas');
  let engine, engineLabel = 'WebGL2';

  // Tenta WebGPU nativo do Babylon
  if (navigator.gpu && BABYLON.WebGPUEngine) {
    try {
      engine = new BABYLON.WebGPUEngine(canvas, { antialias:true });
      await engine.initAsync();
      engineLabel = 'WebGPU';
    } catch(e){ console.warn('WebGPU falhou, fallback WebGL', e); }
  }
  if (!engine) engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:false, stencil:false });
  document.getElementById('engine').textContent = engineLabel;

  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.008, 0.031, 0.024, 1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.004;
  scene.fogColor = new BABYLON.Color3(0.008, 0.031, 0.024);

  const camera = new BABYLON.ArcRotateCamera('cam', Math.PI/2, Math.PI/2.5, 260, BABYLON.Vector3.Zero(), scene);
  camera.attachControl(canvas, true);
  camera.wheelPrecision = 2;
  camera.lowerRadiusLimit = 30;

  const hemi = new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0,1,0), scene);
  hemi.intensity = 0.4; hemi.diffuse = new BABYLON.Color3(0.06, 0.72, 0.5);
  const dir = new BABYLON.DirectionalLight('d', new BABYLON.Vector3(-1,-2,-1), scene);
  dir.intensity = 1.2; dir.diffuse = new BABYLON.Color3(0.2, 0.9, 0.6);

  // Glow layer (o "efeito Jarvis" nativo)
  const glow = new BABYLON.GlowLayer('glow', scene, { mainTextureFixedSize: 512, blurKernelSize: 32 });
  glow.intensity = 1.3;

  // Starfield
  const stars = BABYLON.MeshBuilder.CreatePoints ? null : null; // fallback
  const starMesh = new BABYLON.PointsCloudSystem('stars', 1, scene);
  starMesh.addPoints(2500, (p)=>{
    p.position = new BABYLON.Vector3((Math.random()-0.5)*2000,(Math.random()-0.5)*2000,(Math.random()-0.5)*2000);
    p.color = new BABYLON.Color4(0.06,0.72,0.5, 0.7);
  });
  await starMesh.buildMeshAsync();

  // Dados
  async function loadData(){
    try {
      const r = await fetch('https://grafo.centralldark.com/api/graph', {mode:'cors'});
      const ct = r.headers.get('content-type') || '';
      if (r.ok && ct.includes('application/json')) return await r.json();
      console.warn('[lab-v3] API devolveu', r.status, ct, '→ usando mock');
    } catch(e){ console.warn('[lab-v3] fetch falhou → mock', e.message); }
    const N = 400;
    const nodes = Array.from({length:N}, (_,i)=>({id:'n'+i}));
    const links = [];
    for (let i=1;i<N;i++) links.push({source:'n'+i, target:'n'+((Math.random()*i)|0)});
    return { nodes, links };
  }
  const data = await loadData();
  document.getElementById('nodes').textContent = data.nodes.length;

  // Nó base + PBR
  const nodeBase = BABYLON.MeshBuilder.CreateSphere('node', { diameter: 2.4, segments: 12 }, scene);
  const pbr = new BABYLON.PBRMaterial('pbr', scene);
  pbr.albedoColor = new BABYLON.Color3(0.06, 0.72, 0.5);
  pbr.emissiveColor = new BABYLON.Color3(0.06, 0.72, 0.5);
  pbr.emissiveIntensity = 1.5;
  pbr.metallic = 0.85;
  pbr.roughness = 0.25;
  nodeBase.material = pbr;

  // Posições iniciais + Thin Instances (1 draw call pra tudo)
  const N = data.nodes.length;
  const nodes = data.nodes.map(()=>({
    x:(Math.random()-0.5)*200, y:(Math.random()-0.5)*200, z:(Math.random()-0.5)*200,
    vx:0, vy:0, vz:0
  }));
  const matrices = new Float32Array(16*N);
  for (let i=0;i<N;i++){
    const m = BABYLON.Matrix.Translation(nodes[i].x, nodes[i].y, nodes[i].z);
    m.copyToArray(matrices, i*16);
  }
  nodeBase.thinInstanceSetBuffer('matrix', matrices, 16, false);

  // Links (LineSystem)
  const linkPairs = data.links.map(l => {
    const s = data.nodes.findIndex(n=>n.id===l.source);
    const t = data.nodes.findIndex(n=>n.id===l.target);
    return [s, t];
  }).filter(([s,t]) => s>=0 && t>=0);
  const lineArr = linkPairs.map(([s,t]) => [
    new BABYLON.Vector3(nodes[s].x, nodes[s].y, nodes[s].z),
    new BABYLON.Vector3(nodes[t].x, nodes[t].y, nodes[t].z)
  ]);
  let lines = BABYLON.MeshBuilder.CreateLineSystem('links', { lines: lineArr, updatable: true }, scene);
  lines.color = new BABYLON.Color3(0.06, 0.72, 0.5);
  lines.alpha = 0.3;

  // Layout de força (leve, roda em setInterval)
  const REPULSION=6, SPRING=0.02, DAMPING=0.88, CENTER=0.001;
  function stepLayout(){
    for (let i=0;i<N;i++){
      const a = nodes[i];
      for (let k=0;k<6;k++){
        const j = (i+1+((Math.random()*N)|0))%N;
        const b = nodes[j];
        const dx=a.x-b.x, dy=a.y-b.y, dz=a.z-b.z;
        const d2 = dx*dx+dy*dy+dz*dz+0.1;
        const f = REPULSION/d2;
        a.vx+=dx*f; a.vy+=dy*f; a.vz+=dz*f;
      }
      a.vx-=a.x*CENTER; a.vy-=a.y*CENTER; a.vz-=a.z*CENTER;
    }
    for (const [s,t] of linkPairs){
      const a=nodes[s], b=nodes[t];
      const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
      a.vx+=dx*SPRING; a.vy+=dy*SPRING; a.vz+=dz*SPRING;
      b.vx-=dx*SPRING; b.vy-=dy*SPRING; b.vz-=dz*SPRING;
    }
    for (let i=0;i<N;i++){
      const n=nodes[i];
      n.vx*=DAMPING; n.vy*=DAMPING; n.vz*=DAMPING;
      n.x+=n.vx; n.y+=n.vy; n.z+=n.vz;
      const m = BABYLON.Matrix.Translation(n.x, n.y, n.z);
      m.copyToArray(matrices, i*16);
    }
    nodeBase.thinInstanceBufferUpdated('matrix');

    // update lines
    for (let i=0;i<linkPairs.length;i++){
      const [s,t] = linkPairs[i];
      lineArr[i][0].set(nodes[s].x, nodes[s].y, nodes[s].z);
      lineArr[i][1].set(nodes[t].x, nodes[t].y, nodes[t].z);
    }
    lines = BABYLON.MeshBuilder.CreateLineSystem('links', { lines: lineArr, instance: lines }, scene);
  }
  setInterval(stepLayout, 40);

  // FPS
  setInterval(()=>{ document.getElementById('fps').textContent = engine.getFps().toFixed(0); }, 500);

  engine.runRenderLoop(()=> scene.render());
  addEventListener('resize', ()=> engine.resize());
})();
</script>
</body>
</html>
