<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<title>LAB · JARVIS · V4 — Cinematic</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html,body{margin:0;height:100%;background:#000;color:#7ff2c8;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;overflow:hidden}
  #c{position:fixed;inset:0;display:block}
  .hud{position:fixed;top:16px;left:16px;padding:10px 14px;background:rgba(6,20,17,.55);
       border:1px solid rgba(52,211,153,.35);border-radius:10px;
       backdrop-filter:blur(8px);font-size:12px;letter-spacing:.5px;z-index:10;
       box-shadow:0 0 40px rgba(16,185,129,.15) inset}
  .hud h1{margin:0 0 6px;font-size:12px;letter-spacing:6px;color:#a7f3d0;font-weight:500}
  .hud b{color:#34d399}
  .hud .row{opacity:.85}
  .badge{position:fixed;bottom:14px;left:16px;font-size:10px;letter-spacing:4px;color:#0f766e;z-index:10}
  .center-tag{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
              font-size:10px;letter-spacing:8px;color:rgba(167,243,208,.25);
              pointer-events:none;z-index:5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <h1>L A B · J A R V I S · <b>V4</b></h1>
  <div class="row">Engine: <b id="eng">Three.js · Bloom · Depth</b></div>
  <div class="row">Nós: <b id="nn">—</b> · Links: <b id="ll">—</b> · FPS: <b id="fps">—</b></div>
  <div class="row">Status: <b id="st">carregando grafo…</b></div>
</div>
<div class="center-tag">CENTRALDARK · GRAPH CORE</div>
<div class="badge">MOUSE: ORBITA · SCROLL: ZOOM</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $=id=>document.getElementById(id);
const canvas=$('c');

// ---------- Scene ----------
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x02110d, 0.0055);

const camera=new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 4000);
camera.position.set(0,80,320);

const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x02110d,1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=.06;
controls.autoRotate=true; controls.autoRotateSpeed=.35;
controls.minDistance=60; controls.maxDistance=900;

// bloom
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 1.2, 0.85, 0.15);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

// ---------- Ambient starfield ----------
{
  const g=new THREE.BufferGeometry();
  const N=1500, p=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=800+Math.random()*600, t=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(t);
    p[i*3+1]=r*Math.sin(ph)*Math.sin(t);
    p[i*3+2]=r*Math.cos(ph);
  }
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x0d5c47,size:1.2,transparent:true,opacity:.55})));
}

// ---------- Data ----------
const ENDPOINTS=[
  'https://grafo.centralldark.com/api/graph',
  'https://kagejpghnwdfymddwxuf.supabase.co/functions/v1/grafo-proxy'
];
async function loadGraph(){
  for(const u of ENDPOINTS){
    try{ const r=await fetch(u); if(r.ok) return await r.json(); }catch(e){}
  }
  // fallback sintético elegante
  const nodes=[], links=[];
  for(let i=0;i<400;i++) nodes.push({id:'n'+i});
  for(let i=1;i<400;i++) links.push({source:'n'+i,target:'n'+Math.floor(Math.random()*i)});
  return {nodes,links};
}

// ---------- Build ----------
$('st').textContent='montando cena…';
const data=await loadGraph();
const nodes=data.nodes||[]; const rawLinks=data.links||data.edges||[];
$('nn').textContent=nodes.length; $('ll').textContent=rawLinks.length;

// Fruchterman-Reingold 3D leve (poucas iterações)
const idx=new Map();
nodes.forEach((n,i)=>{ idx.set(n.id??n.name??i,i);
  n.x=(Math.random()-.5)*300; n.y=(Math.random()-.5)*200; n.z=(Math.random()-.5)*300;
  n.vx=0; n.vy=0; n.vz=0;
});
const edges=[];
for(const l of rawLinks){
  const a=idx.get(l.source?.id ?? l.source), b=idx.get(l.target?.id ?? l.target);
  if(a!=null && b!=null && a!==b) edges.push([a,b]);
}
// degrees
const deg=new Array(nodes.length).fill(0);
edges.forEach(([a,b])=>{deg[a]++;deg[b]++;});

// simulate
const AREA=350, k=Math.cbrt(AREA*AREA*AREA/Math.max(1,nodes.length))*0.9;
for(let it=0; it<60; it++){
  const t=1-it/60;
  // repulsion (O(n^2) — ok até ~1500)
  for(let i=0;i<nodes.length;i++){
    let fx=0,fy=0,fz=0;
    for(let j=0;j<nodes.length;j++){
      if(i===j)continue;
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y, dz=nodes[i].z-nodes[j].z;
      let d2=dx*dx+dy*dy+dz*dz; if(d2<0.01)d2=0.01;
      const f=(k*k)/d2;
      fx+=dx*f; fy+=dy*f; fz+=dz*f;
    }
    nodes[i].vx=fx; nodes[i].vy=fy; nodes[i].vz=fz;
  }
  // attraction
  for(const [a,b] of edges){
    const dx=nodes[a].x-nodes[b].x, dy=nodes[a].y-nodes[b].y, dz=nodes[a].z-nodes[b].z;
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.01;
    const f=(d*d)/k;
    const ux=dx/d, uy=dy/d, uz=dz/d;
    nodes[a].vx-=ux*f; nodes[a].vy-=uy*f; nodes[a].vz-=uz*f;
    nodes[b].vx+=ux*f; nodes[b].vy+=uy*f; nodes[b].vz+=uz*f;
  }
  const max=20*t+2;
  for(const n of nodes){
    const s=Math.sqrt(n.vx*n.vx+n.vy*n.vy+n.vz*n.vz)||1;
    const lim=Math.min(s,max);
    n.x+=n.vx/s*lim; n.y+=n.vy/s*lim; n.z+=n.vz/s*lim;
  }
}

// ---------- Nodes as instanced glowing spheres ----------
const sphereGeo=new THREE.SphereGeometry(1,12,12);
const nodeMat=new THREE.MeshBasicMaterial({color:0x34d399});
const inst=new THREE.InstancedMesh(sphereGeo,nodeMat,nodes.length);
const m=new THREE.Matrix4(); const col=new THREE.Color();
nodes.forEach((n,i)=>{
  const s=1.2+Math.min(deg[i]||0,20)*0.35;
  m.compose(new THREE.Vector3(n.x,n.y,n.z), new THREE.Quaternion(), new THREE.Vector3(s,s,s));
  inst.setMatrixAt(i,m);
  const hue=0.42 + (deg[i]||0)*0.004;
  col.setHSL(hue,0.75,0.55);
  inst.setColorAt(i,col);
});
inst.instanceMatrix.needsUpdate=true;
if(inst.instanceColor) inst.instanceColor.needsUpdate=true;
scene.add(inst);

// halo sprites for extra glow
const spriteTex=(()=>{
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d'); const grd=g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,'rgba(167,243,208,1)');
  grd.addColorStop(0.25,'rgba(52,211,153,.55)');
  grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();
const haloMat=new THREE.SpriteMaterial({map:spriteTex,color:0x34d399,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.7});
nodes.forEach((n,i)=>{
  const sp=new THREE.Sprite(haloMat);
  const s=6+Math.min(deg[i]||0,25)*1.1;
  sp.scale.set(s,s,1);
  sp.position.set(n.x,n.y,n.z);
  scene.add(sp);
});

// ---------- Edges as thin lines with additive blending ----------
{
  const pos=new Float32Array(edges.length*2*3);
  edges.forEach(([a,b],i)=>{
    pos[i*6]=nodes[a].x; pos[i*6+1]=nodes[a].y; pos[i*6+2]=nodes[a].z;
    pos[i*6+3]=nodes[b].x; pos[i*6+4]=nodes[b].y; pos[i*6+5]=nodes[b].z;
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.LineBasicMaterial({color:0x10b981,transparent:true,opacity:.28,blending:THREE.AdditiveBlending,depthWrite:false});
  scene.add(new THREE.LineSegments(g,mat));
}

// ---------- Flying photons along edges ----------
const PH=Math.min(400,edges.length);
const photonGeo=new THREE.BufferGeometry();
const photonPos=new Float32Array(PH*3);
photonGeo.setAttribute('position',new THREE.BufferAttribute(photonPos,3));
const photonMat=new THREE.PointsMaterial({
  size:6, map:spriteTex, transparent:true, depthWrite:false,
  blending:THREE.AdditiveBlending, color:0xa7f3d0, sizeAttenuation:true
});
const photons=new THREE.Points(photonGeo,photonMat);
scene.add(photons);
const ph=[];
for(let i=0;i<PH;i++){
  const e=edges[Math.floor(Math.random()*edges.length)];
  ph.push({a:e[0],b:e[1],t:Math.random(),sp:0.002+Math.random()*0.006});
}

// center core
{
  const core=new THREE.Mesh(new THREE.SphereGeometry(4,32,32),
    new THREE.MeshBasicMaterial({color:0xa7f3d0}));
  scene.add(core);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:spriteTex,color:0x34d399,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:.9}));
  halo.scale.set(60,60,1); scene.add(halo);
}

$('st').textContent='online';

// ---------- Loop ----------
let last=performance.now(), frames=0, ftimer=0;
function tick(now){
  const dt=(now-last)/1000; last=now; frames++; ftimer+=dt;
  if(ftimer>=0.5){ $('fps').textContent=Math.round(frames/ftimer); frames=0; ftimer=0; }

  // photons
  for(let i=0;i<PH;i++){
    const p=ph[i]; p.t+=p.sp;
    if(p.t>=1){
      const e=edges[Math.floor(Math.random()*edges.length)];
      p.a=e[0]; p.b=e[1]; p.t=0; p.sp=0.002+Math.random()*0.006;
    }
    const A=nodes[p.a], B=nodes[p.b];
    photonPos[i*3]  = A.x + (B.x-A.x)*p.t;
    photonPos[i*3+1]= A.y + (B.y-A.y)*p.t;
    photonPos[i*3+2]= A.z + (B.z-A.z)*p.t;
  }
  photonGeo.attributes.position.needsUpdate=true;

  controls.update();
  composer.render();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
