<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lab Jarvis v2 — WebGPU + Worker</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#020806;color:#d1fae5;font-family:ui-monospace,Menlo,monospace;overflow:hidden}
  #app{position:fixed;inset:0}
  #hud{position:fixed;top:12px;left:12px;padding:10px 14px;border:1px solid #10b98155;background:#052e2b99;
       border-radius:8px;font-size:12px;letter-spacing:.12em;backdrop-filter:blur(6px);z-index:10}
  #hud b{color:#10b981}
  #tag{position:fixed;top:12px;right:12px;padding:6px 12px;border:1px solid #10b98155;background:#052e2b99;
       border-radius:999px;font-size:11px;letter-spacing:.2em;color:#6ee7b7;z-index:10}
  #back{position:fixed;bottom:12px;left:12px;color:#6ee7b7;text-decoration:none;font-size:12px;letter-spacing:.15em;
        border:1px solid #10b98155;padding:6px 12px;border-radius:6px;background:#052e2b99;z-index:10}
  #back:hover{color:#10b981}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div>L A B · J A R V I S · <b>V2</b></div>
  <div style="margin-top:6px;opacity:.7">Renderer: <b id="renderer">detectando…</b></div>
  <div style="opacity:.7">Nós: <b id="nodes">0</b> · FPS: <b id="fps">0</b></div>
</div>
<div id="tag">WEBGPU · WORKER · INSTANCING</div>
<a id="back" href="/jarvis-lab/comparador.html">◂ COMPARADOR</a>

<!-- Worker de layout de força (roda fora da main thread) -->
<script id="force-worker" type="javascript/worker">
  // Layout de força simplificado (evita CDN pesado no worker).
  // Aproximação O(n) com repulsão em grade + molas nos links.
  let nodes=[], links=[], positions=null;
  const REPULSION=6, SPRING=0.02, DAMPING=0.88, CENTER=0.001;

  self.onmessage = (e) => {
    const msg = e.data;
    if (msg.type === 'init') {
      nodes = msg.nodes.map((n,i)=>({id:n.id,x:(Math.random()-0.5)*200,y:(Math.random()-0.5)*200,z:(Math.random()-0.5)*200,vx:0,vy:0,vz:0}));
      links = msg.links.map(l=>({s:nodes.findIndex(n=>n.id===l.source),t:nodes.findIndex(n=>n.id===l.target)}));
      tick();
    }
  };

  function tick(){
    // repulsão par-a-par amostrada (evita O(n²))
    for (let i=0;i<nodes.length;i++){
      const a=nodes[i];
      for (let k=0;k<8;k++){
        const j=(i+1+((Math.random()*nodes.length)|0))%nodes.length;
        const b=nodes[j];
        const dx=a.x-b.x, dy=a.y-b.y, dz=a.z-b.z;
        const d2=dx*dx+dy*dy+dz*dz+0.1;
        const f=REPULSION/d2;
        a.vx+=dx*f; a.vy+=dy*f; a.vz+=dz*f;
      }
      // gravidade central
      a.vx-=a.x*CENTER; a.vy-=a.y*CENTER; a.vz-=a.z*CENTER;
    }
    // molas nos links
    for (const l of links){
      const a=nodes[l.s], b=nodes[l.t]; if(!a||!b) continue;
      const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
      a.vx+=dx*SPRING; a.vy+=dy*SPRING; a.vz+=dz*SPRING;
      b.vx-=dx*SPRING; b.vy-=dy*SPRING; b.vz-=dz*SPRING;
    }
    // integra
    const buf=new Float32Array(nodes.length*3);
    for (let i=0;i<nodes.length;i++){
      const n=nodes[i];
      n.vx*=DAMPING; n.vy*=DAMPING; n.vz*=DAMPING;
      n.x+=n.vx; n.y+=n.vy; n.z+=n.vz;
      buf[i*3]=n.x; buf[i*3+1]=n.y; buf[i*3+2]=n.z;
    }
    self.postMessage({type:'positions', buf}, [buf.buffer]);
    setTimeout(tick, 33);
  }
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.169.0",
    "three/addons/": "https://esm.sh/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ── Detecta WebGPU ─────────────────────────────────────────
let rendererLabel = 'WebGL2';
let renderer;
try {
  if (navigator.gpu) {
    const { default: WebGPURenderer } = await import('https://esm.sh/three@0.169.0/examples/jsm/renderers/webgpu/WebGPURenderer.js');
    const adapter = await navigator.gpu.requestAdapter();
    if (adapter) {
      renderer = new WebGPURenderer({ antialias: true });
      await renderer.init();
      rendererLabel = 'WebGPU';
    }
  }
} catch(e){ console.warn('WebGPU indisponível, caindo pra WebGL', e); }
if (!renderer) renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x020806, 1);
document.getElementById('app').appendChild(renderer.domElement);
document.getElementById('renderer').textContent = rendererLabel;

// ── Cena ───────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020806, 0.0025);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 3000);
camera.position.set(0, 60, 260);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// starfield
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(3000*3);
for (let i=0;i<3000;i++){ starPos[i*3]=(Math.random()-0.5)*2000; starPos[i*3+1]=(Math.random()-0.5)*2000; starPos[i*3+2]=(Math.random()-0.5)*2000;}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0x10b981, size:0.6, transparent:true, opacity:0.6})));

// luz
scene.add(new THREE.AmbientLight(0x10b981, 0.35));
const dl = new THREE.DirectionalLight(0x34d399, 1.2); dl.position.set(50,80,50); scene.add(dl);

// ── Dados (mock) ───────────────────────────────────────────
async function loadData(){
  try {
    const r = await fetch('https://grafo.centralldark.com/api/graph', {mode:'cors'});
    const ct = r.headers.get('content-type') || '';
    if (r.ok && ct.includes('application/json')) return await r.json();
    console.warn('[lab-v2] API devolveu', r.status, ct, '→ usando mock');
  } catch(e){ console.warn('[lab-v2] fetch falhou → mock', e.message); }
  // fallback mock (sempre funciona, sem token, sem CORS)
  const N = 400;
  const nodes = Array.from({length:N}, (_,i)=>({id:'n'+i, group:i%6}));
  const links = [];
  for (let i=1;i<N;i++) links.push({source:'n'+i, target:'n'+((Math.random()*i)|0)});
  return { nodes, links };
}
const data = await loadData();
document.getElementById('nodes').textContent = data.nodes.length;

// ── Instancing dos nós ─────────────────────────────────────
const nodeGeo = new THREE.SphereGeometry(1.2, 12, 12);
const nodeMat = new THREE.MeshStandardMaterial({
  color: 0x10b981, emissive: 0x10b981, emissiveIntensity: 1.2,
  metalness: 0.7, roughness: 0.25
});
const inst = new THREE.InstancedMesh(nodeGeo, nodeMat, data.nodes.length);
inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(inst);

// links (linhas)
const linkGeo = new THREE.BufferGeometry();
const linkPos = new Float32Array(data.links.length*2*3);
linkGeo.setAttribute('position', new THREE.BufferAttribute(linkPos, 3));
const linkMat = new THREE.LineBasicMaterial({ color: 0x10b981, transparent:true, opacity:0.25 });
scene.add(new THREE.LineSegments(linkGeo, linkMat));

// ── Worker de layout ───────────────────────────────────────
const workerBlob = new Blob([document.getElementById('force-worker').textContent], {type:'application/javascript'});
const worker = new Worker(URL.createObjectURL(workerBlob));
worker.postMessage({type:'init', nodes:data.nodes, links:data.links});

const dummy = new THREE.Object3D();
let latestPositions = null;
worker.onmessage = (e) => { if (e.data.type==='positions') latestPositions = e.data.buf; };

// ── Post-processing (só WebGL) ─────────────────────────────
let composer = null;
if (rendererLabel === 'WebGL2') {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 1.4, 0.6, 0.1));
}

// ── Loop ───────────────────────────────────────────────────
let frames=0, last=performance.now();
function animate(){
  requestAnimationFrame(animate);
  controls.update();

  if (latestPositions) {
    for (let i=0;i<data.nodes.length;i++){
      dummy.position.set(latestPositions[i*3], latestPositions[i*3+1], latestPositions[i*3+2]);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;

    for (let i=0;i<data.links.length;i++){
      const l = data.links[i];
      const si = data.nodes.findIndex(n=>n.id===l.source);
      const ti = data.nodes.findIndex(n=>n.id===l.target);
      if (si<0||ti<0) continue;
      linkPos[i*6]=latestPositions[si*3]; linkPos[i*6+1]=latestPositions[si*3+1]; linkPos[i*6+2]=latestPositions[si*3+2];
      linkPos[i*6+3]=latestPositions[ti*3]; linkPos[i*6+4]=latestPositions[ti*3+1]; linkPos[i*6+5]=latestPositions[ti*3+2];
    }
    linkGeo.attributes.position.needsUpdate = true;
    latestPositions = null;
  }

  if (composer) composer.render(); else renderer.render(scene, camera);

  frames++;
  const now = performance.now();
  if (now-last>500){
    document.getElementById('fps').textContent = ((frames*1000/(now-last))|0);
    frames=0; last=now;
  }
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
