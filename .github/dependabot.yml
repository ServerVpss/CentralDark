version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    labels:
      - "🤖 AUTO"
      - "🔄 GIT"
      - "👑 PERMITO-SEGREDO"
      - "✨ MELHORIA"
      - "🤖 IA-EXECUTAR"
    commit-message:
      prefix: "🤖 deps"
      include: "scope"
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Bolt/source concentra os alertas Dependabot do app. Um PR por dependência
  # toca o mesmo lockfile e aumenta conflito; agrupamos por classe para reduzir ruído.
  - package-ecosystem: "npm"
    directory: "/apps/modulos/Bolt/source"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    labels:
      - "🤖 AUTO"
      - "🔄 GIT"
      - "👑 PERMITO-SEGREDO"
      - "✨ MELHORIA"
      - "🤖 IA-EXECUTAR"
    commit-message:
      prefix: "🤖 deps"
      include: "scope"
    groups:
      bolt-source-security:
        applies-to: security-updates
        patterns:
          - "*"
      bolt-source-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "pip"
    directory: "/apps/modulos/Bolt/source/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docs-security:
        applies-to: security-updates
        patterns:
          - "*"
      docs-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "🤖 AUTO"
      - "🔄 GIT"
      - "👑 PERMITO-SEGREDO"
      - "✨ MELHORIA"
      - "🤖 IA-EXECUTAR"
    commit-message:
      prefix: "🤖 deps"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Aplicações privadas fora do monorepo raiz: cada lockfile precisa de um
  # owner Dependabot próprio para receber security/version updates.
  - package-ecosystem: "npm"
    directory: "/apps/instinto-superior"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    groups:
      instinto-security:
        applies-to: security-updates
        patterns:
          - "*"
      instinto-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/modulos/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    groups:
      mcp-security:
        applies-to: security-updates
        patterns:
          - "*"
      mcp-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/modulos/oauth-broker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      oauth-broker-security:
        applies-to: security-updates
        patterns:
          - "*"
      oauth-broker-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/modulos/hub"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      hub-security:
        applies-to: security-updates
        patterns:
          - "*"
      hub-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/scripts/telegram-mtproto"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      telegram-security:
        applies-to: security-updates
        patterns:
          - "*"
      telegram-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/apps/modulos/elite-gateway"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      elite-gateway-security:
        applies-to: security-updates
        patterns:
          - "*"
      elite-gateway-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "🤖 AUTO"
      - "🔄 GIT"
      - "👑 PERMITO-SEGREDO"
      - "✨ MELHORIA"
      - "🤖 IA-EXECUTAR"
    commit-message:
      prefix: "🛠️ ações"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
