version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    labels:
      - "🤖 AUTO"
      - "🔄 GIT"
      - "👑 PERMITO-SEGREDO"
      - "🧠 AGENTE-HERMES"
      - "✨ MELHORIA"
      - "🤖 IA-EXECUTAR"
    commit-message:
      prefix: "🤖 deps"
      include: "scope"
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Bolt/source concentra os alertas Dependabot do app. Um PR por dependência
  # toca o mesmo lockfile e aumenta conflito; agrupamos por classe para reduzir ruído.
  - package-ecosystem: "npm"
    directory: "/apps/modulos/Bolt/source"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    labels:
      - "🤖 AUTO"
      - "🔄 GIT"
      - "👑 PERMITO-SEGREDO"
      - "🧠 AGENTE-HERMES"
      - "✨ MELHORIA"
      - "🤖 IA-EXECUTAR"
    commit-message:
      prefix: "🤖 deps"
      include: "scope"
    groups:
      bolt-source-security:
        applies-to: security-updates
        patterns:
          - "*"
      bolt-source-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "pip"
    directory: "/apps/modulos/Bolt/source/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docs-security:
        applies-to: security-updates
        patterns:
          - "*"
      docs-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "🤖 AUTO"
      - "🔄 GIT"
      - "👑 PERMITO-SEGREDO"
      - "🧠 AGENTE-HERMES"
      - "✨ MELHORIA"
      - "🤖 IA-EXECUTAR"
    commit-message:
      prefix: "🤖 deps"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "🤖 AUTO"
      - "🔄 GIT"
      - "👑 PERMITO-SEGREDO"
      - "🧠 AGENTE-HERMES"
      - "✨ MELHORIA"
      - "🤖 IA-EXECUTAR"
    commit-message:
      prefix: "🛠️ ações"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
