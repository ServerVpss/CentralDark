# Auto-merge dos PRs do Dependabot — só patches (semver-patch).
# Minor fica aberto pra revisão humana. Major nem chega (bloqueado no dependabot.yml).
#
# Este workflow é o mutator especializado do fluxo universal de bots.
# Usa pull_request_target porque pull_request não roda enquanto o PR está
# conflitado. Segurança: nunca executa código do HEAD do PR; o resolver vem
# sempre do BASE SHA confiável e o escopo é restrito a PR cujo autor é
# dependabot[bot] no próprio repositório.
name: Dependabot Auto-Merge (só patches)

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge-patch:
    if: >-
      github.repository == 'ServerVpss/CentralDark' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux]
    steps:
      - name: Provar escopo do mutator especializado
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$PR_AUTHOR" = 'dependabot[bot]'
          test "$HEAD_REPO" = "$BASE_REPO"
          test -n "$PR_HEAD_REF"
          test "$PR_HEAD_REF" != 'main'
          echo "DEPENDABOT_SCOPE=PASS"
          echo "PR_HEAD_REF=$PR_HEAD_REF"

      - name: Coletar metadados do PR do Dependabot
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aprovar PR do Dependabot dentro da política
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'APPROVE',
              body: 'Aprovação automática — atualização do Dependabot dentro da política (sem majors).',
            });

      - name: Medir mergeability e decidir fallback
        id: stale
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let pr;
            for (let attempt = 1; attempt <= 5; attempt++) {
              pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              if (pr.data.mergeable !== null) break;
              console.log(`::notice::Mergeability UNKNOWN tentativa=${attempt}/5`);
              await new Promise(resolve => setTimeout(resolve, 2000));
            }

            const mergeable = pr.data.mergeable;
            if (mergeable === false) {
              console.log('::warning::PR conflitado. Encaminhando ao motor único da Casa.');
              core.exportVariable('RESOLVE_REQUESTED', '1');
              core.exportVariable('MERGEABILITY_STATE', 'CONFLICTING');
            } else if (mergeable === null) {
              console.log('::notice::Mergeability continuou UNKNOWN. Fail-closed; nenhuma mutação.');
              core.exportVariable('MERGEABILITY_STATE', 'UNKNOWN');
            } else {
              console.log('::notice::PR mergeable. Seguindo política de auto-merge.');
              core.exportVariable('MERGEABILITY_STATE', 'MERGEABLE');
            }

      - name: Checkout somente do BASE SHA confiável
        if: env.RESOLVE_REQUESTED == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-resolve
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: Resolver conflito pelo motor único da Casa
        if: env.RESOLVE_REQUESTED == '1'
        env:
          REPO_DIR: /root/CentralDark
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.ci-resolve/scripts/dependabot/resolve-conflicts.sh" "${{ github.event.pull_request.number }}"

      - name: Habilitar auto-merge somente para PATCH
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' && env.RESOLVE_REQUESTED != '1' && env.MERGEABILITY_STATE == 'MERGEABLE'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.graphql(`
              mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId, mergeMethod: SQUASH}) {
                  pullRequest { number autoMergeRequest { enabledAt mergeMethod } }
                }
              }
            `, {
              pullRequestId: context.payload.pull_request.node_id,
            });

      - name: Comentar quando for MINOR (fica pra revisão humana)
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' && github.event.action != 'synchronize'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '🟡 Atualização **minor** detectada — aprovada, mas o merge fica pra revisão humana (política: auto-merge só pra patch).',
            });

      - name: Receipt determinístico do fluxo Dependabot
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGEABILITY_STATE: ${{ env.MERGEABILITY_STATE }}
          RESOLVE_REQUESTED: ${{ env.RESOLVE_REQUESTED }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=$HEAD_SHA"
          echo "PR_HEAD_REF=$PR_HEAD_REF"
          echo "MERGEABILITY_STATE=${MERGEABILITY_STATE:-UNKNOWN}"
          echo "RESOLVE_REQUESTED=${RESOLVE_REQUESTED:-0}"
          echo "JOB_STATUS=$JOB_STATUS"
          echo 'TRIGGER=pull_request_target'
          echo 'TRUSTED_CODE_SOURCE=BASE_SHA'
          echo 'UNTRUSTED_PR_CODE_EXECUTED=0'
          echo 'FALLBACK_ENGINE=scripts/dependabot/resolve-conflicts.sh'
          echo 'DEPENDABOT_IS_SPECIALIZED_FALLBACK_NOT_SECOND_BRAIN=1'
