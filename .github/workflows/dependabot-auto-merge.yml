# 🤖 Dependabot — automação segura de patches + radar GLOBAL de conflitos.
#
# Regras:
# - update-branch é sincronização, não aprovação; checks amarelos não bloqueiam a sincronização.
# - TODO PR aberto passa pelo radar global, independentemente do autor.
# - conflito real vai para scripts/dependabot/resolve-conflicts.sh (motor único da Casa).
# - Dependabot pode auto-reconciliar somente pela política especializada do motor.
# - PR humano/non-dependabot é medido, recebe receipt e fica fail-closed para Writer semântico.
# - Zendrive/CodeRabbit são revisão consultiva; Hermes/testes provam.
# - somente PATCH do Dependabot pode ser promovido automaticamente; MINOR fica humano; MAJOR é bloqueado no dependabot.yml.
# - PATCH só faz squash depois que TODOS os gates aplicáveis do MESMO HEAD concluírem success.
# - pull_request_target nunca executa código do HEAD não confiável.

name: 🤖 Dependabot + Radar Global — reconciliação e auto-merge seguro

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows:
      - porta-de-entrada
      - codex-validate
      - lupa-conformance
      - Lupa Drift Guard
      - PR auto-review (Codex + checklist)
      - Pipeline — Telegram + Painel
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: dependabot-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || 'radar' }}
  cancel-in-progress: false

jobs:
  auto-merge-patch:
    name: 🤖 Sincronizar, reconciliar e classificar PR Dependabot
    if: >-
      github.event_name == 'pull_request_target' &&
      github.repository == 'ServerVpss/CentralDark' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15

    steps:
      - name: 🛡️ Provar escopo do mutator especializado
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$PR_AUTHOR" = 'dependabot[bot]'
          test "$HEAD_REPO" = "$BASE_REPO"
          test -n "$PR_HEAD_REF"
          test "$PR_HEAD_REF" != 'main'
          echo "DEPENDABOT_SCOPE=PASS"
          echo "PR_HEAD_REF=$PR_HEAD_REF"

      - name: 📥 Checkout somente do BASE SHA confiável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-house
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: 🔎 Coletar metadados do Dependabot
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🇧🇷 Padronizar título em PT-BR com selo semântico
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const nomes = (process.env.DEPENDENCY_NAMES || 'DEPENDÊNCIAS').trim();
            const tipo = (process.env.UPDATE_TYPE || 'ATUALIZAÇÃO')
              .replace('version-update:semver-', '')
              .toUpperCase();
            const titulo = `🤖 DEPENDABOT · ATUALIZA ${nomes} · ${tipo}`
              .toLocaleUpperCase('pt-BR')
              .slice(0, 240);
            if ((context.payload.pull_request.title || '') !== titulo) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                title: titulo,
              });
            }
            console.log(`TITULO_PTBR=${titulo}`);

      - name: 🧠 Classificar sinal no HERMES Signal Watcher
        shell: bash
        env:
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
          DEPENDENCY_TYPE: ${{ steps.meta.outputs.dependency-type }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          PREVIOUS_VERSION: ${{ steps.meta.outputs.previous-version }}
          NEW_VERSION: ${{ steps.meta.outputs.new-version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          EVENT_B64="$(node - <<'NODE'
          const event = {
            source: 'dependabot_pr',
            subject: `🤖 Dependabot PR #${process.env.PR_NUMBER}: ${process.env.DEPENDENCY_NAMES || 'dependências'}`,
            body: [
              `tipo_dependencia=${process.env.DEPENDENCY_TYPE || 'UNKNOWN'}`,
              `tipo_atualizacao=${process.env.UPDATE_TYPE || 'UNKNOWN'}`,
              `anterior=${process.env.PREVIOUS_VERSION || 'UNKNOWN'}`,
              `novo=${process.env.NEW_VERSION || 'UNKNOWN'}`,
              `head=${process.env.PR_HEAD_SHA || 'UNKNOWN'}`,
            ].join(' '),
            url: process.env.PR_URL || '',
          };
          process.stdout.write(Buffer.from(JSON.stringify(event), 'utf8').toString('base64url'));
          NODE
          )"
          node "$GITHUB_WORKSPACE/.ci-house/scripts/hermes/signal-watch-notify.mjs" --event-b64 "$EVENT_B64" --notify

      - name: 🔄 Tentar Update branch antes de julgar conflito
        id: update_branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const args = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              expected_head_sha: context.payload.pull_request.head.sha,
            };
            try {
              const result = await github.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch', args);
              console.log(`::notice::UPDATE_BRANCH_REQUESTED status=${result.status}`);
              core.exportVariable('UPDATE_BRANCH_STATE', 'REQUESTED');
              core.exportVariable('MERGEABILITY_STATE', 'REMEASURE_ON_SYNCHRONIZE');
            } catch (error) {
              if (error.status !== 422) throw error;
              const current = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              const mergeable = current.data.mergeable;
              const mergeState = current.data.mergeable_state;
              console.log(`::notice::UPDATE_BRANCH_422 mergeable=${mergeable} state=${mergeState}`);
              if (mergeable === false || mergeState === 'dirty') {
                core.exportVariable('UPDATE_BRANCH_STATE', 'CONFLICT');
                core.exportVariable('RESOLVE_REQUESTED', '1');
                core.exportVariable('MERGEABILITY_STATE', 'CONFLICTING');
              } else if (mergeable === null) {
                core.exportVariable('UPDATE_BRANCH_STATE', 'UNKNOWN');
                core.exportVariable('MERGEABILITY_STATE', 'UNKNOWN');
              } else {
                core.exportVariable('UPDATE_BRANCH_STATE', 'NOOP_OR_UP_TO_DATE');
                core.exportVariable('MERGEABILITY_STATE', 'MERGEABLE');
              }
            }

      - name: 🧭 Remedir mergeabilidade quando Update branch não criou novo HEAD
        if: env.UPDATE_BRANCH_STATE != 'REQUESTED' && env.RESOLVE_REQUESTED != '1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let pr;
            for (let attempt = 1; attempt <= 5; attempt++) {
              pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              if (pr.data.mergeable !== null) break;
              console.log(`::notice::Mergeabilidade UNKNOWN tentativa=${attempt}/5`);
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            if (pr.data.mergeable === false || pr.data.mergeable_state === 'dirty') {
              core.exportVariable('RESOLVE_REQUESTED', '1');
              core.exportVariable('MERGEABILITY_STATE', 'CONFLICTING');
            } else if (pr.data.mergeable === null) {
              core.exportVariable('MERGEABILITY_STATE', 'UNKNOWN');
            } else {
              core.exportVariable('MERGEABILITY_STATE', 'MERGEABLE');
            }

      - name: 🪡 Resolver conflito Dependabot pelo motor único da Casa
        if: env.RESOLVE_REQUESTED == '1'
        env:
          REPO_DIR: /root/CentralDark
          PR_KIND: dependabot
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.ci-house/scripts/dependabot/resolve-conflicts.sh" "${{ github.event.pull_request.number }}"

      - name: 🔒 Registrar PATCH elegível para o promotor SAME_HEAD
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' &&
          env.UPDATE_BRANCH_STATE != 'REQUESTED' &&
          env.RESOLVE_REQUESTED != '1' &&
          env.MERGEABILITY_STATE == 'MERGEABLE'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "DEPENDABOT_PATCH_CANDIDATE=1"
          echo "PR_NUMBER=$PR_NUMBER"
          echo "HEAD_SHA=$HEAD_SHA"
          echo "PROMOTION=WAIT_SAME_HEAD_GATES"
          echo "AUTO_MERGE_EARLY=FORBIDDEN"

      - name: 🟡 Avisar quando for MINOR
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' && github.event.action != 'synchronize'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '🟡 Atualização **minor** detectada — o merge permanece para revisão humana. O radar pode sincronizar/reconciliar a branch, mas não promove minor sozinho.',
            });

      - name: 🧾 Receipt determinístico do fluxo Dependabot
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGEABILITY_STATE: ${{ env.MERGEABILITY_STATE }}
          UPDATE_BRANCH_STATE: ${{ env.UPDATE_BRANCH_STATE }}
          RESOLVE_REQUESTED: ${{ env.RESOLVE_REQUESTED }}
          JOB_STATUS: ${{ job.status }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -euo pipefail
          echo "🤖 DEPENDABOT_HEAD_SHA=$HEAD_SHA"
          echo "🔄 PR_HEAD_REF=$PR_HEAD_REF"
          echo "🔄 UPDATE_BRANCH_STATE=${UPDATE_BRANCH_STATE:-UNKNOWN}"
          echo "🧭 MERGEABILITY_STATE=${MERGEABILITY_STATE:-UNKNOWN}"
          echo "🪡 RESOLVE_REQUESTED=${RESOLVE_REQUESTED:-0}"
          echo "⚖️ JOB_STATUS=$JOB_STATUS"
          echo "UPDATE_TYPE=${UPDATE_TYPE:-UNKNOWN}"
          echo 'TRIGGER=pull_request_target'
          echo 'TRUSTED_CODE_SOURCE=BASE_SHA'
          echo 'UNTRUSTED_PR_CODE_EXECUTED=0'
          echo 'CHECKS_PENDING_BLOCK_UPDATE_BRANCH=0'
          echo 'PATCH_PROMOTION_REQUIRES_SAME_HEAD_GATES=1'
          echo 'AUTO_MERGE_EARLY=0'
          echo 'ZENDRIVE_ROLE=REVIEW_ONLY'
          echo 'RABBIT_ROLE=REVIEW_ONLY'
          echo 'HERMES_ROLE=PROVE_AND_TEST'
          echo 'UNKNOWN_IS_PASS=0'
          echo 'NEVER_DISCARD_LEARNING=1'

  same-head-promote-patch:
    name: 🔒 Dependabot PATCH — provar SAME_HEAD e só então squash
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.repository == 'ServerVpss/CentralDark'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read

    steps:
      - name: ⚖️ Revalidar HEAD, classe PATCH, mergeabilidade e gates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUIRED_WORKFLOWS: porta-de-entrada,codex-validate,lupa-conformance,Lupa Drift Guard,PR auto-review (Codex + checklist),Pipeline — Telegram + Painel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const sameRepo = `${owner}/${repo}`;
            const required = (process.env.REQUIRED_WORKFLOWS || '')
              .split(',').map(v => v.trim()).filter(Boolean);

            if (!headSha || !/^[0-9a-f]{40}$/i.test(headSha)) {
              core.notice('DEPENDABOT_SAME_HEAD=NO_VALID_HEAD');
              return;
            }

            const candidateNumbers = new Set(
              (context.payload.workflow_run.pull_requests || [])
                .map(pr => Number(pr.number))
                .filter(Number.isInteger)
            );

            if (!candidateNumbers.size) {
              const open = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
              for (const pr of open.data) {
                if (pr.head?.sha === headSha) candidateNumbers.add(Number(pr.number));
              }
            }

            if (!candidateNumbers.size) {
              core.notice(`DEPENDABOT_SAME_HEAD=NO_OPEN_PR head=${headSha}`);
              return;
            }

            for (const number of candidateNumbers) {
              let response = await github.rest.pulls.get({ owner, repo, pull_number: number });
              let pr = response.data;

              if (pr.state !== 'open') continue;
              if (pr.user?.login !== 'dependabot[bot]') continue;
              if (pr.head?.repo?.full_name !== sameRepo) continue;
              if (pr.base?.ref !== 'main') continue;
              if (pr.head?.sha !== headSha) {
                core.notice(`PR=${number} HEAD_MOVED expected=${headSha} current=${pr.head?.sha || 'UNKNOWN'}`);
                continue;
              }
              if (!/·\s*PATCH\s*$/iu.test(String(pr.title || '').trim())) {
                core.notice(`PR=${number} NOT_PATCH_CLASSIFIED title=${pr.title || ''}`);
                continue;
              }

              for (let attempt = 1; attempt <= 4 && pr.mergeable === null; attempt++) {
                await new Promise(resolve => setTimeout(resolve, 1500));
                response = await github.rest.pulls.get({ owner, repo, pull_number: number });
                pr = response.data;
              }

              if (pr.head?.sha !== headSha) {
                core.notice(`PR=${number} HEAD_MOVED_DURING_REVALIDATION`);
                continue;
              }
              if (pr.mergeable !== true || pr.mergeable_state === 'dirty') {
                core.notice(`PR=${number} MERGEABLE=${pr.mergeable} STATE=${pr.mergeable_state || 'UNKNOWN'} PROMOTION=WAIT`);
                continue;
              }

              const runsResponse = await github.request('GET /repos/{owner}/{repo}/actions/runs', {
                owner,
                repo,
                head_sha: headSha,
                per_page: 100,
              });
              const exactRuns = (runsResponse.data.workflow_runs || [])
                .filter(run => run.head_sha === headSha);

              const latestNonSkipped = (name) => exactRuns
                .filter(run => run.name === name && run.conclusion !== 'skipped')
                .sort((a, b) => {
                  const n = Number(b.run_number || 0) - Number(a.run_number || 0);
                  if (n) return n;
                  return String(b.updated_at || b.created_at || '')
                    .localeCompare(String(a.updated_at || a.created_at || ''));
                })[0] || null;

              const verdicts = required.map(name => {
                const run = latestNonSkipped(name);
                if (!run) return { name, state: 'MISSING', run_id: null };
                if (run.status !== 'completed') return { name, state: 'PENDING', run_id: run.id };
                if (run.conclusion === 'success') return { name, state: 'PASS', run_id: run.id };
                return { name, state: 'FAIL', conclusion: run.conclusion || 'UNKNOWN', run_id: run.id };
              });

              console.log(`PR=${number} SAME_HEAD=${headSha}`);
              console.log(`SAME_HEAD_VERDICTS=${JSON.stringify(verdicts)}`);

              const allPass = verdicts.length === required.length && verdicts.every(v => v.state === 'PASS');
              if (!allPass) {
                const residue = verdicts.filter(v => v.state !== 'PASS');
                core.notice(`PR=${number} PROMOTION=WAIT_SAME_HEAD residual=${JSON.stringify(residue)}`);
                continue;
              }

              const finalCheck = await github.rest.pulls.get({ owner, repo, pull_number: number });
              const live = finalCheck.data;
              if (live.state !== 'open' || live.head?.sha !== headSha || live.mergeable !== true || live.mergeable_state === 'dirty') {
                core.notice(`PR=${number} LIVE_REVALIDATION_CHANGED PROMOTION=ABORT`);
                continue;
              }

              const merged = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: number,
                sha: headSha,
                merge_method: 'squash',
                commit_title: `${live.title} (#${number})`,
                commit_message: [
                  'Promoção Dependabot PATCH após gates aplicáveis PASS no mesmo HEAD.',
                  `Validated-Head: ${headSha}`,
                  `Gates: ${required.join(' | ')}`,
                  'UNKNOWN_IS_PASS=0',
                ].join('\n'),
              });

              if (!merged.data.merged) {
                core.setFailed(`PR=${number} MERGE_REJECTED:${merged.data.message || 'UNKNOWN'}`);
                return;
              }

              console.log(`PR=${number} DEPENDABOT_PATCH_SQUASH=PASS MERGE_SHA=${merged.data.sha}`);
              console.log(`VALIDATED_HEAD=${headSha}`);
              console.log('SAME_HEAD_REQUIRED_GATES=PASS');
              console.log('REALITY_IS_JUDGE=1');
            }

  radar-open-prs:
    name: 📡 Radar Global — todo conflito de PR passa por uma direção
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    concurrency:
      group: centraldark-repository-conflict-radar
      cancel-in-progress: true

    steps:
      - name: 📥 Checkout confiável da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .ci-house
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: 📡 Varredura oldest-first de TODOS os PRs abertos
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPO_DIR: /root/CentralDark
          RESOLVER: scripts/dependabot/resolve-conflicts.sh
          MAX_PRS: '100'
          MAIN_REF: main
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.ci-house/scripts/dependabot/reconcile-open-prs.sh"
