# 🔄 PR Update Branch — determinístico
#
# Função: apertar autonomamente o equivalente ao botão GitHub "Update branch"
# para qualquer PR aberto da própria CentralDark que esteja atrás da main.
#
# Costura evoluída no mesmo objeto:
# - depois do 202 Accepted, remede a PR até confirmar head/compare/checks.
# - STITCH_CONFIRMED exige behind_by_after == 0.
# - pending/skipped/unknown continuam amarelo; não viram PASS.
#
# Cadeados:
# - update-branch é sincronização, não aprovação.
# - PR-MÃE #1562 também é sincronizada quando ficar atrás da main; isso NÃO autoriza merge.
# - não faz merge, squash, deploy nem ignora checks.
# - conflito/UNKNOWN não vira PASS.
# - pull_request_target executa somente código confiável da base/main.
#
# 🛡️ CADEADO DO GUARDIÃO — NÃO trocar o runner deste fluxo para self-hosted.
# Regressão provada: self-hosted offline deixou a COSTURA em fila.
# Este fluxo fica em GitHub-hosted até VPS/self-hosted ficar PROVADO online
# e o CHEFE autorizar modo híbrido.
# UPDATE_BRANCH_RUNNER_LOCK=GITHUB_HOSTED_UNTIL_SELF_HOSTED_PROVEN
# SELF_HOSTED_ALLOWED_ONLY_WHEN_PROVEN_ONLINE=true
# HYBRID_MODE_PENDING_VPS_PROOF=true
# CLAUDE_OR_ANY_AGENT_MUST_NOT_CHANGE_RUNNER_WITHOUT_CHEFE=true

name: 🔄 PR Update Branch — determinístico

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR específico para sincronizar; vazio = varrer PRs abertos'
        required: false
        type: string
  repository_dispatch:
    types:
      - centraldark_update_branch_reconcile
      - centraldark_pr_update_branch
      - centraldark_pr_mother_update_branch
  schedule:
    - cron: '11,41 * * * *'

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read

concurrency:
  # push na main: todas as varreduras no mesmo grupo; a mais nova (main mais recente) substitui a anterior já obsoleta.
  # Demais eventos mantêm o comportamento anterior (grupo por PR/SHA, sem cancelar).
  group: update-branch-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.event.client_payload.pr_number || (github.event_name == 'push' && 'main') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  preflight:
    name: 🧭 Preflight — alvo + fonte confiável
    if: github.repository == 'ServerVpss/CentralDark'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_pr: ${{ steps.plan.outputs.target_pr }}
      tool_ref: ${{ steps.plan.outputs.tool_ref }}
    steps:
      - name: 🧭 Resolver alvo determinístico
        id: plan
        shell: bash
        env:
          TARGET_PR_RAW: ${{ github.event.pull_request.number || inputs.pr_number || github.event.client_payload.pr_number || '' }}
          TOOL_REF_RAW: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'main' }}
        run: |
          set -euo pipefail
          TARGET_PR="${TARGET_PR_RAW:-}"
          TOOL_REF="${TOOL_REF_RAW:-main}"
          echo "target_pr=${TARGET_PR}" >> "$GITHUB_OUTPUT"
          echo "tool_ref=${TOOL_REF}" >> "$GITHUB_OUTPUT"
          echo "EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "TRUSTED_TOOL_REF=${TOOL_REF}"
          echo "TARGET_PR=${TARGET_PR:-ALL_OPEN}"
          echo "TRUSTED_TOOL_REF=${TOOL_REF:-UNKNOWN}"
          echo "NEXT=UPDATE_AND_STITCH"

      - name: 🪵 Debug seguro do contexto
        if: runner.debug == '1'
        shell: bash
        env:
          TARGET_PR: ${{ steps.plan.outputs.target_pr }}
          TOOL_REF: ${{ steps.plan.outputs.tool_ref }}
        run: |
          set -euo pipefail
          echo "DEBUG_ENABLED=1"
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          echo "EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "ACTOR=${GITHUB_ACTOR}"
          echo "SHA=${GITHUB_SHA}"
          echo "REF=${GITHUB_REF}"
          echo "TARGET_PR=${TARGET_PR:-ALL_OPEN}"

  update-and-stitch:
    name: 🔄🪡 Update branch + estabilização
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.update.outputs.verdict }}
      total: ${{ steps.update.outputs.total }}
      requested: ${{ steps.update.outputs.requested }}
      confirmed: ${{ steps.update.outputs.confirmed }}
      blocked: ${{ steps.update.outputs.blocked }}
      unknown_or_pending: ${{ steps.update.outputs.unknown_or_pending }}
      step_outcome: ${{ steps.classify.outputs.step_outcome }}
    steps:
      - name: 📥 Checkout do código confiável do ref autorizado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tool_ref }}
          path: .ci-house
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: 🔄🪡 Aplicar update-branch determinístico com costura estabilizada
        id: update
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_PR: ${{ needs.preflight.outputs.target_pr }}
          PR_MOTHER_NUMBER: '1562'
          BASE_BRANCH: main
          UPDATE_BRANCH_INCLUDE_PROTECTED: 'true'
          UPDATE_BRANCH_FAIL_ON_BLOCKED: 'true'
          UPDATE_BRANCH_STITCH_SETTLE_MS: '3000'
          UPDATE_BRANCH_STITCH_POLL_ATTEMPTS: '8'
          UPDATE_BRANCH_STITCH_POLL_INTERVAL_MS: '5000'
          UPDATE_BRANCH_CHECKS_POLL_ATTEMPTS: '2'
          UPDATE_BRANCH_CHECKS_POLL_INTERVAL_MS: '4000'
        run: |
          set -euo pipefail
          echo 'CENTRALDARK_ANY_PR_UPDATE_BRANCH_DETERMINISTIC=true'
          echo 'CENTRALDARK_PR_MOTHER_UPDATE_BRANCH_DETERMINISTIC=true'
          echo 'PR_MOTHER_NUMBER=1562'
          echo 'PR_MOTHER_MERGE_FORBIDDEN_SYNC_ALLOWED=true'
          echo 'CENTRALDARK_STITCH_STABILIZATION=true'
          echo 'ENDPOINT=PUT /pulls/{PR}/update-branch'
          echo 'TARGET_PR='"${TARGET_PR:-ALL_OPEN}"''
          node .ci-house/scripts/github/update-branch-deterministic.mjs

      - name: 🪡 Encaminhar conflito ao resolvedor canônico existente
        if: >-
          always() &&
          steps.update.outputs.blocked != '0' &&
          needs.preflight.outputs.target_pr != '' &&
          needs.preflight.outputs.target_pr != '1562'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_PR: ${{ needs.preflight.outputs.target_pr }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pull_number = Number(process.env.TARGET_PR || 0);
            const pr = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            })).data;
            const mergeState = String(pr.mergeable_state || 'unknown').toLowerCase();
            const conflict = pr.mergeable === false || mergeState === 'dirty';
            if (!conflict || pr.state !== 'open' || pr.base?.ref !== 'main' ||
                pr.head?.repo?.full_name !== context.payload.repository?.full_name) {
              core.notice(`CONFLICT_RESOLVER_ROUTE=NOOP pr=${pull_number} conflict=${conflict}`);
              return;
            }
            await github.request('POST /repos/{owner}/{repo}/dispatches', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'centraldark_dependabot_reconcile',
              client_payload: {
                pr_number: pull_number,
                head_sha: pr.head.sha,
                source: 'pr-update-branch-deterministic',
                reason: 'conflict_requires_existing_resolver',
                reconciliation_only: true,
              },
            });
            core.notice(`CONFLICT_RESOLVER_ROUTE=DISPATCHED pr=${pull_number} owner=scripts/dependabot/resolve-conflicts.sh`);

      - name: 🧭 Classificar resultado da execução
        id: classify
        if: always()
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.update.outcome }}
          OWNER_VERDICT: ${{ steps.update.outputs.verdict }}
        run: |
          set -euo pipefail
          echo "step_outcome=${STEP_OUTCOME:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "STEP_OUTCOME=${STEP_OUTCOME:-UNKNOWN}"
          echo "OWNER_VERDICT=${OWNER_VERDICT:-UNKNOWN}"

  reality-judge:
    name: ⚖️ Reality Judge — costura material
    needs: [preflight, update-and-stitch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.judge.outputs.verdict }}
    steps:
      - name: ⚖️ Julgar efeito material
        id: judge
        shell: bash
        env:
          OWNER_VERDICT: ${{ needs.update-and-stitch.outputs.verdict }}
          STEP_OUTCOME: ${{ needs.update-and-stitch.outputs.step_outcome }}
          TOTAL: ${{ needs.update-and-stitch.outputs.total }}
          CONFIRMED: ${{ needs.update-and-stitch.outputs.confirmed }}
          BLOCKED: ${{ needs.update-and-stitch.outputs.blocked }}
          UNKNOWN_OR_PENDING: ${{ needs.update-and-stitch.outputs.unknown_or_pending }}
        run: |
          set -euo pipefail
          VERDICT="${OWNER_VERDICT:-UNKNOWN}"

          echo "OWNER_VERDICT=$VERDICT"
          echo "STEP_OUTCOME=${STEP_OUTCOME:-UNKNOWN}"
          echo "TOTAL=${TOTAL:-UNKNOWN}"
          echo "CONFIRMED=${CONFIRMED:-UNKNOWN}"
          echo "BLOCKED=${BLOCKED:-UNKNOWN}"
          echo "UNKNOWN_OR_PENDING=${UNKNOWN_OR_PENDING:-UNKNOWN}"

          case "$VERDICT" in
            PASS)
              if [ "${STEP_OUTCOME:-}" != "success" ]; then
                echo "REALITY_JUDGE=FAIL_STEP_OUTCOME"
                echo "verdict=FAIL" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              echo "REALITY_JUDGE=PASS"
              echo "verdict=PASS" >> "$GITHUB_OUTPUT"
              ;;
            FAIL)
              echo "REALITY_JUDGE=FAIL"
              echo "verdict=FAIL" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            *)
              echo "REALITY_JUDGE=UNKNOWN_NOT_PASS"
              echo "verdict=UNKNOWN" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

  receipt:
    name: 🧾 Receipt — fluxo completo
    needs: [preflight, update-and-stitch, reality-judge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🧾 Receipt
        shell: bash
        env:
          TARGET_PR: ${{ needs.preflight.outputs.target_pr }}
          UPDATE_VERDICT: ${{ needs.update-and-stitch.outputs.verdict }}
          REALITY_VERDICT: ${{ needs.reality-judge.outputs.verdict }}
          TOTAL: ${{ needs.update-and-stitch.outputs.total }}
          REQUESTED: ${{ needs.update-and-stitch.outputs.requested }}
          CONFIRMED: ${{ needs.update-and-stitch.outputs.confirmed }}
          BLOCKED: ${{ needs.update-and-stitch.outputs.blocked }}
          UNKNOWN_OR_PENDING: ${{ needs.update-and-stitch.outputs.unknown_or_pending }}
        run: |
          set -euo pipefail
          echo "TARGET_PR=${TARGET_PR:-ALL_OPEN}"
          echo "FLOW=PRECHECK -> UPDATE_AND_STITCH -> REALITY_JUDGE -> RECEIPT"
          echo "ACTION=PUT_UPDATE_BRANCH_WHEN_BEHIND_MAIN"
          echo "PR_MOTHER_1562_UPDATE_BRANCH=DETERMINISTIC_SYNC_ALLOWED"
          echo "PR_MOTHER_1562_MERGE=FORBIDDEN"
          echo "STITCH_STABILIZATION=ENABLED"
          echo "UPDATE_VERDICT=${UPDATE_VERDICT:-UNKNOWN}"
          echo "REALITY_VERDICT=${REALITY_VERDICT:-UNKNOWN}"
          echo "TOTAL=${TOTAL:-UNKNOWN}"
          echo "REQUESTED=${REQUESTED:-UNKNOWN}"
          echo "CONFIRMED=${CONFIRMED:-UNKNOWN}"
          echo "BLOCKED=${BLOCKED:-UNKNOWN}"
          echo "UNKNOWN_OR_PENDING=${UNKNOWN_OR_PENDING:-UNKNOWN}"
          echo "MERGE=NOT_DONE"
          echo "APPROVAL=NOT_DONE"
          echo "DEPLOY=NOT_DONE"
          echo "UNKNOWN_IS_PASS=0"
          echo "UPDATE_BRANCH_RUNNER_LOCK=GITHUB_HOSTED_UNTIL_SELF_HOSTED_PROVEN"
