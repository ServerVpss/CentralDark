name: VPS Deploy canônico (self-hosted)

on:
  push:
    branches: [main]
    paths:
      - "apps/modulos/mcp/**"
      - "apps/modulos/mapeamento/**"
      - "apps/modulos/HERMES-CORE/agents/Log-Verificador/**"
      - "apps/modulos/screenpipe-launcher.mjs"
      - "docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/HERMES-AUTOCONFIG-RUNTIME.yml"
      - "apps/modulos/HERMES-CORE/prompts/hermes-core.md"
      - "apps/modulos/HERMES-CORE/core/universal-method-contract.mjs"
      - "docs/BRAIN/01-CONCEITOS/02-BANDA/BANDA_COMPASSO_GLOBAL.json"
      - "docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/AUREOLA-BAHIA-BIBLICA.yml"
      - "docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/TRIGGERS.yml"
      - "docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/CONTRACT.yml"
      - "docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/UNIVERSAL-ENGINE-METHOD.yml"
      - ".agents/skills/centraldark-operational-method/**"
      - ".agents/skills/centraldark-esteira-motor/**"
      - "scripts/vps/centraldark-deploy.sh"
      - "scripts/vps/deploy-guards-dispatcher.sh"
      - "scripts/vps/deploy-operational-guards.sh"
      - ".github/workflows/vps-exec-selfhosted.yml"
      - "scripts/webhook/github-webhook-deploy.mjs"
      - "ecosystem.config.cjs"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: centraldark-vps-production
  cancel-in-progress: false

jobs:
  deploy-mcp:
    name: Deploy canônico do CentralDark-MCP
    if: github.repository == 'ServerVpss/CentralDark'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 25
    env:
      REPO_DIR: <caminho-vps>
      MCP_DIR: <caminho-vps>
      PM2_APP: CentralDark-MCP
      WEBHOOK_APP: CentralDark-WebhookDeploy
      HEALTH_URL: http://127.0.0.1:9100/health
      AUDIT_DIR: <caminho-vps>
      BEFORE_SHA: ${{ github.event.before || '' }}
    steps:
      - name: Hydrate Cofre (GitHub secret → VPS secrets/, sem echo)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
        run: |
          set -euo pipefail
          bash <caminho-vps>

      - name: Install system dependencies
        run: bash scripts/vps/install-system-deps.sh

      - name: Validar SHA, construir isolado, promover e comprovar
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          exec 9>/tmp/centraldark-mcp-deploy.lock
          flock -w 90 9 || { echo "DEPLOY_LOCK_TIMEOUT"; exit 21; }

          TARGET_SHA='${{ github.sha }}'
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "TARGET_SHA_INVALID"; exit 22; }
          [[ -d "$REPO_DIR/.git" ]] || { echo "REPO_DIR_INVALID"; exit 23; }
          cd "$REPO_DIR"
          CURRENT_BRANCH="$(git symbolic-ref --quiet --short HEAD || true)"
          [[ -n "$CURRENT_BRANCH" ]] || CURRENT_BRANCH="DETACHED"
          ORIGIN_URL="$(git remote get-url origin)"
          [[ "$ORIGIN_URL" =~ github\.com[:/]ServerVpss/CentralDark(\.git)?$ ]] || { echo "ORIGIN_REPOSITORY_MISMATCH"; exit 25; }
          if [[ "${GITHUB_EVENT_NAME:-}" == "push" && "${BEFORE_SHA:-}" =~ ^[0-9a-f]{40}$ && ! "${BEFORE_SHA}" =~ ^0{40}$ ]]; then
            git fetch --no-tags origin main
            if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null && git diff --quiet "$BEFORE_SHA" "$TARGET_SHA" -- \
              apps/modulos/mcp \
              .github/workflows/vps-exec-selfhosted.yml \
              scripts/webhook/github-webhook-deploy.mjs; then
              echo "MCP_SCOPE_UNCHANGED"
              echo "deployed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          DIRTY_TRACKED_FILE="$(mktemp "$RUNNER_TEMP/centraldark-dirty.XXXXXX")"
          DIRTY_MCP_FLAG="$(mktemp "$RUNNER_TEMP/centraldark-mcp-dirty.XXXXXX")"
          chmod 600 "$DIRTY_TRACKED_FILE" "$DIRTY_MCP_FLAG"
          git status --porcelain=v1 -z --untracked-files=no > "$DIRTY_TRACKED_FILE"
          if [[ -s "$DIRTY_TRACKED_FILE" ]]; then
            python3 - "$DIRTY_TRACKED_FILE" "$DIRTY_MCP_FLAG" <<'PY'
          from pathlib import Path
          import re
          import sys
          denied = re.compile(r'(^|/)(\.\.env(?:\.|$)|secrets?(?:/|$)|tokens?(?:/|$)|sessions?(?:/|$)|\.ssh(?:/|$)|[^/]+\.(?:pem|key)$)', re.I)
          dependency_manifests = {
              'apps/modulos/mcp/package.json',
              'apps/modulos/mcp/package-lock.json',
          }
          for raw in Path(sys.argv[1]).read_bytes().split(b'\0'):
              if not raw:
                  continue
              item = raw.decode('utf-8', 'replace')
              code = item[:2] if len(item) >= 2 else '??'
              path = item[3:] if len(item) >= 4 else item
              shown = 'SENSITIVE_TRACKED_PATH_REDACTED' if denied.search(path) else path
              print(f'TRACKED_DIRTY_PRESERVED {code} {shown}')
              if path in dependency_manifests:
                  Path(sys.argv[2]).write_text('dirty', encoding='utf-8')
          PY
            if [[ -s "$DIRTY_MCP_FLAG" ]]; then
              echo "MCP_DEPENDENCY_MANIFEST_DIRTY"
              exit 26
            fi
            echo "TRACKED_DIRTY_TREE_PRESERVED_ATOMIC_DIST_ONLY"
          fi

          # A porta 9300 só pode pertencer ao webhook legado conhecido. Ele é
          # aposentado antes de qualquer mutação Git para eliminar a corrida.
          WEBHOOK_JSON="$(pm2 jlist | jq -c --arg app "$WEBHOOK_APP" '.[] | select(.name == $app)' | head -n1)"
          if [[ -n "$WEBHOOK_JSON" ]]; then
            WEBHOOK_PID="$(jq -r '.pid // 0' <<<"$WEBHOOK_JSON")"
            WEBHOOK_EXEC="$(jq -r '.pm2_env.pm_exec_path // ""' <<<"$WEBHOOK_JSON")"
            [[ "$WEBHOOK_EXEC" == "$REPO_DIR/scripts/webhook/github-webhook-deploy.mjs" ]] || { echo "WEBHOOK_PM2_TARGET_MISMATCH"; exit 27; }
            PORT_PID="$(ss -ltnp 'sport = :9300' 2>/dev/null | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -n1)"
            [[ -z "$PORT_PID" || "$PORT_PID" == "$WEBHOOK_PID" ]] || { echo "PORT_9300_OWNERSHIP_MISMATCH"; exit 28; }
            pm2 stop "$WEBHOOK_APP" >/dev/null
            pm2 save --force >/dev/null
          fi
          for _ in $(seq 1 20); do
            ss -ltn 'sport = :9300' | grep -q LISTEN || break
            sleep 1
          done
          ! ss -ltn 'sport = :9300' | grep -q LISTEN || { echo "PORT_9300_STILL_LISTENING"; exit 29; }

          git fetch --prune origin main
          ORIGIN_SHA="$(git rev-parse origin/main)"
          CURRENT_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$TARGET_SHA" "$ORIGIN_SHA" || { echo "EVENT_SHA_NOT_IN_MAIN"; exit 30; }
          git diff --quiet "$TARGET_SHA" "$ORIGIN_SHA" -- \
            apps/modulos/mcp \
            .github/workflows/vps-exec-selfhosted.yml \
            scripts/webhook/github-webhook-deploy.mjs || { echo "DEPLOY_SCOPE_ADVANCED_AFTER_EVENT"; exit 31; }
          echo "LOCAL_CHECKOUT_PRESERVED"

          BUILD_DIR="$(mktemp -d "$RUNNER_TEMP/centraldark-mcp-build.XXXXXX")"
          restart_attempted=0
          artifact_promoted=0
          RUNTIME_STAGE=""
          RUNTIME_BACKUP=""
          cleanup() {
            rc=$?
            trap - EXIT ERR
            set +e
            if [[ "$rc" -ne 0 && "$artifact_promoted" == "1" ]]; then
              rollback_ok=false
              FAILED_DIST="$MCP_DIR/.dist-failed.${TARGET_SHA:0:12}.${BASHPID}"
              if [[ -d "$RUNTIME_BACKUP" ]]; then
                if [[ -d "$MCP_DIR/dist" && ! -e "$FAILED_DIST" ]]; then
                  mv -- "$MCP_DIR/dist" "$FAILED_DIST"
                fi
                if [[ ! -e "$MCP_DIR/dist" ]] && mv -- "$RUNTIME_BACKUP" "$MCP_DIR/dist"; then
                  if pm2 restart "$PM2_APP" >/dev/null; then
                    for _ in $(seq 1 20); do
                      if curl -fsS --max-time 3 "$HEALTH_URL" | jq -e '.ok == true and .service == "mcp-centraldark"' >/dev/null; then
                        rollback_ok=true
                        break
                      fi
                      sleep 1
                    done
                  fi
                fi
              fi
              if [[ "$rollback_ok" == "true" ]]; then echo "RUNTIME_ROLLBACK_OK"; else echo "RUNTIME_ROLLBACK_FAILED"; fi
            fi
            git -C "$REPO_DIR" worktree remove --force "$BUILD_DIR" >/dev/null 2>&1 || true
            if [[ "$rc" -ne 0 && "$restart_attempted" == "1" ]]; then echo "DEPLOY_BLOCKED_AFTER_RESTART"; fi
            exit "$rc"
          }
          trap cleanup EXIT ERR
          rmdir "$BUILD_DIR"
          git worktree add --detach "$BUILD_DIR" "$TARGET_SHA" >/dev/null
          BUILD_MCP="$BUILD_DIR/apps/modulos/mcp"
          cd "$BUILD_MCP"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          node --test tests/*.test.mjs
          npm run build
          [[ -z "$(git -C "$BUILD_DIR" status --porcelain --untracked-files=all -- apps/modulos/mcp/dist)" ]] || {
            echo "MCP_DIST_DRIFT"
            exit 47
          }

          # Dependências novas exigem release-dir atômico; código puro segue
          # automaticamente. Nunca altera node_modules do processo vivo.
          git -C "$REPO_DIR" diff --quiet "$CURRENT_SHA" "$TARGET_SHA" -- \
            apps/modulos/mcp/package.json apps/modulos/mcp/package-lock.json || {
            echo "MCP_DEPENDENCY_MANIFEST_CHANGED"
            DEPENDENCY_BACKUP="$MCP_DIR/.backup-depmanifest-$CURRENT_SHA.tar.gz"
            if [[ ! -e "$DEPENDENCY_BACKUP" ]]; then
              tar -czf "$DEPENDENCY_BACKUP" -C "$MCP_DIR" . 2>/dev/null || true
            fi
          }

          # Preparar release (dist). Se package*.json mudou, node_modules será
          # reconstruído após o git worktree desaparecer, no processo vivo.
          RELEASE_DIR="$MCP_DIR/.release-staged-$TARGET_SHA"
          if [[ -d "$RELEASE_DIR" ]]; then
            echo "MCP_RELEASE_ALREADY_STAGED"
            rm -rf "$RELEASE_DIR"
          fi
          mkdir -p "$RELEASE_DIR"
          cp -a "dist" "$RELEASE_DIR/dist"
          git -C "$REPO_DIR" worktree remove --force "$BUILD_DIR" >/dev/null 2>&1 || true

          # Se não houve mudança de manifesto de dependência, promoción atômica
          # do dist. Se houve mudança, stage apenas e deixa a promoção para o
          # node_modules ser reconstruído.
          MANIFEST_CHANGED=""
          if git -C "$REPO_DIR" diff --quiet "$CURRENT_SHA" "$TARGET_SHA" -- \
            apps/modulos/mcp/package.json apps/modulos/mcp/package-lock.json; then
            echo "MCP_DEPENDENCY_MANIFEST_UNCHANGED"
            RUNTIME_BACKUP="$MCP_DIR/.backup-dist-$CURRENT_SHA"
            if [[ -d "$MCP_DIR/dist" ]]; then
              mv -- "$MCP_DIR/dist" "$RUNTIME_BACKUP"
            fi
            mv -- "$RELEASE_DIR/dist" "$MCP_DIR/dist"
            artifact_promoted=1

            # Procurar por app ativo com PID que tenha sido marcado como
            # inicializado por worktree snapshot; promoção de dist não toca no
            # código, mas pode invalidar cache. Certificar que reinício ocorrer
            # e health pass dentro de máximo 20 segundos.
            if [[ -n "$(pm2 jlist | jq -c --arg app "$PM2_APP" '.[] | select(.name == $app)')" ]]; then
              restart_attempted=1
              pm2 restart "$PM2_APP" >/dev/null || true
              for _ in $(seq 1 20); do
                if curl -fsS --max-time 3 "$HEALTH_URL" | jq -e '.ok == true and .service == "mcp-centraldark"' >/dev/null; then
                  break
                fi
                sleep 1
              done
            fi
          else
            echo "MCP_DEPENDENCY_MANIFEST_CHANGED"
            MANIFEST_CHANGED=1
          fi
          rm -rf "$RELEASE_DIR"

          # Compilação passou. Se manifesto não mudou, promoción foi atômica e
          # health passou. Se mudou, stage fica pronto mas necessita rebuild de
          # node_modules no processo vivo quando for horário.
          git fetch --prune origin main
          FINAL_MAIN_SHA="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$TARGET_SHA" "$FINAL_MAIN_SHA" || { echo "VALIDATED_SHA_LEFT_MAIN"; exit 44; }
          git diff --quiet "$TARGET_SHA" "$FINAL_MAIN_SHA" -- apps/modulos/mcp || { echo "MCP_ADVANCED_DURING_DEPLOY"; exit 45; }
          ! ss -ltn 'sport = :9300' | grep -q LISTEN || { echo "PORT_9300_REOPENED"; exit 46; }

          STATE_TMP="$AUDIT_DIR/.mcp-last-known-good.${BASHPID}"
          jq -n \
            --arg sha "$TARGET_SHA" \
            --arg checkout_sha "$CURRENT_SHA" \
            --arg backup "$RUNTIME_BACKUP" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{validated_sha: $sha, local_checkout_sha: $checkout_sha, pm2_app: env.PM2_APP, restarted_at: $at, health: "ok", startup_audit: "ok", deployment_mode: "atomic_dist", runtime_backup: $backup}' > "$STATE_TMP"
          mv "$STATE_TMP" "$AUDIT_DIR/mcp-last-known-good.json"

          artifact_promoted=0
          restart_attempted=0
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "DEPLOYED_TO_MAIN"
          echo "validated_sha=$TARGET_SHA"
          echo "local_checkout_sha=$CURRENT_SHA"
          echo "local_checkout_preserved=$CURRENT_BRANCH"
          echo "main_sha=$FINAL_MAIN_SHA"
          echo "pm2_app=$PM2_APP"
          echo "runtime_mode=atomic_dist"
          echo "port_9300=retired"
          echo "health=ok"
          echo "startup_audit=ok"

      - name: Publicar status sanitizado no SHA
        if: always()
        uses: actions/github-script@v9
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          MCP_DEPLOYED: ${{ steps.deploy.outputs.deployed }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const success = process.env.DEPLOY_OUTCOME === 'success';
            const deployed = process.env.MCP_DEPLOYED === 'true';
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'centraldark/mcp-deploy',
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: success
                ? (deployed ? 'worktree, PM2, health, audit e porta 9300 comprovados' : 'escopo MCP sem mudança; runtime preservado')
                : 'deploy bloqueado em fail-closed; consultar job sanitizado',
            });

  deploy-operational-guards:
    name: Deploy atômico do mapa e Hermes-Verificador
    if: github.repository == 'ServerVpss/CentralDark'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    env:
      REPO_DIR: <caminho-vps>
    steps:
      - name: Prepare isolated deploy script checkout
        shell: bash
        run: |
          set -euo pipefail
          checkout_dir="$GITHUB_WORKSPACE/.ci-operational-guards"
          [[ "$checkout_dir" == "$GITHUB_WORKSPACE/.ci-operational-guards" ]]
          rm -rf "$checkout_dir"

      - name: Checkout exact event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci-operational-guards
          fetch-depth: 1
          submodules: false

      - name: Validate, promote, restart and prove
        id: guards
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.ci-operational-guards/scripts/vps/deploy-operational-guards.sh"

      - name: Publish sanitized operational guards status
        if: always()
        uses: actions/github-script@v9
        env:
          DEPLOY_OUTCOME: ${{ steps.guards.outcome }}
          DEPLOYED: ${{ steps.guards.outputs.deployed }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const success = process.env.DEPLOY_OUTCOME === 'success';
            const deployed = process.env.DEPLOYED === 'true';
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'centraldark/operational-guards-deploy',
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: success
                ? (deployed ? 'mapa e Hermes-Verificador promovidos e estáveis' : 'escopo sem mudança; runtime preservado')
                : 'promoção bloqueada em fail-closed; consultar job sanitizado',
            });

  vps-housekeeping:
    name: VPS Housekeeping (varredura lixo/ouro, report-only)
    if: github.repository == 'ServerVpss/CentralDark'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    env:
      REPO_DIR: <caminho-vps>
      REPORT_DIR: <caminho-vps>
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci-housekeeping
          fetch-depth: 1
          submodules: false

      - name: Varredura lixo/ouro (report-only, sem destruir)
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          REPORT="$REPORT_DIR/$(date -u +%Y-%m-%dT%H:%M:%SZ).jsonl"
          echo "REPORT=$REPORT" >> "$GITHUB_OUTPUT"
          HOUSEKEEPING_SCRIPT="$GITHUB_WORKSPACE/.ci-housekeeping/scripts/vps/vps-housekeeping-scan.mjs"
          if [[ ! -f "$HOUSEKEEPING_SCRIPT" ]]; then
            echo "HOUSEKEEPING_SCRIPT_MISSING"
            exit 61
          fi
          node "$HOUSEKEEPING_SCRIPT" --repo-dir "$REPO_DIR" --report "$REPORT"

      - name: Publicar status sanitizado
        if: always()
        uses: actions/github-script@v9
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          REPORT: ${{ steps.scan.outputs.REPORT }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const ok = process.env.SCAN_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'centraldark/vps-housekeeping',
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: ok
                ? 'varredura lixo/ouro concluída (report-only)'
                : 'varredura falhou; consultar job',
            });

  deploy-hermes-runtime:
    name: Deploy canônico do runtime Hermes
    if: github.repository == 'ServerVpss/CentralDark'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    env:
      REPO_DIR: <caminho-vps>
      HERMES_APP: CentralDark-Hermes
      RUNTIME_CONTRACT: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/HERMES-AUTOCONFIG-RUNTIME.yml
      VALIDATOR: apps/modulos/HERMES-CORE/core/universal-method-contract.mjs
      HERMES_PROMPT: apps/modulos/HERMES-CORE/prompts/hermes-core.md
      OPERATIONAL_METHOD: .agents/skills/centraldark-operational-method/SKILL.md
      UNIVERSAL_METHOD: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/UNIVERSAL-ENGINE-METHOD.yml
      TRIGGER_CONTRACT: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/CONTRACT.yml
      TRIGGER_MAP: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/TRIGGERS.yml
      AUREOLA_CONTRACT: docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/AUREOLA-BAHIA-BIBLICA.yml
      BAND_SCORE: docs/BRAIN/01-CONCEITOS/02-BANDA/BANDA_COMPASSO_GLOBAL.json
      SEMANTIC_OWNER: apps/modulos/HERMES-CORE
      SEMANTIC_CAPABILITY: HERMES_RUNTIME
      SEMANTIC_SCOPE: HERMES_RUNTIME
    steps:
      - name: Validar, promover runtime Hermes, reiniciar e contraprovar
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          TARGET_SHA='${{ github.sha }}'
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "TARGET_SHA_INVALID"; exit 71; }
          [[ -d "$REPO_DIR/.git" ]] || { echo "REPO_DIR_INVALID"; exit 72; }

          cd "$REPO_DIR"
          ORIGIN_URL="$(git remote get-url origin)"
          [[ "$ORIGIN_URL" =~ github\.com[:/]ServerVpss/CentralDark(\.git)?$ ]] || {
            echo "ORIGIN_REPOSITORY_MISMATCH"
            exit 73
          }

          git fetch --prune origin main
          ORIGIN_SHA="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$TARGET_SHA" "$ORIGIN_SHA" || {
            echo "EVENT_SHA_NOT_IN_MAIN"
            exit 74
          }

          for rel in "${RUNTIME_FILES[@]}"; do
            git cat-file -e "$TARGET_SHA:$rel" 2>/dev/null || {
              echo "TARGET_FILE_MISSING=$rel"
              exit 75
            }
          done

          DIRTY_TARGETS="$(git status --porcelain=v1 --untracked-files=no -- "$RUNTIME_CONTRACT" "$VALIDATOR" "$HERMES_PROMPT")"
          [[ -z "$DIRTY_TARGETS" ]] || {
            echo "HERMES_RUNTIME_TARGET_DIRTY_FAIL_CLOSED"
            printf '%s\n' "$DIRTY_TARGETS"
            exit 76
          }

          BUILD_DIR="$(mktemp -d "$RUNNER_TEMP/hermes-runtime-validate.XXXXXX")"
          BACKUP_DIR="<caminho-vps>${TARGET_SHA:0:12}-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$BACKUP_DIR"

          copied=0
          restart_attempted=0
          cleanup() {
            rc=$?
            trap - EXIT ERR
            set +e
            if [[ "$rc" -ne 0 && "$copied" == "1" ]]; then
              echo "HERMES_RUNTIME_ROLLBACK_BEGIN"
              for rel in "${RUNTIME_FILES[@]}"; do
                if [[ -f "$BACKUP_DIR/$rel" ]]; then
                  mkdir -p "$(dirname "$REPO_DIR/$rel")"
                  cp -a "$BACKUP_DIR/$rel" "$REPO_DIR/$rel"
                fi
              done
              if [[ "$restart_attempted" == "1" ]]; then
                pm2 restart "$HERMES_APP" --update-env >/dev/null 2>&1 || true
              fi
              echo "HERMES_RUNTIME_ROLLBACK_END"
            fi
            git -C "$REPO_DIR" worktree remove --force "$BUILD_DIR" >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap cleanup EXIT ERR

          rmdir "$BUILD_DIR"
          git worktree add --detach "$BUILD_DIR" "$TARGET_SHA" >/dev/null

          cd "$BUILD_DIR"
          node --check "$VALIDATOR"
          node "$VALIDATOR" --self-test | tee "$RUNNER_TEMP/hermes-runtime-self-test.txt"
          grep -q '^UNIVERSAL_ENGINE_METHOD_SELF_TEST=PASS$' "$RUNNER_TEMP/hermes-runtime-self-test.txt"
          grep -q 'progressive_autonomy:' "$RUNTIME_CONTRACT"
          grep -q 'AUTONOMY_MODES=SONHAR->EXPERIMENTAR->CRISTALIZAR' "$HERMES_PROMPT"
          grep -q 'FREEDOM_TO_EXPLORE_IS_NOT_FREEDOM_TO_INVENT_STATE: true' "$RUNTIME_CONTRACT"

          for rel in "${RUNTIME_FILES[@]}"; do
            mkdir -p "$BACKUP_DIR/$(dirname "$rel")"
            if [[ -f "$rel" ]]; then
              cp -a "$rel" "$BACKUP_DIR/$rel"
            fi
            stage="$REPO_DIR/$rel.stage.${BASHPID}"
            cp -a "$BUILD_DIR/$rel" "$stage"
            mv -f "$stage" "$REPO_DIR/$rel"
          done
          copied=1

          cd "$REPO_DIR"
          node "$VALIDATOR" --self-test | tee "$RUNNER_TEMP/hermes-runtime-live-self-test.txt"
          grep -q '^UNIVERSAL_ENGINE_METHOD_SELF_TEST=PASS$' "$RUNNER_TEMP/hermes-runtime-live-self-test.txt"

          HERMES_JSON="$(pm2 jlist | jq -c --arg app "$HERMES_APP" '.[] | select(.name == $app)' | head -n1)"
          [[ -n "$HERMES_JSON" ]] || { echo "HERMES_PM2_APP_NOT_FOUND"; exit 77; }
          OLD_PID="$(jq -r '.pid // 0' <<<"$HERMES_JSON")"
          [[ "$OLD_PID" =~ ^[0-9]+$ && "$OLD_PID" -gt 0 ]] || { echo "HERMES_OLD_PID_INVALID"; exit 78; }

          restart_attempted=1
          pm2 restart "$HERMES_APP" --update-env >/dev/null
          NEW_PID=0
          for _ in $(seq 1 20); do
            NEW_PID="$(pm2 pid "$HERMES_APP" | tail -n1)"
            STATUS="$(pm2 jlist | jq -r --arg app "$HERMES_APP" '.[] | select(.name == $app) | .pm2_env.status' | head -n1)"
            if [[ "$NEW_PID" =~ ^[0-9]$ && "$NEW_PID" -gt 0 && "$NEW_PID" != "$OLD_PID" && "$STATUS" == "online" ]]; then
              break
            fi
            sleep 1
          done

          [[ "$NEW_PID" =~ ^[0-9]+$ && "$NEW_PID" -gt 0 && "$NEW_PID" != "$OLD_PID" ]] || {
            echo "HERMES_PID_NOT_REPLACED"
            exit 79
          }

          for _ in $(seq 1 5); do
            sleep 3
            STABLE_PID="$(pm2 pid "$HERMES_APP" | tail -n1)"
            STATUS="$(pm2 jlist | jq -r --arg app "$HERMES_APP" '.[] | select(.name == $app) | .pm2_env.status' | head -n1)"
            [[ "$STABLE_PID" == "$NEW_PID" && "$STATUS" == "online" ]] || {
              echo "HERMES_RUNTIME_UNSTABLE"
              exit 80
            }
          done

          LIVE_RUNTIME_HASH="$(sha256sum "$RUNTIME_CONTRACT" | awk '{print $1}')"
          TARGET_RUNTIME_HASH="$(git -C "$BUILD_DIR" show "$TARGET_SHA:$RUNTIME_CONTRACT" | sha256sum | awk '{print $1}')"
          [[ "$LIVE_RUNTIME_HASH" == "$TARGET_RUNTIME_HASH" ]] || {
            echo "HERMES_RUNTIME_HASH_MISMATCH"
            exit 81
          }
          LIVE_CONTRACT_SET_HASH="$(for rel in "${RUNTIME_FILES[@]}"; do printf '%s  %s\n' "$(sha256sum "$rel" | awk '{print $1}')" "$rel"; done | sha256sum | awk '{print $1}')"
          TARGET_CONTRACT_SET_HASH="$(for rel in "${RUNTIME_FILES[@]}"; do printf '%s  %s\n' "$(git -C "$BUILD_DIR" show "$TARGET_SHA:$rel" | sha256sum | awk '{print $1}')" "$rel"; done | sha256sum | awk '{print $1}')"
          [[ "$LIVE_CONTRACT_SET_HASH" == "$TARGET_CONTRACT_SET_HASH" ]] || {
            echo "HERMES_CONTRACT_SET_HASH_MISMATCH"
            exit 82
          }

          RECEIPT="$REPO_DIR/logs/hermes-runtime-last-known-good.json"
          mkdir -p "$(dirname "$RECEIPT")"
          jq -n \
            --arg sha "$TARGET_SHA" \
            --arg contract "$RUNTIME_CONTRACT" \
            --arg runtime_hash "$LIVE_RUNTIME_HASH" \
            --arg contract_set_hash "$LIVE_CONTRACT_SET_HASH" \
            --arg owner "$SEMANTIC_OWNER" \
            --arg capability "$SEMANTIC_CAPABILITY" \
            --arg scope "$SEMANTIC_SCOPE" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg job_key "$GITHUB_JOB" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --argjson old_pid "$OLD_PID" \
            --argjson new_pid "$NEW_PID" \
            --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema: "centraldark.hermes-runtime-deploy.v1",
              semantic_identity: {owner: $owner, capability: $capability, scope: $scope},
              execution_provenance: {
                workflow_ref: $workflow_ref,
                job_key: $job_key,
                run_id: $run_id,
                head_sha: $sha,
                canonical_identity: false,
                discovered_at_runtime: true
              },
              validated_sha: $sha,
              contract: $contract,
              runtime_hash: $runtime_hash,
              contract_set_hash: $contract_set_hash,
              contract_coverage: {defined: 9, deployed: 9, percent: 100, meaning: "DEFINED_CANONICAL_RUNTIME_SET"},
              old_pid: $old_pid,
              new_pid: $new_pid,
              pm2_status: "online",
              progressive_autonomy: ["SONHAR", "EXPERIMENTAR", "CRISTALIZAR"],
              observed_at: $observed_at,
              action_is_proof: false,
              deployed_and_remeasured: true,
              reality_is_judge: true
            }' > "$RECEIPT"

          copied=0
          restart_attempted=0
          echo "HERMES_RUNTIME_DEPLOY=PASS"
          echo "SEMANTIC_IDENTITY=$SEMANTIC_OWNER+$SEMANTIC_CAPABILITY+$SEMANTIC_SCOPE"
          echo "EXECUTION_PROVENANCE=run:$GITHUB_RUN_ID job:$GITHUB_JOB head:$TARGET_SHA"
          echo "VALIDATED_SHA=$TARGET_SHA"
          echo "OLD_PID=$OLD_PID"
          echo "NEW_PID=$NEW_PID"
          echo "RUNTIME_HASH=$LIVE_RUNTIME_HASH"
          echo "CONTRACT_SET_HASH=$LIVE_CONTRACT_SET_HASH"
          echo "DEFINED_CONTRACT_COVERAGE=9/9=100%"
          echo "RECEIPT=$RECEIPT"

      - name: Publish sanitized Hermes runtime deploy status
        if: always()
        uses: actions/github-script@v9
        env:
          DEPLOY_OUTCOME: ${{ job.status }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const ok = process.env.DEPLOY_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'centraldark/hermes-runtime-deploy',
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: ok
                ? 'runtime Hermes promovido e estável'
                : 'deploy Hermes bloqueado em fail-closed; consultar job',
            });
