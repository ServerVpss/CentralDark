name: porta-de-entrada

# Protege a porta universal e o mapa canônico do repositório inteiro.
# O gate verifica alcance, contratos, identidade Git, raízes duplicadas,
# novos caminhos paralelos e validações mascaradas. Nenhum adaptador guarda
# uma cópia manual da governança e nenhum relatório transforma falha em verde.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: porta-de-entrada-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Porta e governança canônica estão íntegras?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testar falsificadores do mapa global
        run: node --test apps/modulos/mapeamento/tests/validar-mapa.test.mjs

      - name: Testar política de promoção autônoma
        run: node --test scripts/github-autonomia-promocao.test.mjs

      - name: Testar falsificações semânticas do protocolo ACORDA
        run: node --test scripts/lupa/validar-porta-de-entrada.test.mjs

      - name: Validar mapa e contratos do repositório inteiro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PIVETE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'permito-pivete') || contains(github.event.pull_request.body || '', 'PERMITO PIVETE') }}
        run: |
          set -euo pipefail
          node apps/modulos/mapeamento/core/validar-mapa.mjs \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --approved "$PIVETE_APPROVED"

      - name: Validar porta e adaptadores universais
        run: node scripts/lupa/validar-porta-de-entrada.mjs

      - name: Emitir relatório reproduzível
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PIVETE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'permito-pivete') || contains(github.event.pull_request.body || '', 'PERMITO PIVETE') }}
        run: |
          set -euo pipefail
          node apps/modulos/mapeamento/core/validar-mapa.mjs \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --approved "$PIVETE_APPROVED"
          node scripts/lupa/validar-porta-de-entrada.mjs --json
