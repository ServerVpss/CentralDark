name: porta-de-entrada

# Gate canônico: atualiza o mecanismo existente em vez de criar workflows
# paralelos. Valida identidade, reconciliação, raiz única da CentralDark,
# labels operacionais, fronteira única da API e política global de executor.

on:
  pull_request:
    branches: [main, program/centraldark-convergencia-omniroute-722]
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: porta-de-entrada-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Porta, identidade e governança canônica estão íntegras?
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    steps:
      - name: Bloquear HEAD de fork no runner persistente
        id: fork_guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "cause=FORK_HEAD" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_FORK_HEAD repo=${HEAD_REPO:-empty}"
            exit 1
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "FORK_GUARD_OK ${HEAD_REPO}"

      - name: Checkout preso ao HEAD validado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Provar checkout no mesmo HEAD do gate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA" || {
            echo "CHECKOUT_HEAD_MISMATCH expected=$HEAD_SHA actual=$actual"
            exit 1
          }

      - name: Setup Node 24 (fast path self-hosted)
        uses: ./.github/actions/setup-node24-selfhosted

      - name: Gate global — Trigger Fabric + runner policy + self-healing contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/trigger-fabric/verify_repo_contract.py . | tee "$RUNNER_TEMP/centraldark-contract.txt"
          grep -q '^REPO_CONTRACT_VERIFY=PASS$' "$RUNNER_TEMP/centraldark-contract.txt"
          grep -q '^CANONICAL_RUNNER_POLICY=PASS$' "$RUNNER_TEMP/centraldark-contract.txt"
          grep -q '^SELF_HEALING_CONTRACT=PASS$' "$RUNNER_TEMP/centraldark-contract.txt"

      - name: Validar continuidade global e fronteira de autoridade da entrada
        run: node scripts/lupa/validar-continuidade-global.mjs

      - name: Testar decisão determinística do gate de labels
        if: github.event_name == 'pull_request'
        run: node --test scripts/lupa/label-gate.test.mjs

      - name: Exigir labels operacionais canônicas
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/lupa/label-gate-run.mjs

      - name: Bloquear novo bypass direto de provider fora do Gateway
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" != "" && test "$HEAD_SHA" != ""
          forbidden='(api\.openai\.com|api\.anthropic\.com|openrouter\.ai|api\.groq\.com|generativelanguage\.googleapis\.com|api\.x\.ai)'
          failed=0
          while IFS= read -r file; do
            case "$file" in
              *.js|*.mjs|*.cjs|*.ts|*.tsx|*.py|*.sh|*.yml|*.yaml|*.json) ;;
              *) continue ;;
            esac
            case "$file" in
              apps/modulos/arsenal-openai-adapter/*|apps/modulos/elite-anthropic-proxy/*|apps/modulos/elite-gateway/*|apps/modulos/proxy/*|apps/modulos/lovable-proxy/*|apps/modulos/oauth-broker/*)
                continue
                ;;
            esac
            if git diff -U0 "$BASE_SHA" "$HEAD_SHA" -- "$file" \
              | grep '^+' \
              | grep -v '^+++' \
              | grep -Eiq "$forbidden"; then
              echo "API_SINGLE_ENTRY_BLOCKED path=$file reason=NEW_DIRECT_PROVIDER_BYPASS"
              failed=1
            fi
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "$failed" -eq 0
          echo "CENTRALDARK_API_SINGLE_ENTRY=PASS"

      - name: Testar fonte autenticada de autorização
        run: node --test scripts/lupa/authority-approval.test.mjs

      - name: Resolver autorização autenticada
        id: authority
        run: node scripts/lupa/authority-approval.mjs

      - name: Testar contrato de identidade operacional
        run: node --test scripts/lupa/validar-identidade-operacional.test.mjs

      - name: Testar core único e adapters finos
        run: node --test scripts/lupa/agent-core-adapters.test.mjs

      - name: Validar identidade SEGREDO → SOL → PIVETE/HERMES
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/lupa/validar-identidade-operacional.mjs \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA"

      - name: Testar kernel portátil e entrada multimodal
        run: node --test scripts/lupa/portable-kernel.test.mjs

      - name: Regenerar pacote portátil a partir do HEAD vivo
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lupa/portable-kernel.mjs \
            --export "$RUNNER_TEMP/CENTRALDARK-PORTABLE-KERNEL.json" \
            --json
          sha256sum "$RUNNER_TEMP/CENTRALDARK-PORTABLE-KERNEL.json"

      - name: Testar grafo finito de propriedade da prova
        run: node --test scripts/lupa/proof-ownership.test.mjs

      - name: Bloquear prova circular e cadeia sem âncora externa
        run: node scripts/lupa/proof-ownership.mjs

      - name: Testar juiz de reincidência de erro registrado
        run: node --test scripts/lupa/erro-reincidencia.test.mjs

      - name: FABLE JUDGE — erro registrado não pode reincidir
        run: |
          set -uo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD_REF="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/lupa/erro-reincidencia.mjs --intervalo "$BASE..$HEAD_REF"
          else
            echo "REINCIDENCIA_ESCOPO=SEM_BASE — auditando apenas o HEAD"
            node scripts/lupa/erro-reincidencia.mjs --intervalo "$HEAD_REF~1..$HEAD_REF"
          fi

      - name: Testar Dream Review isolado do memory-linker
        run: node --test scripts/memory-linker/dream-review.test.mjs

      - name: Testar biblioteca cognitiva, tags e referência contextual
        run: |
          set -euo pipefail
          node --check scripts/memory-linker/library-router.mjs
          node --test scripts/memory-linker/library-router.test.mjs

      - name: Validar sintaxe do Dream Review
        run: node --check scripts/memory-linker/dream-review.mjs

      - name: Testar retomada fail-closed do Hermes
        shell: bash
        run: |
          set +e
          output="$(node --test apps/modulos/HERMES-CORE/core/continuity-guard.test.mjs 2>&1)"
          status=$?
          set -e
          printf '%s\n' "${output}"
          if [ "${status}" -ne 0 ]; then
            detail="$(printf '%s\n' "${output}" | tail -n 40 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error file=apps/modulos/HERMES-CORE/core/continuity-guard.test.mjs,title=HERMES_CONTINUITY_TEST_FAIL::${detail}"
            exit "${status}"
          fi

      - name: Validar sintaxe do orquestrador Hermes
        run: node --check apps/modulos/HERMES-CORE/core/orchestrator.mjs

      - name: Testar falsificadores do mapa global
        run: node --test apps/modulos/mapeamento/tests/validar-mapa.test.mjs

      - name: Testar política de promoção autônoma
        run: node --test scripts/github-autonomia-promocao.test.mjs

      - name: Testar cristal global de segurança de estado Git
        run: |
          set -euo pipefail
          node --test scripts/webhook/lib/safe-git-deploy.test.mjs
          node .agents/skills/git-state-safety/scripts/validate.mjs

      - name: Validar mapa e contratos do repositório inteiro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUTHORITY_APPROVED: ${{ steps.authority.outputs.approved }}
        run: |
          set -euo pipefail
          node apps/modulos/mapeamento/core/validar-mapa.mjs \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --approved "$AUTHORITY_APPROVED"

      - name: Validar porta, fronteira CentralDark e reuso de workflows
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node scripts/lupa/validar-porta-de-entrada.mjs \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      - name: Emitir todos os relatórios reproduzíveis
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUTHORITY_APPROVED: ${{ steps.authority.outputs.approved }}
        run: |
          set -uo pipefail
          status=0
          python3 scripts/trigger-fabric/verify_repo_contract.py . || status=1
          node apps/modulos/mapeamento/core/validar-mapa.mjs \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --approved "$AUTHORITY_APPROVED" || status=1
          node scripts/lupa/validar-continuidade-global.mjs --json || status=1
          node scripts/lupa/validar-porta-de-entrada.mjs \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --json || status=1
          node scripts/lupa/validar-identidade-operacional.mjs \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --json || status=1
          node --test scripts/lupa/agent-core-adapters.test.mjs || status=1
          node scripts/lupa/portable-kernel.mjs --json || status=1
          node scripts/lupa/proof-ownership.mjs || status=1
          node --test scripts/webhook/lib/safe-git-deploy.test.mjs || status=1
          node .agents/skills/git-state-safety/scripts/validate.mjs || status=1
          exit "$status"

      - name: Receipt determinístico (sempre)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_BLOCKED: ${{ steps.fork_guard.outputs.blocked }}
          FORK_CAUSE: ${{ steps.fork_guard.outputs.cause }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "EXECUTOR=self-hosted-linux"
          echo "RUNNER_POLICY_SCOPE=ALL_ROOT_WORKFLOWS"
          echo "GITHUB_HOSTED_RUNNER_ALLOWED=0"
          echo "ANY_BRANCH_PUSH_GATED=1"
          echo "ROTA_PRIMARIA=self-hosted-linux"
          echo "ROTA_FALLBACK=BLOCKED_NO_HOSTED"
          echo "CENTRALDARK_ROOT_ONLY=1"
          echo "WORKFLOW_REUSE_REQUIRED=1"
          echo "AI_DETERMINISTIC_FALLBACK_REQUIRED=1"
          echo "GLOBAL_CONTINUITY_HARD_GATE=1"
          echo "MOTHER_BRANCH_GATED=1"
          echo "CANONICAL_LABELS_REQUIRED=1"
          echo "CENTRALDARK_API_SINGLE_ENTRY=1"
          echo "CENTRALDARK_PORTABLE_KERNEL=1"
          echo "AGENT_CORE_SINGLETON=1"
          echo "AGENT_ADAPTER_DRIFT_GUARD=1"
          echo "IMAGE_INPUT_IS_OPERATIONAL=1"
          echo "PROOF_OWNERSHIP_COVERAGE=PARTIAL_EXPLICIT"
          echo "UNREGISTERED_INVARIANT=UNPROVEN_NOT_OWNED"
          echo "DREAM_REVIEW_ISOLATED=1"
          echo "DREAM_DIRECT_CANONICAL_MUTATION=0"
          echo "LIBRARY_COGNITION_ROUTER=1"
          echo "GIT_STATE_SAFETY_GATE=1"
          echo "GIT_FORCE_PUSH_ALLOWED=0"
          echo "GIT_RESET_HARD_OPERATIONAL_ALLOWED=0"
          echo "SELF_HEALING_CONTRACT_REQUIRED=1"
          echo "NODE24_FAST_PATH=1"
          echo "JOB_STATUS=${JOB_STATUS}"
          if [ "${FORK_BLOCKED:-}" = "true" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=${FORK_CAUSE:-FORK_HEAD}"
          elif [ "${JOB_STATUS}" = "cancelled" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=CANCELLED_OR_RUNNER_UNAVAILABLE"
          elif [ "${JOB_STATUS}" = "failure" ]; then
            echo "RESULTADO=FAIL"
          elif [ "${JOB_STATUS}" = "success" ]; then
            echo "RESULTADO=PASS"
          else
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=UNKNOWN_STATUS_${JOB_STATUS}"
          fi
