name: porta-de-entrada

# Impede que a porta de entrada e os adaptadores automaticos voltem a ser murados.
#
# Em 2026-07-27 o LEIA-ME-IA.md, listado como item 1 do kit_boas_vindas e lido
# por ler_regras_inviolaveis, nao existia em commit nenhum. Toda IA que chegava
# entrava por uma porta 404 e caia direto nos documentos tecnicos, sem nunca
# passar pelo jeito de conversar com o Pivete.
#
# Em 2026-07-30 a mesma protecao passou a cobrir Claude, Codex/OpenAI, Copilot,
# Gemini, Cursor e Windsurf. Todos os adaptadores devem apontar para a mesma
# porta universal e para o contrato de orquestracao em delta.
#
# A identidade da Meta Lupa tambem e validada contra o blob Git real. Nenhum
# adaptador pode congelar uma copia manual de SHA ou mascarar falha com || true.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: porta-de-entrada-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Porta, canonicos e autoloaders universais estao integros?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testar falhas discriminantes da identidade Meta Lupa
        run: node scripts/lupa/test-validar-identidade-meta-lupa.mjs

      - name: Validar identidade canônica da Meta Lupa
        run: node scripts/lupa/validar-identidade-meta-lupa.mjs

      - name: Validar porta, canonicos e adaptadores de IA
        run: node scripts/lupa/validar-porta-de-entrada.mjs

      - name: Relatorio completo
        if: always()
        run: |
          node scripts/lupa/validar-identidade-meta-lupa.mjs --json
          node scripts/lupa/validar-porta-de-entrada.mjs --json
