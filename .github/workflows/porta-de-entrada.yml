name: porta-de-entrada

# Protege a porta universal, a escola agentic, o contrato de relato e o mapa canônico.
# Roda em todo commit de qualquer branch, todo PR e merge queue.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
  push:
    branches: ["**"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: porta-de-entrada-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Porta, escola, relato e governança canônica estão íntegros?
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testar falsificadores do mapa global
        run: node --test apps/modulos/mapeamento/tests/validar-mapa.test.mjs

      - name: Testar política de promoção autônoma
        run: node --test scripts/github-autonomia-promocao.test.mjs

      - name: Testar falsificações semânticas do protocolo ACORDA
        run: node --test scripts/lupa/validar-porta-de-entrada.test.mjs

      - name: Testar escola, relato Pivete e progresso
        run: >-
          node --test
          scripts/lupa/agentic-school-loader.test.mjs
          scripts/lupa/agentic-loop-progress.test.mjs
          scripts/lupa/validar-relato-pivete.test.mjs

      - name: Validar corpo de todo PR no padrão Pivete
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/lupa/validar-relato-pivete.mjs --mode pr --input "$RUNNER_TEMP/pr-body.md"

      - name: Testar fontes e pacote visual
        env:
          PYTHONPATH: scripts/lupa
        run: python3 -m unittest scripts/lupa/test_validar_agentic_visual_package.py

      - name: Provar fontes visuais versionadas
        run: python3 scripts/lupa/validar_agentic_visual_package.py --json

      - name: Bootar escola de refatoração crítica no HEAD exato
        run: node scripts/lupa/agentic-school-loader.mjs --task critical-refactor --expected-head "$TARGET_HEAD_SHA" --json

      - name: Validar operação da escola no HEAD exato
        run: node scripts/lupa/agentic-loop-progress.mjs --expected-head "$TARGET_HEAD_SHA" --require-operational

      - name: Validar mapa e autorização no contexto do PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PIVETE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'permito-pivete') || contains(github.event.pull_request.body || '', 'PERMITO PIVETE') }}
        run: |
          set -euo pipefail
          node apps/modulos/mapeamento/core/validar-mapa.mjs \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --approved "$PIVETE_APPROVED"

      - name: Validar porta e adaptadores universais
        run: node scripts/lupa/validar-porta-de-entrada.mjs

      - name: Emitir relatório reproduzível
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PIVETE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'permito-pivete') || contains(github.event.pull_request.body || '', 'PERMITO PIVETE') }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node apps/modulos/mapeamento/core/validar-mapa.mjs \
              --repo-root "$GITHUB_WORKSPACE" \
              --base-sha "$BASE_SHA" \
              --head-sha "$HEAD_SHA" \
              --approved "$PIVETE_APPROVED"
          fi
          node scripts/lupa/validar-porta-de-entrada.mjs --json
          node scripts/lupa/agentic-loop-progress.mjs --expected-head "$TARGET_HEAD_SHA" --json
