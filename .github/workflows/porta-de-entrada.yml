name: porta-de-entrada

# Impede que a porta de entrada volte a ser murada.
#
# Em 2026-07-27 o LEIA-ME-IA.md, listado como item 1 do kit_boas_vindas e lido
# por ler_regras_inviolaveis, nao existia em commit nenhum. Toda IA que chegava
# entrava por uma porta 404 e caia direto nos documentos tecnicos, sem nunca
# passar pelo jeito de conversar com o Pivete.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: porta-de-entrada-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: A porta abre e leva aos canonicos?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar porta de entrada e canonicos alcancaveis
        run: node scripts/lupa/validar-porta-de-entrada.mjs

      - name: Relatorio completo
        if: always()
        run: node scripts/lupa/validar-porta-de-entrada.mjs --json || true
