name: porta-de-entrada

# Gate canônico: atualiza o mecanismo existente em vez de criar workflows
# paralelos. Valida identidade, reconciliação, raiz única da CentralDark,
# labels operacionais e a fronteira única da API.

on:
  pull_request:
    branches: [main, program/centraldark-convergencia-omniroute-722]
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: porta-de-entrada-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Porta, identidade e governança canônica estão íntegras?
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    steps:
      - name: Bloquear HEAD de fork no runner persistente
        id: fork_guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "cause=FORK_HEAD" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_FORK_HEAD repo=${HEAD_REPO:-empty}"
            exit 1
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "FORK_GUARD_OK ${HEAD_REPO}"

      - name: Checkout preso ao HEAD validado
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Provar checkout no mesmo HEAD do gate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA" || {
            echo "CHECKOUT_HEAD_MISMATCH expected=$HEAD_SHA actual=$actual"
            exit 1
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Exigir labels operacionais canônicas
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const labels = (event.pull_request?.labels || []).map((item) => String(item?.name || ''));
          const seed = execFileSync(
            'git',
            ['show', `${process.env.BASE_SHA}:.github/workflows/bots-labels-seed.yml`],
            { encoding: 'utf8' },
          );
          const canonical = new Set([...seed.matchAll(/name:\s*'([^']+)'/g)].map((match) => match[1]));
          const authorityAliases = new Set(['permito-segredo', 'PERMITO-SEGREDO']);
          const canonicalPresent = labels.filter((label) => canonical.has(label));
          const invalid = labels.filter((label) => !canonical.has(label) && !authorityAliases.has(label));
          const authorityCompat = labels.filter((label) => authorityAliases.has(label));

          if (canonicalPresent.length === 0) {
            console.error('LABEL_GATE_BLOCKED=SEM_LABEL_CANONICA');
            process.exit(1);
          }
          if (invalid.length > 0) {
            console.error(`LABEL_GATE_BLOCKED=LABEL_NAO_CANONICA count=${invalid.length}`);
            process.exit(1);
          }
          if (authorityCompat.length > 0) {
            console.log(`LABEL_GATE_AUTHORITY_SEGREDO=${authorityCompat.length}`);
          }
          console.log(`LABEL_GATE=PASS canonical=${canonicalPresent.length}`);
          NODE

      - name: Bloquear novo bypass direto de provider fora do Gateway
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" != "" && test "$HEAD_SHA" != ""
          forbidden='(api\.openai\.com|api\.anthropic\.com|openrouter\.ai|api\.groq\.com|generativelanguage\.googleapis\.com|api\.x\.ai)'
          failed=0
          while IFS= read -r file; do
            case "$file" in
              *.js|*.mjs|*.cjs|*.ts|*.tsx|*.py|*.sh|*.yml|*.yaml|*.json) ;;
              *) continue ;;
            esac
            case "$file" in
              apps/modulos/arsenal-openai-adapter/*|apps/modulos/elite-anthropic-proxy/*|apps/modulos/elite-gateway/*|apps/modulos/proxy/*|apps/modulos/lovable-proxy/*|apps/modulos/oauth-broker/*)
                continue
                ;;
            esac
            if git diff -U0 "$BASE_SHA" "$HEAD_SHA" -- "$file" \
              | grep '^+' \
              | grep -v '^+++' \
              | grep -Eiq "$forbidden"; then
              echo "API_SINGLE_ENTRY_BLOCKED path=$file reason=NEW_DIRECT_PROVIDER_BYPASS"
              failed=1
            fi
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "$failed" -eq 0
          echo "CENTRALDARK_API_SINGLE_ENTRY=PASS"

      - name: Testar fonte autenticada de autorização
        run: node --test scripts/lupa/authority-approval.test.mjs

      - name: Resolver autorização autenticada
        id: authority
        run: node scripts/lupa/authority-approval.mjs

      - name: Testar contrato de identidade operacional
        run: node --test scripts/lupa/validar-identidade-operacional.test.mjs

      - name: Validar identidade SEGREDO → SOL → PIVETE/HERMES
        run: node scripts/lupa/validar-identidade-operacional.mjs

      - name: Testar grafo finito de propriedade da prova
        run: node --test scripts/lupa/proof-ownership.test.mjs

      - name: Bloquear prova circular e cadeia sem âncora externa
        run: node scripts/lupa/proof-ownership.mjs

      - name: Testar Dream Review isolado do memory-linker
        run: node --test scripts/memory-linker/dream-review.test.mjs

      - name: Validar sintaxe do Dream Review
        run: node --check scripts/memory-linker/dream-review.mjs

      - name: Testar retomada fail-closed do Hermes
        run: node --test apps/modulos/HERMES-CORE/core/continuity-guard.test.mjs

      - name: Validar sintaxe do orquestrador Hermes
        run: node --check apps/modulos/HERMES-CORE/core/orchestrator.mjs

      - name: Testar falsificadores do mapa global
        run: node --test apps/modulos/mapeamento/tests/validar-mapa.test.mjs

      - name: Testar política de promoção autônoma
        run: node --test scripts/github-autonomia-promocao.test.mjs

      - name: Validar mapa e contratos do repositório inteiro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUTHORITY_APPROVED: ${{ steps.authority.outputs.approved }}
        run: |
          set -euo pipefail
          node apps/modulos/mapeamento/core/validar-mapa.mjs \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --approved "$AUTHORITY_APPROVED"

      - name: Validar porta, fronteira CentralDark e reuso de workflows
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node scripts/lupa/validar-porta-de-entrada.mjs \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      - name: Emitir todos os relatórios reproduzíveis
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUTHORITY_APPROVED: ${{ steps.authority.outputs.approved }}
        run: |
          set -uo pipefail
          status=0
          node apps/modulos/mapeamento/core/validar-mapa.mjs \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --approved "$AUTHORITY_APPROVED" || status=1
          node scripts/lupa/validar-porta-de-entrada.mjs \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --json || status=1
          node scripts/lupa/validar-identidade-operacional.mjs --json || status=1
          node scripts/lupa/proof-ownership.mjs || status=1
          exit "$status"

      - name: Receipt determinístico (sempre)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_BLOCKED: ${{ steps.fork_guard.outputs.blocked }}
          FORK_CAUSE: ${{ steps.fork_guard.outputs.cause }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "EXECUTOR=self-hosted"
          echo "ROTA_PRIMARIA=self-hosted-linux"
          echo "ROTA_FALLBACK=BLOCKED_NO_HOSTED"
          echo "CENTRALDARK_ROOT_ONLY=1"
          echo "WORKFLOW_REUSE_REQUIRED=1"
          echo "AI_DETERMINISTIC_FALLBACK_REQUIRED=1"
          echo "MOTHER_BRANCH_GATED=1"
          echo "CANONICAL_LABELS_REQUIRED=1"
          echo "CENTRALDARK_API_SINGLE_ENTRY=1"
          echo "PROOF_OWNERSHIP_COVERAGE=PARTIAL_EXPLICIT"
          echo "UNREGISTERED_INVARIANT=UNPROVEN_NOT_OWNED"
          echo "DREAM_REVIEW_ISOLATED=1"
          echo "DREAM_DIRECT_CANONICAL_MUTATION=0"
          echo "JOB_STATUS=${JOB_STATUS}"
          if [ "${FORK_BLOCKED:-}" = "true" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=${FORK_CAUSE:-FORK_HEAD}"
          elif [ "${JOB_STATUS}" = "cancelled" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=CANCELLED_OR_RUNNER_UNAVAILABLE"
          elif [ "${JOB_STATUS}" = "failure" ]; then
            echo "RESULTADO=FAIL"
          elif [ "${JOB_STATUS}" = "success" ]; then
            echo "RESULTADO=PASS"
          else
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=UNKNOWN_STATUS_${JOB_STATUS}"
          fi
          # UNKNOWN/SKIPPED/empty nunca viram PASS por este receipt.
