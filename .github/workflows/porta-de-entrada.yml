name: porta-de-entrada

# Impede que a porta de entrada volte a ser murada.
#
# Em 2026-07-27 o LEIA-ME-IA.md, listado como item 1 do kit_boas_vindas e lido
# por ler_regras_inviolaveis, nao existia em commit nenhum. Toda IA que chegava
# entrava por uma porta 404 e caia direto nos documentos tecnicos, sem nunca
# passar pelo jeito de conversar com o Pivete.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: porta-de-entrada-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: A porta abre e leva aos canonicos?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate obrigatório da META LUPA
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          base_ref="$(git rev-parse origin/main)"
          base_sha="$(git rev-parse "$base_ref:.agents/skills/meta-lupa")"
          head_sha="$(git rev-parse HEAD)"
          trusted="$RUNNER_TEMP/meta_lupa_gate.py"
          git show "$base_ref:.agents/skills/meta-lupa/scripts/meta_lupa.py" > "$trusted"
          receipt="$RUNNER_TEMP/meta-lupa-gate.json"
          python3 "$trusted" issue-gate-receipt --repo-root "$GITHUB_WORKSPACE" \
            --repo ServerVpss/CentralDark --mission-id "${GITHUB_WORKFLOW}-${GITHUB_RUN_ID}" \
             --workspace-head "$head_sha" --canonical-ref "$base_ref" --expected-canonical-sha "$base_sha" --output "$receipt"
          python3 "$trusted" gate --repo-root "$GITHUB_WORKSPACE" --input "$receipt" \
             --canonical-ref "$base_ref" --expected-canonical-sha "$base_sha" --expected-head-sha "$head_sha" --operation workflow

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar porta de entrada e canonicos alcancaveis
        run: node scripts/lupa/validar-porta-de-entrada.mjs

      - name: Relatorio completo
        if: always()
        run: node scripts/lupa/validar-porta-de-entrada.mjs --json || true
