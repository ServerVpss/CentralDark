name: porta-de-entrada

# Impede que a porta de entrada volte a ser murada e que a IA volte a entregar
# materia tecnica sem a sequencia tecnico -> papo reto do Pivete.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: porta-de-entrada-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Porta, canonicos e resposta do Pivete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar porta de entrada e canonicos alcancaveis
        run: node scripts/lupa/validar-porta-de-entrada.mjs

      - name: Testar gate da resposta dupla do Pivete
        run: python3 scripts/lupa/test_validar_resposta_pivete.py

      - name: Relatorio completo
        if: always()
        run: node scripts/lupa/validar-porta-de-entrada.mjs --json || true
