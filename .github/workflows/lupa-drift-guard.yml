name: Lupa Drift Guard

on:
  pull_request:
    branches: [main, program/centraldark-convergencia-omniroute-722, pivete/dev, pivete/auditoria]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lupa-drift-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift-guard:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:

      - name: Bloquear HEAD de fork no runner persistente
        id: fork_guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "cause=FORK_HEAD" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_FORK_HEAD repo=${HEAD_REPO:-empty}"
            exit 1
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "FORK_GUARD_OK ${HEAD_REPO}"

      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Provar identidade do checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "DRIFT_GUARD_HEAD_MISMATCH expected=${EXPECTED_SHA} actual=${ACTUAL_SHA}"
            exit 1
          fi
          echo "DRIFT_GUARD_HEAD=PASS sha=${ACTUAL_SHA}"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Confirmar MetaLupa como técnica Lupa canônica única
        run: |
          set -e
          test -f .agents/skills/meta-lupa/SKILL.md || { echo "❌ canônica ausente"; exit 1; }
          # skill removida reapareceu = skill PARALALA REAL (segunda autoridade), não alias de compatibilidade.
          # tecnica-da-lupa é COMPATIBILITY_ALIAS legítimo (owner=meta-lupa, status=COMPATIBILITY_ALIAS no frontmatter).
          for proibido in metalupa-bayesiana-canonica lupa-premium; do
            for base in .agents/skills .claude/skills .workspace/skills; do
              if [ -d "$base/$proibido" ]; then
                echo "❌ skill removida reapareceu: $base/$proibido"
                exit 1
              fi
            done
          done
          # guard extra: bloquear qualquer skill que se declare second_owner/second_skill real (não alias redirect)
          for base in .agents/skills .claude/skills .workspace/skills; do
            for d in "$base"/*/; do
              [ -f "${d}SKILL.md" ] || continue
              if grep -qiE '^(type|status):[[:space:]]*redirect' "${d}SKILL.md" 2>/dev/null; then
                continue  # alias de compatibilidade permitido (ex.: tecnica-da-lupa)
              fi
              if grep -qiE 'IS_SECOND_(SKILL|OWNER|AUTHORITY)=true' "${d}SKILL.md" 2>/dev/null; then
                echo "❌ skill paralela com autoridade duplicada detectada: ${d}"
                exit 1
              fi
            done
          done
          echo "✅ meta-lupa é a única técnica Lupa canônica ativa; aliases de compatibilidade e outras skills legítimas podem coexistir"

      - name: Gerar inventário de skills
        run: |
          python scripts/lupa/inventario_skills.py > /tmp/inv.json
          echo "---"
          jq '.total, [.skills[].nome]' /tmp/inv.json

      - name: Detectar drift (skills duplicadas + menções ativas em doc)
        run: python scripts/lupa/detectar_drift.py

      - name: Upload inventário
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inventario-skills
          path: |
            /tmp/inv.json
            docs/RELATORIOS/inventario-skills.json

      - name: Receipt determinístico (sempre)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_BLOCKED: ${{ steps.fork_guard.outputs.blocked }}
          FORK_CAUSE: ${{ steps.fork_guard.outputs.cause }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "EXECUTOR=self-hosted"
          echo "ROTA_PRIMARIA=self-hosted-linux"
          echo "ROTA_FALLBACK=BLOCKED_NO_HOSTED"
          echo "JOB_STATUS=${JOB_STATUS}"
          if [ "${FORK_BLOCKED:-}" = "true" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=${FORK_CAUSE:-FORK_HEAD}"
          elif [ "${JOB_STATUS}" = "cancelled" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=CANCELLED_OR_RUNNER_UNAVAILABLE"
          elif [ "${JOB_STATUS}" = "failure" ]; then
            echo "RESULTADO=FAIL"
          elif [ "${JOB_STATUS}" = "success" ]; then
            echo "RESULTADO=PASS"
          else
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=UNKNOWN_STATUS_${JOB_STATUS}"
          fi
          # UNKNOWN/SKIPPED/empty never promoted as PASS by this receipt alone
