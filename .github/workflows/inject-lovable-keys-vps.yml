name: Inject Lovable Keys VPS

on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: Injetar chaves sem expor valores
        shell: bash
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          WEBUI_LOVABLE_KEY: ${{ secrets.WEBUI_LOVABLE_KEY }}
        run: |
          set -euo pipefail
          echo "::add-mask::${LOVABLE_API_KEY}"
          echo "::add-mask::${WEBUI_LOVABLE_KEY}"

          if [ -z "${LOVABLE_API_KEY:-}" ]; then
            echo "LOVABLE_API_KEY ausente no GitHub Secrets"
            exit 10
          fi

          if [ -z "${WEBUI_LOVABLE_KEY:-}" ]; then
            echo "WEBUI_LOVABLE_KEY ausente no GitHub Secrets"
            exit 11
          fi

          target_dir="/root/CentralDark/secrets/keys"
          target_file="${target_dir}/keys.env"
          tmp_file="${target_file}.tmp.$$"

          install -d -m 700 "$target_dir"
          umask 077
          {
            printf 'LOVABLE_API_KEY=%s\n' "$LOVABLE_API_KEY"
            printf 'WEBUI_LOVABLE_KEY=%s\n' "$WEBUI_LOVABLE_KEY"
          } > "$tmp_file"
          chmod 600 "$tmp_file"
          mv "$tmp_file" "$target_file"

          echo "keys.env gravado com permissao restrita"
          awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/{print $1"=PRESENTE"}' "$target_file" | sort

          if command -v pm2 >/dev/null 2>&1; then
            pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s); for (const p of a.filter(x=>/Lovable|Arsenal|AiDiag|Dark|Hermes|Proxy|Gateway|Central/i.test(x.name||''))) console.log([p.name,p.pm2_env?.status,p.pm_id,p.pm2_env?.restart_time].join('\t'));}catch(e){console.log('PM2_INDISPONIVEL')}})"
          fi
