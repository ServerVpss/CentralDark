name: ⚙️ PR — artefato de aprendizado automático

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]
    branches: [main]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-learning-artifact-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: 🧩 Provar gerador no HEAD do PR
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'ServerVpss/CentralDark' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: 🔹 Checkout exato do PR sem credencial persistente
        id: checkout_pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: 🔹 Sintaxe e testes discriminativos
        id: tests
        run: |
          set -Eeuo pipefail
          node --check scripts/lupa/pr-learning-artifact.mjs
          node --check scripts/lupa/pr-learning-artifact.test.mjs
          node --test scripts/lupa/pr-learning-artifact.test.mjs | tee "$RUNNER_TEMP/pr-learning.tap"
          TOTAL="$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/pr-learning.tap" | tail -1)"
          PASS="$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/pr-learning.tap" | tail -1)"
          FAIL="$(awk '/^# fail / {print $3}' "$RUNNER_TEMP/pr-learning.tap" | tail -1)"
          SKIPPED="$(awk '/^# skipped / {print $3}' "$RUNNER_TEMP/pr-learning.tap" | tail -1)"
          if [ -z "$TOTAL" ] || [ -z "$PASS" ] || [ -z "$FAIL" ] || [ -z "$SKIPPED" ]; then
            echo "TEST_RECEIPT_INCOMPLETE" >&2
            exit 1
          fi
          if [ "$FAIL" -ne 0 ] || [ "$SKIPPED" -ne 0 ] || [ "$PASS" -ne "$TOTAL" ]; then
            echo "TESTS_BLOCKED total=$TOTAL pass=$PASS fail=$FAIL skipped=$SKIPPED" >&2
            exit 1
          fi
          {
            echo "total=$TOTAL"
            echo "pass=$PASS"
            echo "fail=$FAIL"
            echo "skipped=$SKIPPED"
          } >> "$GITHUB_OUTPUT"

      - name: 🔹 Preparar entrada do próprio PR
        id: prepare_input
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          FILES_JSON: ${{ runner.temp }}/pr-learning-files.json
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if [ "$ACTUAL_HEAD" != "$HEAD_SHA" ]; then
            echo "HEAD_IDENTITY_MISMATCH expected=$HEAD_SHA actual=$ACTUAL_HEAD" >&2
            exit 1
          fi
          echo "verified_head=$ACTUAL_HEAD" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin "$BASE_SHA"
          FILES_JSON="$RUNNER_TEMP/pr-learning-files.json"
          git diff --numstat "$BASE_SHA" "$HEAD_SHA" -- . |
            node -e '
              const fs=require("fs");
              const rows=fs.readFileSync(0,"utf8").trim().split(/\r?\n/).filter(Boolean);
              const files=rows.map((row)=>{
                const [a,d,...rest]=row.split("\t");
                return {
                  filename: rest.join("\t"),
                  status: "modified",
                  additions: a==="-" ? 0 : Number(a||0),
                  deletions: d==="-" ? 0 : Number(d||0)
                };
              });
              fs.writeFileSync(process.env.FILES_JSON, JSON.stringify(files));
            '
          node - <<'NODE'
          const fs = require('fs');
          const files = JSON.parse(fs.readFileSync(process.env.FILES_JSON, 'utf8'));
          const input = {
            repository: process.env.REPOSITORY,
            pr_number: Number(process.env.PR_NUMBER),
            head_sha: process.env.HEAD_SHA,
            base_sha: process.env.BASE_SHA,
            title: process.env.PR_TITLE || '',
            author: process.env.PR_AUTHOR || '',
            body: process.env.PR_BODY || '',
            files,
          };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/pr-learning-input.json`, JSON.stringify(input));
          NODE

      - name: 🔹 Gerar Markdown e Canvas HTML
        id: artifact
        run: |
          set -Eeuo pipefail
          node scripts/lupa/pr-learning-artifact.mjs \
            --input "$RUNNER_TEMP/pr-learning-input.json" \
            --markdown "$RUNNER_TEMP/pr-learning-artifact.md" \
            --html "$RUNNER_TEMP/pr-learning-artifact.html" \
            --github-output "$GITHUB_OUTPUT"

      - name: 🔹 Publicar artefato de prova do HEAD
        id: upload_contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-learning-contract-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/pr-learning-artifact.md
            ${{ runner.temp }}/pr-learning-artifact.html
          if-no-files-found: error
          retention-days: 30

      - name: 🔹 Gate de caminho sensível
        id: sensitive_gate
        if: steps.artifact.outputs.blocked == 'true'
        run: |
          echo "BLOCKED_SENSITIVE_PATH" >&2
          exit 1

      - name: 🔹 Receipt final do contrato
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout_pr.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          INPUT_OUTCOME: ${{ steps.prepare_input.outcome }}
          VERIFIED_HEAD: ${{ steps.prepare_input.outputs.verified_head }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_contract.outcome }}
          GATE_OUTCOME: ${{ steps.sensitive_gate.outcome }}
          ARTIFACT_STATUS: ${{ steps.artifact.outputs.status }}
          SUPPORT_REQUIRED: ${{ steps.artifact.outputs.support_required }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          TEST_TOTAL: ${{ steps.tests.outputs.total }}
          TEST_PASS: ${{ steps.tests.outputs.pass }}
          TEST_FAIL: ${{ steps.tests.outputs.fail }}
          TEST_SKIPPED: ${{ steps.tests.outputs.skipped }}
        run: |
          set -Eeuo pipefail
          value_or_unknown() {
            if [ -n "${1:-}" ]; then printf '%s' "$1"; else printf 'UNKNOWN'; fi
          }
          CHECKOUT="$(value_or_unknown "$CHECKOUT_OUTCOME")"
          TESTS="$(value_or_unknown "$TESTS_OUTCOME")"
          INPUT="$(value_or_unknown "$INPUT_OUTCOME")"
          VERIFIED="$(value_or_unknown "$VERIFIED_HEAD")"
          ARTIFACT="$(value_or_unknown "$ARTIFACT_OUTCOME")"
          UPLOAD="$(value_or_unknown "$UPLOAD_OUTCOME")"
          GATE="$(value_or_unknown "$GATE_OUTCOME")"
          STATUS="$(value_or_unknown "$ARTIFACT_STATUS")"
          TOTAL="$(value_or_unknown "$TEST_TOTAL")"
          PASS="$(value_or_unknown "$TEST_PASS")"
          FAIL="$(value_or_unknown "$TEST_FAIL")"
          SKIPPED="$(value_or_unknown "$TEST_SKIPPED")"
          DIGEST="$(value_or_unknown "$ARTIFACT_DIGEST")"
          SUPPORT="$(value_or_unknown "$SUPPORT_REQUIRED")"

          BLOCKED=NAO
          CAUSE=NENHUMA
          if [ "$CHECKOUT" != "success" ]; then BLOCKED=SIM; CAUSE=CHECKOUT_NOT_PROVEN
          elif [ "$TESTS" != "success" ]; then BLOCKED=SIM; CAUSE=TESTS_NOT_PROVEN
          elif [ "$INPUT" != "success" ]; then BLOCKED=SIM; CAUSE=INPUT_NOT_PROVEN
          elif [ "$VERIFIED" = "UNKNOWN" ]; then BLOCKED=SIM; CAUSE=CHECKED_OUT_HEAD_UNKNOWN
          elif [ "$VERIFIED" != "$HEAD_SHA" ]; then BLOCKED=SIM; CAUSE=CHECKED_OUT_HEAD_MISMATCH
          elif [ "$ARTIFACT" != "success" ]; then BLOCKED=SIM; CAUSE=ARTIFACT_NOT_PROVEN
          elif [ "$UPLOAD" != "success" ]; then BLOCKED=SIM; CAUSE=UPLOAD_NOT_PROVEN
          elif [ "$GATE" = "failure" ]; then BLOCKED=SIM; CAUSE=BLOCKED_SENSITIVE_PATH
          elif [ "$TOTAL" = "UNKNOWN" ] || [ "$PASS" = "UNKNOWN" ] || [ "$FAIL" = "UNKNOWN" ] || [ "$SKIPPED" = "UNKNOWN" ]; then
            BLOCKED=SIM; CAUSE=TEST_RECEIPT_UNKNOWN
          elif [ "$FAIL" != "0" ] || [ "$SKIPPED" != "0" ] || [ "$PASS" != "$TOTAL" ]; then
            BLOCKED=SIM; CAUSE=TEST_RECEIPT_NOT_GREEN
          fi

          {
            echo "## Artefato de aprendizado — receipt final do contrato"
            echo
            echo "- HEAD esperado: \`$HEAD_SHA\`"
            echo "- HEAD verificado no checkout: \`$VERIFIED\`"
            echo "- Alvo: \`PR_HEAD\`"
            echo "- BLOCKED: \`$BLOCKED\`"
            echo "- Causa: \`$CAUSE\`"
            echo "- Outcomes: \`checkout=$CHECKOUT tests=$TESTS input=$INPUT head_identity=$VERIFIED artifact=$ARTIFACT upload=$UPLOAD sensitive_gate=$GATE\`"
            echo "- Testes: \`$TOTAL total / $PASS PASS / $FAIL FAIL / $SKIPPED SKIPPED\`"
            echo "- Estado do artefato: \`$STATUS\`"
            echo "- Suporte necessário: \`$SUPPORT\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Contraprova: \`negative_cases + sensitive_path_gate\`"
            echo "- Rollback: \`reverter somente commits deste PR\`"
            echo "- Decisão humana: \`OBRIGATÓRIA_ANTES_DO_MERGE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-comment:
    name: 🧩 Comentar e rotear usando somente código confiável da base
    if: >-
      github.event_name == 'pull_request_target' &&
      github.repository == 'ServerVpss/CentralDark'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: 🔹 Checkout exato da base confiável
        id: checkout_base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: 🔹 Preparar metadados sanitizados pela API
        id: prepare_metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_PATH: ${{ runner.temp }}/pr-learning-input.json
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            if (files.length > 300) throw new Error('PR_LEARNING_TOO_MANY_FILES');
            const redact = (value, limit) => String(value || '')
              .slice(0, limit)
              .replace(/\bBearer\s+[A-Za-z0-9._~+/=-]{12,}/gi, 'Bearer [REDACTED]')
              .replace(/\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\b/g, '[REDACTED_JWT]')
              .replace(/\bgh[pousr]_[A-Za-z0-9_]{20,}\b/g, '[REDACTED_GITHUB_TOKEN]')
              .replace(/\bsk-[A-Za-z0-9_-]{16,}\b/g, '[REDACTED_PROVIDER_KEY]');
            const input = {
              repository: `${owner}/${repo}`,
              pr_number: pr.number,
              head_sha: pr.head.sha,
              base_sha: pr.base.sha,
              title: redact(pr.title, 500),
              author: redact(pr.user?.login, 200),
              body: redact(pr.body, 12000),
              files: files.map((file) => ({
                filename: file.filename,
                status: file.status,
                additions: file.additions,
                deletions: file.deletions,
              })),
            };
            fs.writeFileSync(process.env.INPUT_PATH, JSON.stringify(input), { mode: 0o600 });

      - name: 🔹 Gerar artefato confiável
        id: artifact
        run: |
          set -Eeuo pipefail
          node scripts/lupa/pr-learning-artifact.mjs \
            --input "$RUNNER_TEMP/pr-learning-input.json" \
            --markdown "$RUNNER_TEMP/pr-learning-artifact.md" \
            --html "$RUNNER_TEMP/pr-learning-artifact.html" \
            --github-output "$GITHUB_OUTPUT"

      - name: 🔹 Salvar Canvas e Markdown como artifact
        id: upload_published
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-learning-artifact-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/pr-learning-artifact.md
            ${{ runner.temp }}/pr-learning-artifact.html
          if-no-files-found: error
          retention-days: 30

      - name: 🔹 Atualizar comentário idempotente e pedir suporte
        id: publish_comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MARKDOWN_PATH: ${{ runner.temp }}/pr-learning-artifact.md
          SUPPORT_REQUIRED: ${{ steps.artifact.outputs.support_required }}
          SUPPORT_LABELS: ${{ steps.artifact.outputs.support_labels }}
          BLOCKED: ${{ steps.artifact.outputs.blocked }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- centraldark-pr-learning-artifact -->';
            const body = fs.readFileSync(process.env.MARKDOWN_PATH, 'utf8').slice(0, 60000);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const isOwnedComment = (comment) =>
              comment.user?.login === 'github-actions[bot]' ||
              comment.performed_via_github_app?.slug === 'github-actions';
            const existing = comments.find(
              (comment) => isOwnedComment(comment) && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            const labels = String(process.env.SUPPORT_LABELS || '')
              .split(',')
              .map((label) => label.trim())
              .filter(Boolean);
            if (labels.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels });
            }

            if (process.env.BLOCKED === 'true') {
              core.notice('SECURITY_PATH_BLOCKED');
            } else if (process.env.SUPPORT_REQUIRED === 'true') {
              core.notice('SUPPORT_REQUEST_DISPATCHED');
            } else {
              core.notice('CAPABILITIES_DECLARED_UNVERIFIED');
            }

      - name: 🔹 Gate final de caminho sensível
        id: publish_sensitive_gate
        if: steps.artifact.outputs.blocked == 'true'
        run: |
          echo "BLOCKED_SENSITIVE_PATH" >&2
          exit 1

      - name: 🔹 Receipt final do bot
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout_base.outcome }}
          METADATA_OUTCOME: ${{ steps.prepare_metadata.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_published.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_comment.outcome }}
          GATE_OUTCOME: ${{ steps.publish_sensitive_gate.outcome }}
          ARTIFACT_STATUS: ${{ steps.artifact.outputs.status }}
          SUPPORT_REQUIRED: ${{ steps.artifact.outputs.support_required }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        run: |
          set -Eeuo pipefail
          value_or_unknown() {
            if [ -n "${1:-}" ]; then printf '%s' "$1"; else printf 'UNKNOWN'; fi
          }
          CHECKOUT="$(value_or_unknown "$CHECKOUT_OUTCOME")"
          METADATA="$(value_or_unknown "$METADATA_OUTCOME")"
          ARTIFACT="$(value_or_unknown "$ARTIFACT_OUTCOME")"
          UPLOAD="$(value_or_unknown "$UPLOAD_OUTCOME")"
          PUBLISH="$(value_or_unknown "$PUBLISH_OUTCOME")"
          GATE="$(value_or_unknown "$GATE_OUTCOME")"
          STATUS="$(value_or_unknown "$ARTIFACT_STATUS")"
          SUPPORT="$(value_or_unknown "$SUPPORT_REQUIRED")"
          DIGEST="$(value_or_unknown "$ARTIFACT_DIGEST")"

          BLOCKED=NAO
          CAUSE=NENHUMA
          if [ "$CHECKOUT" != "success" ]; then BLOCKED=SIM; CAUSE=TRUSTED_BASE_CHECKOUT_NOT_PROVEN
          elif [ "$METADATA" != "success" ]; then BLOCKED=SIM; CAUSE=METADATA_NOT_PROVEN
          elif [ "$ARTIFACT" != "success" ]; then BLOCKED=SIM; CAUSE=ARTIFACT_NOT_PROVEN
          elif [ "$UPLOAD" != "success" ]; then BLOCKED=SIM; CAUSE=UPLOAD_NOT_PROVEN
          elif [ "$PUBLISH" != "success" ]; then BLOCKED=SIM; CAUSE=COMMENT_OR_LABEL_NOT_PROVEN
          elif [ "$GATE" = "failure" ]; then BLOCKED=SIM; CAUSE=BLOCKED_SENSITIVE_PATH
          elif [ "$STATUS" = "UNKNOWN" ] || [ "$DIGEST" = "UNKNOWN" ]; then BLOCKED=SIM; CAUSE=RECEIPT_UNKNOWN
          fi

          {
            echo "## PR Learning Artifact Bot — receipt final"
            echo
            echo "- HEAD observado: \`$HEAD_SHA\`"
            echo "- Base confiável executada: \`$BASE_SHA\`"
            echo "- Alvo: \`PR_CONVERSATION_AND_ARTIFACT\`"
            echo "- BLOCKED: \`$BLOCKED\`"
            echo "- Causa: \`$CAUSE\`"
            echo "- Outcomes: \`checkout=$CHECKOUT metadata=$METADATA artifact=$ARTIFACT upload=$UPLOAD publish=$PUBLISH sensitive_gate=$GATE\`"
            echo "- Estado: \`$STATUS\`"
            echo "- Suporte: \`$SUPPORT\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Contraprova: \`marker de terceiro não conta como comentário do bot\`"
            echo "- Rollback: \`reverter somente commits deste PR\`"
            echo "- Aprovação/merge automático: \`NÃO\`"
            echo "- Decisão humana: \`OBRIGATÓRIA_ANTES_DO_MERGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
