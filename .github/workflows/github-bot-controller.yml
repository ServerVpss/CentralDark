name: GitHub Bot Controller

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rodar em dry-run?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      merged_pr:
        description: "PR consolidada mergeada que substituiu outras PRs"
        required: false
        default: ""
      supersedes:
        description: "Lista de PRs substituídas. Exemplo: #14 #16 #11"
        required: false
        default: ""
  pull_request:
    types:
      - closed
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: github-bot-controller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controller:
    name: Auditar PRs e fechar substituídas com segurança
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gate obrigatório da META LUPA
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          base_ref="$(git rev-parse origin/main)"
          base_sha="$(git rev-parse "$base_ref:.agents/skills/meta-lupa")"
          head_sha="$(git rev-parse HEAD)"
          trusted="$RUNNER_TEMP/meta_lupa_gate.py"
          git show "$base_ref:.agents/skills/meta-lupa/scripts/meta_lupa.py" > "$trusted"
          receipt="$RUNNER_TEMP/meta-lupa-gate.json"
          python3 "$trusted" issue-gate-receipt --repo-root "$GITHUB_WORKSPACE" --repo ServerVpss/CentralDark \
            --mission-id "${GITHUB_WORKFLOW}-${GITHUB_RUN_ID}" --workspace-head "$head_sha" --canonical-ref "$base_ref" \
            --expected-canonical-sha "$base_sha" --output "$receipt"
          python3 "$trusted" gate --repo-root "$GITHUB_WORKSPACE" --input "$receipt" \
            --canonical-ref "$base_ref" --expected-canonical-sha "$base_sha" --expected-head-sha "$head_sha" --operation github-write

      - name: Validar runtime Node
        run: node --version

      - name: Executar GitHub Bot Controller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_EXPECTED_REPOSITORY: ServerVpss/CentralDark
          BOT_EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'auto' }}
          BOT_MERGED_PR: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.merged_pr || '' }}
          BOT_SUPERSEDES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.supersedes || '' }}
        # O runner self-hosted ja posiciona GITHUB_WORKSPACE na raiz do repo
        # (_work/CentralDark/CentralDark). Prefixar "CentralDark/" aqui produzia
        # _work/CentralDark/CentralDark/CentralDark/scripts/... e MODULE_NOT_FOUND.
        run: node scripts/github-bot-controller.mjs
