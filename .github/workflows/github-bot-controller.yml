name: GitHub Bot Controller

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rodar em dry-run?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      merged_pr:
        description: "PR consolidada mergeada que substituiu outras PRs (número, ex.: 149)"
        required: false
        default: ""
      supersedes:
        description: "Lista de PRs substituídas. Exemplo: #14 #16 #11 (precisa bater com a linha 'Supersedes:' do corpo do PR mergeado)"
        required: false
        default: ""
  pull_request:
    types:
      - closed
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: github-bot-controller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controller:
    name: Auditar PRs e (só em dispatch com referência explícita) fechar substituídas
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10

    steps:
      # Roda em self-hosted: NUNCA fazer checkout do ref do PR (poderia executar
      # código não confiável). Fixamos no default branch, sem credenciais persistentes.
      - name: Checkout (default branch, sem credenciais, workspace limpo)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          clean: true

      - name: Validar runtime Node
        run: node --version

      - name: Executar GitHub Bot Controller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_EXPECTED_REPOSITORY: ServerVpss/CentralDark
          # schedule/pull_request => sempre DRY_RUN. workflow_dispatch => respeita input.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'true' }}
          BOT_EVENT_NAME: ${{ github.event_name }}
          BOT_MERGED_PR: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.merged_pr || '' }}
          BOT_SUPERSEDES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.supersedes || '' }}
        run: node scripts/github-bot-controller.mjs

      # Persistimos o relatório como ARTIFACT (não commitamos no GitHub).
      - name: Publicar relatório como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-bot-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/RELATORIOS/github-bot-controller/*.md
          if-no-files-found: warn
          retention-days: 7
