name: installer-deterministic

on:
  pull_request:
    paths:
      - 'scripts/installer/centraldark-installer-deterministic-beta1.sh'
      - 'scripts/installer/centraldark-installer-deterministic-beta1.test.sh'
      - 'scripts/installer/full-package.manifest.json'
      - 'docs/INSTALADOR/30-deterministic-full-package.md'
      - '.github/workflows/installer-deterministic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-beta1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n scripts/installer/centraldark-installer-deterministic-beta1.sh
          bash -n scripts/installer/centraldark-installer-deterministic-beta1.test.sh
      - name: Providerless and tokenless contract
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          OPENROUTER_API_KEY: ''
          NVIDIA_API_KEY: ''
        run: bash scripts/installer/centraldark-installer-deterministic-beta1.test.sh
      - name: Validate package manifest
        run: |
          jq -e '.one_system_only == true' scripts/installer/full-package.manifest.json
          jq -e '.unknown_is_not_pass == true' scripts/installer/full-package.manifest.json
          jq -e '.provider_required_for_installer == false' scripts/installer/full-package.manifest.json
