name: codex-validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
    branches:
      - main
      - program/centraldark-convergencia-omniroute-722
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-canonical-map:
    name: Validate canonical map and consolidated areas
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:
      - name: Bloquear HEAD de fork no runner persistente
        id: fork_guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "cause=FORK_HEAD" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_FORK_HEAD repo=${HEAD_REPO:-empty}"
            exit 1
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "FORK_GUARD_OK ${HEAD_REPO}"

      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Prove checkout identity
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Test authenticated authority source
        run: node --test scripts/lupa/authority-approval.test.mjs

      - name: Resolve authenticated authority
        id: authority
        run: node scripts/lupa/authority-approval.mjs

      - name: Test deterministic map and provider guards
        run: |
          set -euo pipefail
          node --test apps/modulos/mapeamento/tests/validar-mapa.test.mjs
          node --test apps/modulos/HERMES-CORE/agents/Log-Verificador/provider-health.test.mjs
          bash -n scripts/vps/deploy-operational-guards.sh
          bash -n scripts/vps/centraldark-deploy.sh

      - name: Enforce unique map and consolidated locks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUTHORITY_APPROVED: ${{ steps.authority.outputs.approved }}
        run: |
          set -euo pipefail
          node apps/modulos/mapeamento/core/validar-mapa.mjs \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --approved "$AUTHORITY_APPROVED"

      - name: Receipt determinístico (sempre)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_BLOCKED: ${{ steps.fork_guard.outputs.blocked }}
          FORK_CAUSE: ${{ steps.fork_guard.outputs.cause }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "EXECUTOR=self-hosted"
          echo "ROTA_PRIMARIA=self-hosted-linux"
          echo "ROTA_FALLBACK=BLOCKED_NO_HOSTED"
          echo "JOB_STATUS=${JOB_STATUS}"
          if [ "${FORK_BLOCKED:-}" = "true" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=${FORK_CAUSE:-FORK_HEAD}"
          elif [ "${JOB_STATUS}" = "cancelled" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=CANCELLED_OR_RUNNER_UNAVAILABLE"
          elif [ "${JOB_STATUS}" = "failure" ]; then
            echo "RESULTADO=FAIL"
          elif [ "${JOB_STATUS}" = "success" ]; then
            echo "RESULTADO=PASS"
          else
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=UNKNOWN_STATUS_${JOB_STATUS}"
          fi

  validate:
    name: Validate Codex operational kit
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:
      - name: Bloquear HEAD de fork no runner persistente
        id: fork_guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "cause=FORK_HEAD" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_FORK_HEAD repo=${HEAD_REPO:-empty}"
            exit 1
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "FORK_GUARD_OK ${HEAD_REPO}"

      - name: Prepare isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          checkout_dir="$GITHUB_WORKSPACE/.ci-codex-validate"
          if [[ "$checkout_dir" != "$GITHUB_WORKSPACE/.ci-codex-validate" ]]; then
            echo "Unsafe checkout directory: $checkout_dir"
            exit 1
          fi
          rm -rf "$checkout_dir"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-codex-validate
          persist-credentials: false
          submodules: false

      - name: Prove isolated checkout identity
        shell: bash
        working-directory: .ci-codex-validate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Validate required Codex files
        shell: bash
        working-directory: .ci-codex-validate
        run: |
          set -euo pipefail
          required=("AGENTS.md" "CODEX.md" ".github/codex/prompts/centraldark-system.md" ".github/pull_request_template.md")
          for file in "${required[@]}"; do test -f "$file" || { echo "Missing required file: $file"; exit 1; }; done

      - name: Check official repository references
        shell: bash
        working-directory: .ci-codex-validate
        run: |
          set -euo pipefail
          grep -q "ServerVpss/CentralDark" AGENTS.md
          grep -q "ServerVpss/CentralDark" CODEX.md
          grep -q "ServerVpss/CentralDark" .github/codex/prompts/centraldark-system.md
          grep -q "ServerVpss/CentralDark" .github/pull_request_template.md

      - name: Check sensitive-file guardrails are explicit
        shell: bash
        working-directory: .ci-codex-validate
        run: |
          set -euo pipefail
          docs=("AGENTS.md" "CODEX.md" ".github/codex/prompts/centraldark-system.md" ".github/pull_request_template.md")
          for file in "${docs[@]}"; do grep -q "arquivos sensíveis\|Arquivos sensíveis" "$file" || { echo "Missing sensitive-file guardrail wording in $file"; exit 1; }; done
          grep -q "Não li, abri, copiei, editei ou usei como contexto arquivos sensíveis" .github/pull_request_template.md
          grep -q "Verifiquei comentários de agentes no PR antes do merge" .github/pull_request_template.md
          grep -q "\.env" AGENTS.md
          grep -q "secrets""/" AGENTS.md
          grep -q "sessions""/" CODEX.md
          grep -q "\.ssh""/" .github/codex/prompts/centraldark-system.md

      - name: Check docs do not contain real secret values
        shell: bash
        working-directory: .ci-codex-validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          files = [Path("AGENTS.md"), Path("CODEX.md"), Path(".github/codex/prompts/centraldark-system.md"), Path(".github/pull_request_template.md")]
          patterns = [re.compile(r"-----BEGIN (?:RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----", re.I), re.compile(r"(?i)\b(?:token|password|passwd|secret|cookie|session|connection_string|database_url|api_key|apikey)\b\s*[:=]\s*['\"]?([^'\"\s<>`]{12,})")]
          allowed = {"***OCULTO***", "REDACTED", "CHANGEME", "EXAMPLE", "PLACEHOLDER"}
          findings=[]
          for file in files:
              text=file.read_text(encoding="utf-8")
              for pattern in patterns:
                  for match in pattern.finditer(text):
                      value=(match.group(1) if match.groups() else match.group(0)).strip().strip("\"'")
                      if value not in allowed: findings.append(f"{file}: possible real secret value near: {match.group(0)[:40]}")
          if findings:
              print("Potential real secret-like values found in Codex docs:")
              print(*[f"- {item}" for item in findings], sep="\n")
              sys.exit(1)
          print("OK: no real secret-like values found in Codex docs")
          PY

      - name: Validate Markdown presence
        shell: bash
        working-directory: .ci-codex-validate
        run: |
          set -euo pipefail
          grep -q "Repositório oficial" AGENTS.md
          grep -q "Alvo obrigatório" CODEX.md
          grep -q "Autoajuste consciente" .github/codex/prompts/centraldark-system.md
          grep -q "Ações sensíveis" .github/pull_request_template.md

      - name: Receipt determinístico (sempre)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_BLOCKED: ${{ steps.fork_guard.outputs.blocked }}
          FORK_CAUSE: ${{ steps.fork_guard.outputs.cause }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "EXECUTOR=self-hosted"
          echo "ROTA_PRIMARIA=self-hosted-linux"
          echo "ROTA_FALLBACK=BLOCKED_NO_HOSTED"
          echo "JOB_STATUS=${JOB_STATUS}"
          if [ "${FORK_BLOCKED:-}" = "true" ]; then echo "RESULTADO=BLOCKED"; echo "CAUSE=${FORK_CAUSE:-FORK_HEAD}";
          elif [ "${JOB_STATUS}" = "cancelled" ]; then echo "RESULTADO=BLOCKED"; echo "CAUSE=CANCELLED_OR_RUNNER_UNAVAILABLE";
          elif [ "${JOB_STATUS}" = "failure" ]; then echo "RESULTADO=FAIL";
          elif [ "${JOB_STATUS}" = "success" ]; then echo "RESULTADO=PASS";
          else echo "RESULTADO=BLOCKED"; echo "CAUSE=UNKNOWN_STATUS_${JOB_STATUS}"; fi

  validate-admin-guard:
    name: Validate MCP admin guard and runtime build
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:
      - name: Bloquear HEAD de fork no runner persistente
        id: fork_guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then echo "blocked=true" >> "$GITHUB_OUTPUT"; echo "cause=FORK_HEAD" >> "$GITHUB_OUTPUT"; echo "BLOCKED_FORK_HEAD repo=${HEAD_REPO:-empty}"; exit 1; fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "FORK_GUARD_OK ${HEAD_REPO}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/modulos/mcp/package-lock.json

      - name: Install dependencies
        working-directory: apps/modulos/mcp
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: apps/modulos/mcp
        run: npm run typecheck

      - name: Run MCP admin guard, mission bridge and provider control tests
        working-directory: apps/modulos/mcp
        run: |
          set -euo pipefail
          node --test tests/admin-guard.test.mjs
          node --test tests/hub-mission-consumer.test.mjs
          node --test tests/provider-admin-bridge.test.mjs tests/provider-control-integration.test.mjs tests/provider-control.test.mjs tests/provider-secret-boundary.test.mjs

      - name: Build runtime dist
        working-directory: apps/modulos/mcp
        run: npm run build

      - name: Upload compiled runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-dist-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/modulos/mcp/dist
          if-no-files-found: error
          retention-days: 2

      - name: Verify committed runtime matches build
        working-directory: apps/modulos/mcp
        run: |
          set -euo pipefail
          test -f dist/lib/admin-guard.js
          git diff --exit-code -- dist
          untracked="$(git ls-files --others --exclude-standard -- dist)"
          if [ -n "$untracked" ]; then
            echo "DIST_UNTRACKED_OUTPUT"
            printf '%s\n' "$untracked"
            exit 1
          fi

      - name: Receipt determinístico (sempre)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_BLOCKED: ${{ steps.fork_guard.outputs.blocked }}
          FORK_CAUSE: ${{ steps.fork_guard.outputs.cause }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "EXECUTOR=self-hosted"
          echo "ROTA_PRIMARIA=self-hosted-linux"
          echo "ROTA_FALLBACK=BLOCKED_NO_HOSTED"
          echo "JOB_STATUS=${JOB_STATUS}"
          if [ "${FORK_BLOCKED:-}" = "true" ]; then echo "RESULTADO=BLOCKED"; echo "CAUSE=${FORK_CAUSE:-FORK_HEAD}";
          elif [ "${JOB_STATUS}" = "cancelled" ]; then echo "RESULTADO=BLOCKED"; echo "CAUSE=CANCELLED_OR_RUNNER_UNAVAILABLE";
          elif [ "${JOB_STATUS}" = "failure" ]; then echo "RESULTADO=FAIL";
          elif [ "${JOB_STATUS}" = "success" ]; then echo "RESULTADO=PASS";
          else echo "RESULTADO=BLOCKED"; echo "CAUSE=UNKNOWN_STATUS_${JOB_STATUS}"; fi

  bot-fallback-router:
    name: Universal bot flow — deterministic fallback router
    needs: [validate-canonical-map, validate, validate-admin-guard]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR HEAD without writer credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ci-bot-router
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: Classificar resultado e apontar fallback canônico
        shell: bash
        working-directory: .ci-bot-router
        env:
          ACTOR: ${{ github.actor }}
          MAP_RESULT: ${{ needs.validate-canonical-map.result }}
          CODEX_RESULT: ${{ needs.validate.result }}
          MCP_RESULT: ${{ needs.validate-admin-guard.result }}
        run: |
          set -euo pipefail

          skill='.agents/skills/git-conflict-resolve-house-standard/SKILL.md'
          engine='scripts/dependabot/resolve-conflicts.sh'
          dependabot_flow='.github/workflows/dependabot-auto-merge.yml'

          for path in "$skill" "$engine" "$dependabot_flow"; do
            test -f "$path" || {
              echo "BOT_ROUTER_CONTRACT_FAIL missing=$path"
              exit 1
            }
          done

          # Um único motor de conflito; vários bots podem consumir o mesmo código.
          # Permissão de escrita NÃO é compartilhada com o gate read-only.
          bash -n "$engine"
          grep -Fq 'Owner do motor: `scripts/dependabot/resolve-conflicts.sh`' "$skill"
          grep -Fq 'scripts/dependabot/resolve-conflicts.sh' "$dependabot_flow"
          grep -Fq "github.actor != 'dependabot[bot]'" "$dependabot_flow"

          green=1
          for result in "$MAP_RESULT" "$CODEX_RESULT" "$MCP_RESULT"; do
            if [ "$result" != 'success' ]; then
              green=0
            fi
          done

          echo "BOT_ACTOR=$ACTOR"
          echo 'UNIVERSAL_VALIDATION_OWNER=.github/workflows/codex-validate.yml'
          echo 'GIT_CONFLICT_SKILL=.agents/skills/git-conflict-resolve-house-standard/SKILL.md'
          echo 'GIT_CONFLICT_ENGINE=scripts/dependabot/resolve-conflicts.sh'
          echo 'BOT_CODE_SHARED=1'
          echo 'BOT_PERMISSION_SHARED=0'
          echo 'BOT_FAILURE_DOES_NOT_CREATE_NEW_BOT=1'

          if [ "$green" -eq 1 ]; then
            echo 'BOT_KIND=ANY'
            echo 'BOT_FALLBACK=NONE'
            echo 'BOT_ROUTER=PASS'
            exit 0
          fi

          case "$ACTOR" in
            'dependabot[bot]')
              echo 'BOT_KIND=DEPENDABOT'
              echo 'BOT_FALLBACK_OWNER=.github/workflows/dependabot-auto-merge.yml'
              echo 'BOT_FALLBACK_ENGINE=scripts/dependabot/resolve-conflicts.sh'
              echo 'BOT_FALLBACK_REASON=VALIDATION_NOT_GREEN'
              ;;
            *\[bot\])
              echo 'BOT_KIND=GENERIC_BOT'
              echo 'BOT_FALLBACK_OWNER=OWNER_BY_FAILED_GATE'
              echo 'BOT_FALLBACK_ENGINE=NONE'
              echo 'BOT_FALLBACK_REASON=NO_SPECIALIZED_MUTATOR'
              ;;
            *)
              echo 'BOT_KIND=HUMAN_OR_SERVICE'
              echo 'BOT_FALLBACK_OWNER=OWNER_BY_FAILED_GATE'
              echo 'BOT_FALLBACK_ENGINE=NONE'
              echo 'BOT_FALLBACK_REASON=NO_BOT_MUTATION_REQUIRED'
              ;;
          esac

          echo 'BOT_ROUTER=ROUTED'

      - name: Receipt determinístico do router
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAP_RESULT: ${{ needs.validate-canonical-map.result }}
          CODEX_RESULT: ${{ needs.validate.result }}
          MCP_RESULT: ${{ needs.validate-admin-guard.result }}
          ROUTER_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "MAP_RESULT=${MAP_RESULT}"
          echo "CODEX_RESULT=${CODEX_RESULT}"
          echo "MCP_RESULT=${MCP_RESULT}"
          echo "ROUTER_STATUS=${ROUTER_STATUS}"
          echo 'UNIVERSAL_BOT_FLOW=1'
          echo 'DEPENDABOT_IS_SPECIALIZED_FALLBACK_NOT_SECOND_BRAIN=1'
          echo 'UNKNOWN_OR_SKIPPED_IS_NOT_PASS=1'
