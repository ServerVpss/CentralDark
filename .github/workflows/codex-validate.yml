name: codex-validate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Codex operational kit
    runs-on: [self-hosted, Linux]
    steps:
      - name: Prepare isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          checkout_dir="$GITHUB_WORKSPACE/.ci-codex-validate"
          if [[ "$checkout_dir" != "$GITHUB_WORKSPACE/.ci-codex-validate" ]]; then
            echo "Unsafe checkout directory: $checkout_dir"
            exit 1
          fi
          rm -rf "$checkout_dir"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: .ci-codex-validate
          submodules: false

      - name: Validate required Codex files
        shell: bash
        working-directory: .ci-codex-validate
        run: |
          set -euo pipefail

          required=(
            "AGENTS.md"
            "CODEX.md"
            ".github/codex/prompts/centraldark-system.md"
            ".github/pull_request_template.md"
          )

          for file in "${required[@]}"; do
            test -f "$file" || {
              echo "Missing required file: $file"
              exit 1
            }
          done

      - name: Check official repository references
        shell: bash
        working-directory: .ci-codex-validate
        run: |
          set -euo pipefail

          grep -q "ServerVpss/CentralDark" AGENTS.md
          grep -q "ServerVpss/CentralDark" CODEX.md
          grep -q "ServerVpss/CentralDark" .github/codex/prompts/centraldark-system.md
          grep -q "ServerVpss/CentralDark" .github/pull_request_template.md

      - name: Check sensitive-file guardrails are explicit
        shell: bash
        working-directory: .ci-codex-validate
        run: |
          set -euo pipefail

          docs=(
            "AGENTS.md"
            "CODEX.md"
            ".github/codex/prompts/centraldark-system.md"
            ".github/pull_request_template.md"
          )

          for file in "${docs[@]}"; do
            grep -q "arquivos sensíveis\|Arquivos sensíveis" "$file" || {
              echo "Missing sensitive-file guardrail wording in $file"
              exit 1
            }
          done

          grep -q "Não li, abri, copiei, editei ou usei como contexto arquivos sensíveis" .github/pull_request_template.md
          grep -q "Verifiquei comentários de agentes no PR antes do merge" .github/pull_request_template.md
          grep -q "\.env" AGENTS.md
          grep -q "secrets/" AGENTS.md
          grep -q "sessions/" CODEX.md
          grep -q "\.ssh/" .github/codex/prompts/centraldark-system.md

      - name: Check docs do not contain real secret values
        shell: bash
        working-directory: .ci-codex-validate
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          files = [
              Path("AGENTS.md"),
              Path("CODEX.md"),
              Path(".github/codex/prompts/centraldark-system.md"),
              Path(".github/pull_request_template.md"),
          ]

          patterns = [
              re.compile(r"-----BEGIN (?:RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----", re.I),
              re.compile(r"(?i)\b(?:token|password|passwd|secret|cookie|session|connection_string|database_url|api_key|apikey)\b\s*[:=]\s*['\"]?([^'\"\s<>`]{12,})"),
          ]

          allowed_placeholders = {
              "***OCULTO***",
              "REDACTED",
              "CHANGEME",
              "EXAMPLE",
              "PLACEHOLDER",
          }

          findings = []

          for file in files:
              text = file.read_text(encoding="utf-8")
              for pattern in patterns:
                  for match in pattern.finditer(text):
                      value = match.group(1) if match.groups() else match.group(0)
                      normalized = value.strip().strip("\"'")
                      if normalized in allowed_placeholders:
                          continue
                      findings.append(f"{file}: possible real secret value near: {match.group(0)[:40]}")

          if findings:
              print("Potential real secret-like values found in Codex docs:")
              for item in findings:
                  print("-", item)
              sys.exit(1)

          print("OK: no real secret-like values found in Codex docs")
          PY

      - name: Validate Markdown presence
        shell: bash
        working-directory: .ci-codex-validate
        run: |
          set -euo pipefail
          grep -q "Repositório oficial" AGENTS.md
          grep -q "Alvo obrigatório" CODEX.md
          grep -q "Autoajuste consciente" .github/codex/prompts/centraldark-system.md
          grep -q "Ações sensíveis" .github/pull_request_template.md

  validate-admin-guard:
    name: Validate MCP admin guard (offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Run admin guard unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/modulos/mcp/tests/admin-guard.test.mjs

  diagnose-webhook-port:
    name: Diagnose webhook port 9300 (read-only)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 3
    steps:
      - name: Verify listener, PM2 owner and health
        shell: bash
        run: |
          set -euo pipefail

          listener="$(ss -H -ltnp '( sport = :9300 )' 2>/dev/null || true)"
          listener_pid="$(printf '%s\n' "$listener" | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          pm2_pid="$(pm2 pid CentralDark-WebhookDeploy 2>/dev/null | tail -n1 || true)"
          health_code="$(curl -sS -o /tmp/centraldark-port9300-health.json -w '%{http_code}' --max-time 5 http://127.0.0.1:9300/health || true)"

          printf 'listener_present=%s\n' "$([[ -n "$listener" ]] && echo true || echo false)"
          printf 'listener_pid=%s\n' "${listener_pid:-none}"
          printf 'pm2_pid=%s\n' "${pm2_pid:-none}"
          printf 'health_code=%s\n' "${health_code:-000}"

          if [[ -n "$listener_pid" && -r "/proc/$listener_pid/comm" ]]; then
            printf 'listener_command=%s\n' "$(tr -cd '[:alnum:]_.-\n' <"/proc/$listener_pid/comm" | head -n1)"
          fi

          test -n "$listener_pid" || { echo 'PORT_9300_NO_LISTENER'; exit 1; }
          [[ "$pm2_pid" =~ ^[0-9]+$ && "$pm2_pid" -gt 0 ]] || { echo 'WEBHOOK_PM2_NOT_RUNNING'; exit 1; }
          [[ "$listener_pid" == "$pm2_pid" ]] || { echo 'PORT_9300_OWNED_BY_OTHER_PROCESS'; exit 1; }
          [[ "$health_code" == "200" ]] || { echo 'PORT_9300_HEALTH_FAILED'; exit 1; }

          echo 'PORT_9300_HEALTHY'
