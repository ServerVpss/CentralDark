name: lupa-conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, program/centraldark-convergencia-omniroute-722]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lupa-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:

      - name: Bloquear HEAD de fork no runner persistente
        id: fork_guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "cause=FORK_HEAD" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_FORK_HEAD repo=${HEAD_REPO:-empty}"
            exit 1
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "FORK_GUARD_OK ${HEAD_REPO}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Vincular branch esperada ao SHA exato
        shell: bash
        env:
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_BRANCH}" ]; then
            echo "OPERATION_RECEIPT_EXPECTED_BRANCH_MISSING"
            exit 1
          fi
          git check-ref-format --branch "${EXPECTED_BRANCH}" >/dev/null
          BEFORE_SHA="$(git rev-parse HEAD)"
          if [ "${BEFORE_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "OPERATION_RECEIPT_HEAD_MISMATCH expected=${EXPECTED_SHA} actual=${BEFORE_SHA}"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/heads/${EXPECTED_BRANCH}"; then
            git branch -f "${EXPECTED_BRANCH}" "${EXPECTED_SHA}"
          else
            git branch "${EXPECTED_BRANCH}" "${EXPECTED_SHA}"
          fi
          git switch "${EXPECTED_BRANCH}" >/dev/null
          AFTER_SHA="$(git rev-parse HEAD)"
          ACTUAL_BRANCH="$(git branch --show-current)"
          if [ "${AFTER_SHA}" != "${EXPECTED_SHA}" ] || [ "${ACTUAL_BRANCH}" != "${EXPECTED_BRANCH}" ]; then
            echo "OPERATION_RECEIPT_BRANCH_BINDING_FAILED expected_branch=${EXPECTED_BRANCH} actual_branch=${ACTUAL_BRANCH:-empty} expected_sha=${EXPECTED_SHA} actual_sha=${AFTER_SHA}"
            exit 1
          fi
          echo "OPERATION_RECEIPT_BRANCH_BINDING=PASS"
          echo "EXPECTED_BRANCH=${EXPECTED_BRANCH}"
          echo "HEAD_SHA=${AFTER_SHA}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Instalar pytest
        run: pip install pytest
      - name: Validar hash canônico da Lupa
        run: python3 scripts/lupa/validar_autolupa_hash.py
      - name: Rodar testes de conformidade
        env:
          AUTOLUPA_REPORT: .agents/skills/meta-lupa/testes/fixtures/exemplo_ok.md
        run: pytest .agents/skills/meta-lupa/testes/test_autolupa_conformance.py -v
      - name: Motor determinístico
        working-directory: .agents/skills/meta-lupa
        run: python3 testes/test_lupa.py
      - name: Evolução verificável — fail closed
        working-directory: .agents/skills/meta-lupa
        run: |
          python3 scripts/evolution_gate.py --self-test
          python3 scripts/evolution_series_gate.py --self-test
          python3 scripts/agi_claim_gate.py --self-test
          python3 scripts/evolution_series_gate.py --scan references --repo-root ../../..
          pytest testes/test_evolution_gate.py -v
      - name: Knowledge Compiler — FORJA rigorosa, runtime FLASH
        shell: bash
        run: |
          set -euo pipefail
          node --check .agents/skills/knowledge-compiler/scripts/compiler.mjs
          node .agents/skills/knowledge-compiler/scripts/compiler.mjs --self-test
          node --test \
            .agents/skills/knowledge-compiler/tests/compiler.test.mjs \
            .agents/skills/knowledge-compiler/tests/contract.test.mjs
      - name: Percentual evidencial — denominador fechado + dogfood
        working-directory: .agents/skills/meta-lupa
        run: python3 scripts/percentual_evidencial.py self-test
      - name: Validador e promotor do OPERATION_RECEIPT
        run: pytest .agents/skills/meta-lupa/testes/test_operation_receipt_validator.py -v
      - name: Guardrail do selo de ponto fixo
        working-directory: .agents/skills/meta-lupa
        run: python3 guardrails/validar_selo_ponto_fixo.py
      - name: Regressão do selo e do recibo de XP
        working-directory: .agents/skills/meta-lupa
        run: python3 testes/test_selo_ponto_fixo.py

      - name: Padrões — biblioteca longitudinal
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/memory-linker/pattern-library.mjs
          node --test scripts/memory-linker/pattern-library.test.mjs

      - name: Padrões — ponte Lembranças para Dream Review
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/memory-linker/memory-reserve-events.mjs
          node --test scripts/memory-linker/memory-reserve-events.test.mjs

      - name: Padrões — gavetas seguras no Admin
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/modulos/mcp/src/admin-patterns-ui.js
          node --test apps/modulos/mcp/src/admin-patterns-ui.test.mjs

      - name: Memory Linker — sintaxe + mineração determinística
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check scripts/memory-linker/delta-core.mjs
          node --check scripts/memory-linker/fs-safe.mjs
          node --check scripts/memory-linker/dream-review.mjs
          node --check scripts/memory-linker/pattern-discovery.mjs
          node --check scripts/memory-linker/pattern-library.mjs
          node --check scripts/memory-linker/memory-reserve-events.mjs
          node --check scripts/memory-linker/dream-review-run.mjs
          node --check scripts/memory-linker/artifact-capability.mjs
          node --check scripts/memory-linker/memory-linker-agent.mjs
          node --check scripts/memory-linker/memory-analyst-agent.mjs
          node --check scripts/memory-linker/memory-executor-agent.mjs
          node --check apps/modulos/mcp/src/admin-patterns-ui.js
          node --check supabase/functions/_shared/source-delta.mjs
          node --check supabase/functions/_shared/operational-error.mjs
          node --check scripts/lupa/no-silent-error-scan.mjs
          node --check apps/modulos/hub/scripts/house-inventory-core.mjs
          node --check apps/modulos/hub/scripts/generate-house-inventory.mjs

          tests=(
            scripts/memory-linker/dream-review.test.mjs
            scripts/memory-linker/pattern-discovery.test.mjs
            scripts/memory-linker/pattern-library.test.mjs
            scripts/memory-linker/memory-reserve-events.test.mjs
            scripts/memory-linker/dream-review-run.test.mjs
            scripts/memory-linker/artifact-capability.test.mjs
            scripts/memory-linker/fs-safe.test.mjs
            scripts/memory-linker/delta-core.test.mjs
            scripts/memory-linker/source-delta-wiring.test.mjs
            apps/bot-telegram/skills/externas/obsidian-writer.test.cjs
            apps/bot-telegram/skills/externas/memoria-longa.test.cjs
            apps/modulos/mcp/src/admin-patterns-ui.test.mjs
            supabase/functions/_shared/source-delta.test.mjs
            supabase/functions/_shared/operational-error.test.mjs
            scripts/lupa/no-silent-error-scan.test.mjs
          )
          for test_file in "${tests[@]}"; do
            echo "MEMORY_TEST_FILE=${test_file}"
            set +e
            output="$(node --test "${test_file}" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "${output}"
            if [ "${status}" -ne 0 ]; then
              detail="$(printf '%s\n' "${output}" | tail -n 30 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
              echo "::error file=${test_file},title=MEMORY_LINKER_TEST_FAIL::${detail}"
              exit "${status}"
            fi
          done

      - name: Erro silencioso — catraca de novos padrões; dívida antiga explícita
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          BASE_REF="${BASE_SHA:-HEAD^}"
          node scripts/lupa/no-silent-error-scan.mjs --repo-root . --base-ref "${BASE_REF}"

      - name: "HUB — Inventário: gerar + typecheck + build"
        shell: bash
        run: |
          set -euo pipefail
          node apps/modulos/hub/scripts/generate-house-inventory.mjs
          npm --prefix apps/modulos/hub ci --ignore-scripts
          npm --prefix apps/modulos/hub run build

      - name: Semantic Core — fixtures offline + contratos
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "numpy>=1.26" "safetensors>=0.4.5"
          python3 -m unittest discover -s infra/mcp/tests -v

      - name: Receipt determinístico (sempre)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_BLOCKED: ${{ steps.fork_guard.outputs.blocked }}
          FORK_CAUSE: ${{ steps.fork_guard.outputs.cause }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "EXECUTOR=self-hosted"
          echo "ROTA_PRIMARIA=self-hosted-linux"
          echo "ROTA_FALLBACK=BLOCKED_NO_HOSTED"
          echo "KNOWLEDGE_COMPILER_GATE=1"
          echo "MINING_ONCE_CRYSTALLIZE_ONCE_REUSE_N=1"
          echo "DELTA_AFFECTED_ONLY=1"
          echo "JOB_STATUS=${JOB_STATUS}"
          if [ "${FORK_BLOCKED:-}" = "true" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=${FORK_CAUSE:-FORK_HEAD}"
          elif [ "${JOB_STATUS}" = "cancelled" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=CANCELLED_OR_RUNNER_UNAVAILABLE"
          elif [ "${JOB_STATUS}" = "failure" ]; then
            echo "RESULTADO=FAIL"
          elif [ "${JOB_STATUS}" = "success" ]; then
            echo "RESULTADO=PASS"
          else
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=UNKNOWN_STATUS_${JOB_STATUS}"
          fi
          # UNKNOWN/SKIPPED/empty never promoted as PASS by this receipt alone

  canonical-visual-posters:
    name: Cartazes canônicos — hashes e elos semânticos
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Contraprova do cânone visual
        shell: bash
        run: |
          set -euo pipefail
          node --check .agents/skills/visual-design-method/scripts/validate-canonical-posters.mjs
          node .agents/skills/visual-design-method/scripts/validate-canonical-posters.mjs
          node --test tests/canonical-posters.test.mjs tests/bolt-theme-contract.test.mjs
