name: lupa-conformance

on:
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate obrigatório da META LUPA
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          base_ref="$(git rev-parse origin/main)"
          base_sha="$(git rev-parse "$base_ref:.agents/skills/meta-lupa")"
          head_sha="$(git rev-parse HEAD)"
          trusted="$RUNNER_TEMP/meta_lupa_gate.py"
          git show "$base_ref:.agents/skills/meta-lupa/scripts/meta_lupa.py" > "$trusted"
          receipt="$RUNNER_TEMP/meta-lupa-gate.json"
          python3 "$trusted" issue-gate-receipt --repo-root "$GITHUB_WORKSPACE" \
            --repo ServerVpss/CentralDark --mission-id "${GITHUB_WORKFLOW}-${GITHUB_RUN_ID}" \
             --workspace-head "$head_sha" --canonical-ref "$base_ref" --expected-canonical-sha "$base_sha" --output "$receipt"
          python3 "$trusted" gate --repo-root "$GITHUB_WORKSPACE" --input "$receipt" \
             --canonical-ref "$base_ref" --expected-canonical-sha "$base_sha" --expected-head-sha "$head_sha" --operation workflow

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar pytest
        run: pip install pytest
      - name: Validar hash canônico da Lupa
        run: python scripts/lupa/validar_autolupa_hash.py
      - name: Rodar testes de conformidade (fixture PASS)
        env:
          AUTOLUPA_REPORT: .agents/skills/meta-lupa/testes/fixtures/exemplo_ok.md
        run: pytest .agents/skills/meta-lupa/testes/test_autolupa_conformance.py -v

      # A partir daqui: evidência que antes era declarada à mão no corpo do PR
      # e nunca executada por nenhum check. Ver PR #410.
      - name: Motor determinístico (test_lupa.py)
        working-directory: .agents/skills/meta-lupa
        run: python testes/test_lupa.py
      - name: Guardrail do selo de ponto fixo (exige AutoLupa executada)
        working-directory: .agents/skills/meta-lupa
        run: python guardrails/validar_selo_ponto_fixo.py
      - name: Regressão do selo e do recibo de XP
        working-directory: .agents/skills/meta-lupa
        run: python testes/test_selo_ponto_fixo.py
