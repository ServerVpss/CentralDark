name: lupa-conformance

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: pr585-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 585 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'segredounlock'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout da branch real do PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/modo-operacional-loop-evidencia-20260731
          fetch-depth: 0

      - name: Provar HEAD exato
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: Aplicar correção preparada
        run: python scripts/temporary/pr585_fix_operation_receipt.py

      - name: Instalar pytest
        run: python -m pip install pytest

      - name: Validar correção completa
        run: |
          set -euo pipefail
          python -m py_compile .agents/skills/meta-lupa/scripts/meta_lupa.py
          python scripts/lupa/validar_autolupa_hash.py
          pytest .agents/skills/meta-lupa/testes -q
          git diff --check

      - name: Limpar instrumentos e publicar HEAD corrigido
        run: |
          set -euo pipefail
          rm -f scripts/temporary/pr585_fix_operation_receipt.py
          rm -f .github/workflows/pr585-autofix-temporary.yml
          git config user.name 'centraldark-repair[bot]'
          git config user.email 'centraldark-repair[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(meta-lupa): fechar falhas do operation receipt'
          git push origin HEAD:docs/modo-operacional-loop-evidencia-20260731
