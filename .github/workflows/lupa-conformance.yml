name: lupa-conformance

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lupa-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - name: Instalar pytest
        run: pip install pytest
      - name: Provar baseline canônico no BASE_SHA
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/meta-lupa-base"
          BASE_BRANCH="meta-lupa-baseline-$GITHUB_RUN_ID"
          trap 'git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true' EXIT
          git worktree add -b "$BASE_BRANCH" "$BASE_DIR" "$BASE_SHA"
          cd "$BASE_DIR"
          python scripts/lupa/validar_autolupa_hash.py
          AUTOLUPA_REPORT=.agents/skills/meta-lupa/testes/fixtures/exemplo_ok.md \
            pytest .agents/skills/meta-lupa/testes/test_autolupa_conformance.py -v
          (cd .agents/skills/meta-lupa && python testes/test_lupa.py)
          pytest .agents/skills/meta-lupa/testes/test_operation_receipt_validator.py -v
          (cd .agents/skills/meta-lupa && python guardrails/validar_selo_ponto_fixo.py)
          (cd .agents/skills/meta-lupa && python testes/test_selo_ponto_fixo.py)
          echo "BASELINE_SHA=$BASE_SHA"
          echo "BASELINE_EXISTING_SUITE=PASS"
      - name: Validar hash canônico da Lupa
        run: python scripts/lupa/validar_autolupa_hash.py
      - name: Provar Gate Final Adversarial
        run: |
          python - <<'PY'
          from pathlib import Path

          skill = Path('.agents/skills/meta-lupa/SKILL.md').read_text(encoding='utf-8')
          required = (
              '### 10. Executar o Gate Final Adversarial',
              '### 11. Selecionar revisão proporcional ao ambiente',
              'GATE_FINAL_ADVERSARIAL=PASS|FAIL|UNPROVEN',
              'ZERO_REGRESSION=PASS|FAIL|UNPROVEN',
              r'T_{\mathrm{baseline\_pass}}',
              r'\Delta_{\mathrm{outside\_scope}}=\varnothing',
              'PONTO_FIXO_ATINGIDO não é PASS.',
              'O executor nunca aprova a si mesmo.',
              'Não cria outra skill',
              'GATE FINAL ADVERSARIAL:',
              'CLAIMS REPRODUZIDAS:',
              'BASELINE/DIFF:',
              'ZERO REGRESSION:',
              'JUDGE INDEPENDENTE:',
              'CONTRAPROVA FINAL:',
          )
          missing = [token for token in required if token not in skill]
          if missing:
              raise SystemExit(f'Gate Final incompleto; tokens ausentes: {missing}')

          autolupa = skill.index('### 9. Executar a AutoLupa')
          gate = skill.index('### 10. Executar o Gate Final Adversarial')
          review = skill.index('### 11. Selecionar revisão proporcional ao ambiente')
          output = skill.index('## Saída obrigatória')
          if not autolupa < gate < review < output:
              raise SystemExit('Ordem canônica inválida: AutoLupa → Gate Final → revisão → saída')

          if 'Fable permanece `EXPERIMENTAL_FAIL_CLOSED`, fora do\nroteamento padrão' not in skill:
              raise SystemExit('Regressão: Fable deixou de permanecer experimental e fora do roteamento')

          print('GATE_FINAL_ADVERSARIAL_CONTRACT=PASS')
          print('GATE_FINAL_ORDER=PASS')
          print('FABLE_DEPENDENCY=NAO')
          PY
      - name: Rodar testes de conformidade no HEAD
        env:
          AUTOLUPA_REPORT: .agents/skills/meta-lupa/testes/fixtures/exemplo_ok.md
        run: pytest .agents/skills/meta-lupa/testes/test_autolupa_conformance.py -v
      - name: Motor determinístico no HEAD
        working-directory: .agents/skills/meta-lupa
        run: python testes/test_lupa.py
      - name: Validador e promotor do OPERATION_RECEIPT no HEAD
        run: pytest .agents/skills/meta-lupa/testes/test_operation_receipt_validator.py -v
      - name: Guardrail do selo de ponto fixo no HEAD
        working-directory: .agents/skills/meta-lupa
        run: python guardrails/validar_selo_ponto_fixo.py
      - name: Regressão do selo e do recibo de XP no HEAD
        working-directory: .agents/skills/meta-lupa
        run: python testes/test_selo_ponto_fixo.py
      - name: Selar comparação BASE versus HEAD
        if: github.event_name == 'pull_request'
        run: |
          echo "HEAD_SHA=$(git rev-parse HEAD)"
          echo "BASELINE_EXISTING_SUITE=PASS"
          echo "HEAD_EXISTING_SUITE=PASS"
          echo "NEW_GATE_CONTRACT=PASS"
          echo "ZERO_REGRESSION=PASS"
      - name: Exportar fontes para correção adversarial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-lupa-fontes-${{ github.run_id }}
          path: |
            .agents/skills/meta-lupa/scripts/meta_lupa.py
            .agents/skills/meta-lupa/testes/test_lupa.py
            .agents/skills/meta-lupa/SKILL.md
            .github/workflows/lupa-conformance.yml
          if-no-files-found: error
          retention-days: 1
