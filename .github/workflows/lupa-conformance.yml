name: lupa-conformance

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lupa-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:

      - name: Bloquear HEAD de fork no runner persistente
        id: fork_guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "cause=FORK_HEAD" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_FORK_HEAD repo=${HEAD_REPO:-empty}"
            exit 1
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "FORK_GUARD_OK ${HEAD_REPO}"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      # O checkout continua preso ao SHA imutável. Esta etapa só dá ao Git local
      # a identidade de branch já provada pelo evento, porque o OPERATION_RECEIPT
      # fail-closed exige branch explícita e `git branch --show-current` é vazio
      # em detached HEAD. A branch local nunca é fonte do conteúdo e não é pushada.
      - name: Vincular branch esperada ao SHA exato
        shell: bash
        env:
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_BRANCH}" ]; then
            echo "OPERATION_RECEIPT_EXPECTED_BRANCH_MISSING"
            exit 1
          fi
          git check-ref-format --branch "${EXPECTED_BRANCH}" >/dev/null
          BEFORE_SHA="$(git rev-parse HEAD)"
          if [ "${BEFORE_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "OPERATION_RECEIPT_HEAD_MISMATCH expected=${EXPECTED_SHA} actual=${BEFORE_SHA}"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/heads/${EXPECTED_BRANCH}"; then
            git branch -f "${EXPECTED_BRANCH}" "${EXPECTED_SHA}"
          else
            git branch "${EXPECTED_BRANCH}" "${EXPECTED_SHA}"
          fi
          git switch "${EXPECTED_BRANCH}" >/dev/null
          AFTER_SHA="$(git rev-parse HEAD)"
          ACTUAL_BRANCH="$(git branch --show-current)"
          if [ "${AFTER_SHA}" != "${EXPECTED_SHA}" ] || [ "${ACTUAL_BRANCH}" != "${EXPECTED_BRANCH}" ]; then
            echo "OPERATION_RECEIPT_BRANCH_BINDING_FAILED expected_branch=${EXPECTED_BRANCH} actual_branch=${ACTUAL_BRANCH:-empty} expected_sha=${EXPECTED_SHA} actual_sha=${AFTER_SHA}"
            exit 1
          fi
          echo "OPERATION_RECEIPT_BRANCH_BINDING=PASS"
          echo "EXPECTED_BRANCH=${EXPECTED_BRANCH}"
          echo "HEAD_SHA=${AFTER_SHA}"

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - name: Instalar pytest
        run: pip install pytest
      - name: Provar baseline canônico no BASE_SHA
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/meta-lupa-base"
          BASE_BRANCH="meta-lupa-baseline-$GITHUB_RUN_ID"
          trap 'git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true' EXIT
          git worktree add -b "$BASE_BRANCH" "$BASE_DIR" "$BASE_SHA"
          cd "$BASE_DIR"
          python scripts/lupa/validar_autolupa_hash.py
          AUTOLUPA_REPORT=.agents/skills/meta-lupa/testes/fixtures/exemplo_ok.md \
            pytest .agents/skills/meta-lupa/testes/test_autolupa_conformance.py -v
          (cd .agents/skills/meta-lupa && python testes/test_lupa.py)
          pytest .agents/skills/meta-lupa/testes/test_operation_receipt_validator.py -v
          (cd .agents/skills/meta-lupa && python guardrails/validar_selo_ponto_fixo.py)
          (cd .agents/skills/meta-lupa && python testes/test_selo_ponto_fixo.py)
          echo "BASELINE_SHA=$BASE_SHA"
          echo "BASELINE_EXISTING_SUITE=PASS"
      - name: Validar hash canônico da Lupa
        run: python scripts/lupa/validar_autolupa_hash.py
      - name: Provar Gate Final Adversarial
        run: |
          python - <<'PY'
          from pathlib import Path

          skill = Path('.agents/skills/meta-lupa/SKILL.md').read_text(encoding='utf-8')
          required = (
              '### 10. Executar o Gate Final Adversarial',
              '### 11. Selecionar revisão proporcional ao ambiente',
              'GATE_FINAL_ADVERSARIAL=PASS|FAIL|UNPROVEN',
              'ZERO_REGRESSION=PASS|FAIL|UNPROVEN',
              r'T_{\mathrm{baseline\_pass}}',
              r'\Delta_{\mathrm{outside\_scope}}=\varnothing',
              'PONTO_FIXO_ATINGIDO não é PASS.',
              'O executor nunca aprova a si mesmo.',
              'Não cria outra skill',
              'GATE FINAL ADVERSARIAL:',
              'CLAIMS REPRODUZIDAS:',
              'BASELINE/DIFF:',
              'ZERO REGRESSION:',
              'JUDGE INDEPENDENTE:',
              'CONTRAPROVA FINAL:',
          )
          missing = [token for token in required if token not in skill]
          if missing:
              raise SystemExit(f'Gate Final incompleto; tokens ausentes: {missing}')

          autolupa = skill.index('### 9. Executar a AutoLupa')
          gate = skill.index('### 10. Executar o Gate Final Adversarial')
          review = skill.index('### 11. Selecionar revisão proporcional ao ambiente')
          output = skill.index('## Saída obrigatória')
          if not autolupa < gate < review < output:
              raise SystemExit('Ordem canônica inválida: AutoLupa → Gate Final → revisão → saída')

          if 'Fable permanece `EXPERIMENTAL_FAIL_CLOSED`, fora do\nroteamento padrão' not in skill:
              raise SystemExit('Regressão: Fable deixou de permanecer experimental e fora do roteamento')

          print('GATE_FINAL_ADVERSARIAL_CONTRACT=PASS')
          print('GATE_FINAL_ORDER=PASS')
          print('FABLE_DEPENDENCY=NAO')
          PY
      - name: Rodar testes de conformidade no HEAD
        env:
          AUTOLUPA_REPORT: .agents/skills/meta-lupa/testes/fixtures/exemplo_ok.md
        run: pytest .agents/skills/meta-lupa/testes/test_autolupa_conformance.py -v
      - name: Motor determinístico no HEAD
        working-directory: .agents/skills/meta-lupa
        run: python testes/test_lupa.py
      - name: Validador e promotor do OPERATION_RECEIPT no HEAD
        run: pytest .agents/skills/meta-lupa/testes/test_operation_receipt_validator.py -v
      - name: Guardrail do selo de ponto fixo no HEAD
        working-directory: .agents/skills/meta-lupa
        run: python guardrails/validar_selo_ponto_fixo.py
      - name: Regressão do selo e do recibo de XP no HEAD
        working-directory: .agents/skills/meta-lupa
        run: python testes/test_selo_ponto_fixo.py
      - name: Selar comparação BASE versus HEAD
        if: github.event_name == 'pull_request'
        run: |
          echo "HEAD_SHA=$(git rev-parse HEAD)"
          echo "BASELINE_EXISTING_SUITE=PASS"
          echo "HEAD_EXISTING_SUITE=PASS"
          echo "NEW_GATE_CONTRACT=PASS"
          echo "ZERO_REGRESSION=PASS"
      - name: Expor identidade da árvore para commit atômico
        run: echo "HEAD_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Exportar fontes para correção adversarial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-lupa-fontes-${{ github.run_id }}
          path: |
            .agents/skills/meta-lupa/scripts/meta_lupa.py
            .agents/skills/meta-lupa/testes/test_lupa.py
            .agents/skills/meta-lupa/SKILL.md
            .github/workflows/lupa-conformance.yml
          if-no-files-found: error
          retention-days: 1

      - name: Receipt determinístico (sempre)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_BLOCKED: ${{ steps.fork_guard.outputs.blocked }}
          FORK_CAUSE: ${{ steps.fork_guard.outputs.cause }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "EXECUTOR=self-hosted"
          echo "ROTA_PRIMARIA=self-hosted-linux"
          echo "ROTA_FALLBACK=BLOCKED_NO_HOSTED"
          echo "JOB_STATUS=${JOB_STATUS}"
          if [ "${FORK_BLOCKED:-}" = "true" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=${FORK_CAUSE:-FORK_HEAD}"
          elif [ "${JOB_STATUS}" = "cancelled" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=CANCELLED_OR_RUNNER_UNAVAILABLE"
          elif [ "${JOB_STATUS}" = "failure" ]; then
            echo "RESULTADO=FAIL"
          elif [ "${JOB_STATUS}" = "success" ]; then
            echo "RESULTADO=PASS"
          else
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=UNKNOWN_STATUS_${JOB_STATUS}"
          fi
          # UNKNOWN/SKIPPED/empty never promoted as PASS by this receipt alone
