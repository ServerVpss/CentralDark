name: lupa-conformance

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: pr585-ledger-correction-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  correct-ledger:
    if: >-
      github.event.pull_request.number == 585 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'segredounlock'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout da branch real
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/modo-operacional-loop-evidencia-20260731
          fetch-depth: 2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: Acrescentar correções append-only
        run: python scripts/temporary/pr585_append_ledger_corrections.py

      - name: Validar ledger e regressões críticas
        run: |
          set -euo pipefail
          python .agents/skills/meta-lupa/scripts/ledger_check.py --ledger .agents/skills/meta-lupa/references/uso-ledger.jsonl
          python -m pip install pytest
          pytest .agents/skills/meta-lupa/testes/test_ledger_check.py .agents/skills/meta-lupa/testes/test_operation_receipt_validator.py -q
          git diff --check

      - name: Publicar somente ledger e remover instrumento
        run: |
          set -euo pipefail
          rm -f scripts/temporary/pr585_append_ledger_corrections.py
          git config user.name 'centraldark-ledger[bot]'
          git config user.email 'centraldark-ledger[bot]@users.noreply.github.com'
          git add .agents/skills/meta-lupa/references/uso-ledger.jsonl
          git add scripts/temporary/pr585_append_ledger_corrections.py
          git diff --cached --check
          git commit -m 'fix(meta-lupa): corrigir receipts históricos append-only'
          git push origin HEAD:docs/modo-operacional-loop-evidencia-20260731
