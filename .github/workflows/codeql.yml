name: 🔐 CodeQL — análise semântica e segurança

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 🔎 CodeQL (${{ matrix.language }})
    runs-on: [self-hosted, Linux]
    if: github.repository == 'ServerVpss/CentralDark' && (github.event.repository.private == false || vars.CENTRALDARK_CODEQL_PRIVATE_LICENSED == 'true')
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]

    steps:
      - name: 📥 Checkout exato
        uses: actions/checkout@v7

      - name: 🧠 Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: 🔬 Analisar e publicar SARIF
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  entitlement-receipt:
    name: 🧾 CodeQL privado — licença e capacidade
    runs-on: [self-hosted, Linux]
    if: always()
    steps:
      - name: ⚖️ Declarar estado sem falso-verde
        shell: bash
        env:
          PRIVATE: ${{ github.event.repository.private }}
          LICENSED: ${{ vars.CENTRALDARK_CODEQL_PRIVATE_LICENSED }}
        run: |
          set -euo pipefail
          echo "REPOSITORY_PRIVATE=${PRIVATE:-UNKNOWN}"
          echo "CENTRALDARK_CODEQL_PRIVATE_LICENSED=${LICENSED:-UNKNOWN}"
          echo "UNKNOWN_IS_NOT_PASS=true"
          if [ "${PRIVATE:-true}" = "true" ] && [ "${LICENSED:-false}" != "true" ]; then
            echo "CODEQL_PRIVATE_STATUS=BLOCKED_LICENSE"
          else
            echo "CODEQL_PRIVATE_STATUS=ELIGIBLE_TO_RUN"
          fi
