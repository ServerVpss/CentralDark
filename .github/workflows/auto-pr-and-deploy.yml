name: ⚙️ Auto PR + Micro Deploy

on:
  push:
    branches:
      - 'feat/**'

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  create_pr_and_deploy:
    runs-on: [self-hosted, Linux]
    steps:
      - name: 🔹 Checkout
        uses: actions/checkout@v4

      - name: 🔹 Ensure PR exists (create if missing)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROMOTION_TOKEN }}
          script: |
            const branch = process.env.GITHUB_REF.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prs = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}` });
            if (prs.data.length === 0) {
              const bodyPath = '.github/PR_BODY.md';
              let body = '';
              try {
                body = require('fs').readFileSync(bodyPath, 'utf8');
              } catch (e) {
                body = 'Auto-generated PR for ' + branch;
              }
              await github.rest.pulls.create({ owner, repo, title: `Auto PR: ${branch}`, head: branch, base: 'main', body });
              core.info(`Created PR for ${branch}`);
            } else {
              core.info(`PR already exists for ${branch}: ${prs.data[0].html_url}`);
            }

      - name: 🔹 Run tests (if present)
        run: |
          if [ -f ./scripts/test.sh ]; then
            chmod +x ./scripts/test.sh
            ./scripts/test.sh
          else
            echo "No test.sh found, skipping tests"
          fi

      - name: 🔹 Micro deploy (dry-run)
        env:
          DRY_RUN: true
        run: |
          chmod +x ./scripts/micro_deploy.sh || true
          ./scripts/micro_deploy.sh "$GITHUB_REF" "$GITHUB_SHA"

      - name: 🔹 Upload deploy log
        id: artifact_mirror_auto_pr_and_deploy_1
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: micro-deploy-log
          path: files/deploy-*.log

      - name: 🔹 Classificar espelho de artifact
        if: always()
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ steps.artifact_mirror_auto_pr_and_deploy_1.outcome }}
        run: |
          set -euo pipefail
          if [ "${UPLOAD_OUTCOME:-}" = "success" ]; then
            echo "ARTIFACT_MIRROR=PASS"
          elif [ "${UPLOAD_OUTCOME:-}" = "failure" ]; then
            echo "ARTIFACT_MIRROR=DEGRADED"
          else
            echo "ARTIFACT_MIRROR=UNKNOWN"
          fi
