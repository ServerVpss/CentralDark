name: PR611 Reconcile Runner

on:
  pull_request_target:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr611-reconcile-runner
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.number == 611 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'segredounlock'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout da branch do PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/acorda-rebuilder-20260801
          fetch-depth: 0

      - name: Buscar main vigente
        run: git fetch origin main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconciliar e testar
        run: |
          set -euo pipefail
          python scripts/temporary/pr611_reconcile_main.py
          node --test scripts/lupa/agentic-school-loader.test.mjs
          node --test scripts/lupa/agentic-loop-progress.test.mjs
          node --test scripts/lupa/validar-relato-pivete.test.mjs
          node --test apps/modulos/mapeamento/tests/validar-mapa.test.mjs
          python scripts/lupa/validar_autolupa_hash.py
          python scripts/lupa/test_validar_agentic_visual_package.py
          node scripts/lupa/agentic-school-loader.mjs --json
          python scripts/lupa/validar_agentic_visual_package.py --json
          node scripts/lupa/validar-porta-de-entrada.mjs
          git diff --check

      - name: Publicar merge na mesma branch
        run: |
          set -euo pipefail
          rm -f scripts/temporary/pr611_reconcile_main.py
          git add -A
          git diff --cached --check
          git config user.name 'centraldark-reconcile[bot]'
          git config user.email 'centraldark-reconcile[bot]@users.noreply.github.com'
          git commit -m 'reconcile(agentic): integrar main e preservar escola canônica'
          git push origin HEAD:docs/acorda-rebuilder-20260801

      - name: Registrar bloqueio real com run observável
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment 611 --body "<!-- pr611-reconcile-error -->
          ## Reconciliação automática bloqueada

          Nenhuma alteração parcial foi publicada. Run exato: ${RUN_URL}"
