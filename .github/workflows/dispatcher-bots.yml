name: dispatcher-bots

# Issues e PRs usam somente labels canônicas em MAIÚSCULAS.
# Label roteia CAPACIDADE; nome de modelo/agente é somente proveniência e nunca gate.

on:
  issues:
    types: [labeled, opened]
  pull_request_target:
    types: [labeled, opened, reopened]

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: dispatcher-bots-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rotear:
    if: >-
      (github.event_name == 'issues' && (
        contains(github.event.issue.labels.*.name, '🤖 IA-PESQUISAR') ||
        contains(github.event.issue.labels.*.name, '🤖 IA-REVISAR') ||
        contains(github.event.issue.labels.*.name, '🤖 IA-VALIDAR') ||
        contains(github.event.issue.labels.*.name, '🤖 IA-DOCUMENTAR') ||
        contains(github.event.issue.labels.*.name, '🤖 IA-EXECUTAR') ||
        contains(github.event.issue.labels.*.name, '🤖 IA-INFRA') ||
        contains(github.event.issue.labels.*.name, '🤖 IA-FRONTEND') ||
        contains(github.event.issue.labels.*.name, '🤖 AGENTIC-DEVOPS') ||
        contains(github.event.issue.labels.*.name, '🔧 SELF-HEAL')
      )) ||
      (github.event_name == 'pull_request_target' && (
        contains(github.event.pull_request.labels.*.name, '🤖 IA-PESQUISAR') ||
        contains(github.event.pull_request.labels.*.name, '🤖 IA-REVISAR') ||
        contains(github.event.pull_request.labels.*.name, '🤖 IA-VALIDAR') ||
        contains(github.event.pull_request.labels.*.name, '🤖 IA-DOCUMENTAR') ||
        contains(github.event.pull_request.labels.*.name, '🤖 IA-EXECUTAR') ||
        contains(github.event.pull_request.labels.*.name, '🤖 IA-INFRA') ||
        contains(github.event.pull_request.labels.*.name, '🤖 IA-FRONTEND') ||
        contains(github.event.pull_request.labels.*.name, '🤖 AGENTIC-DEVOPS') ||
        contains(github.event.pull_request.labels.*.name, '🔧 SELF-HEAL')
      ))
    runs-on: [self-hosted, Linux]
    steps:
      - name: Postar briefing idempotente
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const subject = context.payload.issue || context.payload.pull_request;
            const labels = subject.labels.map((label) => label.name);
            const issue_number = subject.number;
            const kind = context.payload.pull_request ? 'PR' : 'Issue';
            const briefings = [
              ['🤖 IA-PESQUISAR', 'Pesquisar contexto e evidência antes de concluir; sem mutação por padrão.'],
              ['🤖 IA-REVISAR', 'Revisar o escopo e apontar risco, regressão, duplicação e lacunas de prova.'],
              ['🤖 IA-VALIDAR', 'Validar com teste, contraprova e estado observável; UNKNOWN nunca vira PASS.'],
              ['🤖 IA-DOCUMENTAR', 'Documentar somente fatos observados, proveniência, receipt e NEXT_CURSOR.'],
              ['🤖 IA-EXECUTAR', 'Executar somente dentro do Writer-Scope e da autoridade já concedida; modelo é substituível.'],
              ['🤖 IA-INFRA', 'Capacidade de infra/VPS: medir superfície, permissão e owner antes de mutar; restart/deploy/reset exigem autorização aplicável.'],
              ['🤖 IA-FRONTEND', 'Capacidade de frontend: patch mínimo, build/test e zero regressão no owner existente.'],
              ['🤖 AGENTIC-DEVOPS', 'Orquestrar capacidades por escopo e lease, nunca por marca ou nome de modelo.'],
              ['🔧 SELF-HEAL', 'Aplicar recuperação determinística no cone causal medido, com rollback e receipt.'],
            ];

            let comments;
            try {
              comments = await github.paginate(github.rest.issues.listComments, {owner:context.repo.owner,repo:context.repo.repo,issue_number,per_page:100});
            } catch (error) {
              if (kind !== 'PR' || error.status !== 403) throw error;
              comments = await github.paginate(github.rest.pulls.listReviews, {owner:context.repo.owner,repo:context.repo.repo,pull_number:issue_number,per_page:100});
            }

            for (const [label, text] of briefings) {
              if (!labels.includes(label)) continue;
              const marker = `<!-- dispatcher-bots:${label} -->`;
              const alreadyPosted = comments.some((comment) => {
                const owned = comment.user?.login === 'github-actions[bot]' || comment.performed_via_github_app?.slug === 'github-actions';
                return owned && comment.body?.includes(marker);
              });
              if (alreadyPosted) continue;
              const body = [
                marker,
                `🤖 **Dispatcher CentralDark** — ${kind} roteado por \`${label}\`.`,
                '',
                '**Regra:** capability/scope escolhem executor; nome de modelo é somente proveniência.',
                '**Anti-loop:** atualizar a ferida material existente; não criar eco/issue paralela.',
                '',
                text,
              ].join('\n');
              try {
                await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number,body});
              } catch (error) {
                if (kind !== 'PR' || error.status !== 403) throw error;
                await github.rest.pulls.createReview({owner:context.repo.owner,repo:context.repo.repo,pull_number:issue_number,body,event:'COMMENT'});
              }
            }
