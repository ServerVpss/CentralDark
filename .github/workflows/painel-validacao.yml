name: painel-validacao

# Valida painel-data.json e cada endpoint declarado em liveStatus.
# Gera relatório verde/amarelo/vermelho. Roda daily e sob demanda.

on:
  schedule:
    - cron: '15 8 * * *'  # 05:15 BRT
  workflow_dispatch:
  push:
    paths:
      - 'apps/modulos/status/painel-data.json'
      - 'scripts/validar-painel-vivo.mjs'
      - '.github/workflows/painel-validacao.yml'

permissions:
  contents: write

concurrency:
  group: painel-validacao
  cancel-in-progress: false

jobs:
  validar:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validar
        run: node scripts/validar-painel-vivo.mjs
      - name: Commit relatório sem falso verde
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CentralDark Painel'
          git config user.email 'actions@github.com'
          git add -- docs/RELATORIOS/painel-vivo-validacao
          if git diff --cached --quiet; then
            echo 'PAINEL_VALIDACAO_NO_CHANGE=1'
            exit 0
          fi
          git commit -m "chore(painel): validação ${{ github.run_id }}

          Co-authored-by: SegredoiDev <segredounlock@users.noreply.github.com>"

          BASE_SHA=$(git rev-parse HEAD^)
          git fetch --no-tags origin main
          REMOTE_SHA=$(git rev-parse FETCH_HEAD)
          if [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
            echo "PAINEL_VALIDACAO_BLOCKED_DIVERGENCE base=$BASE_SHA remote=$REMOTE_SHA"
            exit 1
          fi
          echo "🚪 Gate global pré-main"
          node scripts/lupa/validar-continuidade-global.mjs
          node scripts/lupa/validar-porta-de-entrada.mjs
          git push origin HEAD:main
