name: painel-validacao

# Valida painel-data.json e cada endpoint declarado em liveStatus.
# Gera relatório verde/amarelo/vermelho. Roda daily e sob demanda.

on:
  schedule:
    - cron: '15 8 * * *'  # 05:15 BRT
  workflow_dispatch:
  push:
    paths:
      - 'CentralDark/apps/projeto-dashboard/painel-data.json'
      - 'scripts/validar-painel-vivo.mjs'

permissions:
  contents: write

jobs:
  validar:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gate obrigatório da META LUPA
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          base_ref="$(git rev-parse origin/main)"
          base_sha="$(git rev-parse "$base_ref:.agents/skills/meta-lupa")"
          head_sha="$(git rev-parse HEAD)"
          trusted="$RUNNER_TEMP/meta_lupa_gate.py"
          git show "$base_ref:.agents/skills/meta-lupa/scripts/meta_lupa.py" > "$trusted"
          receipt="$RUNNER_TEMP/meta-lupa-gate.json"
          python3 "$trusted" issue-gate-receipt --repo-root "$GITHUB_WORKSPACE" --repo ServerVpss/CentralDark \
            --mission-id "${GITHUB_WORKFLOW}-${GITHUB_RUN_ID}" --workspace-head "$head_sha" --canonical-ref "$base_ref" \
            --expected-canonical-sha "$base_sha" --output "$receipt"
          python3 "$trusted" gate --repo-root "$GITHUB_WORKSPACE" --input "$receipt" \
            --canonical-ref "$base_ref" --expected-canonical-sha "$base_sha" --expected-head-sha "$head_sha" --operation push
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Validar
        run: node scripts/validar-painel-vivo.mjs
      - name: Commit relatório
        run: |
          git config user.name 'CentralDark Painel'
          git config user.email 'actions@github.com'
          git add -- docs/RELATORIOS/painel-vivo-validacao 2>/dev/null || true
          git commit -m "chore(painel): validação ${{ github.run_id }}

          Co-authored-by: SegredoiDev <segredounlock@users.noreply.github.com>" || exit 0
          git push || true
