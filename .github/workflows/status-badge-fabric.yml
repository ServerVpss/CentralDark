name: 🏷️ Status Badge Fabric

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/generate_status_badges.py'

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: status-badge-fabric
  cancel-in-progress: true

jobs:
  regenerate:
    name: 🧩 Regenerar índice total de badges
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: 🔹 Checkout confiável da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🔹 Gerar Badge Fabric determinística
        run: python3 scripts/ci/generate_status_badges.py

      - name: 🔹 Validar invariantes anti-falso-verde
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'BADGE_IS_TELEMETRY_NOT_PROOF=true' docs/STATUS-BADGES.md
          grep -Fq 'UNKNOWN_IS_NOT_PASS=true' docs/STATUS-BADGES.md
          grep -Fq 'SAME_HEAD_PROOF_REQUIRED_FOR_CI_CLAIM=true' docs/STATUS-BADGES.md

      - name: 🔹 Detectar delta
        id: delta
        shell: bash
        run: |
          if git diff --quiet -- docs/STATUS-BADGES.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'BADGE_FABRIC=REUSE_PROOF_NO_CHANGE'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'BADGE_FABRIC=DELTA_MATERIAL'
          fi

      - name: 🔹 Criar ou atualizar branch determinística
        if: steps.delta.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='automation/status-badge-fabric'
          git config user.name 'CentralDark Badge Fabric'
          git config user.email 'actions@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add docs/STATUS-BADGES.md
          git commit -m '🏷️ docs: sincronizar Status Badge Fabric'
          git push --force-with-lease origin "$BRANCH"

      - name: 🔹 Abrir ou reutilizar PR da Badge Fabric
        if: steps.delta.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='automation/status-badge-fabric'
          EXISTING="$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "BADGE_FABRIC_PR=#$EXISTING"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title '🏷️ Badge Fabric — sincronizar telemetria visual' \
              --body $'Atualização determinística do índice canônico de status badges.\n\nBADGE != PROOF. UNKNOWN != PASS. SAME_HEAD continua obrigatório.'
          fi

      - name: 🔹 Receipt
        shell: bash
        run: |
          echo "BADGE_FABRIC_HEAD=$(git rev-parse HEAD)"
          echo "BADGE_FABRIC_CHANGED=${{ steps.delta.outputs.changed }}"
          echo 'BADGE_FABRIC_MODE=DETERMINISTIC_REGENERATE'
