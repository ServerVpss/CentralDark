name: ⚙️ PR Review — IA local CentralDark

# O review usa o bridge OpenAI-compatible local da VPS.
# O modelo é resolvido no início do job pelo /health; nenhum modelo cloud é fixado.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review with the local CURRENT model"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-agent-local-${{ inputs.pr_number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-local:
    name: "🪬 CentralDark Local AI — current model"
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    if: >-
      github.repository == 'ServerVpss/CentralDark' &&
      (
        github.event_name == 'workflow_dispatch' ||
        !github.event.pull_request.draft
      )
    continue-on-error: false
    env:
      LOCAL_BRIDGE_BASE: http://127.0.0.1:18435/v1
      LOCAL_BRIDGE_HEALTH: http://127.0.0.1:18435/health
      GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🧿 Resolver e provar IA local CURRENT
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 --version
          health="$(curl -fsS --max-time 10 "$LOCAL_BRIDGE_HEALTH")"
          LOCAL_MODEL="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["model"])' <<<"$health")"
          LOCAL_MODEL_SOURCE="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("source", "UNKNOWN"))' <<<"$health")"
          LOCAL_EXECUTION_CLASS="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("execution_class", "UNKNOWN"))' <<<"$health")"
          test -n "$LOCAL_MODEL"
          printf 'LOCAL_MODEL=%s\n' "$LOCAL_MODEL" >> "$GITHUB_ENV"
          printf 'LOCAL_MODEL_SOURCE=%s\n' "$LOCAL_MODEL_SOURCE" >> "$GITHUB_ENV"
          printf 'LOCAL_EXECUTION_CLASS=%s\n' "$LOCAL_EXECUTION_CLASS" >> "$GITHUB_ENV"
          printf 'LOCAL_BRIDGE_HEALTH=%s\n' "$LOCAL_BRIDGE_HEALTH" >> "$GITHUB_ENV"
          printf 'LOCAL_BRIDGE_HEALTH=PASS\n'
          printf 'RUNNER_NAME=%s\n' "$RUNNER_NAME"
          printf 'LOCAL_MODEL=%s\n' "$LOCAL_MODEL"
          printf 'LOCAL_MODEL_SOURCE=%s\n' "$LOCAL_MODEL_SOURCE"
          printf 'LOCAL_EXECUTION_CLASS=%s\n' "$LOCAL_EXECUTION_CLASS"

      - name: 🐍 Preparar PR-Agent isolado
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          : "${GITHUB_ENV:?GITHUB_ENV is required}"
          free_kib="$(df -Pk "$RUNNER_TEMP" | awk 'END {print $4}')"
          printf 'DISK_AVAILABLE_MIB=%s\n' "$((free_kib / 1024))"
          if (( free_kib < 1048576 )); then
            echo 'PR_AGENT_DISK_BLOCKED: less than 1 GiB available for isolated dependencies'
            exit 1
          fi
          # O runner nao possui ensurepip; aproveitar pip sem mudar Python global.
          # setuptools local completo permite compilar html2text e giteapy legados.
          PR_AGENT_ROOT="$(mktemp -d "$RUNNER_TEMP/centraldark-pr-agent.XXXXXXXX")"
          PR_AGENT_BOOTSTRAP="$PR_AGENT_ROOT/bootstrap"
          PR_AGENT_SITE="$PR_AGENT_ROOT/site"
          mkdir -p "$PR_AGENT_BOOTSTRAP" "$PR_AGENT_SITE"
          env -u PYTHONPATH -u PYTHONHOME python3 -m pip install \
            --disable-pip-version-check --no-cache-dir --target "$PR_AGENT_BOOTSTRAP" \
            'setuptools==78.1.1' 'wheel==0.46.3' --quiet
          env -u PYTHONHOME PYTHONPATH="$PR_AGENT_BOOTSTRAP" python3 -c \
            'import setuptools.build_meta,wheel; print("BUILD_BACKEND=PASS")'
          env -u PYTHONHOME PYTHONPATH="$PR_AGENT_BOOTSTRAP" python3 -m pip install \
            --disable-pip-version-check --no-cache-dir --no-build-isolation \
            --target "$PR_AGENT_SITE" 'pr-agent==0.46.0' --quiet
          env -u PYTHONHOME PYTHONPATH="$PR_AGENT_SITE:$PR_AGENT_BOOTSTRAP" python3 -c \
            'import pr_agent,openai,setuptools.build_meta; print("PR_AGENT_IMPORT=PASS"); print("OPENAI_PATH="+openai.__file__)'
          printf 'PR_AGENT_RUNTIME=target\n' >> "$GITHUB_ENV"
          printf 'PR_AGENT_SITE=%s\n' "$PR_AGENT_SITE" >> "$GITHUB_ENV"
          printf 'PR_AGENT_BOOTSTRAP=%s\n' "$PR_AGENT_BOOTSTRAP" >> "$GITHUB_ENV"

      - name: 🤖 Review pelo modelo local CURRENT
        env:
          CONFIG__AI_PROVIDER: openai
          CONFIG__FALLBACK_MODELS: '[]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '32000'
          CONFIG__MAX_MODEL_TOKENS: '32000'
          OPENAI__API_BASE: ${{ env.LOCAL_BRIDGE_BASE }}
          OPENAI__KEY: local-kylin
        run: |
          set -Eeuo pipefail
          export CONFIG__MODEL="openai/$LOCAL_MODEL"
          PR_NUMBER='${{ inputs.pr_number || github.event.pull_request.number }}'
          PR_URL="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "LOCAL_MODEL=$LOCAL_MODEL"
          echo "LOCAL_MODEL_SOURCE=$LOCAL_MODEL_SOURCE"
          echo "LOCAL_EXECUTION_CLASS=$LOCAL_EXECUTION_CLASS"
          echo "PR_URL=$PR_URL"
          echo "🤖 CentralDark Local AI — $LOCAL_MODEL iniciando review..."
          : "${PR_AGENT_SITE:?PR-Agent site must be installed}"
          : "${PR_AGENT_BOOTSTRAP:?PR-Agent build backend must be installed}"
          env -u PYTHONHOME PYTHONPATH="$PR_AGENT_SITE:$PR_AGENT_BOOTSTRAP" \
            python3 -m pr_agent.cli --pr_url="$PR_URL" review
