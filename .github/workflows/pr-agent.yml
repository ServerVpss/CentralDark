          print(f"pr-agent={version('pr-agent')} pyOpenSSL={OpenSSL.__version__} cryptography={cryptography.__version__}")
          PY
          echo "PR_AGENT_PYTHON=$VENV/bin/python" >> "$GITHUB_ENV"
      - name: Review
        env:
          CENTRALDARK_GATEWAY_KEY: ${{ secrets.CENTRALDARK_GATEWAY_KEY || secrets.ANTHROPIC_API_KEY }}
          GITHUB__USER_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
        run: |
