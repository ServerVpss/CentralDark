name: 🧠 Notion Sync (docs/CONSCIENCIA → Notion)
# Espelha automaticamente o conteúdo de docs/CONSCIENCIA/ para o Notion
# usando UPSERT (cria se não existe, atualiza se existe).
## Lei vigente: Git é fonte da verdade. Notion é painel humano.

on:
  push:
    branches: [main]
    paths:
      - 'docs/CONSCIENCIA/**/*.md'
      - 'docs/PENDENCIAS.md'
      - 'scripts/notion-sync/**'
      - '.github/workflows/notion-sync.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo validação (não escreve no Notion, só mostra o que faria)'
        type: boolean
        default: true
      target:
        description: 'O que sincronizar'
        type: choice
        default: all
        options: [all, regras, decisoes, aprendizados, pendencias, estrutura]
      cleanup_orphans:
        description: 'Limpar (arquivar) órfãos no Notion que não existem no Git'
        type: choice
        default: 'no'
        options: ['no', 'dry-run', 'confirm-delete']
      cleanup_target:
        description: 'Bases pra limpar (CSV). Ex: regras,pendencias,decisoes ou all'
        type: string
        default: 'all'

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Espelhar para o Notion
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: 🟢 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar @notionhq/client
        working-directory: scripts/notion-sync
        run: npm install --omit=dev

      - name: 🧠 Executar sync (UPSERT)
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TARGET: ${{ github.event.inputs.target || 'all' }}
          GITHUB_COMMIT: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node scripts/notion-sync/sync.mjs

      - name: 🧹 Cleanup de órfãos (opcional)
        if: github.event.inputs.cleanup_orphans != 'no' && github.event.inputs.cleanup_orphans != ''
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          TARGET: ${{ github.event.inputs.cleanup_target || github.event.inputs.target || 'all' }}
          CONFIRM: ${{ github.event.inputs.cleanup_orphans == 'confirm-delete' && 'YES_DELETE_ORPHANS' || '' }}
          GITHUB_COMMIT: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node scripts/notion-sync/cleanup-orphans.mjs

      - name: 📊 Relatório de consistência (Git ↔ Notion)
        if: always()
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GITHUB_COMMIT: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node scripts/notion-sync/report-consistency.mjs

      - name: 📝 Commitar relatórios + changelog sem falso verde
        if: always() && github.event.inputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "docs/RELATORIOS/notion-sync" ]; then
            echo 'NOTION_REPORT_DIR_ABSENT=1'
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RELATORIOS/notion-sync/
          if git diff --cached --quiet; then
            echo 'NOTION_REPORT_NO_CHANGE=1'
            exit 0
          fi

          git commit -m "chore(notion-sync): relatório + changelog [skip ci]" \
            -m "Commit-fonte: ${{ github.sha }}" \
            -m "Disparado por: ${{ github.actor }}"

          BASE_SHA=$(git rev-parse HEAD^)
          git fetch --no-tags origin main
          REMOTE_SHA=$(git rev-parse FETCH_HEAD)
          if [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
            echo "NOTION_REPORT_BLOCKED_DIVERGENCE base=$BASE_SHA remote=$REMOTE_SHA"
            exit 1
          fi
          echo "🚪 Gate global pré-main"
          node scripts/lupa/validar-continuidade-global.mjs
          node scripts/lupa/validar-porta-de-entrada.mjs
          git push origin HEAD:main
