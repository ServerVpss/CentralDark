name: Instalar Cloudflare Origin Certificate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite CONFIRMO para instalar o cert"
        required: true

jobs:
  install-cert:
    name: Instalar Origin CA no Caddy
    runs-on: [self-hosted, Linux]
    if: github.event.inputs.confirm == 'CONFIRMO'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gate obrigatório da META LUPA
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          base_ref="$(git rev-parse origin/main)"
          base_sha="$(git rev-parse "$base_ref:.agents/skills/meta-lupa")"
          head_sha="$(git rev-parse HEAD)"
          trusted="$RUNNER_TEMP/meta_lupa_gate.py"
          git show "$base_ref:.agents/skills/meta-lupa/scripts/meta_lupa.py" > "$trusted"
          receipt="$RUNNER_TEMP/meta-lupa-gate.json"
          python3 "$trusted" issue-gate-receipt --repo-root "$GITHUB_WORKSPACE" --repo ServerVpss/CentralDark \
            --mission-id "${GITHUB_WORKFLOW}-${GITHUB_RUN_ID}" --workspace-head "$head_sha" --canonical-ref "$base_ref" \
            --expected-canonical-sha "$base_sha" --output "$receipt"
          python3 "$trusted" gate --repo-root "$GITHUB_WORKSPACE" --input "$receipt" \
            --canonical-ref "$base_ref" --expected-canonical-sha "$base_sha" --expected-head-sha "$head_sha" --operation deploy

      - name: Instalar certificado e recarregar Caddy
        env:
          CF_ORIGIN_CERT: ${{ secrets.CF_ORIGIN_CERT }}
          CF_ORIGIN_KEY: ${{ secrets.CF_ORIGIN_KEY }}
        run: bash infra/scripts/setup-cf-origin-cert.sh

      - name: Notificar Telegram
        if: always()
        env:
          TOKEN: ${{ secrets.SRVER1_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          STATUS: ${{ job.status }}
        run: |
          MSG="🔐 Origin CA install: $STATUS"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}&text=${MSG}" > /dev/null || true
