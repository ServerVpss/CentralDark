name: TEMP — sync MCP dist for PR 962

on:
  push:
    branches:
      - feat/skill-workshop-claude-skills-20260816

permissions:
  contents: write

jobs:
  sync-generated-admin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout da branch de reparo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: feat/skill-workshop-claude-skills-20260816
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/modulos/mcp/package-lock.json

      - name: Regenerar e sincronizar somente admin.js
        shell: bash
        run: |
          set -euo pipefail
          cd apps/modulos/mcp
          npm ci --ignore-scripts
          npm run build
          cd ../../..

          changed="$(git diff --name-only -- apps/modulos/mcp/dist)"
          if [ "$changed" != "apps/modulos/mcp/dist/admin.js" ]; then
            echo "UNEXPECTED_DIST_DELTA"
            printf '%s\n' "$changed"
            exit 1
          fi

          git add apps/modulos/mcp/dist/admin.js
          if git diff --cached --quiet; then
            echo "MCP_DIST_ALREADY_SYNCED=1"
            exit 0
          fi

          git config user.name "CentralDark Bot"
          git config user.email "bot@centralldark.com"
          git commit -m "chore(mcp): sincronizar dist gerado bloqueando CI"
          git push origin HEAD:feat/skill-workshop-claude-skills-20260816
