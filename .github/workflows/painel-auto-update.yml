name: painel auto-update

# Em todo push na main, registra um evento "push <sha>" no Mega Painel
# (painel-data.json LOCAL da VPS em /root/CentralDark/apps/projeto-dashboard/).
# NÃO faz git commit/push de volta — Caddy serve direto do disco da VPS,
# então o painel atualiza ao vivo sem poluir o chat com cards `chore(painel)`.
#
# ⚠️ Mudança 26/06/2026: removido o commit automático que estava gerando
# spam de cards "chore(painel): registrar push <sha>" no chat do Lovable.
# Painel continua vivo em tempo real, só que via escrita direta no disco
# do runner self-hosted (que é a própria VPS).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: painel-auto-update
  cancel-in-progress: false

jobs:
  registrar:
    name: Registrar push no painel (sem commit)
    runs-on: [self-hosted, Linux]
    if: github.repository == 'ServerVpss/CentralDark' && github.actor != 'github-actions[bot]'
    timeout-minutes: 5
    steps:
      - name: Registrar evento direto no painel da VPS
        env:
          PAINEL_EVENTO: "Push na main · ${{ github.sha }}"
          PAINEL_EVENTO_DETALHE: "${{ github.event.head_commit.message }}"
          PAINEL_EVENTO_AREA: "Repositório"
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Roda o atualizador apontando pro painel-data.json LOCAL da VPS.
          # Sem checkout, sem git add, sem commit, sem push.
          cd /root/CentralDark
          node apps/projeto-dashboard/atualizar-painel-vivo.mjs
          echo "✅ painel-data.json atualizado em disco — Caddy serve na hora"

      - name: Notificar Telegram — painel atualizado
        if: success()
        env:
          BOT: ${{ secrets.SRVER1_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          MSG="📊 <b>Painel atualizado</b> — CentralDark\n▸ Commit: <code>${GITHUB_SHA:0:7}</code>\n▸ <a href=\"https://status.centralldark.com\">Ver painel ao vivo</a>\n<i>#CentralDark #painel #atualizado</i>"
          curl -s -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${CHAT}\",\"parse_mode\":\"HTML\",\"text\":\"${MSG}\",\"disable_web_page_preview\":true}" > /dev/null || true
