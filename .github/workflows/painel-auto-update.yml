name: 📊 Painel — atualização automática

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/modulos/status/painel-data.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: painel-auto-update
  cancel-in-progress: false

jobs:
  registrar:
    name: 📊 Registrar push no painel
    runs-on: [self-hosted, Linux]
    if: github.repository == 'ServerVpss/CentralDark' && github.actor != 'github-actions[bot]'
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false
          fetch-depth: 0

      - name: 🔄 Regerar + micro-commit + push seguro
        env:
          PAINEL_EVENTO: "Push na main · ${{ github.sha }}"
          PAINEL_EVENTO_DETALHE: "${{ github.event.head_commit.message }}"
          PAINEL_EVENTO_AREA: "Repositório"
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          MAX_TRIES=3
          for TRY in $(seq 1 "$MAX_TRIES"); do
            echo "🔄 Tentativa $TRY/$MAX_TRIES"

            git fetch --no-tags origin refs/heads/main
            BASE_SHA="$(git rev-parse FETCH_HEAD)"
            WORKTREE="${RUNNER_TEMP}/painel-auto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TRY}"

            if [ -e "$WORKTREE" ]; then
              echo "🔴 WORKTREE_TEMP_JA_EXISTE=$WORKTREE"
              exit 1
            fi

            git worktree add --detach "$WORKTREE" "$BASE_SHA"

            STATUS=0
            if (
              set -euo pipefail
              cd "$WORKTREE"
              git config user.name 'CentralDark Bot'
              git config user.email 'bot@centralldark.com'

              node apps/modulos/status/atualizar-painel-vivo.mjs
              if git diff --quiet -- apps/modulos/status/painel-data.json; then
                echo "🟢 Nada a commitar."
                exit 0
              fi

              git add -- apps/modulos/status/painel-data.json
              git commit -m "📊 painel: registrar estado da main ${GITHUB_SHA:0:7}

🧾 Origem: push na main
🔗 SHA observado: ${GITHUB_SHA}
🤖 Autor: CentralDark Bot

Co-authored-by: SegredoiDev <bot@centralldark.com>"

              HEAD_SHA="$(git rev-parse HEAD)"
              echo "🚪 Gate global pré-main base=${BASE_SHA:0:12} head=${HEAD_SHA:0:12}"
              node scripts/lupa/validar-continuidade-global.mjs
              node scripts/lupa/validar-porta-de-entrada.mjs \
                --base-sha "$BASE_SHA" \
                --head-sha "$HEAD_SHA"

              if git push origin HEAD:main; then
                echo "🟢 Painel atualizado (tentativa $TRY)."
                exit 0
              fi

              echo "🟡 Push rejeitado por concorrência; refazendo a partir da main atual."
              exit 75
            ); then
              STATUS=0
            else
              STATUS=$?
            fi

            if ! git worktree remove "$WORKTREE"; then
              echo "🔴 WORKTREE_CLEANUP_BLOCKED=$WORKTREE"
              exit 1
            fi

            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            if [ "$STATUS" -ne 75 ]; then
              echo "🔴 Falha não concorrencial status=$STATUS"
              exit "$STATUS"
            fi

            sleep 2
          done

          echo "🔴 Falhou após $MAX_TRIES tentativas."
          exit 1

      - name: 📢 Notificar Telegram
        if: success()
        env:
          BOT: ${{ secrets.SRVER1_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          MSG="📊 <b>Painel atualizado</b>\n▸ Commit observado: <code>${GITHUB_SHA:0:7}</code>\n▸ <a href=\"https://status.centralldark.com\">Ver painel</a>"
          curl -s -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${CHAT}\",\"parse_mode\":\"HTML\",\"text\":\"${MSG}\",\"disable_web_page_preview\":true}" > /dev/null || true
