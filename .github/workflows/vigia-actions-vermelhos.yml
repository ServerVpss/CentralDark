name: Vigia Actions Vermelhos
# Bot 24/7 que vigia workflows do CentralDark.
# v2: roda em ubuntu-latest (imune ao runner offline), concurrency com cancel-in-progress,
#     filtro precoce pra ignorar success ruidoso, auto-mute de workflow rebelde,
#     resumo diário consolidado.

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
    inputs:
      janela_horas:
        description: "Janela em horas pra varredura sob demanda"
        required: false
        default: "6"

permissions:
  actions: write   # precisa write pra cancelar runs órfãos do próprio vigia
  contents: read

concurrency:
  # 1 vigia por workflow monitorado; qualquer novo cancela o anterior.
  group: vigia-${{ github.event.workflow_run.name || github.event_name }}
  cancel-in-progress: true

env:
  # Workflows que nunca precisam de alerta (ruído puro)
  IGNORAR_WORKFLOWS: "Vigia Actions Vermelhos,Farm — trailer Co-authored-by,CodeQL — análise de segurança,painel auto-update,Notion Sync (docs/CONSCIENCIA → Notion),linear-pendencias-sync"

jobs:
  vigia:
    # Filtro precoce: só entra em ação quando faz sentido.
    # - schedule/dispatch: sempre roda (varredura periódica)
    # - workflow_run: só roda se conclusão for failure OU se for success (pra checar recuperação)
    #   E nunca roda pra si mesmo (evita loop)
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.name != 'Vigia Actions Vermelhos' &&
       (github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      WF_NAME: ${{ github.event.workflow_run.name }}
      WF_CONCL: ${{ github.event.workflow_run.conclusion }}
      WF_URL: ${{ github.event.workflow_run.html_url }}
      WF_ID: ${{ github.event.workflow_run.id }}
      WF_ACTOR: ${{ github.event.workflow_run.actor.login }}
      WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
      WF_SHA: ${{ github.event.workflow_run.head_sha }}
      JANELA_HORAS: ${{ github.event.inputs.janela_horas || '6' }}

    steps:
      - name: Restaurar estado persistente (cache)
        id: cache-estado
        uses: actions/cache/restore@v4
        with:
          path: vigia-state
          key: vigia-state-v1-${{ github.run_id }}
          restore-keys: |
            vigia-state-v1-

      - name: Auto-limpar filas órfãs do próprio vigia
        shell: bash
        continue-on-error: true
        run: |
          # Cancela runs deste workflow que estejam queued/waiting/pending há mais de 3min.
          # Rede de segurança — se cair, ok.
          set +e
          AGORA=$(date +%s)
          curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/actions/workflows/vigia-actions-vermelhos.yml/runs?per_page=50&status=queued" \
            | jq -r '.workflow_runs[]? | "\(.id)|\(.created_at)"' \
            | while IFS='|' read -r ID CREATED; do
                [ -z "$ID" ] && continue
                CREATED_TS=$(date -d "$CREATED" +%s 2>/dev/null || echo 0)
                IDADE=$((AGORA - CREATED_TS))
                if [ "$IDADE" -gt 180 ]; then
                  curl -sS -o /dev/null -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
                    "https://api.github.com/repos/${REPO}/actions/runs/${ID}/cancel"
                  echo "[vigia] cancelou órfão $ID (idade ${IDADE}s)"
                fi
              done

      - name: Vigiar e notificar
        shell: bash
        run: |
          set +e
          STATE_DIR="vigia-state"
          mkdir -p "$STATE_DIR"
          STATE_FILE="$STATE_DIR/reported.txt"
          FAIL_TRACK="$STATE_DIR/failing_workflows.txt"
          MUTED_FILE="$STATE_DIR/muted_workflows.txt"
          FAIL_COUNT_FILE="$STATE_DIR/fail_counts.tsv"   # nome<TAB>count<TAB>epoch_primeira
          touch "$STATE_FILE" "$FAIL_TRACK" "$MUTED_FILE" "$FAIL_COUNT_FILE"

          # ---------- helpers ----------
          notificar() {
            local TIPO="$1" TITULO="$2" MSG="$3"
            echo "[vigia] $TIPO :: $TITULO"
            echo -e "$MSG"
            [ -z "${NOTIFY_API_KEY}" ] && { echo "::warning::NOTIFY_API_KEY ausente"; return 0; }
            local PAYLOAD
            PAYLOAD=$(jq -nc \
              --arg origem "vigia-actions" \
              --arg tipo "$TIPO" \
              --arg titulo "$TITULO" \
              --arg mensagem "$(echo -e "$MSG")" \
              '{origem:$origem, tipo:$tipo, titulo:$titulo, mensagem:$mensagem}')
            curl -sS -X POST "https://kagejpghnwdfymddwxuf.supabase.co/functions/v1/notify-telegram" \
              -H "x-notify-key: ${NOTIFY_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" >/dev/null
          }

          ja_reportado() { grep -qxF "$1" "$STATE_FILE" 2>/dev/null; }
          marcar()       { echo "$1" >> "$STATE_FILE"; tail -n 500 "$STATE_FILE" > "$STATE_FILE.tmp" && mv "$STATE_FILE.tmp" "$STATE_FILE"; }

          esta_falhando() { grep -qxF "$1" "$FAIL_TRACK" 2>/dev/null; }
          marcar_falha()  { echo "$1" >> "$FAIL_TRACK"; sort -u "$FAIL_TRACK" -o "$FAIL_TRACK"; }
          remover_falha() { grep -vxF "$1" "$FAIL_TRACK" > "$FAIL_TRACK.tmp" 2>/dev/null && mv "$FAIL_TRACK.tmp" "$FAIL_TRACK" || true; }

          esta_mutado()  { grep -qxF "$1" "$MUTED_FILE" 2>/dev/null; }
          mutar()        { echo "$1" >> "$MUTED_FILE"; sort -u "$MUTED_FILE" -o "$MUTED_FILE"; }
          desmutar()     { grep -vxF "$1" "$MUTED_FILE" > "$MUTED_FILE.tmp" 2>/dev/null && mv "$MUTED_FILE.tmp" "$MUTED_FILE" || true; }

          # Ignora workflows barulhentos
          eh_ignorado() {
            local NAME="$1"
            IFS=',' read -ra LISTA <<< "$IGNORAR_WORKFLOWS"
            for w in "${LISTA[@]}"; do
              [ "$w" = "$NAME" ] && return 0
            done
            return 1
          }

          # Atualiza contador de falhas recentes; imprime "SIM" se cruzou 5 em <1h
          registrar_falha_e_verificar_flood() {
            local NAME="$1"
            local AGORA=$(date +%s)
            local LINHA COUNT PRIMEIRA
            LINHA=$(grep -F "$(printf "%s\t" "$NAME")" "$FAIL_COUNT_FILE" | head -n1)
            if [ -z "$LINHA" ]; then
              printf "%s\t1\t%s\n" "$NAME" "$AGORA" >> "$FAIL_COUNT_FILE"
              echo "NAO"; return
            fi
            COUNT=$(echo "$LINHA" | cut -f2)
            PRIMEIRA=$(echo "$LINHA" | cut -f3)
            # Reseta janela se passou +1h
            if [ $((AGORA - PRIMEIRA)) -gt 3600 ]; then
              COUNT=1; PRIMEIRA=$AGORA
            else
              COUNT=$((COUNT + 1))
            fi
            grep -vF "$(printf "%s\t" "$NAME")" "$FAIL_COUNT_FILE" > "$FAIL_COUNT_FILE.tmp" 2>/dev/null
            mv "$FAIL_COUNT_FILE.tmp" "$FAIL_COUNT_FILE" 2>/dev/null || true
            printf "%s\t%s\t%s\n" "$NAME" "$COUNT" "$PRIMEIRA" >> "$FAIL_COUNT_FILE"
            [ "$COUNT" -ge 5 ] && echo "SIM" || echo "NAO"
          }

          # ---------- fluxo workflow_run ----------
          if [ "$EVENT" = "workflow_run" ]; then
            if eh_ignorado "$WF_NAME"; then
              echo "[vigia] '$WF_NAME' está na lista de ignorados — pulando"
              exit 0
            fi

            KEY="run:${WF_ID}"

            if [ "$WF_CONCL" = "success" ]; then
              # Só interessa se estava falhando antes → é recuperação
              if esta_falhando "$WF_NAME"; then
                MSG="🟢 <b>SISTEMA RECUPERADO</b>\n\nUma tarefa que estava com problema voltou a funcionar normalmente.\n\n📋 <b>Tarefa:</b> ${WF_NAME}\n🌿 <b>Ramo:</b> ${WF_BRANCH}\n\n🔗 <a href=\"${WF_URL}\">Ver execução no GitHub</a>\n\n✅ <i>Tudo certo por aqui.</i>"
                notificar "info" "🟢 Recuperado — ${WF_NAME}" "$MSG"
                remover_falha "$WF_NAME"
                desmutar "$WF_NAME"
                # Zera contador
                grep -vF "$(printf "%s\t" "$WF_NAME")" "$FAIL_COUNT_FILE" > "$FAIL_COUNT_FILE.tmp" 2>/dev/null && mv "$FAIL_COUNT_FILE.tmp" "$FAIL_COUNT_FILE" || true
              fi
              exit 0
            fi

            # Conclusão: failure
            if ja_reportado "$KEY"; then
              echo "[vigia] já reportado — ignorando"; exit 0
            fi

            FLOOD=$(registrar_falha_e_verificar_flood "$WF_NAME")

            if esta_mutado "$WF_NAME"; then
              echo "[vigia] '$WF_NAME' está em modo silencioso — não notifica até success"
              marcar "$KEY"
              exit 0
            fi

            if [ "$FLOOD" = "SIM" ] && ! esta_mutado "$WF_NAME"; then
              MSG="🔕 <b>MODO SILENCIOSO ATIVADO</b>\n\nA tarefa <b>${WF_NAME}</b> falhou 5x em menos de 1 hora.\nVou parar de mandar alertas dela até ela voltar a dar certo.\n\n💡 <i>Recomendo investigar manualmente:</i>\n🔗 <a href=\"${WF_URL}\">Ver detalhes no GitHub</a>"
              notificar "erro" "🔕 Silenciado — ${WF_NAME}" "$MSG"
              mutar "$WF_NAME"
              marcar "$KEY"
              marcar_falha "$WF_NAME"
              exit 0
            fi

            MSG="🚨 <b>ALERTA — TAREFA DO SISTEMA FALHOU</b>\n\nUma tarefa automática encontrou um erro e precisou parar.\n\n📋 <b>Tarefa:</b> ${WF_NAME}\n🌿 <b>Ramo:</b> ${WF_BRANCH}\n👤 <b>Quem disparou:</b> ${WF_ACTOR}\n🔢 <b>Commit:</b> <code>${WF_SHA:0:10}</code>\n\n🔗 <a href=\"${WF_URL}\">Ver detalhes no GitHub</a>\n\n💡 <i>Pode ser temporário. Se continuar falhando, me acione.</i>"
            notificar "erro" "🚨 Alerta CentralDark — ${WF_NAME}" "$MSG"
            marcar "$KEY"
            marcar_falha "$WF_NAME"
            exit 0
          fi

          # ---------- fluxo schedule/dispatch: varredura periódica ----------
          echo "[vigia] varredura periódica em $REPO (janela ${JANELA_HORAS}h)"
          RUNS=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/actions/runs?per_page=100")

          FAILS=$(echo "$RUNS" | jq -r --arg ignorar "$IGNORAR_WORKFLOWS" '
            ($ignorar | split(",")) as $skip
            | .workflow_runs[]?
            | select(.conclusion=="failure")
            | select(.name as $n | ($skip | index($n)) | not)
            | "\(.id)|\(.name)|\(.html_url)|\(.head_branch)|\(.actor.login)|\(.head_sha)"')

          # Resumo consolidado (contagem)
          TOTAL_FAILS=$(echo "$RUNS" | jq -r --arg ignorar "$IGNORAR_WORKFLOWS" '
            ($ignorar | split(",")) as $skip
            | [.workflow_runs[]? | select(.conclusion=="failure") | select(.name as $n | ($skip | index($n)) | not)] | length')
          TOTAL_OK=$(echo "$RUNS" | jq -r --arg ignorar "$IGNORAR_WORKFLOWS" '
            ($ignorar | split(",")) as $skip
            | [.workflow_runs[]? | select(.conclusion=="success") | select(.name as $n | ($skip | index($n)) | not)] | length')
          WF_SAUDAVEIS=$(echo "$RUNS" | jq -r --arg ignorar "$IGNORAR_WORKFLOWS" '
            ($ignorar | split(",")) as $skip
            | [.workflow_runs[]? | select(.conclusion=="success") | select(.name as $n | ($skip | index($n)) | not) | .name] | unique | length')

          NOVOS=0
          while IFS='|' read -r ID NAME URL BRANCH ACTOR SHA; do
            [ -z "$ID" ] && continue
            KEY="run:$ID"
            ja_reportado "$KEY" && continue
            esta_mutado "$NAME" && { marcar "$KEY"; continue; }
            MSG="🚨 <b>ALERTA — TAREFA DO SISTEMA FALHOU</b>\n\nUma tarefa automática encontrou um erro e precisou parar.\n\n📋 <b>Tarefa:</b> ${NAME}\n🌿 <b>Ramo:</b> ${BRANCH}\n👤 <b>Quem disparou:</b> ${ACTOR}\n🔢 <b>Commit:</b> <code>${SHA:0:10}</code>\n\n🔗 <a href=\"${URL}\">Ver detalhes no GitHub</a>\n\n💡 <i>Pode ser temporário. Se continuar falhando, me acione.</i>"
            notificar "erro" "🚨 Alerta CentralDark — ${NAME}" "$MSG"
            marcar "$KEY"
            marcar_falha "$NAME"
            NOVOS=$((NOVOS+1))
          done <<< "$FAILS"
          echo "[vigia] reportou $NOVOS falha(s) nova(s)"

          # Resumo diário consolidado (cron das 07h ou dispatch manual)
          HOUR=$(date +%H)
          if { [ "$EVENT" = "schedule" ] && [ "$HOUR" = "07" ]; } || [ "$EVENT" = "workflow_dispatch" ]; then
            KEY_RESUMO="resumo:$(date +%F):$EVENT"
            if ! ja_reportado "$KEY_RESUMO"; then
              MUTED_LIST=$(cat "$MUTED_FILE" 2>/dev/null | paste -sd, - | sed 's/,/, /g')
              [ -z "$MUTED_LIST" ] && MUTED_LIST="nenhum"
              MSG="📊 <b>RESUMO DIÁRIO — CENTRALDARK</b>\n\n📈 <b>Últimas 100 execuções:</b>\n  ✅ ${TOTAL_OK} sucessos\n  ❌ ${TOTAL_FAILS} falhas\n\n🟢 <b>Workflows saudáveis:</b> ${WF_SAUDAVEIS}\n🔕 <b>Em modo silencioso:</b> ${MUTED_LIST}\n\n⏰ <i>Próxima verificação em 6h.</i>"
              notificar "info" "📊 Resumo diário CentralDark" "$MSG"
              marcar "$KEY_RESUMO"
            fi
          fi

      - name: Salvar estado persistente
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vigia-state
          key: vigia-state-v1-${{ github.run_id }}

      - name: Resumo do run
        if: always()
        shell: bash
        run: |
          echo "## 🔍 Vigia Actions — $(date '+%d/%m/%Y %H:%M')" >> $GITHUB_STEP_SUMMARY
          echo "Evento: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Workflow origem: \`${WF_NAME:-–}\` · conclusão: \`${WF_CONCL:-–}\`" >> $GITHUB_STEP_SUMMARY
          [ -f vigia-state/muted_workflows.txt ] && {
            echo "### Silenciados atualmente" >> $GITHUB_STEP_SUMMARY
            sed 's/^/- /' vigia-state/muted_workflows.txt >> $GITHUB_STEP_SUMMARY
          }
