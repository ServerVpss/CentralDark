name: Autonomia Canário Recovery

on:
  pull_request_target:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read

concurrency:
  group: autonomia-canario-recovery
  cancel-in-progress: false

jobs:
  prove:
    if: >-
      github.event.pull_request.number == 636 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'segredounlock'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_REPOSITORY: ServerVpss/CentralDark
      BOT_TRUSTED_AUTHORS: segredounlock
      BOT_REQUIRED_WORKFLOWS: porta-de-entrada,codex-validate,lupa-conformance,Lupa Drift Guard,PR auto-review (Codex + checklist),Pipeline — Telegram + Painel
      GH_TOKEN: ${{ secrets.PROMOTION_TOKEN || github.token }}
    steps:
      - name: Checkout exclusivo da main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testar motores
        run: |
          node --test scripts/github-autonomia-promocao.test.mjs
          node --test scripts/github-autonomia-varredura.test.mjs

      - name: Atualizar, aguardar checks e promover
        env:
          JUDGE_TOKEN: ${{ github.token }}
          PROMOTER_TOKEN: ${{ secrets.PROMOTION_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/centraldark-autonomia"
          success=false
          for attempt in $(seq 1 30); do
            rm -rf "$RUNNER_TEMP/centraldark-autonomia"/*
            export BOT_SWEEP_DIR="$RUNNER_TEMP/centraldark-autonomia"
            echo "AUTONOMIA_ATTEMPT=$attempt"
            node scripts/github-autonomia-varredura.mjs judge
            node scripts/github-autonomia-varredura.mjs promote
            state="$(gh api repos/ServerVpss/CentralDark/pulls/636 --jq '.state + ":" + (.merged_at // "")')"
            echo "PR636_STATE=$state"
            if [[ "$state" == closed:* && "$state" != 'closed:' ]]; then
              success=true
              break
            fi
            sleep 30
          done
          [[ "$success" == true ]] || {
            summary="$(find "$RUNNER_TEMP/centraldark-autonomia" -maxdepth 1 -type f -print | sed 's#^.*/##' | tr '\n' ',' | cut -c1-1000)"
            gh pr comment 636 --body "<!-- autonomia-recovery -->\n## Autonomia ainda bloqueada\n\nO motor canônico executou 30 ciclos sem merge. Artefatos sanitizados: \`${summary:-none}\`. Verificar o log deste workflow; nenhum PASS foi fabricado."
            exit 1
          }
