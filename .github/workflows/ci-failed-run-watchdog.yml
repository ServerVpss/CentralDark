name: "CI — revisão de runs falhos a cada 5 minutos"

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: "Janela de revisão em minutos"
        required: false
        default: "15"
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: ci-failed-run-watchdog
  cancel-in-progress: true

jobs:
  review-failed-runs:
    name: "🔎 Revisar runs falhos recentes"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: "🔎 Detectar e reexecutar falhas recentes"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LOOKBACK_MINUTES: ${{ inputs.lookback_minutes || '15' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowName = "CI — revisão de runs falhos a cada 5 minutos";
            const parsedLookback = Number(process.env.LOOKBACK_MINUTES || "15");
            const lookbackMinutes = Number.isFinite(parsedLookback)
              ? Math.min(Math.max(parsedLookback, 5), 60)
              : 15;
            const cutoff = Date.now() - lookbackMinutes * 60 * 1000;
            const red = new Set([
              "failure",
              "cancelled",
              "timed_out",
              "startup_failure",
              "stale",
            ]);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const candidates = runs
              .filter((run) => run.name !== workflowName)
              .filter((run) => run.status === "completed")
              .filter((run) => red.has(String(run.conclusion || "").toLowerCase()))
              .filter((run) => Date.parse(run.created_at || 0) >= cutoff)
              .filter((run) => Number(run.run_attempt || 1) === 1)
              .slice(0, 50);

            let requested = 0;
            let blocked = 0;
            for (const run of candidates) {
              try {
                await github.request(
                  "POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun",
                  { owner, repo, run_id: run.id }
                );
                requested += 1;
                core.notice(
                  `RERUN_REQUESTED=PASS run=${run.id} workflow=${run.name} conclusion=${run.conclusion} head=${run.head_sha}`
                );
              } catch (error) {
                blocked += 1;
                core.warning(
                  `RERUN_REQUESTED=BLOCKED run=${run.id} workflow=${run.name} status=${error.status || "UNKNOWN"}`
                );
              }
            }

            core.notice(
              `CI_FAILED_RUN_REVIEW lookback_minutes=${lookbackMinutes} candidates=${candidates.length} requested=${requested} blocked=${blocked}`
            );
            core.setOutput("candidates", String(candidates.length));
            core.setOutput("requested", String(requested));
            core.setOutput("blocked", String(blocked));

      - name: "🧾 Receipt"
        if: always()
        run: |
          echo "OWNER=CI_FAILED_RUN_WATCHDOG"
          echo "SCHEDULE=*/5 * * * *"
          echo "ACTION=RERUN_ONLY_RECENT_COMPLETED_RED_RUNS"
          echo "RUN_ATTEMPT=1_ONLY"
          echo "LOOKBACK_MINUTES=${{ inputs.lookback_minutes || '15' }}"
          echo "NO_CODE_MUTATION=1"
          echo "NO_MERGE=1"
          echo "NO_FALSE_GREEN=1"
