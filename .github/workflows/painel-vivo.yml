name: painel-vivo

on:
  workflow_dispatch:
    inputs:
      evento:
        description: 'Título do acontecimento'
        required: true
      detalhe:
        description: 'Detalhe em linguagem simples'
        required: false
        default: ''
      area:
        description: 'Área do projeto'
        required: false
        default: 'Projeto'
      geral:
        description: 'Progresso geral 0-100'
        required: false
        default: ''
      marco:
        description: 'Marco para atualizar/criar'
        required: false
        default: ''
      marco_pct:
        description: 'Progresso do marco 0-100'
        required: false
        default: ''
      marco_status:
        description: 'done, doing, next ou later'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  atualizar-painel:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gate obrigatório da META LUPA
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          base_ref="$(git rev-parse origin/main)"
          base_sha="$(git rev-parse "$base_ref:.agents/skills/meta-lupa")"
          head_sha="$(git rev-parse HEAD)"
          trusted="$RUNNER_TEMP/meta_lupa_gate.py"
          git show "$base_ref:.agents/skills/meta-lupa/scripts/meta_lupa.py" > "$trusted"
          receipt="$RUNNER_TEMP/meta-lupa-gate.json"
          python3 "$trusted" issue-gate-receipt --repo-root "$GITHUB_WORKSPACE" --repo ServerVpss/CentralDark \
            --mission-id "${GITHUB_WORKFLOW}-${GITHUB_RUN_ID}" --workspace-head "$head_sha" --canonical-ref "$base_ref" \
            --expected-canonical-sha "$base_sha" --output "$receipt"
          python3 "$trusted" gate --repo-root "$GITHUB_WORKSPACE" --input "$receipt" \
            --canonical-ref "$base_ref" --expected-canonical-sha "$base_sha" --expected-head-sha "$head_sha" --operation push

      - name: Atualizar painel vivo
        env:
          PAINEL_EVENTO: ${{ inputs.evento }}
          PAINEL_EVENTO_DETALHE: ${{ inputs.detalhe }}
          PAINEL_EVENTO_AREA: ${{ inputs.area }}
          PAINEL_GERAL: ${{ inputs.geral }}
          PAINEL_MARCO: ${{ inputs.marco }}
          PAINEL_MARCO_PCT: ${{ inputs.marco_pct }}
          PAINEL_MARCO_STATUS: ${{ inputs.marco_status }}
        run: node CentralDark/apps/projeto-dashboard/atualizar-painel-vivo.mjs

      - name: Commit painel vivo
        run: |
          git config user.name 'CentralDark Bot'
          git config user.email 'actions@github.com'
          git add -- CentralDark/apps/projeto-dashboard/painel-data.json
          git commit -m "chore(painel): atualizar mapa vivo" || exit 0
          git push
