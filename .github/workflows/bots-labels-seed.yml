name: Bots — labels operacionais canônicas

# Único owner do catálogo ativo de labels operacionais.
# Cria/atualiza o catálogo canônico, migra aliases legados e remove labels mortas.
# Histórico permanece no GitHub; taxonomia ativa fica limpa.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bots-labels-seed.yml'

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  reconcile:
    runs-on: [self-hosted, Linux]
    if: github.repository == 'ServerVpss/CentralDark'
    steps:
      - name: Reconciliar labels operacionais
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;

            const canonical = [
              ['👑 PERMITO-SEGREDO','5319E7','Autorização humana canônica de SEGREDO/CHEFE'],
              ['✅ PR CONFIRMADO','0E8A16','Resultado derivado: merge comprovado por receipt SHA-256 + HEAD/merge + contraprova; não concede autoridade'],
              ['🕊️ POMBO-CHECKSUM OBRIGATÓRIO DE PACOTE','5319E7','Pacote/handoff material exige SHA-256 + receipt + proveniência; selo não prova semântica'],
              ['🔄 GIT','1F6FEB','Branch commit pull push merge'],
              ['🧠 AGENTE-CHATGPT','10A37F','ChatGPT/SOL como capacidade, nunca autoridade'],
              ['🧠 AGENTE-CLAUDE','B088FF','Claude como capacidade, nunca autoridade'],
              ['🧠 AGENTE-CODEX','5319E7','Codex como capacidade, nunca autoridade'],
              ['🧠 AGENTE-GROK','1F6FEB','Grok como capacidade, nunca autoridade'],
              ['🧠 AGENTE-HERMES','7057FF','PIVETE/Hermes executor'],
              ['🧠 AGENTE-JARVIS','0052CC','Jarvis/orquestração'],
              ['🧠 AGENTE-SENTINELA','B60205','Sentinela detector'],
              ['🧠 AGENTE-SUPABASE','3ECF8E','Supabase/banco'],
              ['🤖 AUTO','5319E7','Criado/atualizado por automação'],
              ['🐞 BUG','D73A4A','Algo quebrado'],
              ['♻️ DUPLICADO','CFD3D7','Já existe outra issue material equivalente'],
              ['✨ MELHORIA','A2EEEF','Melhoria/refinamento'],
              ['❓ DÚVIDA','D876E3','Falta esclarecer materialmente'],
              ['🆘 AJUDA-NECESSÁRIA','008672','Ação humana realmente necessária'],
              ['🌱 BOM-PARA-INICIAR','7057FF','Tarefa simples'],
              ['🎨 FRONTEND','FF80B0','Tela/layout/mobile'],
              ['📚 DOCS','0075CA','Documentação/memória versionada'],
              ['🔄 GIT-DIVERGÊNCIA','D93F0B','Estados Git diferentes para reconciliar'],
              ['🔐 SEGURANÇA','B60205','Auth/secret/RLS/credencial'],
              ['🔧 SELF-HEAL','0E8A16','Recuperação determinística'],
              ['🔴 ERRO','B60205','Falha confirmada'],
              ['🔴 FALTA-EVIDÊNCIA','D93F0B','Sem prova suficiente; UNKNOWN não é PASS'],
              ['🔴 PRIORIDADE-ALTA','FF0000','Resolver logo'],
              ['🔴 RISCO-SERVIDOR','D93F0B','VPS/PM2/deploy/produção'],
              ['🕸️ GRAPHIFY','5319E7','Graphify/grafo'],
              ['🚫 INVÁLIDO','E4E669','Issue sem ferida material aplicável'],
              ['🛠️ INFRA','D93F0B','Infra/VPS/servidor'],
              ['🛡️ SENTINELA','B60205','Finding material da Sentinela'],
              ['🟡 ATENÇÃO','FBCA04','Atenção material'],
              ['🟡 IA-PRECISA-REVISAR','FBCA04','Revisão técnica necessária'],
              ['🟡 PENDÊNCIA','FBCA04','Pendência material comprovada'],
              ['🟡 PRIORIDADE-MÉDIA','FFA500','Prioridade média'],
              ['🟢 CORREÇÃO-SEGURA','0E8A16','Correção de baixo risco'],
              ['🟢 PRIORIDADE-BAIXA','0E8A16','Prioridade baixa'],
              ['🟢 PRONTO-PARA-IA','0E8A16','Contexto suficiente para IA'],
              ['🟢 SUCESSO','0E8A16','Validado/estável/concluído'],
              ['🟢 SUPABASE','3ECF8E','Supabase/banco/auth/storage'],
              ['🤖 AGENTIC-DEVOPS','5319E7','Orquestração agentic sem sistema paralelo'],
              ['🤖 IA-DOCUMENTAR','0075CA','IA documentar/organizar'],
              ['🤖 IA-EXECUTAR','5319E7','IA executar dentro do escopo autorizado'],
              ['🤖 IA-FRONTEND','FF80B0','IA em frontend'],
              ['🤖 IA-INFRA','D93F0B','IA em infra'],
              ['🤖 IA-PESQUISAR','1F6FEB','IA pesquisar contexto'],
              ['🤖 IA-REVISAR','5319E7','IA revisar'],
              ['🤖 IA-VALIDAR','0E8A16','IA validar/provar'],
              ['🧊 NÃO-FAZER','FFFFFF','Decisão explícita de não executar'],
              ['🧊 PARADO','CFD3D7','Sem movimento; não equivale a ferida viva'],
              ['🧩 DIVERGÊNCIA','D93F0B','Estados divergentes'],
              ['🧭 PAINEL','0052CC','Painel/cockpit'],
              ['SUPERSEDED','CFD3D7','Claim integralmente absorvido por owner canônico'],
            ].map(([name,color,description]) => ({name,color,description}));

            const aliases = new Map([
              ['assign:chatgpt',['🧠 AGENTE-CHATGPT']],
              ['assign:claude',['🧠 AGENTE-CLAUDE']],
              ['assign:codex',['🧠 AGENTE-CODEX']],
              ['assign:grok',['🧠 AGENTE-GROK']],
              ['assign:supabase-bot',['🧠 AGENTE-SUPABASE']],
              ['assign:lovable',['🎨 FRONTEND']],
              ['auto',['🤖 AUTO']],
              ['bug',['🐞 BUG']],
              ['p0',['🔴 PRIORIDADE-ALTA']],
              ['p1',['🔴 PRIORIDADE-ALTA']],
              ['p2',['🟡 PRIORIDADE-MÉDIA']],
              ['p3',['🟢 PRIORIDADE-BAIXA']],
              ['sentinela',['🛡️ SENTINELA']],
              ['vigia',['🛡️ SENTINELA']],
              ['stale',['🧊 PARADO']],
              ['superseded',['SUPERSEDED']],
              ['needs-codex-review',['🟡 IA-PRECISA-REVISAR','🧠 AGENTE-CODEX']],
              ['revisao-humana',['🆘 AJUDA-NECESSÁRIA']],
              ['🟡 PRECISA-DE-OK',['🆘 AJUDA-NECESSÁRIA']],
              ['permito-segredo',['👑 PERMITO-SEGREDO']],
              ['PERMITO-SEGREDO',['👑 PERMITO-SEGREDO']],
              ['📚 DOC',['📚 DOCS']],
            ]);

            const obsolete = new Set([
              '🧠 AGENTE-LOVABLE',
              'permito-pivete',
              'PERMITO-PIVETE',
              'pr611-reconcile',
            ]);

            for (const label of canonical) {
              const current = await github.rest.issues.getLabel({owner,repo,name:label.name}).catch(() => null);
              if (!current) await github.rest.issues.createLabel({owner,repo,...label});
              else if (current.data.color.toLowerCase() !== label.color.toLowerCase() || (current.data.description || '') !== label.description) {
                await github.rest.issues.updateLabel({owner,repo,name:label.name,new_name:label.name,color:label.color,description:label.description});
              }
            }

            const items = await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'all',per_page:100});
            for (const item of items) {
              const names = new Set((item.labels || []).map(l => typeof l === 'string' ? l : l.name));
              for (const [oldName,newNames] of aliases) {
                if (!names.has(oldName)) continue;
                for (const name of newNames) {
                  if (!names.has(name)) await github.rest.issues.addLabels({owner,repo,issue_number:item.number,labels:[name]});
                }
                await github.rest.issues.removeLabel({owner,repo,issue_number:item.number,name:oldName}).catch(e => { if (e.status !== 404) throw e; });
              }
              for (const dead of obsolete) {
                if (names.has(dead)) await github.rest.issues.removeLabel({owner,repo,issue_number:item.number,name:dead}).catch(e => { if (e.status !== 404) throw e; });
              }
            }

            const labels = await github.paginate(github.rest.issues.listLabelsForRepo,{owner,repo,per_page:100});
            for (const label of labels) {
              const name = label.name;
              if (name.startsWith('red-action:')) {
                const slug = name.slice('red-action:'.length).toUpperCase();
                const target = `🔴 ACTION:${slug}`.slice(0,50);
                const current = await github.rest.issues.getLabel({owner,repo,name:target}).catch(() => null);
                if (!current) await github.rest.issues.createLabel({owner,repo,name:target,color:'B60205',description:'Workflow vermelho material'});
                for (const item of items) {
                  const names = new Set((item.labels || []).map(l => typeof l === 'string' ? l : l.name));
                  if (!names.has(name)) continue;
                  await github.rest.issues.addLabels({owner,repo,issue_number:item.number,labels:[target]});
                  await github.rest.issues.removeLabel({owner,repo,issue_number:item.number,name}).catch(e => { if (e.status !== 404) throw e; });
                }
                await github.rest.issues.deleteLabel({owner,repo,name});
              }
            }

            for (const oldName of [...aliases.keys(), ...obsolete]) {
              await github.rest.issues.deleteLabel({owner,repo,name:oldName}).catch(e => { if (e.status !== 404) throw e; });
            }

            // Invariante final: nenhuma etiqueta operacional ativa sobrevive em minúsculas.
            // Aliases conhecidos acima são cadáveres de migração. Qualquer minúscula restante
            // é tratada como label funcional não catalogada e preserva o uso ao virar MAIÚSCULA.
            const canonicalNames = new Set(canonical.map(l => l.name));
            const labelsAfterLegacy = await github.paginate(github.rest.issues.listLabelsForRepo,{owner,repo,per_page:100});
            for (const label of labelsAfterLegacy) {
              const name = label.name;
              if (canonicalNames.has(name)) continue;
              if (name === name.toLocaleUpperCase('pt-BR')) continue;

              const target = name.toLocaleUpperCase('pt-BR').slice(0,50);
              const existing = await github.rest.issues.getLabel({owner,repo,name:target}).catch(() => null);
              if (!existing) {
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name,
                  new_name: target,
                  color: label.color,
                  description: label.description || '',
                });
                core.notice(`LABEL_UPPERCASED=${name}=>${target}`);
                continue;
              }

              for (const item of items) {
                const names = new Set((item.labels || []).map(l => typeof l === 'string' ? l : l.name));
                if (!names.has(name)) continue;
                if (!names.has(target)) await github.rest.issues.addLabels({owner,repo,issue_number:item.number,labels:[target]});
                await github.rest.issues.removeLabel({owner,repo,issue_number:item.number,name}).catch(e => { if (e.status !== 404) throw e; });
              }
              await github.rest.issues.deleteLabel({owner,repo,name});
              core.notice(`LABEL_ABSORBED_INTO_UPPERCASE=${name}=>${target}`);
            }

            const finalLabels = await github.paginate(github.rest.issues.listLabelsForRepo,{owner,repo,per_page:100});
            const forbidden = finalLabels.filter(l => l.name !== l.name.toLocaleUpperCase('pt-BR'));
            if (forbidden.length) core.setFailed(`VISIBLE_LOWERCASE_OPERATIONAL_LABELS=${forbidden.map(l=>l.name).join(',')}`);
            const duplicates = ['assign:chatgpt','assign:claude','assign:codex','assign:grok','assign:supabase-bot','assign:lovable','auto','bug','p0','p1','p2','p3','sentinela','vigia','stale','superseded','needs-codex-review','revisao-humana','🟡 PRECISA-DE-OK','permito-segredo','permito-pivete','PERMITO-PIVETE','📚 DOC'].filter(name => finalLabels.some(l => l.name === name));
            if (duplicates.length) core.setFailed(`DEAD_OR_DUPLICATE_LABELS=${duplicates.join(',')}`);
            core.notice(`LABELS_FINAL=${finalLabels.length}; OBSOLETE_AGENT_LABELS=${finalLabels.filter(l=>/LOVABLE/i.test(l.name)).length}`);
