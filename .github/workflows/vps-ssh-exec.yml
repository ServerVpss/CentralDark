name: VPS SSH Exec
on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Comandos pra rodar no VPS'
        required: true
        type: string

jobs:
  exec:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configurar chave SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Executar no VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          CMDS: ${{ inputs.commands }}
        run: |
          echo "========== INÍCIO =========="
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "$CMDS"
          echo "========== FIM =========="
