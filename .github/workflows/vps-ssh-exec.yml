name: VPS SSH Exec
on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Comandos SSH para executar no VPS (separados por |||)'
        required: true
        type: string
      timeout_minutes:
        description: 'Timeout em minutos'
        required: false
        type: string
        default: '5'

jobs:
  exec:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.timeout_minutes) }}
    steps:
      - name: Executar comandos no VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            #!/bin/bash
            set -e
            echo "========== INÍCIO =========="
            IFS='|||' read -ra CMDS <<< "${{ inputs.commands }}"
            for cmd in "${CMDS[@]}"; do
              cmd=$(echo "$cmd" | xargs)
              [[ -z "$cmd" ]] && continue
              echo "\n\$ $cmd"
              eval "$cmd" || echo "⚠️ Comando retornou erro: $?"
            done
            echo "========== FIM =========="
