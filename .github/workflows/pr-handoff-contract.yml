name: PR HANDOFF CONTRACT

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-handoff:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect changed files
        id: files
        shell: bash
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/pr-files.txt || true
          {
            echo 'files<<EOF'
            cat /tmp/pr-files.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate PR handoff contract
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_FILES: ${{ steps.files.outputs.files }}
        run: node scripts/ci/pr-handoff-contract.mjs
