name: Migrar Secrets (in-memory)
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:
      - name: Rodar migração in-memory (passagem ampla)
        env:
          MIGRATION_GH_PAT: ${{ secrets.MIGRATION_GH_PAT }}
        run: |
          python3 -m pip install --quiet --user pynacl >/dev/null 2>&1 || true
          python3 - <<'PY'
          import os, re, json, base64, urllib.request, subprocess
          from nacl import encoding, public

          REPO="ServerVpss/CentralDark"
          TOKEN=os.environ["MIGRATION_GH_PAT"]
          MISSING=["ANTHROPIC_API_KEY","GEMINI_API_KEY","GROQ_API_KEY","SYNC_TOKEN","VPS_SSH_KEY_LOVABLE"]

          # Varredura ampla via grep recursivo
          roots=["/etc","/root","/opt","/home","/srv","/var/lib"]
          excl=["/proc","/sys","/node_modules/","/.git/","/revisoes/","/.npm/","/.cache/","/var/lib/docker"]
          patterns={
            "ANTHROPIC_API_KEY": [r"ANTHROPIC_API_KEY\s*[:=]\s*[\"']?(sk-ant-[A-Za-z0-9_-]{30,})", r"\b(sk-ant-[A-Za-z0-9_-]{40,})\b"],
            "GEMINI_API_KEY":    [r"GEMINI_API_KEY\s*[:=]\s*[\"']?(AIza[A-Za-z0-9_-]{30,})", r"GOOGLE_AI_STUDIO_KEY\s*[:=]\s*[\"']?(AIza[A-Za-z0-9_-]{30,})", r"\b(AIza[A-Za-z0-9_-]{35})\b"],
            "GROQ_API_KEY":      [r"GROQ_API_KEY\s*[:=]\s*[\"']?(gsk_[A-Za-z0-9]{30,})", r"\b(gsk_[A-Za-z0-9]{40,})\b"],
            "SYNC_TOKEN":        [r"SYNC_TOKEN\s*[:=]\s*[\"']?([A-Za-z0-9_\-\.]{16,})"],
          }
          found={}

          # grep eficiente
          for root in roots:
              if not os.path.isdir(root): continue
              cmd=["grep","-rIaE","-l","ANTHROPIC_API_KEY|GEMINI_API_KEY|GROQ_API_KEY|GOOGLE_AI_STUDIO_KEY|SYNC_TOKEN|sk-ant-|gsk_[A-Za-z0-9]|AIza[A-Za-z0-9]",root]
              for e in excl: cmd += ["--exclude-dir",e.strip("/").split("/")[-1]]
              try:
                  out=subprocess.run(cmd,capture_output=True,text=True,timeout=180).stdout
              except Exception: continue
              for fp in out.splitlines():
                  if any(x in fp for x in excl): continue
                  try:
                      with open(fp,"r",errors="ignore") as f: txt=f.read()
                  except Exception: continue
                  for name,regs in patterns.items():
                      if name in found: continue
                      for rg in regs:
                          m=re.search(rg,txt)
                          if m:
                              v=m.group(1).strip().strip('"\'')
                              if v and v.lower() not in ("changeme","xxx","todo"):
                                  found[name]=v; break

          # SSH KEY: procurar chaves privadas
          for p in ["/root/.ssh/id_lovable","/root/.ssh/id_rsa_lovable","/root/.ssh/lovable","/root/.ssh/id_ed25519_lovable",
                    "/root/.ssh/id_rsa","/root/.ssh/id_ed25519","/etc/centraldark/lovable.pem","/root/CentralDark/secrets/lovable_id",
                    "/root/.ssh/github_actions","/root/.ssh/lovable_id_ed25519"]:
              if "VPS_SSH_KEY_LOVABLE" in found: break
              if os.path.isfile(p):
                  try:
                      v=open(p).read().strip()
                      if "PRIVATE KEY" in v: found["VPS_SSH_KEY_LOVABLE"]=v
                  except Exception: pass
          # também varrer /root/.ssh por qualquer arquivo PEM
          if "VPS_SSH_KEY_LOVABLE" not in found:
              for r,_,fs in os.walk("/root/.ssh"):
                  for fn in fs:
                      fp=os.path.join(r,fn)
                      try:
                          v=open(fp).read()
                          if "BEGIN OPENSSH PRIVATE KEY" in v or "BEGIN RSA PRIVATE KEY" in v or "BEGIN EC PRIVATE KEY" in v:
                              found["VPS_SSH_KEY_LOVABLE"]=v.strip(); break
                      except Exception: pass
                  if "VPS_SSH_KEY_LOVABLE" in found: break

          # Enviar
          def gh(method,path,body=None):
              req=urllib.request.Request(f"https://api.github.com{path}",method=method,
                  headers={"Authorization":f"Bearer {TOKEN}","Accept":"application/vnd.github+json"},
                  data=(json.dumps(body).encode() if body else None))
              if body: req.add_header("Content-Type","application/json")
              try:
                  with urllib.request.urlopen(req) as r: return r.status,(r.read() or b"{}")
              except urllib.error.HTTPError as e: return e.code, e.read()
          st,b=gh("GET",f"/repos/{REPO}/actions/secrets/public-key")
          pk=json.loads(b)
          pub=public.PublicKey(pk["key"].encode(),encoding.Base64Encoder())

          ok=[]; miss=[]; fail=[]
          for name in MISSING:
              if name not in found:
                  miss.append(name); continue
              enc=base64.b64encode(public.SealedBox(pub).encrypt(found[name].encode())).decode()
              st,_=gh("PUT",f"/repos/{REPO}/actions/secrets/{name}",
                      {"encrypted_value":enc,"key_id":pk["key_id"]})
              if st in (201,204):
                  print(f"OK secret {name} HTTP {st}"); ok.append(name)
              else:
                  print(f"FAIL secret {name} HTTP {st}"); fail.append(name)
          print(f"\nRESUMO 2a passagem: enviadas={len(ok)} faltantes={len(miss)} falhas={len(fail)}")
          if miss: print("AINDA FALTANTES:", ",".join(miss))
          PY
