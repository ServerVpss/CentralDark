name: Migrar Secrets (in-memory)
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    steps:
      - name: Rodar migração in-memory
        env:
          MIGRATION_GH_PAT: ${{ secrets.MIGRATION_GH_PAT }}
        run: |
          python3 -m pip install --quiet --user pynacl >/dev/null 2>&1 || true
          python3 - <<'PY'
          import os, re, json, base64, urllib.request, glob
          from nacl import encoding, public

          REPO="ServerVpss/CentralDark"
          TOKEN=os.environ["MIGRATION_GH_PAT"]
          TARGETS=["ANTHROPIC_API_KEY","GEMINI_API_KEY","GROQ_API_KEY",
                   "GUARDA_TELEGRAM_BOT_TOKEN","SRVER1_BOT_TOKEN","SYNC_TOKEN",
                   "TELEGRAM_ALERTS_CHAT_ID","TELEGRAM_CHANNEL_ID",
                   "VPS_HOST_LOVABLE","VPS_USER_LOVABLE","VPS_SSH_KEY_LOVABLE"]

          # 1) Coletar candidatos de arquivos env
          paths=[]
          for root in ["/etc/centraldark","/root/CentralDark","/root/Multizap","/root/.config","/opt"]:
              for ext in ("*.env","*.env.*",".env","secrets*","*.sh"):
                  paths += glob.glob(f"{root}/**/{ext}", recursive=True)
          # remover ruído
          paths=[p for p in set(paths) if "/node_modules/" not in p and "/.git/" not in p and "/revisoes/" not in p]

          values={}
          # SSH key pode estar em arquivo PEM separado
          for pem in ["/root/.ssh/id_lovable","/root/.ssh/id_rsa_lovable","/root/.ssh/lovable","/root/.ssh/id_ed25519_lovable","/etc/centraldark/lovable.pem","/root/CentralDark/secrets/lovable_id"]:
              if os.path.isfile(pem):
                  try:
                      v=open(pem).read().strip()
                      if "PRIVATE KEY" in v:
                          values.setdefault("VPS_SSH_KEY_LOVABLE", v)
                  except Exception: pass

          def parse_env_line(line):
              m=re.match(r'\s*(?:export\s+)?([A-Z0-9_]+)\s*=\s*(.*?)\s*$', line)
              if not m: return None,None
              k,v=m.group(1),m.group(2)
              if (v.startswith('"') and v.endswith('"')) or (v.startswith("'") and v.endswith("'")):
                  v=v[1:-1]
              return k,v

          for p in paths:
              try:
                  with open(p,"r",errors="ignore") as f: lines=f.readlines()
              except Exception: continue
              for ln in lines:
                  k,v=parse_env_line(ln)
                  if not k or not v: continue
                  if k in TARGETS and k not in values:
                      values[k]=v
                  # mapeamentos alternativos
                  if k=="VPS_HOST" and "VPS_HOST_LOVABLE" not in values: values["VPS_HOST_LOVABLE"]=v
                  if k=="VPS_USER" and "VPS_USER_LOVABLE" not in values: values["VPS_USER_LOVABLE"]=v

          # Defaults razoáveis
          values.setdefault("VPS_USER_LOVABLE","root")
          try:
              ip=os.popen("hostname -I 2>/dev/null").read().split()
              if ip and "VPS_HOST_LOVABLE" not in values: values["VPS_HOST_LOVABLE"]=ip[0]
          except Exception: pass

          # 2) Chave pública do repo
          def gh(method,path,body=None):
              req=urllib.request.Request(f"https://api.github.com{path}",method=method,
                  headers={"Authorization":f"Bearer {TOKEN}","Accept":"application/vnd.github+json"},
                  data=(json.dumps(body).encode() if body else None))
              if body: req.add_header("Content-Type","application/json")
              try:
                  with urllib.request.urlopen(req) as r: return r.status,(r.read() or b"{}")
              except urllib.error.HTTPError as e: return e.code, e.read()
          st,b=gh("GET",f"/repos/{REPO}/actions/secrets/public-key")
          pk=json.loads(b)
          pub=public.PublicKey(pk["key"].encode(),encoding.Base64Encoder())

          # 3) Encriptar e enviar (sem imprimir valores)
          ok=[]; miss=[]; fail=[]
          for name in TARGETS:
              if name not in values:
                  miss.append(name); continue
              enc=base64.b64encode(public.SealedBox(pub).encrypt(values[name].encode())).decode()
              st,_=gh("PUT",f"/repos/{REPO}/actions/secrets/{name}",
                      {"encrypted_value":enc,"key_id":pk["key_id"]})
              if st in (201,204):
                  print(f"OK secret {name} HTTP {st}"); ok.append(name)
              else:
                  print(f"FAIL secret {name} HTTP {st}"); fail.append(name)

          # 4) Variable PR_REVIEW_PROVIDER=groq
          st,_=gh("POST",f"/repos/{REPO}/actions/variables",{"name":"PR_REVIEW_PROVIDER","value":"groq"})
          if st==409:
              st,_=gh("PATCH",f"/repos/{REPO}/actions/variables/PR_REVIEW_PROVIDER",{"name":"PR_REVIEW_PROVIDER","value":"groq"})
          print(f"OK variable PR_REVIEW_PROVIDER HTTP {st}")

          print(f"\nRESUMO: enviadas={len(ok)} faltantes={len(miss)} falhas={len(fail)}")
          if miss: print("FALTANTES:", ",".join(miss))
          if fail: print("FALHAS:", ",".join(fail))
          PY
