name: Migrar Secrets (in-memory)
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: Injeção direta do mapa /tmp/secrets_map.env
        env:
          MIGRATION_GH_PAT: ${{ secrets.MIGRATION_GH_PAT }}
        run: |
          python3 -m pip install --quiet --user pynacl >/dev/null 2>&1 || true
          python3 - <<'PY'
          import os, re, json, base64, urllib.request
          from nacl import encoding, public

          REPO="ServerVpss/CentralDark"
          TOKEN=os.environ["MIGRATION_GH_PAT"]
          MAP="/tmp/secrets_map.env"

          if not os.path.isfile(MAP):
              print(f"ERRO: {MAP} não existe"); raise SystemExit(2)

          values={}; current_key=None; buf=[]; in_heredoc=False; heredoc_tag=None
          with open(MAP,"r",errors="ignore") as f:
              for raw in f:
                  line=raw.rstrip("\n")
                  if in_heredoc:
                      if line.strip()==heredoc_tag:
                          values[current_key]="\n".join(buf).strip()
                          in_heredoc=False; current_key=None; buf=[]; heredoc_tag=None
                      else:
                          buf.append(line)
                      continue
                  s=line.strip()
                  if not s or s.startswith("#"): continue
                  # heredoc estilo NOME<<EOF
                  m=re.match(r'(?:export\s+)?([A-Z0-9_]+)\s*<<\s*([A-Za-z0-9_]+)\s*$', s)
                  if m:
                      current_key=m.group(1); heredoc_tag=m.group(2); in_heredoc=True; buf=[]; continue
                  m=re.match(r'(?:export\s+)?([A-Z0-9_]+)\s*=\s*(.*)$', s)
                  if not m: continue
                  k,v=m.group(1),m.group(2)
                  if (v.startswith('"') and v.endswith('"')) or (v.startswith("'") and v.endswith("'")):
                      v=v[1:-1]
                  values[k]=v

          def gh(method,path,body=None):
              req=urllib.request.Request(f"https://api.github.com{path}",method=method,
                  headers={"Authorization":f"Bearer {TOKEN}","Accept":"application/vnd.github+json"},
                  data=(json.dumps(body).encode() if body else None))
              if body: req.add_header("Content-Type","application/json")
              try:
                  with urllib.request.urlopen(req) as r: return r.status,(r.read() or b"{}")
              except urllib.error.HTTPError as e: return e.code, e.read()

          st,b=gh("GET",f"/repos/{REPO}/actions/secrets/public-key")
          pk=json.loads(b)
          pub=public.PublicKey(pk["key"].encode(),encoding.Base64Encoder())

          ok=[]; fail=[]
          for name in sorted(values.keys()):
              v=values[name]
              if not v:
                  print(f"SKIP {name} (vazio)"); continue
              enc=base64.b64encode(public.SealedBox(pub).encrypt(v.encode())).decode()
              st,_=gh("PUT",f"/repos/{REPO}/actions/secrets/{name}",
                      {"encrypted_value":enc,"key_id":pk["key_id"]})
              if st in (201,204):
                  print(f"OK secret {name} HTTP {st}"); ok.append(name)
              else:
                  print(f"FAIL secret {name} HTTP {st}"); fail.append(name)

          print(f"\nRESUMO: enviadas={len(ok)} falhas={len(fail)} total_mapa={len(values)}")

          # Limpeza
          if not fail:
              try:
                  os.remove(MAP); print(f"LIMPEZA: {MAP} apagado")
              except Exception as e:
                  print(f"LIMPEZA FALHOU: {e}")
          else:
              print(f"LIMPEZA pulada (houve falhas): {','.join(fail)}")
          PY
