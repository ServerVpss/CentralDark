name: 🚪 CENTRALDARK HORN LINE GATE

# Historical workflow: retained for UI identity only; all jobs permanently disabled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  horn-line-gate:
     if: ${{ false }}
   runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test raw Horn line gate
        run: node --test scripts/ci/centraldark-horn-line-gate.test.mjs
