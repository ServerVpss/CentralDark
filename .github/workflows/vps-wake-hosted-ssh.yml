name: VPS wake via hosted SSH

# Self-hosted NÃO acorda a si mesmo. Este job roda no GitHub hosted
# (ubuntu-latest) com as chaves VPS_*_LOVABLE já no repo.
# Autorizado: PERMITO-SEGREDO — restart VPS quando SSH local timeout.
# NÃO usa CONTABO_* (ausentes neste repo). Se a porta 22 estiver morta
# no provedor, este job também timeout — aí só Contabo API resolve.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: SSH na VPS e restart runner
        env:
          VPS_SSH_KEY_LOVABLE: ${{ secrets.VPS_SSH_KEY_LOVABLE }}
          VPS_HOST_LOVABLE: ${{ secrets.VPS_HOST_LOVABLE }}
          VPS_USER_LOVABLE: ${{ secrets.VPS_USER_LOVABLE }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY_LOVABLE:-}" ] || [ -z "${VPS_HOST_LOVABLE:-}" ] || [ -z "${VPS_USER_LOVABLE:-}" ]; then
            echo "SECRETS_MISSING: precisa VPS_SSH_KEY_LOVABLE + VPS_HOST_LOVABLE + VPS_USER_LOVABLE"
            exit 1
          fi
          KEY=/tmp/vps_wake_key
          python3 - "$KEY" <<'PY'
          import os, re, sys
          raw = os.environ["VPS_SSH_KEY_LOVABLE"].strip()
          m = re.search(
              r"-----BEGIN ([A-Z0-9 ]+?) PRIVATE KEY-----(.*?)-----END \1 PRIVATE KEY-----",
              raw,
              re.S,
          )
          if not m:
              sys.exit("formato de chave não reconhecido")
          tipo, miolo = m.group(1), m.group(2)
          b64 = re.sub(r"\s+", "", miolo)
          linhas = [b64[i:i+70] for i in range(0, len(b64), 70)]
          open(sys.argv[1], "w").write(
              f"-----BEGIN {tipo} PRIVATE KEY-----\n"
              + "\n".join(linhas)
              + f"\n-----END {tipo} PRIVATE KEY-----\n"
          )
          PY
          chmod 600 "$KEY"
          TARGET_HOST="${VPS_HOST_LOVABLE}"
          if ! getent hosts "$TARGET_HOST" >/dev/null 2>&1; then
            TARGET_HOST="89.117.78.124"
            echo "HOST_RESOLUTION_FALLBACK=VPS_CANONICAL_IP"
          fi
          echo "TARGET_HOST_SELECTED=1 USER_PRESENT=$([ -n "${VPS_USER_LOVABLE:-}" ] && echo 1 || echo 0)"
          set +e
          ssh -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -i "$KEY" \
              "${VPS_USER_LOVABLE}@${TARGET_HOST}" \
              bash -s <<'REMOTE'
          set -euo pipefail
          hostname
          uptime
          mapfile -t services < <(
            systemctl list-unit-files --type=service --no-legend \
              | awk '$1 ~ /^actions\.runner\..*\.service$/ {print $1}'
          )
          if [ "${#services[@]}" -eq 0 ]; then
            echo "RUNNER_SERVICE_NOT_FOUND"
            exit 3
          fi
          if [ "${#services[@]}" -ne 1 ]; then
            echo "RUNNER_SERVICE_AMBIGUOUS count=${#services[@]}"
            printf 'RUNNER_SERVICE_CANDIDATE=%s\n' "${services[@]}"
            exit 4
          fi
          service="${services[0]}"
          echo "RUNNER_SERVICE_FOUND=1"
          systemctl restart "$service"
          systemctl is-active --quiet "$service"
          echo "RUNNER_SERVICE_ACTIVE=1"
          REMOTE
          rc=$?
          rm -f "$KEY"
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "SSH_WAKE_FAIL rc=$rc"
            exit "$rc"
          fi
          echo "SSH_WAKE_OK"
