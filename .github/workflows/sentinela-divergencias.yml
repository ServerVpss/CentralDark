name: sentinela-divergencias

# Sentinela 24/7 — varre divergências no repo, workflows, endpoints públicos
# e PM2/MCP, e abre Issue automática (com dedupe por hash) pra cada uma.
# Roda a cada 6h e sob demanda.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só relata, não abre Issue'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: sentinela-divergencias
  cancel-in-progress: false

jobs:
  varredura:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Rodar sentinela
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PAT_PERFIL: ${{ secrets.GITHUB_PAT_PERFIL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          REPO_ALVO: ${{ github.repository }}
        run: node scripts/sentinela/run.mjs

      - name: Commit snapshot
        run: |
          git config user.name 'CentralDark Sentinela'
          git config user.email 'actions@github.com'
          git add -- docs/sentinela/last-snapshot.json docs/sentinela/last-report.md 2>/dev/null || true
          git commit -m "chore(sentinela): snapshot ${{ github.run_id }}

          Co-authored-by: SegredoiDev <segredounlock@users.noreply.github.com>" || exit 0
          git push || true

      # NOTA: o step "Atualizar Mega Painel" foi removido em 25/06/2026.
      # Motivo: race condition com painel-auto-update.yml e com o auto-commit
      # da VPS — três escritores no mesmo arquivo (painel-data.json) causavam
      # rejeição de push (non-fast-forward) na main. Agora só o
      # painel-auto-update.yml mantém o painel-data.json.
