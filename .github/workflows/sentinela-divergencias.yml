name: ⚙️ sentinela-divergencias

# Sentinela 24/7 — varre divergências no repo, workflows, endpoints públicos,
# PM2/MCP e drift de commit GitHub<->VPS, e abre Issue automática (com dedupe
# por hash) pra cada uma. Roda a cada 6h e sob demanda.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só relata, não abre Issue'
        required: false
        default: 'false'
  repository_dispatch:
    types: [centraldark_sentinel_route]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: sentinela-divergencias
  cancel-in-progress: false

jobs:
  varredura:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 🔹 Rodar testes determinísticos do drift GitHub<->VPS
        run: node --test scripts/sentinela/drift.test.mjs

      - name: ⏰ Provar kernel da rota determinística TIK-TAK
        run: python3 scripts/trigger-fabric/system_sentinel.py --self-test

      - name: 🔹 Validar CENTRALDARK_ROOT (fail-closed, sem imprimir valor)
        env:
          CENTRALDARK_ROOT: ${{ secrets.CENTRALDARK_ROOT }}
        run: |
          set -euo pipefail
          test -n "${CENTRALDARK_ROOT:-}" || {
            echo "::error::CENTRALDARK_ROOT ausente — drift GitHub<->VPS falhando fechado, sem adivinhar caminho"
            exit 1
          }

      - name: 🔹 Rodar sentinela
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          REPO_ALVO: ${{ github.repository }}
          VPS_REPO_PATH: ${{ secrets.CENTRALDARK_ROOT }}
          CENTRALDARK_SENTINEL_STATE_PATH: ${{ secrets.CENTRALDARK_ROOT }}/.artifacts/system-sentinel/state.json
          CENTRALDARK_SENTINEL_EVENT_LOG_PATH: ${{ secrets.CENTRALDARK_ROOT }}/.artifacts/system-sentinel/events.jsonl
          SENTINEL_API_SOURCE: ${{ github.event.client_payload.source || '' }}
          SENTINEL_API_EVENT_CLASS: ${{ github.event.client_payload.event_class || '' }}
          SENTINEL_API_STATE: ${{ github.event.client_payload.state || '' }}
          SENTINEL_API_TARGET: ${{ github.event.client_payload.target || '' }}
          SENTINEL_API_OWNER: ${{ github.event.client_payload.owner || '' }}
          SENTINEL_API_HEAD_SHA: ${{ github.event.client_payload.head_sha || '' }}
          SENTINEL_API_EVIDENCE_REF: ${{ github.event.client_payload.evidence_ref || '' }}
          SENTINEL_API_NEXT_CURSOR: ${{ github.event.client_payload.next_cursor || '' }}
        run: node scripts/sentinela/run.mjs

      - name: 🔹 Publicar snapshot como artifact imutável
        if: success()
        id: artifact_mirror_sentinela_divergencias_1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sentinela-snapshot-${{ github.run_id }}
          path: |
            docs/sentinela/last-snapshot.json
            docs/sentinela/last-report.md
          if-no-files-found: error
          retention-days: 30

      # Estado transitório não faz commit nem push na main. Issues deduplicadas,
      # job summary e artifact são os canais operacionais; Git permanece como
      # fonte de código e decisões aprovadas, não banco de telemetria viva.

      - name: 🔹 Classificar espelho de artifact
        if: always()
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ steps.artifact_mirror_sentinela_divergencias_1.outcome }}
        run: |
          set -euo pipefail
          if [ "${UPLOAD_OUTCOME:-}" = "success" ]; then
            echo "ARTIFACT_MIRROR=PASS"
          elif [ "${UPLOAD_OUTCOME:-}" = "failure" ]; then
            echo "ARTIFACT_MIRROR=DEGRADED"
          else
            echo "ARTIFACT_MIRROR=UNKNOWN"
          fi
