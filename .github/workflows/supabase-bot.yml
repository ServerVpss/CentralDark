name: supabase-bot

# Bot Supabase — read-only por padrão. Roda checks de schema/RLS/migrations
# e posta relatório. Escrita exige label adicional `confirm:write` na Issue.

on:
  schedule:
    - cron: '0 9 * * *'  # 06:00 BRT (UTC-3)
  workflow_dispatch:
  push:
    paths:
      - 'infra/supabase/migrations/**'
      - 'CentralDark/apps/supabase-bot/**'
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  rodar:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'assign:supabase-bot')
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gate obrigatório da META LUPA
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          base_ref="$(git rev-parse origin/main)"
          base_sha="$(git rev-parse "$base_ref:.agents/skills/meta-lupa")"
          head_sha="$(git rev-parse HEAD)"
          trusted="$RUNNER_TEMP/meta_lupa_gate.py"
          git show "$base_ref:.agents/skills/meta-lupa/scripts/meta_lupa.py" > "$trusted"
          receipt="$RUNNER_TEMP/meta-lupa-gate.json"
          python3 "$trusted" issue-gate-receipt --repo-root "$GITHUB_WORKSPACE" --repo ServerVpss/CentralDark \
            --mission-id "${GITHUB_WORKFLOW}-${GITHUB_RUN_ID}" --workspace-head "$head_sha" --canonical-ref "$base_ref" \
            --expected-canonical-sha "$base_sha" --output "$receipt"
          python3 "$trusted" gate --repo-root "$GITHUB_WORKSPACE" --input "$receipt" \
            --canonical-ref "$base_ref" --expected-canonical-sha "$base_sha" --expected-head-sha "$head_sha" --operation push
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Instalar deps do bot
        working-directory: CentralDark/apps/supabase-bot
        run: npm install --omit=dev --no-audit --no-fund

      - name: Rodar checks read-only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ALVO: ${{ github.repository }}
          ISSUE_NUM: ${{ github.event.issue.number || '' }}
        run: node CentralDark/apps/supabase-bot/src/index.mjs

      - name: Commit relatório
        run: |
          git config user.name 'CentralDark Supabase Bot'
          git config user.email 'actions@github.com'
          git add -- docs/RELATORIOS/supabase-bot 2>/dev/null || true
          git commit -m "chore(supabase-bot): relatório ${{ github.run_id }}

          Co-authored-by: SegredoiDev <segredounlock@users.noreply.github.com>" || exit 0
          git push || true
