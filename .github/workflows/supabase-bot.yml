name: supabase-bot

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'apps/supabase-bot/**'
      - '.github/workflows/supabase-bot.yml'
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  rodar:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'assign:supabase-bot')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Instalar dependências
        working-directory: apps/supabase-bot
        run: npm install --omit=dev --no-audit --no-fund
      - name: Rodar checks read-only
        env:
          SUPABASE_URL: ${{ github.event_name == 'pull_request' && '' || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.event_name == 'pull_request' && '' || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ALVO: ${{ github.repository }}
          ISSUE_NUM: ${{ github.event.issue.number || '' }}
        run: node apps/supabase-bot/src/index.mjs
      - name: Publicar relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: supabase-bot-${{ github.run_id }}
          path: docs/RELATORIOS/supabase-bot/
          if-no-files-found: error
          retention-days: 14
