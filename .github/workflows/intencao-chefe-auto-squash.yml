name: Intenção do Chefe → Squash Main

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited]
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: centraldark-intencao-chefe-auto-squash-main
  cancel-in-progress: false

jobs:
  promote:
    name: Aplicar intenção autorizada
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar e concluir squash sem reask
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ownCheckName = 'Aplicar intenção autorizada';
            const trustedGate = 'Gates determinísticos em runner self-hosted';
            const allowedConclusions = new Set(['success', 'neutral', 'skipped']);

            function authorized(body = '') {
              return /^Intent-Authorized:\s*SEGREDO\/CHEFE\s*$/mi.test(body)
                && /^Merge-Policy:\s*AUTO_SQUASH_IF_CLEAN\s*$/mi.test(body)
                && /^Intent-Scope:\s*\S.+$/mi.test(body)
                && /^Writer:\s*\S.+$/mi.test(body);
            }

            async function candidateNumbers() {
              if (context.eventName === 'pull_request_target') {
                return [context.payload.pull_request.number];
              }
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', base: 'main', per_page: 100,
              });
              return pulls.map((pr) => pr.number);
            }

            async function latestReviewBlocks(number) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: number, per_page: 100,
              });
              const latest = new Map();
              for (const review of reviews) {
                const login = review.user?.login;
                if (login) latest.set(login, review.state);
              }
              return [...latest.values()].includes('CHANGES_REQUESTED');
            }

            async function checksReady(pr) {
              const response = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, per_page: 100,
              });
              const runs = response.data.check_runs.filter((run) => run.name !== ownCheckName);
              const trusted = runs.find((run) => run.name === trustedGate);
              if (!trusted || trusted.status !== 'completed' || trusted.conclusion !== 'success') {
                core.info(`#${pr.number} aguardando gate confiável: ${trustedGate}`);
                return false;
              }
              const pending = runs.filter((run) => run.status !== 'completed');
              if (pending.length) {
                core.info(`#${pr.number} ainda tem checks pendentes: ${pending.map((x) => x.name).join(', ')}`);
                return false;
              }
              const failing = runs.filter((run) => !allowedConclusions.has(run.conclusion));
              if (failing.length) {
                core.warning(`#${pr.number} check causal/vermelho: ${failing.map((x) => `${x.name}:${x.conclusion}`).join(', ')}`);
                return false;
              }

              const statuses = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: pr.head.sha });
              if (statuses.data.total_count > 0 && statuses.data.state !== 'success') {
                core.warning(`#${pr.number} status legado não verde: ${statuses.data.state}`);
                return false;
              }
              return true;
            }

            for (const number of await candidateNumbers()) {
              let { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });

              if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.draft) continue;
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) {
                core.warning(`#${number} bloqueado: fork/head externo`);
                continue;
              }
              if (!authorized(pr.body || '')) {
                core.info(`#${number} sem recibo de intenção autorizada; não toca`);
                continue;
              }
              if (await latestReviewBlocks(number)) {
                core.warning(`#${number} bloqueado por CHANGES_REQUESTED não resolvido`);
                continue;
              }
              if (!(await checksReady(pr))) continue;

              // GitHub pode devolver mergeable=null enquanto recalcula. O cron tenta de novo.
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number }));
              if (pr.mergeable === null) {
                core.info(`#${number} mergeability ainda calculando; retry automático`);
                continue;
              }
              if (pr.mergeable !== true || pr.mergeable_state === 'dirty') {
                core.warning(`#${number} não mergeável: mergeable=${pr.mergeable} state=${pr.mergeable_state}`);
                continue;
              }

              // HEAD atrás da main: atualiza a própria branch, espera checks do novo HEAD e tenta novamente.
              if (pr.mergeable_state === 'behind') {
                try {
                  await github.rest.pulls.updateBranch({
                    owner, repo, pull_number: number, expected_head_sha: pr.head.sha,
                  });
                  core.info(`#${number} branch atualizada com main; aguardando checks do novo HEAD`);
                } catch (error) {
                  core.warning(`#${number} não conseguiu atualizar branch: ${error.message}`);
                }
                continue;
              }

              const result = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: number,
                merge_method: 'squash',
                sha: pr.head.sha,
                commit_title: `${pr.title} (#${number})`,
                commit_message: [
                  'Intenção já autorizada por SEGREDO/CHEFE.',
                  `Head validado: ${pr.head.sha}`,
                  'Merge-Policy: AUTO_SQUASH_IF_CLEAN',
                ].join('\n'),
              });

              if (!result.data.merged) {
                core.warning(`#${number} GitHub recusou merge: ${result.data.message}`);
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: [
                  '<!-- centraldark-intent-auto-squash -->',
                  '✅ **INTENÇÃO EXECUTADA — SQUASH MAIN**',
                  '',
                  `HEAD_PROVADO=\`${pr.head.sha}\``,
                  `MERGE_SHA=\`${result.data.sha}\``,
                  'AUTHORITY=`SEGREDO/CHEFE`',
                  'REASK=`NAO`',
                  'POLICY=`AUTO_SQUASH_IF_CLEAN`',
                ].join('\n'),
              });

              core.notice(`#${number} squash merge concluído em ${result.data.sha}`);
            }
