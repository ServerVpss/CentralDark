name: 🧾 Materializar evidência completa da sessão

# Historical workflow: retained for UI identity only; all jobs permanently disabled.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: materialize-session-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
     if: ${{ false }}
   if: github.repository == 'ServerVpss/CentralDark'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: Checkout da branch candidata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materializar ZIP exato e validar cadeia de custódia
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, stat, zipfile

          parts_dir = Path('.github/session-evidence-upload')
          out_dir = Path('evidence/session-completa-20260806')
          out_dir.mkdir(parents=True, exist_ok=True)
          out = out_dir / 'GATILHO-UNIVERSAL-IA-RIGOR-MAXIMO.zip'

          parts = sorted(parts_dir.glob('part-*.b64'))
          if len(parts) != 8:
              raise SystemExit(f'EXPECTED_8_PARTS_GOT={len(parts)}')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          out.write_bytes(base64.b64decode(encoded, validate=True))

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          if digest != '877057300af4369e01e9636809ee6b632ccac9f94db2894acd5f1a6b887588fd':
              raise SystemExit(f'GATILHO_SHA256_MISMATCH={digest}')
          if out.stat().st_size != 46740:
              raise SystemExit(f'GATILHO_SIZE_MISMATCH={out.stat().st_size}')

          dangerous = []
          symlinks = []
          with zipfile.ZipFile(out, 'r') as zf:
              infos = zf.infolist()
              bad_crc = zf.testzip()
              for info in infos:
                  name = info.filename.replace('\\', '/')
                  p = PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts or (len(name) > 1 and name[1] == ':'):
                      dangerous.append(name)
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      symlinks.append(name)
          if len(infos) != 54:
              raise SystemExit(f'GATILHO_ENTRIES_MISMATCH={len(infos)}')
          if bad_crc is not None:
              raise SystemExit(f'GATILHO_CRC_FAIL={bad_crc}')
          if dangerous:
              raise SystemExit(f'GATILHO_DANGEROUS_PATHS={dangerous}')
          if symlinks:
              raise SystemExit(f'GATILHO_SYMLINKS={symlinks}')

          print('GATILHO_MATERIALIZED=PASS')
          print(f'GATILHO_SHA256={digest}')
          print(f'GATILHO_SIZE_BYTES={out.stat().st_size}')
          print(f'GATILHO_ZIP_ENTRIES={len(infos)}')
          print('GATILHO_CRC=PASS')
          PY

      - name: Provar verificador e gerar pacote completo de aprendizado
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/evidence/verify-session-20260806.mjs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, stat, zipfile

          root = Path('.')
          docs = Path('docs/APRENDIZADOS/SESSAO-COMPLETA-2026-08-06')
          evidence = Path('evidence/session-completa-20260806')
          script = Path('scripts/evidence/verify-session-20260806.mjs')
          bundle = evidence / 'ARTEFATO-APRENDIZADO-COMPLETO-CENTRALDARK-20260806.zip'
          checksums = docs / 'SHA256SUMS.txt'
          contents_manifest = evidence / 'BUNDLE-CONTENTS.json'
          receipt = evidence / 'MATERIALIZACAO-ZIPS.json'

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          bundle.unlink(missing_ok=True)
          receipt.unlink(missing_ok=True)
          checksums.unlink(missing_ok=True)
          contents_manifest.unlink(missing_ok=True)

          selected = []
          for base in (docs, evidence):
              for p in sorted(base.rglob('*'), key=lambda x: x.as_posix().encode('utf-8')):
                  if p.is_file() and p not in {bundle, receipt, checksums, contents_manifest}:
                      selected.append(p)
          selected.append(script)
          selected = sorted(set(selected), key=lambda x: x.as_posix().encode('utf-8'))

          manifest = {
              'schema': 'centraldark.learning.bundle-contents.v1',
              'intent_author': 'SEGREDO/CHEFE',
              'files': [
                  {'path': p.as_posix(), 'size_bytes': p.stat().st_size, 'sha256': sha256(p)}
                  for p in selected
              ]
          }
          contents_manifest.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          selected.append(contents_manifest)
          selected = sorted(set(selected), key=lambda x: x.as_posix().encode('utf-8'))

          checksum_lines = [f'{sha256(p)}  {p.as_posix()}' for p in selected]
          checksums.write_text('\n'.join(checksum_lines) + '\n', encoding='utf-8')
          selected.append(checksums)
          selected = sorted(set(selected), key=lambda x: x.as_posix().encode('utf-8'))

          with zipfile.ZipFile(bundle, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as zf:
              for p in selected:
                  zf.write(p, arcname=p.as_posix())

          with zipfile.ZipFile(bundle, 'r') as zf:
              bad_crc = zf.testzip()
              infos = zf.infolist()
              dangerous = []
              symlinks = []
              for info in infos:
                  name = info.filename.replace('\\', '/')
                  parts = [part for part in name.split('/') if part not in ('', '.')]
                  if name.startswith('/') or '..' in parts or (len(name) > 1 and name[1] == ':'):
                      dangerous.append(name)
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      symlinks.append(name)

          if bad_crc is not None or dangerous or symlinks:
              raise SystemExit(f'LEARNING_BUNDLE_UNSAFE crc={bad_crc} dangerous={dangerous} symlinks={symlinks}')

          gatilho = evidence / 'GATILHO-UNIVERSAL-IA-RIGOR-MAXIMO.zip'
          receipt_data = {
              'schema': 'centraldark.learning.materialization.v1',
              'intent_author': 'SEGREDO/CHEFE',
              'source_branch': 'docs/aprendizado-sessao-completa-20260806',
              'gatilho': {
                  'path': gatilho.as_posix(),
                  'sha256': sha256(gatilho),
                  'size_bytes': gatilho.stat().st_size,
                  'zip_entries': 54,
                  'dangerous_paths': 0,
                  'symlinks': 0,
                  'crc': 'PASS'
              },
              'learning_bundle': {
                  'path': bundle.as_posix(),
                  'sha256': sha256(bundle),
                  'size_bytes': bundle.stat().st_size,
                  'zip_entries': len(infos),
                  'dangerous_paths': len(dangerous),
                  'symlinks': len(symlinks),
                  'crc': 'PASS' if bad_crc is None else 'FAIL',
                  'contains_exact_gatilho': any(i.filename == gatilho.as_posix() for i in infos)
              },
              'full_session_original': {
                  'name': 'PACOTE-SESSAO-INTEIRA-CENTRALDARK-20260806.zip',
                  'sha256': 'c00aa54b2ef2cb613067b50da58ef53b55e73b8074d078c5814d9558da07daf6',
                  'size_bytes': 32203566,
                  'zip_entries': 742,
                  'embedded_in_pr': False,
                  'registered_by_receipt': True
              },
              'effects': {'merge': False, 'deploy': False, 'restart': False, 'production_changed': False}
          }
          if not receipt_data['learning_bundle']['contains_exact_gatilho']:
              raise SystemExit('LEARNING_BUNDLE_MISSING_EXACT_GATILHO')
          receipt.write_text(json.dumps(receipt_data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(f'LEARNING_BUNDLE_SHA256={receipt_data["learning_bundle"]["sha256"]}')
          print(f'LEARNING_BUNDLE_SIZE_BYTES={receipt_data["learning_bundle"]["size_bytes"]}')
          print(f'LEARNING_BUNDLE_ZIP_ENTRIES={receipt_data["learning_bundle"]["zip_entries"]}')
          print('LEARNING_BUNDLE_CONTAINS_EXACT_GATILHO=PASS')
          PY

      - name: Commitar ZIPs reais e remover transporte temporário
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .github/session-evidence-upload
          rm -f .github/workflows/materialize-session-evidence.yml
          git config user.name "CentralDark Bot"
          git config user.email "bot@centralldark.com"
          git add -A
          git diff --cached --stat
          git commit -m "docs(evidence): materializar ZIPs completos da sessão"
          git push origin "HEAD:${GITHUB_REF_NAME}"
