name: PR585 Autofix Temporário

on:
  push:
    branches:
      - docs/modo-operacional-loop-evidencia-20260731

permissions:
  contents: write

concurrency:
  group: pr585-autofix-temporary
  cancel-in-progress: false

jobs:
  fix-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/modo-operacional-loop-evidencia-20260731
          fetch-depth: 0

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: Aplicar correção determinística
        run: python scripts/temporary/pr585_fix_operation_receipt.py

      - name: Instalar testes
        run: python -m pip install pytest

      - name: Validar sintaxe, diff e identidade canônica
        run: |
          python -m py_compile .agents/skills/meta-lupa/scripts/meta_lupa.py
          git diff --check
          python scripts/lupa/validar_autolupa_hash.py

      - name: Rodar regressões completas da Meta Lupa
        run: pytest .agents/skills/meta-lupa/testes -q

      - name: Remover executor temporário e publicar correção
        run: |
          rm -f scripts/temporary/pr585_fix_operation_receipt.py
          rm -f .github/workflows/pr585-autofix-temporary.yml
          git config user.name "centraldark-autofix[bot]"
          git config user.email "centraldark-autofix[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(meta-lupa): fechar falhas do operation receipt"
          git push origin HEAD:docs/modo-operacional-loop-evidencia-20260731
