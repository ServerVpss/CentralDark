name: Build CentralDark Architecture Package

on:
  push:
    branches:
      - reconcile/garimpo-one-site-one-mcp-admin-20260906
    paths:
      - scripts/artifacts/build_centraldark_architecture_package.py
      - .github/workflows/build-centraldark-architecture-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic document dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow==11.3.0 reportlab==4.4.3

      - name: Build architecture package
        run: |
          python scripts/artifacts/build_centraldark_architecture_package.py --out dist/centraldark-architecture

      - name: Show receipt
        run: |
          cat dist/centraldark-architecture/CENTRALDARK-ARQUITETURA-TOTAL.build.json
          cat dist/centraldark-architecture/CENTRALDARK-ARQUITETURA-TOTAL.zip.sha256

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: centraldark-arquitetura-total-${{ github.sha }}
          path: |
            dist/centraldark-architecture/CENTRALDARK-ARQUITETURA-TOTAL.zip
            dist/centraldark-architecture/CENTRALDARK-ARQUITETURA-TOTAL.zip.sha256
            dist/centraldark-architecture/CENTRALDARK-ARQUITETURA-TOTAL.pdf
            dist/centraldark-architecture/CENTRALDARK-ARQUITETURA-TOTAL.build.json
          if-no-files-found: error
          retention-days: 30
