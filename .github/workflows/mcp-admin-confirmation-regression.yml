name: MCP Admin Confirmation Regression

on:
  pull_request:
    paths:
      - "apps/modulos/mcp/**"
      - ".github/workflows/mcp-admin-confirmation-regression.yml"
  push:
    branches: [main]
    paths:
      - "apps/modulos/mcp/**"
      - ".github/workflows/mcp-admin-confirmation-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-confirmation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/modulos/mcp/package-lock.json
      - name: Install locked MCP dependencies
        run: npm ci
        working-directory: apps/modulos/mcp
      - name: Run confirmation, classifier, envelope and audit regression tests
        run: npm run test:admin-confirmation
        working-directory: apps/modulos/mcp
      - name: Syntax-check changed runtime modules
        run: |
          node --check src/mcp-server.js
          node --check src/tools/core/mcp-admin.js
          node --check src/tools/vps/vps-lazy.js
          node --check src/tool-result-envelope.js
          node --check src/audit-logger.js
        working-directory: apps/modulos/mcp
