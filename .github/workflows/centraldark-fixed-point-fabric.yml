name: "🧭 Fixed Point Fabric Proof"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/modulos/fixed-point-fabric/**'
      - '.github/workflows/centraldark-fixed-point-fabric.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixed-point-fabric-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove-same-head:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/modulos/fixed-point-fabric
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove checkout HEAD
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
        working-directory: .
      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/modulos/fixed-point-fabric/pyproject.toml
      - name: Runtime contract
        run: |
          python3 --version
          python3 -c "import sys; assert sys.version_info >= (3, 11), sys.version"
      - name: Compile
        run: python3 -m compileall -q src
      - name: Unit and counterproof suite
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
      - name: Deterministic fixed-point receipt
        env:
          PYTHONPATH: src
        run: python3 tests/ci_fixed_point.py | tee fixed-point-ci-receipt.json
      - name: Reject embedded secrets
        run: |
          if grep -RIE --exclude='.env.example' --exclude='*.md' '(github_pat_|ghp_|sk-[A-Za-z0-9_-]{12,}|BEGIN (RSA|OPENSSH) PRIVATE KEY)' .; then
            echo 'Potential secret found'
            exit 1
          fi
      - name: Receipt integrity
        run: >-
          test -s fixed-point-ci-receipt.json &&
          grep -q '"chain_valid": true' fixed-point-ci-receipt.json
