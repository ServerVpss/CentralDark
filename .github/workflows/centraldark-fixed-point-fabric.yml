name: 🔥 CentralDark Forja Total — Fixed Point VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/modulos/fixed-point-fabric/**"
      - "scripts/drive-ingest-once.sh"
      - "scripts/drive-ingest-once.test.sh"
      - "scripts/sync-loop.sh"
      - "scripts/trigger-fabric/boot_forja_total.py"
      - "scripts/trigger-fabric/test_boot_forja_total.py"
      - "docs/ARQUITETURA/CENTRALDARK-FORJA-VIVA/**"
      - ".github/workflows/centraldark-fixed-point-fabric.yml"

permissions:
  contents: read

concurrency:
  group: centraldark-forja-total-vps
  cancel-in-progress: false

jobs:
  prove-and-deploy:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Provar BOOT-FORJA-TOTAL no mesmo motor
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/trigger-fabric/test_boot_forja_total.py
          python3 scripts/trigger-fabric/boot_forja_total.py | tee "$RUNNER_TEMP/boot-forja-total.json"
          jq -e '.status == "PASS" and .canonical_trigger == "!CENTRALDARK" and (.chain | index("FIXED_POINT") != null) and .creates_second_brain == false' "$RUNNER_TEMP/boot-forja-total.json" >/dev/null
          echo "TRIGGER_ADAPTER_TEST=PASS"

      - name: Contraprovar auto-ingest do Drive sem rede real
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/drive-ingest-once.sh scripts/drive-ingest-once.test.sh scripts/sync-loop.sh
          bash scripts/drive-ingest-once.test.sh

      - name: Testar Fixed Point Fabric
        shell: bash
        run: |
          set -euo pipefail
          cd apps/modulos/fixed-point-fabric
          python3 -m unittest discover -s tests -v
          echo "FIXED_POINT_PACKAGE_TESTS=PASS"

      - name: Instalar heartbeat VPS sem atropelar porta existente
        shell: bash
        run: |
          set -euo pipefail
          if systemctl is-active --quiet centraldark-vps-heartbeat.service; then
            owner="centraldark-vps-heartbeat.service"
          else
            owner=""
          fi
          if ss -ltn 'sport = :9119' | grep -q LISTEN && [[ "$owner" != "centraldark-vps-heartbeat.service" ]]; then
            echo "PORT_9119_OWNED_BY_OTHER_RUNTIME"
            exit 31
          fi
          sudo bash apps/modulos/fixed-point-fabric/deploy/linux/install.sh
          sudo systemctl enable --now centraldark-vps-heartbeat.service
          health="$(curl -fsS --max-time 5 http://127.0.0.1:9119/)"
          jq -e '.timestamp and .hostname and .agent_version == "1.0.0"' <<<"$health" >/dev/null
          echo "VPS_HEARTBEAT_HEALTH=PASS"

      - name: Promover auto-ingest no owner PM2 existente e provar Drive real
        shell: bash
        run: |
          set -Eeuo pipefail
          sync_json="$(pm2 jlist | jq -c '[.[] | select(.name == "CentralDark-SyncDrive")] | first')"
          [[ "$sync_json" != "null" && -n "$sync_json" ]] || { echo "CENTRALDARK_SYNC_DRIVE_NOT_FOUND"; exit 41; }
          [[ "$(jq -r '.pm2_env.status // ""' <<<"$sync_json")" == "online" ]] || { echo "CENTRALDARK_SYNC_DRIVE_NOT_ONLINE"; exit 42; }
          runtime_root="$(jq -r '.pm2_env.pm_cwd // ""' <<<"$sync_json")"
          runtime_exec="$(jq -r '.pm2_env.pm_exec_path // ""' <<<"$sync_json")"
          [[ -n "$runtime_root" && -d "$runtime_root/.git" ]] || { echo "SYNC_RUNTIME_ROOT_INVALID"; exit 43; }
          [[ "$(basename "$runtime_exec")" == "sync-loop.sh" ]] || { echo "SYNC_RUNTIME_EXEC_MISMATCH"; exit 44; }
          [[ "$(git -C "$runtime_root" remote get-url origin)" =~ github\.com[:/]ServerVpss/CentralDark(\.git)?$ ]] || { echo "SYNC_RUNTIME_REPO_MISMATCH"; exit 45; }

          target_sync="$runtime_root/scripts/sync-loop.sh"
          target_ingest="$runtime_root/scripts/drive-ingest-once.sh"
          [[ -f "$target_sync" ]] || { echo "SYNC_TARGET_MISSING"; exit 46; }
          if [[ -n "$(git -C "$runtime_root" status --porcelain -- scripts/sync-loop.sh scripts/drive-ingest-once.sh)" ]]; then
            echo "SYNC_TARGET_DIRTY_BLOCKED"
            exit 47
          fi

          backup_sync="$RUNNER_TEMP/sync-loop.before.sh"
          cp -a "$target_sync" "$backup_sync"
          ingest_existed=0
          backup_ingest="$RUNNER_TEMP/drive-ingest.before.sh"
          if [[ -f "$target_ingest" ]]; then
            ingest_existed=1
            cp -a "$target_ingest" "$backup_ingest"
          fi
          promoted=0
          rollback() {
            rc=$?
            trap - EXIT ERR
            if [[ "$rc" -ne 0 && "$promoted" == "1" ]]; then
              install -m 0755 "$backup_sync" "$target_sync" || true
              if [[ "$ingest_existed" == "1" ]]; then
                install -m 0755 "$backup_ingest" "$target_ingest" || true
              else
                rm -f "$target_ingest"
              fi
              pm2 restart CentralDark-SyncDrive >/dev/null 2>&1 || true
              pm2 save --force >/dev/null 2>&1 || true
              echo "DRIVE_INGEST_ROLLBACK=ATTEMPTED"
            fi
            exit "$rc"
          }
          trap rollback EXIT ERR

          install -m 0755 scripts/sync-loop.sh "$target_sync"
          install -m 0755 scripts/drive-ingest-once.sh "$target_ingest"
          promoted=1

          CENTRALDARK_REPO_ROOT="$runtime_root" \
          CENTRALDARK_DRIVE_INGEST_RUN_SENTINEL=0 \
          CENTRALDARK_DRIVE_INGEST_REQUIRE=1 \
          "$target_ingest" | tee "$RUNNER_TEMP/drive-ingest-runtime.txt"
          grep -Eq '^DRIVE_INGEST_STATUS=(INGESTED|NO_CHANGE)$' "$RUNNER_TEMP/drive-ingest-runtime.txt"

          old_pid="$(pm2 pid CentralDark-SyncDrive | tail -n1)"
          pm2 restart CentralDark-SyncDrive >/dev/null
          pm2 save --force >/dev/null
          sleep 4
          new_pid="$(pm2 pid CentralDark-SyncDrive | tail -n1)"
          [[ "$new_pid" =~ ^[0-9]+$ && "$new_pid" -gt 0 ]] || { echo "SYNC_RESTART_PID_INVALID"; exit 48; }
          [[ "$new_pid" != "$old_pid" ]] || { echo "SYNC_RESTART_PID_NOT_REPLACED"; exit 49; }
          pm2 jlist | jq -e 'any(.[]; .name == "CentralDark-SyncDrive" and .pm2_env.status == "online" and (.pid | tonumber) > 0)' >/dev/null

          promoted=0
          echo "CENTRALDARK_SYNC_DRIVE=ONLINE"
          echo "DRIVE_INGEST_RUNTIME=PASS"
          echo "FIXED_POINT=NOT_CLAIMED"
          echo "NEXT_CURSOR=CASA_GITHUB_SCREENPIPE_RENDEZVOUS"
