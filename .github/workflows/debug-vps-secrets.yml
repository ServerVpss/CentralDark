name: Debug VPS Secrets

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets length
        run: |
          echo "VPS_HOST_LOVABLE length: ${#VPS_HOST_LOVABLE}"
          echo "VPS_USER_LOVABLE length: ${#VPS_USER_LOVABLE}"
          echo "VPS_SSH_KEY_LOVABLE length: ${#VPS_SSH_KEY_LOVABLE}"
        env:
          VPS_HOST_LOVABLE: ${{ secrets.VPS_HOST_LOVABLE }}
          VPS_USER_LOVABLE: ${{ secrets.VPS_USER_LOVABLE }}
          VPS_SSH_KEY_LOVABLE: ${{ secrets.VPS_SSH_KEY_LOVABLE }}