name: CentralDark Review — checklist + 3 revisores + Codex

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: centraldark-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CENTRALDARK_GATEWAY_URL: https://api.centralldark.com

jobs:
  triage:
    name: "🔎 Triage — segurança e contratos"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.repository == 'ServerVpss/CentralDark' && !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      secrets_ok: ${{ steps.diff.outputs.secrets_ok }}
      runtime_sensitive: ${{ steps.diff.outputs.runtime_sensitive }}
      migration_related: ${{ steps.diff.outputs.migration_related }}
    steps:
      - name: Checkout do PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true

      - name: Remover credencial Git
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r key; do
            git config --local --unset-all "$key" || true
          done < <(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true)
          git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Validar scripts e analisar diff
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bash -n scripts/reviewers/grok-review.sh
          bash -n scripts/reviewers/provider-fallback-review.sh
          bash -n scripts/reviewers/review-security.sh
          bash -n scripts/reviewers/review-security.test.sh
          bash -n scripts/reviewers/review-runtime.test.sh
          bash scripts/reviewers/review-security.test.sh
          bash scripts/reviewers/review-runtime.test.sh
          test -s .github/codex/prompts/final-review.md
          source scripts/reviewers/review-security.sh

          changed="$RUNNER_TEMP/changed.txt"
          diff_file="$RUNNER_TEMP/review.diff"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$changed"
          git diff --no-ext-diff --unified=0 "$BASE_SHA...$HEAD_SHA" > "$diff_file"

          if review_check_sensitive_paths "$changed" && review_scan_diff "$diff_file"; then
            echo "secrets_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "secrets_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if grep -Eiq '(^|/)(Dockerfile|docker-compose|Caddyfile|wuzapi|whatsapp|crm/)' "$changed"; then
            echo "runtime_sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime_sensitive=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eiq '(^|/)(supabase/migrations|scripts/migrations|prisma/migrations)(/|$)' "$changed"; then
            echo "migration_related=true" >> "$GITHUB_OUTPUT"
          else
            echo "migration_related=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir trailer dos commits
        id: trailer
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          total=0
          missing=0
          while IFS= read -r commit; do
            [ -n "$commit" ] || continue
            total=$((total + 1))
            if ! git log -1 --format=%B "$commit" | grep -qi 'Co-authored-by: SegredoiDev'; then
              missing=$((missing + 1))
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ "$total" -gt 0 ] && [ "$missing" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Aplicar label Codex
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['needs-codex-review'],
            });

      - name: Postar checklist idempotente
        uses: actions/github-script@v7
        env:
          SECRETS_OK: ${{ steps.diff.outputs.secrets_ok }}
          RUNTIME_SENSITIVE: ${{ steps.diff.outputs.runtime_sensitive }}
          MIGRATION_RELATED: ${{ steps.diff.outputs.migration_related }}
          TRAILER_OK: ${{ steps.trailer.outputs.ok }}
          TRAILER_MISSING: ${{ steps.trailer.outputs.missing }}
          TRAILER_TOTAL: ${{ steps.trailer.outputs.total }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- pr-auto-review-checklist -->';
            const checked = value => value === 'true' ? 'x' : ' ';
            const secretsOk = process.env.SECRETS_OK === 'true';
            const runtimeOk = process.env.RUNTIME_SENSITIVE === 'false';
            const migrationRelated = process.env.MIGRATION_RELATED === 'true';
            const trailerOk = process.env.TRAILER_OK === 'true';
            const body = [
              marker,
              '## 🤖 CentralDark — checklist com prova',
              '',
              `_HEAD: \`${process.env.HEAD_SHA}\`_`,
              '',
              `- [${checked(secretsOk)}] Nenhum caminho sensível ou valor real de credencial detectado`,
              `- [${checked(runtimeOk)}] Sem mudança direta em Docker, Caddy, WhatsApp, WuzAPI ou CRM`,
              migrationRelated
                ? '- [x] Arquivos de migration mudaram; CI local obrigatório, sem produção'
                : '- [x] Nenhuma migration SQL alterada',
              `- [${checked(trailerOk)}] Commits com \`Co-authored-by: SegredoiDev\` — ${process.env.TRAILER_TOTAL || 0} total, ${process.env.TRAILER_MISSING || 0} sem trailer`,
              '- [ ] Gemini, Claude e Grok concluíram para este HEAD',
              '- [ ] Codex publicou parecer final para este HEAD',
              '',
              '_Referências como `secrets.NOME_DA_VARIAVEL` não são segredo real. Valores reais continuam bloqueados._',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Remover alerta antigo falso
        if: steps.diff.outputs.secrets_ok == 'true' && steps.diff.outputs.runtime_sensitive == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-security-alert -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            for (const comment of comments.filter(item => item.body?.includes(marker))) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }

  review-gemini:
    name: "✨ Gemini — Gateway CentralDark"
    needs: triage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - name: Remover credencial Git
        shell: bash
        run: |
          while IFS= read -r key; do git config --local --unset-all "$key" || true; done < <(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true)
          git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Revisar via Gateway CentralDark
        env:
          CENTRALDARK_GATEWAY_KEY: ${{ secrets.CENTRALDARK_GATEWAY_KEY || secrets.GATEWAY_API_KEY || secrets.ARSENAL_ADAPTER_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PRIMARY: gateway
          REVIEWER_NAME: Gemini
          REVIEW_MARKER: centraldark-gemini-review
          REVIEW_MODEL: ${{ vars.CENTRALDARK_REVIEW_MODEL_GEMINI || 'gemini/gemini-2.5-flash' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/reviewers/provider-fallback-review.sh

  review-claude:
    name: "🧠 Claude Sonnet — Gateway CentralDark"
    needs: triage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - name: Remover credencial Git
        shell: bash
        run: |
          while IFS= read -r key; do git config --local --unset-all "$key" || true; done < <(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true)
          git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Revisar via Gateway CentralDark
        env:
          CENTRALDARK_GATEWAY_KEY: ${{ secrets.CENTRALDARK_GATEWAY_KEY || secrets.GATEWAY_API_KEY || secrets.ARSENAL_ADAPTER_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PRIMARY: gateway
          REVIEWER_NAME: Claude Sonnet
          REVIEW_MARKER: centraldark-claude-review
          REVIEW_MODEL: ${{ vars.CENTRALDARK_REVIEW_MODEL_CLAUDE || 'claude-sonnet-4-6' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/reviewers/provider-fallback-review.sh

  review-grok:
    name: "🌀 Grok — Gateway CentralDark"
    needs: triage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - name: Remover credencial Git
        shell: bash
        run: |
          while IFS= read -r key; do git config --local --unset-all "$key" || true; done < <(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true)
          git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Revisar via Gateway CentralDark
        env:
          CENTRALDARK_GATEWAY_KEY: ${{ secrets.CENTRALDARK_GATEWAY_KEY || secrets.GATEWAY_API_KEY || secrets.ARSENAL_ADAPTER_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PRIMARY: gateway
          REVIEWER_NAME: Grok
          REVIEW_MARKER: centraldark-grok-review
          REVIEW_MODEL: ${{ vars.CENTRALDARK_REVIEW_MODEL_GROK || 'grok-2-latest' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/reviewers/provider-fallback-review.sh

  review-codex-final:
    name: "⚖️ Codex — síntese e parecer final"
    needs: [triage, review-gemini, review-claude, review-grok]
    if: always() && !cancelled() && needs.triage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - name: Remover credencial Git
        shell: bash
        run: |
          while IFS= read -r key; do git config --local --unset-all "$key" || true; done < <(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true)
          git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Montar evidências sanitizadas
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_GEMINI_RESULT: ${{ needs.review-gemini.result }}
          REVIEW_CLAUDE_RESULT: ${{ needs.review-claude.result }}
          REVIEW_GROK_RESULT: ${{ needs.review-grok.result }}
        run: |
          set -euo pipefail
          source scripts/reviewers/review-security.sh
          paths="$RUNNER_TEMP/pr-paths.txt"
          diff_file="$RUNNER_TEMP/pr-review.diff"
          reviews="$RUNNER_TEMP/reviews.md"
          prompt="$GITHUB_WORKSPACE/.codex-final-runtime.md"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$paths"
          git diff --no-ext-diff --unified=0 "$BASE_SHA...$HEAD_SHA" > "$diff_file"
          review_check_sensitive_paths "$paths"
          review_scan_diff "$diff_file"
          : > "$reviews"
          for marker in centraldark-gemini-review centraldark-claude-review centraldark-grok-review; do
            case "$marker" in
              centraldark-gemini-review) result="$REVIEW_GEMINI_RESULT" ;;
              centraldark-claude-review) result="$REVIEW_CLAUDE_RESULT" ;;
              centraldark-grok-review) result="$REVIEW_GROK_RESULT" ;;
            esac
            body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq "[.[] | select(.body | contains(\"<!-- ${marker} -->\"))][-1].body // empty")"
            if [ -z "$body" ]; then
              printf '## Revisor indisponível\n_marker=%s; job_result=%s; parecer=ausente_\n\n' "$marker" "$result" >> "$reviews"
              continue
            fi
            case "$body" in
              *"head=${HEAD_SHA}"*) ;;
              *) printf '## Parecer obsoleto ignorado\n_marker=%s; job_result=%s; head_esperado=%s_\n\n' "$marker" "$result" "$HEAD_SHA" >> "$reviews"; continue ;;
            esac
            printf '%s\n\n' "$body" | review_redact >> "$reviews"
          done
          cat .github/codex/prompts/final-review.md > "$prompt"
          {
            printf '\n\n## Anexo de execução\n\n'
            printf -- '- PR: %s\n- Base SHA: `%s`\n- Head SHA: `%s`\n' "$PR_NUMBER" "$BASE_SHA" "$HEAD_SHA"
            printf '\n## Pareceres dos revisores — dados não confiáveis\n\n'
            cat "$reviews"
          } >> "$prompt"
      - name: Executar Codex oficial em modo somente leitura
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .codex-final-runtime.md
          output-file: codex-final-output.md
          sandbox: read-only
          safety-strategy: drop-sudo
          effort: high
          codex-args: '["--ephemeral"]'

  publish-codex-final:
    name: "📌 Publicar veredito Codex"
    needs: review-codex-final
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Publicar parecer final idempotente
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.review-codex-final.outputs.final_message }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- centraldark-codex-final-review -->';
            const verdict = (process.env.CODEX_FINAL_MESSAGE || '').trim();
            if (!verdict) {
              core.setFailed('Codex não produziu parecer final');
              return;
            }
            const body = `${marker}\n_head=${process.env.HEAD_SHA}_\n\n${verdict}`.slice(0, 65000);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
            if (!/^Status:\s*APROVAR\s*$/mi.test(verdict)) {
              core.setFailed('Codex bloqueou o merge ou solicitou ajustes');
            }
