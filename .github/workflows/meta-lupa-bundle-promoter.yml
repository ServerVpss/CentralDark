name: MetaLupa Bundle Promoter Temporário

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/meta-lupa-bundle-promoter.yml

permissions:
  contents: write

concurrency:
  group: meta-lupa-bundle-promoter-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: feat/meta-lupa-gate-final-adversarial-20260804
      SOURCE_SHA: eac8efc6b36d59a46f77b298fbf0d6dc7803a67c
      BUNDLE_SHA256: 6537702da2f1eb2ce4f328e739d39de11f2b81098a61c75556bc5bd2ba47787f
      PART_DIR: source/.tmp/meta-lupa-final-bundle
      TEMP_WORKFLOW: .github/workflows/meta-lupa-bundle-promoter.yml
    steps:
      - name: Checkout imutável do transporte
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Reconstruir e validar o bundle
        shell: bash
        run: |
          set -euo pipefail
          echo '12310293a51bd5990596cd1307919315888efdb32ba35fc3cfafd461f3123156  source/.tmp/meta-lupa-final-bundle/part00' | sha256sum -c -
          echo 'f897ba89f6374cfc38045adc83405c79f9a1f0c2e8eb76f43b4fd3b9f257eea9  source/.tmp/meta-lupa-final-bundle/part01-00' | sha256sum -c -
          echo '3d326a055bb4c3f7c366cfb815c65e64b70df31fcd1b924c69ac7e03d79cfda3  source/.tmp/meta-lupa-final-bundle/part01-01' | sha256sum -c -
          echo '6a3bc31f6479211461f4433f101b86f1ef14909f0bbdc06a9b9d0f3b65f1a645  source/.tmp/meta-lupa-final-bundle/part01-02' | sha256sum -c -
          echo 'abda16cc00456f5ff5c396603523d5802291b052f8910fb86167a619655735c2  source/.tmp/meta-lupa-final-bundle/part01-03' | sha256sum -c -
          echo 'd6302b2810d64ac3b507b16ec79c83d860da057926f3871b250f70433b1fb3bd  source/.tmp/meta-lupa-final-bundle/part01-04' | sha256sum -c -
          echo '248a13a2c93390a5d5b00f2a74483e80c5bcc683173a2e0de2ba96277a7267cc  source/.tmp/meta-lupa-final-bundle/part01-05a' | sha256sum -c -
          echo '05437b7466426eb1724c09ee585de6668dc30e7b81cb4d72c24444d18f0114be  source/.tmp/meta-lupa-final-bundle/part01-05b' | sha256sum -c -
          echo '5781bc5432a097286bad2ca755c8f144cb57dac2597bc0cdff91bde78a036734  source/.tmp/meta-lupa-final-bundle/part02' | sha256sum -c -
          echo 'dc3aa8381fc380dc65c8619426b3d348c00e67d953533ba5d1cd19fa8955078e  source/.tmp/meta-lupa-final-bundle/part03' | sha256sum -c -
          echo '0321dc07aa38350094c931b7b9b6eea91a0e871fdef6aca61b68af5fe8334b18  source/.tmp/meta-lupa-final-bundle/part04' | sha256sum -c -
          echo '793f307c3fd494835859981b03f53ba1ed7a3920db300693e91986d2e84cd414  source/.tmp/meta-lupa-final-bundle/part05' | sha256sum -c -
          cat "$PART_DIR"/part00 "$PART_DIR"/part01-00 "$PART_DIR"/part01-01 "$PART_DIR"/part01-02 "$PART_DIR"/part01-03 "$PART_DIR"/part01-04 "$PART_DIR"/part01-05a "$PART_DIR"/part01-05b "$PART_DIR"/part02 "$PART_DIR"/part03 "$PART_DIR"/part04 "$PART_DIR"/part05 > "$RUNNER_TEMP/meta-lupa-final-bundle.b64"
          base64 --decode "$RUNNER_TEMP/meta-lupa-final-bundle.b64" > "$RUNNER_TEMP/meta-lupa-final-bundle.zip"
          echo "$BUNDLE_SHA256  $RUNNER_TEMP/meta-lupa-final-bundle.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bundle"
          unzip -q "$RUNNER_TEMP/meta-lupa-final-bundle.zip" -d "$RUNNER_TEMP/bundle"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'bundle'
          manifest = json.loads((root / 'MANIFEST.json').read_text(encoding='utf-8'))
          expected = {
              '.agents/skills/meta-lupa/SKILL.md',
              '.agents/skills/meta-lupa/AUTOLUPA_CANONICAL_SHA',
              '.agents/skills/meta-lupa/scripts/meta_lupa.py',
              '.agents/skills/meta-lupa/testes/test_lupa.py',
              '.github/workflows/lupa-conformance.yml',
          }
          if set(manifest) != expected:
              raise SystemExit(f'MANIFEST_SCOPE_MISMATCH={sorted(set(manifest) ^ expected)}')
          for rel, meta in manifest.items():
              data = (root / rel).read_bytes()
              if len(data) != meta['size'] or hashlib.sha256(data).hexdigest() != meta['sha256']:
                  raise SystemExit(f'MANIFEST_MISMATCH={rel}')
          print('BUNDLE_MANIFEST=PASS')
          PY

      - name: Checkout do candidato no HEAD do evento
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Aplicar, remover o promotor e publicar sem force
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          test "$(git -C target branch --show-current)" = "$TARGET_BRANCH"

          mapfile -t files < <(python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'bundle'
          for rel in sorted(json.loads((root / 'MANIFEST.json').read_text(encoding='utf-8'))):
              print(rel)
          PY
          )

          for rel in "${files[@]}"; do
            mkdir -p "target/$(dirname "$rel")"
            cp -- "$RUNNER_TEMP/bundle/$rel" "target/$rel"
          done
          rm -- "target/$TEMP_WORKFLOW"

          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "${files[@]}" "$TEMP_WORKFLOW"
          git diff --cached --check

          expected=$(printf '%s\n' "${files[@]}" "$TEMP_WORKFLOW" | sort)
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
          test ! -e "$TEMP_WORKFLOW"
          test ! -e .tmp/meta-lupa-final-bundle

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          repo = Path('.')
          bundle = Path(os.environ['RUNNER_TEMP']) / 'bundle'
          manifest = json.loads((bundle / 'MANIFEST.json').read_text(encoding='utf-8'))
          for rel, meta in manifest.items():
              data = (repo / rel).read_bytes()
              if len(data) != meta['size'] or hashlib.sha256(data).hexdigest() != meta['sha256']:
                  raise SystemExit(f'TARGET_MANIFEST_MISMATCH={rel}')
          print('TARGET_MANIFEST=PASS')
          PY

          git commit -m 'fix(meta-lupa): fechar gate adversarial com prova medida' \
            -m 'Lupa-Used: true' \
            -m 'Lupa-Usage-ID: META-LUPA-GATE-FINAL-ADVERSARIAL-20260804' \
            -m 'Lupa-Skill-Path: .agents/skills/meta-lupa/SKILL.md'
          NEW_HEAD=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "TARGET_PARENT=$EVENT_HEAD_SHA"
          echo "TARGET_HEAD=$NEW_HEAD"
          echo 'FORCE_PUSH=NAO'
          echo 'FILES_FINAL=5'
          echo 'TEMP_WORKFLOW_REMOVED=SIM'
