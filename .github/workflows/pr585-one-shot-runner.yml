name: PR585 One-Shot Runner

on:
  pull_request_target:
    types: [labeled]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr585-one-shot-runner
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: >-
      github.event.pull_request.number == 585 &&
      github.event.label.name == 'pr585-autofix' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'segredounlock'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do HEAD exato do PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: Aplicar cirurgia determinística
        run: python scripts/temporary/pr585_fix_operation_receipt.py

      - name: Instalar pytest
        run: python -m pip install pytest

      - name: Validar e testar tudo
        run: |
          set -euo pipefail
          python -m py_compile .agents/skills/meta-lupa/scripts/meta_lupa.py
          python scripts/lupa/validar_autolupa_hash.py
          pytest .agents/skills/meta-lupa/testes -q
          git diff --check

      - name: Remover instrumentos temporários e publicar
        run: |
          set -euo pipefail
          rm -f scripts/temporary/pr585_fix_operation_receipt.py
          rm -f .github/workflows/pr585-autofix-temporary.yml
          git config user.name 'centraldark-one-shot[bot]'
          git config user.email 'centraldark-one-shot[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(meta-lupa): fechar falhas do operation receipt'
          git push origin HEAD:docs/modo-operacional-loop-evidencia-20260731
