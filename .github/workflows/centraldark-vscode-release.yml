name: CentralDark VS Code Release
on:
  push:
    branches: [main]
    paths:
      - "skills/vs-code-restore/package.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: centraldark-vscode-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ServerVpss/CentralDark'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, SHA-256 and release
        working-directory: skills/vs-code-restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="centraldark-vscode-v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ja existe: $TAG"; exit 0
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run compile
          npx --yes @vscode/vsce@4.0.0 package --no-dependencies --allow-missing-repository --out "centraldark-vscode-restore-$VERSION.vsix"
          sha256sum "centraldark-vscode-restore-$VERSION.vsix"
          gh release create "$TAG" "centraldark-vscode-restore-$VERSION.vsix" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CentralDark VS Code $VERSION" \
            --notes "Atualizacao assinada por GitHub release asset SHA-256 e confirmada no VS Code."
