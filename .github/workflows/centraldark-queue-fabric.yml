name: 00 🧿 CENTRALDARK QUEUE FABRIC

on:
  pull_request:
    paths:
      - 'docs/OPERACAO/centraldark-queue-fabric.json'
      - 'scripts/ci/centraldark-queue-fabric.mjs'
      - 'scripts/ci/centraldark-queue-fabric.test.mjs'
      - '.github/workflows/centraldark-queue-fabric.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: centraldark-queue-fabric-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  queue-fabric:
    name: 00 🧿 Queue Fabric / fila canônica e rerun seguro
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test queue fabric
        run: node --test scripts/ci/centraldark-queue-fabric.test.mjs

      - name: Validate queue fabric manifest
        run: node scripts/ci/centraldark-queue-fabric.mjs
