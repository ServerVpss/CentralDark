name: Autonomia — promoção segura

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited, labeled, unlabeled]
    branches: [main]
  workflow_run:
    workflows:
      - porta-de-entrada
      - codex-validate
      - lupa-conformance
      - Lupa Drift Guard
      - PR auto-review (Codex + checklist)
      - Pipeline — Telegram + Painel
    types: [completed]
  repository_dispatch:
    types: [centraldark_autonomia_recheck, centraldark_post_merge]
  schedule:
    - cron: "*/5 * * * *"

permissions: {}

concurrency:
  group: autonomia-promocao-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.event.client_payload.merge_sha || github.ref }}
  cancel-in-progress: false

env:
  BOT_TRUSTED_AUTHORS: segredounlock
  BOT_REQUIRED_WORKFLOWS: porta-de-entrada,codex-validate,lupa-conformance,Lupa Drift Guard,PR auto-review (Codex + checklist),Pipeline — Telegram + Painel

jobs:
  judge:
    name: Juiz read-only — gerar recibos
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
    env:
      BOT_SWEEP_DIR: ${{ runner.temp }}/centraldark-autonomia

    steps:

      - name: Bloquear HEAD de fork no runner persistente
        id: fork_guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "cause=FORK_HEAD" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_FORK_HEAD repo=${HEAD_REPO:-empty}"
            exit 1
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "FORK_GUARD_OK ${HEAD_REPO}"

      - name: Checkout exclusivo da main confiável
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testar juiz, promotor e filtro da varredura
        run: |
          set -euo pipefail
          node --test scripts/github-autonomia-promocao.test.mjs
          node --test scripts/github-autonomia-varredura.test.mjs

      - name: Avaliar PRs autorizados sem capacidade de escrita
        env:
          JUDGE_TOKEN: ${{ github.token }}
        run: node scripts/github-autonomia-varredura.mjs judge

      - name: Publicar recibos do juiz
        uses: actions/upload-artifact@v4
        with:
          name: autonomia-judge-${{ github.run_id }}
          path: ${{ env.BOT_SWEEP_DIR }}
          if-no-files-found: warn
          retention-days: 14


      - name: Receipt determinístico (sempre)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_BLOCKED: ${{ steps.fork_guard.outputs.blocked }}
          FORK_CAUSE: ${{ steps.fork_guard.outputs.cause }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "EXECUTOR=self-hosted"
          echo "ROTA_PRIMARIA=self-hosted-linux"
          echo "ROTA_FALLBACK=BLOCKED_NO_HOSTED"
          echo "JOB_STATUS=${JOB_STATUS}"
          if [ "${FORK_BLOCKED:-}" = "true" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=${FORK_CAUSE:-FORK_HEAD}"
          elif [ "${JOB_STATUS}" = "cancelled" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=CANCELLED_OR_RUNNER_UNAVAILABLE"
          elif [ "${JOB_STATUS}" = "failure" ]; then
            echo "RESULTADO=FAIL"
          elif [ "${JOB_STATUS}" = "success" ]; then
            echo "RESULTADO=PASS"
          else
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=UNKNOWN_STATUS_${JOB_STATUS}"
          fi

          fi
          # UNKNOWN/SKIPPED/empty never promoted as PASS by this receipt alone
  promote:
    name: Promotor — revalidar e promover
    needs: judge
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
    env:
      BOT_SWEEP_DIR: ${{ runner.temp }}/centraldark-autonomia

    steps:

      - name: Bloquear HEAD de fork no runner persistente
        id: fork_guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "cause=FORK_HEAD" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_FORK_HEAD repo=${HEAD_REPO:-empty}"
            exit 1
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "FORK_GUARD_OK ${HEAD_REPO}"

      - name: Checkout exclusivo da main confiável
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar recibos produzidos pelo juiz
        uses: actions/download-artifact@v4
        with:
          name: autonomia-judge-${{ github.run_id }}
          path: ${{ env.BOT_SWEEP_DIR }}

      - name: Promover somente recibos válidos e estado vivo idêntico
        env:
          PROMOTER_TOKEN: ${{ secrets.PROMOTION_TOKEN || github.token }}
        run: node scripts/github-autonomia-varredura.mjs promote

      - name: Publicar resultado sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomia-promote-${{ github.run_id }}
          path: ${{ env.BOT_SWEEP_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Receipt determinístico (sempre)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_BLOCKED: ${{ steps.fork_guard.outputs.blocked }}
          FORK_CAUSE: ${{ steps.fork_guard.outputs.cause }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "EXECUTOR=self-hosted"
          echo "ROTA_PRIMARIA=self-hosted-linux"
          echo "ROTA_FALLBACK=BLOCKED_NO_HOSTED"
          echo "JOB_STATUS=${JOB_STATUS}"
          if [ "${FORK_BLOCKED:-}" = "true" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=${FORK_CAUSE:-FORK_HEAD}"
          elif [ "${JOB_STATUS}" = "cancelled" ]; then
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=CANCELLED_OR_RUNNER_UNAVAILABLE"
          elif [ "${JOB_STATUS}" = "failure" ]; then
            echo "RESULTADO=FAIL"
          elif [ "${JOB_STATUS}" = "success" ]; then
            echo "RESULTADO=PASS"
          else
            echo "RESULTADO=BLOCKED"
            echo "CAUSE=UNKNOWN_STATUS_${JOB_STATUS}"
          fi

          fi
          # UNKNOWN/SKIPPED/empty never promoted as PASS by this receipt alone
