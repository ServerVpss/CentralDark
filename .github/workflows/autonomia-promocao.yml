name: ⚙️ Autonomia — promoção segura

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]
  workflow_run:
    workflows:
      - ⚙️ porta-de-entrada
    types: [completed]
  repository_dispatch:
    types: [centraldark_autonomia_recheck, centraldark_post_merge]

permissions: {}

concurrency:
  group: autonomia-promocao-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.event.client_payload.pr_number || github.event.client_payload.merge_sha || github.ref }}
  cancel-in-progress: true

env:
  BOT_TRUSTED_AUTHORS: segredounlock
  BOT_REQUIRED_WORKFLOWS: ⚙️ porta-de-entrada,⚙️ CentralDark Valida — determinístico,⚙️ lupa-conformance,⚙️ Lupa Drift Guard,🧠 Trigger Fabric Full Package — pacote e contraprova,⚙️ PR Title Contract,⚙️ PR auto-review (CentralDark + checklist),⚙️ Pipeline — Telegram + Painel
  BOT_WAIT_TIMEOUT_MINUTES: "45"

jobs:
  normalize:
    name: 🧩 Normalizador — intenção autorizada não estaciona em Draft
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: 🔹 Checkout exclusivo da main confiável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: 🔹 Setup Node 24 (fast path self-hosted)
        uses: ./.github/actions/setup-node24-selfhosted

      - name: 🔹 Provar política Draft → Ready antes da mutação
        run: node --test scripts/github-autonomia-varredura.test.mjs

      - name: 🔹 Tirar de Draft somente intenção já autorizada
        env:
          BOT_TRUSTED_AUTHORS: segredounlock
          NORMALIZER_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-autonomia-varredura.mjs normalize

      - name: 🔹 Receipt determinístico
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "DRAFT_IS_NOT_DEPENDENCY_SEMAPHORE=1"
          echo "AUTHORIZED_INTENT_DRAFT_AUTO_READY=1"
          echo "EXPLICIT_KEEP_DRAFT_IS_PRESERVED=1"
          echo "JOB_STATUS=${JOB_STATUS}"
          test "${JOB_STATUS}" = "success" && echo "RESULTADO=PASS" || echo "RESULTADO=BLOCKED"

  judge:
    name: 🧩 Juiz determinístico — intenção + estado + segurança
    needs: normalize
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read

    steps:
      - name: 🔹 Checkout exclusivo da main confiável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: 🔹 Setup Node 24 (fast path self-hosted)
        uses: ./.github/actions/setup-node24-selfhosted

      - name: 🔹 Provar presença de canais opcionais sem mostrar valor
        shell: bash
        run: |
          set -euo pipefail
          echo "PROMOTION_TOKEN=${{ secrets.PROMOTION_TOKEN != '' && 'present' || 'absent_active_agent_can_still_promote' }}"
          echo "TELEGRAM=${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' && 'present' || 'absent' }}"
          echo "WEBHOOK=${{ secrets.NOTIFY_WEBHOOK_URL != '' && 'present' || 'absent' }}"

      - name: 🔹 Testar motor canônico e fronteira de autoridade delegada
        run: |
          set -euo pipefail
          node --test scripts/lupa/authority-approval.test.mjs
          node --test scripts/github-autonomia-promocao.test.mjs
          node --test scripts/github-autonomia-varredura.test.mjs
          node --test scripts/github-autonomia-green-guard.test.mjs
          node --test scripts/github-pr-confirmado-label.test.mjs
          node --test scripts/agent-call.test.mjs
          node apps/modulos/HERMES-CORE/core/universal-method-contract.mjs --self-test

      - name: 🔹 Verificar Trigger Fabric canônica antes de qualquer promoção
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/trigger-fabric/verify_repo_contract.py . | tee "$RUNNER_TEMP/trigger-fabric-contract.txt"
          grep -q '^REPO_CONTRACT_VERIFY=PASS$' "$RUNNER_TEMP/trigger-fabric-contract.txt"
          grep -q '^BOT_ENTRY_CONTRACT=PASS$' "$RUNNER_TEMP/trigger-fabric-contract.txt"
          grep -q '^OUTPUT_GUARD_CONTRACT=PASS$' "$RUNNER_TEMP/trigger-fabric-contract.txt"
          grep -q '^WORKFLOW_REUSE_CONTRACT=PASS$' "$RUNNER_TEMP/trigger-fabric-contract.txt"

      - name: 🔹 Avaliar PRs autorizados em read-only
        env:
          BOT_SWEEP_DIR: ${{ runner.temp }}/centraldark-autonomia
          JUDGE_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: node scripts/github-autonomia-varredura.mjs judge

      - name: 🔹 Garantir artifact mesmo sem candidatos elegíveis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/centraldark-autonomia"
          touch "${{ runner.temp }}/centraldark-autonomia/EMPTY"

      - name: 🔹 Publicar recibos do juiz
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autonomia-judge-${{ github.run_id }}
          path: ${{ runner.temp }}/centraldark-autonomia
          if-no-files-found: error
          retention-days: 14

      - name: 🔹 Receipt determinístico
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "EXECUTOR=self-hosted-linux"
          echo "TRIGGER_FABRIC_CONTRACT_REQUIRED=1"
          echo "BOT_ENTRY_CONTRACT_REQUIRED=1"
          echo "OUTPUT_GUARD_CONTRACT_REQUIRED=1"
          echo "WORKFLOW_REUSE_REQUIRED=1"
          echo "NODE24_FAST_PATH=1"
          echo "SCOPE_TEMPERATURE_GATE=HOT_60S+WARM_120S+COLD_TAKEOVER"
          echo "META_LUPA_17_BREATHS_DELTA_MINIMUM=1"
          echo "JOB_STATUS=${JOB_STATUS}"
          test "${JOB_STATUS}" = "success" && echo "RESULTADO=PASS" || echo "RESULTADO=BLOCKED"

  promote:
    name: 🧩 Promotor — revalidar e squash main
    needs: judge
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read

    steps:
      - name: 🔹 Checkout exclusivo da main confiável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: 🔹 Setup Node 24 (fast path self-hosted)
        uses: ./.github/actions/setup-node24-selfhosted

      - name: 🔹 Baixar recibos produzidos pelo juiz
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: autonomia-judge-${{ github.run_id }}
          path: ${{ runner.temp }}/centraldark-autonomia

      - name: 🔹 Isolar receipts investigativos sem selo completo
        shell: bash
        env:
          BOT_SWEEP_DIR: ${{ runner.temp }}/centraldark-autonomia
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readdir, readFile, rm } from "node:fs/promises";
          import { join } from "node:path";

          const dir = process.env.BOT_SWEEP_DIR;
          const names = (await readdir(dir)).filter((name) => /^receipt-pr-\d+\.json$/.test(name)).sort();
          const skipped = [];
          const kept = [];
          const supportedPolicies = new Set([
            "AUTO_SQUASH_IF_CLEAN",
            "GREEN_FIRST",
            "GREEN_FIRST_6_OF_6_THEN_SQUASH",
          ]);

          for (const name of names) {
            const doc = JSON.parse(await readFile(join(dir, name), "utf8"));
            const candidate = doc?.receipt?.candidates?.[0] || {};
            const auth = candidate?.authorization || {};
            const fullPromotionReceipt = Boolean(
              auth.authorized === true
              && (auth.viaBody === true || auth.viaLabel === true)
              && supportedPolicies.has(auth.merge_policy)
              && auth.intent_scope
              && auth.writer
              && auth.writer_scope
            );

            const number = Number(name.match(/^receipt-pr-(\d+)\.json$/)?.[1] || 0);
            if (fullPromotionReceipt) {
              kept.push(number);
              continue;
            }

            skipped.push(number);
            await rm(join(dir, name), { force: true });
            await rm(join(dir, `event-pr-${number}.json`), { force: true });
          }

          console.log(`PROMOTION_RECEIPT_FILTER=PASS kept=${kept.join(",") || "none"} investigation_only=${skipped.join(",") || "none"}`);
          NODE

      - name: 🔹 Aplicar guard proporcional à política escolhida
        env:
          BOT_SWEEP_DIR: ${{ runner.temp }}/centraldark-autonomia
          PROMOTER_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-autonomia-green-guard.mjs

      - name: 🔹 Promover somente recibos válidos e estado vivo idêntico
        env:
          BOT_SWEEP_DIR: ${{ runner.temp }}/centraldark-autonomia
          PROMOTER_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: node scripts/github-autonomia-varredura.mjs promote

      - name: Materializar ✅ PR CONFIRMADO somente após prova observada
        env:
          BOT_SWEEP_DIR: ${{ runner.temp }}/centraldark-autonomia
          PROMOTER_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-pr-confirmado-label.mjs reconcile

      - name: 🔹 Publicar resultado sanitizado
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autonomia-promote-${{ github.run_id }}
          path: ${{ runner.temp }}/centraldark-autonomia
          if-no-files-found: warn
          retention-days: 14

      - name: 🔹 Receipt determinístico
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "EXECUTOR=self-hosted-linux"
          echo "MERGE_METHOD=squash"
          echo "SQUASH_FIXED_POINT=HORN_MONOTONE_CLOSURE"
          echo "SQUASH_ACHILLES_GUARD=FINITE_MONOTONE_PROGRESS"
          echo "SQUASH_SELF_REFERENCE_GUARD=EXTERNAL_FACTS_ONLY_NO_GOAL_SEED"
          echo "SQUASH_SCOPE_VERDICT=PROVED_IN_SCOPE_NOT_ABSOLUTE_TRUTH"
          echo "FAST_GREEN_FIRST_REQUIRED=1"
          echo "ADVERSARIAL_GREEN_FIRST_REQUIRED=1"
          echo "FAST_CAUSAL_GATES=AUTHENTICATED_ACCOUNT+SAME_REPO+INTENT_SCOPE+SECRET_SCAN+CONFLICT+CHANGES_REQUESTED+HEAD_BASE_REVALIDATION"
          echo "REASK=NO_WHEN_INTENT_RECEIPT_VALID"
          echo "PR_CONFIRMED_LABEL=DERIVED_POST_MERGE_ONLY"
          echo "INVESTIGATION_ONLY_RECEIPTS_DO_NOT_FAIL_PROMOTION_BATCH=1"
          echo "TRIGGER_FABRIC_VERIFIED_BY_JUDGE=1"
          echo "NODE24_FAST_PATH=1"
          echo "JOB_STATUS=${JOB_STATUS}"
          test "${JOB_STATUS}" = "success" && echo "RESULTADO=PASS" || echo "RESULTADO=BLOCKED"
