name: Autonomia — promoção segura

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited, labeled, unlabeled]
    branches: [main]
  workflow_run:
    workflows:
      - porta-de-entrada
      - codex-validate
      - lupa-conformance
      - Lupa Drift Guard
      - PR auto-review (Codex + checklist)
      - Pipeline — Telegram + Painel
    types: [completed]
  repository_dispatch:
    types: [centraldark_autonomia_recheck, centraldark_post_merge]
  schedule:
    - cron: "*/5 * * * *"

permissions: {}

concurrency:
  group: autonomia-promocao-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.event.client_payload.merge_sha || github.ref }}
  cancel-in-progress: false

env:
  BOT_TRUSTED_AUTHORS: segredounlock
  BOT_REQUIRED_WORKFLOWS: porta-de-entrada,codex-validate,lupa-conformance,Lupa Drift Guard,PR auto-review (Codex + checklist),Pipeline — Telegram + Painel
  BOT_WAIT_TIMEOUT_MINUTES: "45"

jobs:
  judge:
    name: Juiz read-only — gerar recibos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
    env:
      BOT_SWEEP_DIR: ${{ runner.temp }}/centraldark-autonomia

    steps:
      - name: Checkout exclusivo da main confiável
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Provar presença de segredos (booleano, nunca valor)
        run: |
          set -euo pipefail
          echo "SECRET_PROMOTION_TOKEN=${{ secrets.PROMOTION_TOKEN != '' && 'present' || 'absent' }}"
          echo "SECRET_TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN != '' && 'present' || 'absent' }}"
          echo "SECRET_TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID != '' && 'present' || 'absent' }}"
          echo "SECRET_NOTIFY_WEBHOOK_URL=${{ secrets.NOTIFY_WEBHOOK_URL != '' && 'present' || 'absent' }}"

      - name: Testar juiz, promotor e filtro da varredura
        run: |
          set -euo pipefail
          node --test scripts/github-autonomia-promocao.test.mjs
          node --test scripts/github-autonomia-varredura.test.mjs

      - name: Avaliar PRs autorizados sem capacidade de escrita
        env:
          JUDGE_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: node scripts/github-autonomia-varredura.mjs judge

      - name: Publicar recibos do juiz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomia-judge-${{ github.run_id }}
          path: ${{ env.BOT_SWEEP_DIR }}
          if-no-files-found: warn
          retention-days: 14

  promote:
    name: Promotor — revalidar e promover
    needs: judge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
    env:
      BOT_SWEEP_DIR: ${{ runner.temp }}/centraldark-autonomia

    steps:
      - name: Checkout exclusivo da main confiável
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar recibos produzidos pelo juiz
        uses: actions/download-artifact@v4
        with:
          name: autonomia-judge-${{ github.run_id }}
          path: ${{ env.BOT_SWEEP_DIR }}

      - name: Promover somente recibos válidos e estado vivo idêntico
        env:
          PROMOTER_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: node scripts/github-autonomia-varredura.mjs promote

      - name: Publicar resultado sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomia-promote-${{ github.run_id }}
          path: ${{ env.BOT_SWEEP_DIR }}
          if-no-files-found: warn
          retention-days: 14
