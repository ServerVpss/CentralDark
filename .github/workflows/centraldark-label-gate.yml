name: CENTRALDARK LABEL GATE

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  label-gate:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test raw label gate
        run: node scripts/lupa/label-gate.test.mjs
