name: Test VPS SSH Connection

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY_LOVABLE: ${{ secrets.VPS_SSH_KEY_LOVABLE }}
      VPS_USER_LOVABLE: ${{ secrets.VPS_USER_LOVABLE }}
      VPS_HOST_IP: 89.117.78.124
    steps:
      - name: Checkout repository (not really needed but keeps env)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up SSH agent and add key
        run: |
          mkdir -p ~/.ssh
          eval "$(ssh-agent -s)"
          printf '%s' "$VPS_SSH_KEY_LOVABLE" | ssh-add -
          ssh-keyscan -H $VPS_HOST_IP >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new $VPS_USER_LOVABLE@$VPS_HOST_IP "echo 'SSH connection successful'; hostname"
        env:
          SSH_AUTH_SOCK: ${{ runner.debug }}