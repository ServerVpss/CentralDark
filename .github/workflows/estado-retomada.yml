name: estado-retomada

# Regenera docs/ESTADO-DA-RETOMADA.md a partir de evidencia real do checkout.
# Ninguem edita o arquivo a mao; quem quiser mudar o que e medido muda o script.

on:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]
    paths:
      - 'apps/modulos/mapeamento/config/mapa-canonico.json'
      - 'scripts/estado/gerar-estado-retomada.mjs'
      - '.github/workflows/estado-retomada.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estado-retomada
  cancel-in-progress: false

jobs:
  gerar:
    name: Gerar ESTADO DA RETOMADA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate obrigatório da META LUPA
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          base_ref="$(git rev-parse origin/main)"
          base_sha="$(git rev-parse "$base_ref:.agents/skills/meta-lupa")"
          head_sha="$(git rev-parse HEAD)"
          trusted="$RUNNER_TEMP/meta_lupa_gate.py"
          git show "$base_ref:.agents/skills/meta-lupa/scripts/meta_lupa.py" > "$trusted"
          receipt="$RUNNER_TEMP/meta-lupa-gate.json"
          python3 "$trusted" issue-gate-receipt --repo-root "$GITHUB_WORKSPACE" --repo ServerVpss/CentralDark \
            --mission-id "${GITHUB_WORKFLOW}-${GITHUB_RUN_ID}" --workspace-head "$head_sha" --canonical-ref "$base_ref" \
            --expected-canonical-sha "$base_sha" --output "$receipt"
          python3 "$trusted" gate --repo-root "$GITHUB_WORKSPACE" --input "$receipt" \
            --canonical-ref "$base_ref" --expected-canonical-sha "$base_sha" --expected-head-sha "$head_sha" --operation push

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar estado
        run: node scripts/estado/gerar-estado-retomada.mjs

      - name: Commitar apenas se houver diferenca real
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/ESTADO-DA-RETOMADA.md; then
            echo "ESTADO_INALTERADO=1 - nada a commitar"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ESTADO-DA-RETOMADA.md
          git commit -m "chore(estado): regenerar ESTADO DA RETOMADA [skip ci]"
          git push
