name: estado-retomada

# Regenera docs/ESTADO-DA-RETOMADA.md a partir de evidencia real do checkout.
# Ninguem edita o arquivo a mao; quem quiser mudar o que e medido muda o script.

on:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]
    paths:
      - 'apps/modulos/mapeamento/config/mapa-canonico.json'
      - 'scripts/estado/gerar-estado-retomada.mjs'
      - '.github/workflows/estado-retomada.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estado-retomada
  cancel-in-progress: false

jobs:
  gerar:
    name: Gerar ESTADO DA RETOMADA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar estado
        run: node scripts/estado/gerar-estado-retomada.mjs

      - name: Commitar apenas se houver diferenca real
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/ESTADO-DA-RETOMADA.md; then
            echo "ESTADO_INALTERADO=1 - nada a commitar"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ESTADO-DA-RETOMADA.md
          git commit -m "chore(estado): regenerar ESTADO DA RETOMADA [skip ci]"

          PUSHED=false
          for TRY in 1 2 3; do
            git pull --rebase -X ours origin main
            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi
            echo "ESTADO_PUSH_RETRY=${TRY}"
            sleep 2
          done
          test "$PUSHED" = true || { echo 'ESTADO_RETOMADA_PUSH_FAILED'; exit 1; }
