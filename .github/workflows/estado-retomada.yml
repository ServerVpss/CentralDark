name: estado-retomada

# Regenera docs/ESTADO-DA-RETOMADA.md a partir de evidência real do checkout.
# Ninguém edita o arquivo à mão; quem quiser mudar o que é medido muda o script.

on:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]
    paths:
      - 'apps/modulos/mapeamento/config/mapa-canonico.json'
      - 'scripts/estado/gerar-estado-retomada.mjs'
      - '.github/workflows/estado-retomada.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estado-retomada
  cancel-in-progress: false

jobs:
  gerar:
    name: Gerar ESTADO DA RETOMADA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar estado
        run: node scripts/estado/gerar-estado-retomada.mjs

      - name: Commitar e publicar PR apenas se houver diferença real
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/ESTADO-DA-RETOMADA.md; then
            echo "ESTADO_INALTERADO=1 - nada a publicar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ESTADO-DA-RETOMADA.md
          git commit -m "chore(estado): regenerar ESTADO DA RETOMADA [skip ci]"
          bash scripts/evolucao/publicar-pr-automatico.sh
