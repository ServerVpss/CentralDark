# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: true
language: "pt-BR"
tone_instructions: "PT-BR, direto e baseado em prova. Feche pelo Contrato Unificado de Relato Pivete: veredito, progresso medido, diagnóstico, prova, fluxo visual, próximo gate e ação do CHEFE. Estado incerto nunca vira PASS."
early_access: true
enable_free_tier: true

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  review_progress: true
  fail_commit_status: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: true
  poem: false
  enable_prompt_for_ai_agents: true
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  finishing_touches:
    docstrings:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    unit_tests:
      enabled: false
  path_instructions:
    - path: ".agents/skills/agentic-ci-loop/references/CONTRATO-UNIFICADO-RELATO-PIVETE.md"
      instructions: >-
        Trate este arquivo como fonte única do relato. Verifique ordem, campos,
        percentual medido separado de estimativa, fluxo visual Mermaid em PT-BR,
        comando/coleta únicos e autoria SEGREDO/CHEFE. Bloqueie padrão paralelo.
    - path: ".agents/skills/agentic-ci-loop/**"
      instructions: >-
        Confirme que todo boot carrega o contrato, o validador falha fechado,
        tarefas não ficam sem módulo e modo curto não esconde finding ou risco.
    - path: ".github/pull_request_template.md"
      instructions: >-
        Exija o mesmo Contrato Unificado em todo PR, com prova presa ao HEAD,
        fluxo visual ou NÃO_APLICÁVEL justificado e todos os campos em português.
    - path: "AGENTS.md"
      instructions: >-
        Verifique autoridade, ordem de boot, escritor único, Writer/Judge/Promotor,
        fail-closed e compatibilidade com LEIA-ME-IA.md e a escola agentic.
    - path: "LEIA-ME-IA.md"
      instructions: >-
        Trate como porta canônica. Sinalize autoridade concorrente, fallback
        silencioso, estado antigo como atual ou desvio da escola e do mapa.
    - path: "docs/ARQUITETURA/**"
      instructions: >-
        Confronte com AGENTS.md, LEIA-ME-IA.md e o mapa canônico. Sinalize
        contradições, entrypoints concorrentes e versões V2/V3/NOVO/FINAL/COPY.
    - path: ".github/workflows/**"
      instructions: >-
        Verifique menor privilégio, checkout no SHA esperado, execução em todo
        commit/PR, validação do corpo do PR e ausência de fallback silencioso.
    - path: "scripts/**"
      instructions: >-
        Exija prova reproduzível, timeout, erro fail-closed, sanitização, rollback,
        receipt no HEAD e teste que mate a regressão antes da conclusão.
    - path: "apps/**"
      instructions: >-
        Sinalize duplicação de módulos ou entrypoints, mudança fora do mapa,
        efeitos colaterais sem autorização e regressões de compatibilidade.
    - path: "**/*"
      instructions: >-
        Classifique achados como FACT, INFERENCE ou UNKNOWN. Feche no Contrato
        Unificado. Para fluxo multi-etapa, gere sequenceDiagram em português.
        Se faltar acesso humano, entregue um único coletor read-only em
        E:\CentralDark\Pivete\TEMP. Nunca converta SKIPPED/UNKNOWN em PASS.

chat:
  allow_non_org_members: false
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "LEIA-ME-IA.md"
      - ".agents/skills/agentic-ci-loop/**/*.md"
      - ".github/pull_request_template.md"
      - "docs/ARQUITETURA/**/*.md"
      - "docs/PLANO-MESTRE-RETOMADA-CASA-METALUPA-APIS-NEGOCIOS.md"
  learnings:
    scope: "local"
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
  mcp:
    usage: "disabled"
    disabled_servers: []

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: true
    auto_planning:
      enabled: false
      labels:
        - "plan-me"
        - "!no-plan"
        - "!blocked"
  labeling:
    auto_apply_labels: false
    labeling_instructions:
      - label: "plan-me"
        instructions: >-
          Missão ampla que exige pesquisa, decomposição, ownership, dependências
          e plano agent-ready antes da escrita.
      - label: "blocked"
        instructions: >-
          Dependência, colisão de Writer, ausência de prova crítica ou gate humano
          obrigatório impede avanço seguro.
      - label: "security"
        instructions: >-
          Mudança de credenciais, permissões, exposição, autenticação, sandbox,
          secret scan ou menor privilégio.
      - label: "sol"
        instructions: >-
          Mudança do SOL Desktop, voz, bridge, interface ou experiência voice-first.
      - label: "vps"
        instructions: >-
          Mudança de Linux, Docker, PM2, systemd, Caddy, firewall, Portainer,
          observabilidade ou execução na VPS.
      - label: "delta"
        instructions: >-
          Mudança de Delta, ledger append-only, handoff, receipts, memória ou
          reverificação independente.
