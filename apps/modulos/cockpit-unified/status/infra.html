<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f0c" />
  <title>CentralDark · Infra vivo</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0f0c; --fg:#d8e6dc; --muted:#7a9184; --ok:#3dba74; --bad:#e05a5a; --line:#1c2920; --card:#121a15; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--bg); color: var(--fg); padding: 1.25rem; }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 .25rem; }
    .sub { color: var(--muted); font-size: .8rem; margin-bottom: 1.25rem; }
    .grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .75rem .85rem; }
    .card span { display: block; color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; }
    .card strong { display: block; margin-top: .35rem; font-size: 1.15rem; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    table { width: 100%; border-collapse: collapse; margin-top: 1.25rem; font-size: .78rem; }
    th, td { text-align: left; padding: .4rem .35rem; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    a { color: var(--ok); }
    .err { color: var(--bad); margin: 1rem 0; }
  </style>
</head>
<body>
  <h1>Infra vivo</h1>
  <p class="sub">Estado real da VPS · sem firula · atualiza a cada ~15s · <a href="./">Mega Painel</a></p>
  <div id="err" class="err" hidden></div>
  <div class="grid" id="cards"></div>
  <table>
    <thead><tr><th>PM2</th><th>status</th><th>↺</th><th>mem</th><th>cpu</th></tr></thead>
    <tbody id="pm2"></tbody>
  </table>
  <p class="sub" id="meta" style="margin-top:1.25rem"></p>
  <script>
    async function load() {
      const err = document.getElementById('err');
      try {
        const r = await fetch('./infra-vivo.json?t=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        err.hidden = true;
        const mcpOk = d.mcp && d.mcp.ok;
        const cards = [
          ['PM2 online', (d.pm2?.online ?? '--') + '/' + (d.pm2?.total ?? '--'), d.pm2?.errored ? 'bad' : 'ok'],
          ['Disco', (d.disk?.used_pct ?? '--') + '%', (d.disk?.used_pct ?? 0) >= 85 ? 'bad' : 'ok'],
          ['RAM', (d.mem?.used_pct ?? '--') + '%', (d.mem?.used_pct ?? 0) >= 90 ? 'bad' : 'ok'],
          ['Load 1m', d.load?.['1m'] ?? '--', ''],
          ['MCP', mcpOk ? 'ok' : 'DOWN', mcpOk ? 'ok' : 'bad'],
          ['Fail2ban', (d.fail2ban?.currently_banned ?? '--') + ' bans', ''],
        ];
        document.getElementById('cards').innerHTML = cards.map(([k,v,c]) =>
          `<div class="card"><span>${k}</span><strong class="${c}">${v}</strong></div>`).join('');
        const rows = (d.pm2?.procs || []).slice().sort((a,b)=>a.name.localeCompare(b.name));
        document.getElementById('pm2').innerHTML = rows.map(p =>
          `<tr><td>${p.name}</td><td class="${p.status==='online'?'ok':'bad'}">${p.status}</td><td>${p.restarts}</td><td>${p.mem_mb}MB</td><td>${p.cpu}%</td></tr>`
        ).join('') || '<tr><td colspan="5">sem dados</td></tr>';
        document.getElementById('meta').textContent =
          (d.updatedAtBR || d.updatedAt || '') + ' · ' + (d.host || '') + ' · tele só em movimento (não heartbeat)';
      } catch (e) {
        err.hidden = false;
        err.textContent = 'Falha ao ler infra-vivo.json — rode o snapshot. ' + e.message;
      }
    }
    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
