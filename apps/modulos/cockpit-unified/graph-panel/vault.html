<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>V.A.U.L.T. — CentralDark</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#02120c;overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  #graph{position:fixed;inset:0}
  /* vinheta radial pra dar profundidade neon */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(1,10,7,.75) 100%)}
  .hud{position:fixed;top:22px;left:26px;z-index:10;pointer-events:none;
    color:#6ee7b7;text-shadow:0 0 14px rgba(16,185,129,.65)}
  .hud h1{font-size:clamp(24px,5vw,38px);letter-spacing:.34em;color:#34d399;font-weight:800}
  .hud .sub{font-size:11px;color:#5eead4;letter-spacing:.24em;margin-top:6px;opacity:.85}
  .stats{position:fixed;top:24px;right:26px;z-index:10;text-align:right;
    color:#6ee7b7;font-size:12px;line-height:2;text-shadow:0 0 10px rgba(16,185,129,.5)}
  .stats b{color:#34d399;font-size:16px}
  .legend{position:fixed;bottom:22px;left:26px;z-index:10;display:flex;flex-wrap:wrap;
    gap:7px 15px;max-width:62vw;font-size:11px;color:#9fb8ad}
  .legend span{display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em}
  .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 9px currentColor}
  .foot{position:fixed;bottom:22px;right:26px;z-index:10;font-size:10.5px;
    color:#3f6b5a;text-align:right;line-height:1.7;letter-spacing:.05em}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#34d399;font-size:14px;letter-spacing:.32em;z-index:20;background:#02120c}
  #loading.hide{opacity:0;pointer-events:none;transition:opacity .9s ease}
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
</style>
</head>
<body>
  <div id="graph"></div>
  <div id="vignette"></div>
  <div id="loading" class="pulse">◈ ABRINDO O VAULT ◈</div>
  <div class="hud">
    <h1>V.A.U.L.T.</h1>
    <div class="sub">CENTRALDARK · GRAFO VIVO 3D</div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="legend" id="legend"></div>
  <div class="foot">arraste&nbsp;·&nbsp;gira&nbsp;&nbsp;|&nbsp;&nbsp;scroll&nbsp;·&nbsp;zoom<br>grafo.centralldark.com</div>

  <script src="https://unpkg.com/3d-force-graph"></script>
  <script>
  // Tema Esmeralda — verde ancora + acentos vivos por comunidade
  const PALETTE = {
    raiz:'#10b981', pasta:'#34d399', sh:'#22d3ee', md:'#a3e635', js:'#fbbf24',
    ts:'#38bdf8', json:'#f472b6', py:'#c084fc', tsx:'#2dd4bf', css:'#fb7185',
    html:'#fdba74', yml:'#facc15', yaml:'#facc15'
  };
  const DEF = '#6ee7b7';
  const colorOf = g => PALETTE[g] || DEF;

  fetch('/api/graph')
    .then(r => r.json())
    .then(raw => {
      const nodes = (raw.nodes || []).map(n => ({
        id: n.id, label: n.label || n.id, group: n.group || '?', val: (n.size || 3)
      }));
      const links = (raw.edges || raw.links || []).map(e => ({
        source: e.from || e.source, target: e.to || e.target
      }));
      const groups = [...new Set(nodes.map(n => n.group))];

      document.getElementById('stats').innerHTML =
        `<b>${nodes.length}</b> nós<br><b>${links.length}</b> conexões<br><b>${groups.length}</b> comunidades`;
      document.getElementById('legend').innerHTML = groups.map(g =>
        `<span><i class="dot" style="background:${colorOf(g)};color:${colorOf(g)}"></i>${g}</span>`).join('');

      const Graph = ForceGraph3D()(document.getElementById('graph'))
        .graphData({ nodes, links })
        .backgroundColor('#02120c')
        .showNavInfo(false)
        .nodeColor(n => colorOf(n.group))
        .nodeVal(n => n.val)
        .nodeOpacity(0.95)
        .nodeResolution(14)
        .nodeLabel(n => `<div style="font-family:ui-monospace,monospace;background:#02120cee;`
          + `color:${colorOf(n.group)};padding:4px 9px;border:1px solid ${colorOf(n.group)}66;`
          + `border-radius:5px;font-size:12px">${n.label} · <span style="opacity:.7">${n.group}</span></div>`)
        .linkColor(() => '#10b98144')
        .linkWidth(0.5)
        .linkOpacity(0.4)
        .linkDirectionalParticles(2)
        .linkDirectionalParticleSpeed(0.006)
        .linkDirectionalParticleWidth(1.4)
        .linkDirectionalParticleColor(() => '#5eead4')
        .warmupTicks(80)
        .cooldownTime(7000);

      // rotação viva
      const c = Graph.controls();
      c.autoRotate = true;
      c.autoRotateSpeed = 0.75;

      // pulso sutil no tamanho dos nós (respiração)
      let t = 0;
      (function breathe(){
        t += 0.02;
        Graph.nodeRelSize(4 + Math.sin(t) * 0.5);
        requestAnimationFrame(breathe);
      })();

      Graph.width(innerWidth).height(innerHeight);
      addEventListener('resize', () => Graph.width(innerWidth).height(innerHeight));
      setTimeout(() => document.getElementById('loading').classList.add('hide'), 1000);
    })
    .catch(e => {
      document.getElementById('loading').innerHTML =
        '⚠ falha ao carregar /api/graph<br><small style="opacity:.7">' + e.message + '</small>';
    });
  </script>
</body>
</html>
