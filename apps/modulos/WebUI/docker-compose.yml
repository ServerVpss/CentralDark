services:
  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: CentralDark-WebUI
    environment:
      - WEBUI_NAME=CentralDark AI
      - DEFAULT_LOCALE=pt-BR
      - ENABLE_SIGNUP=false
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
      # Multi-provider OpenAI-compatible: Elite Gateway, Groq, OpenRouter, Gemini
      - OPENAI_API_BASE_URLS=https://api.centralldark.com/v1;https://api.groq.com/openai/v1;https://openrouter.ai/api/v1;https://generativelanguage.googleapis.com/v1beta/openai/
      - OPENAI_API_KEYS=SEGREDO_ELITE_123;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;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;AQ.Ab8RN6LOW8_DIJ7vBdDIfQ-V9p6McU9O4IOxKt-ll9SYnvoYSA
      # Anthropic via Elite Gateway local (rotaciona keys → ap7 → Anthropic)
      - ANTHROPIC_API_BASE_URL=http://host.docker.internal:8082
      - ANTHROPIC_API_KEY=sk-lab-ROTACIONAR-key-foi-exposta
      - WEBUI_SECRET_KEY=
      # Fix database is locked: timeout 30s + pool serializado (1 writer por vez)
      # SQLite + async não tolera concorrência; pool=1 evita disputa de lock no UPDATE user.last_active_at
      - DATABASE_URL=sqlite:////app/backend/data/webui.db?timeout=30
      - DATABASE_POOL_SIZE=1
      - DATABASE_POOL_MAX_OVERFLOW=0
    volumes:
      - open-webui:/app/backend/data
    ports:
      - 0.0.0.0:3000:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      centraldark.app: webui
      centraldark.domain: ui.centralldark.com
    restart: unless-stopped

volumes:
  open-webui:
    external: true
