<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>CentralDark Voice</title>
    <style>
      :root {
        --esm: #10b981;
        --esm2: #34d399;
        --bg: #052e2b;
        --bg2: #0a3d38;
        --tx: #e6fff8;
        --mut: #8fb8ae;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 340px;
        background: var(--bg);
        color: var(--tx);
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
      }
      header {
        padding: 14px 16px;
        background: linear-gradient(135deg, var(--bg2), var(--bg));
        border-bottom: 1px solid var(--esm);
      }
      h1 { margin: 0; font-size: 15px; color: var(--esm2); }
      .sub { color: var(--mut); font-size: 11px; margin-top: 2px; }
      main { padding: 14px 16px; display: grid; gap: 12px; }
      label { display: block; font-size: 11px; color: var(--mut); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
      input, select, textarea {
        width: 100%;
        background: var(--bg2);
        border: 1px solid #164e46;
        color: var(--tx);
        padding: 8px 10px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 13px;
        outline: none;
      }
      input:focus, select:focus, textarea:focus { border-color: var(--esm); }
      textarea { resize: vertical; min-height: 52px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row .grow { flex: 1; }
      button {
        background: var(--esm);
        color: #04211f;
        border: 0;
        padding: 9px 14px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
      }
      button:hover { background: var(--esm2); }
      button.ghost { background: transparent; color: var(--esm2); border: 1px solid var(--esm); }
      .toggle {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 12px; background: var(--bg2); border-radius: 8px;
        border: 1px solid #164e46;
      }
      .switch { position: relative; width: 40px; height: 22px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute; inset: 0; background: #164e46;
        border-radius: 22px; cursor: pointer; transition: .2s;
      }
      .slider::before {
        content: ""; position: absolute; height: 16px; width: 16px;
        left: 3px; top: 3px; background: white; border-radius: 50%; transition: .2s;
      }
      .switch input:checked + .slider { background: var(--esm); }
      .switch input:checked + .slider::before { transform: translateX(18px); }
      .status { font-size: 11px; color: var(--mut); min-height: 14px; }
      .status.ok { color: var(--esm2); }
      .status.erro { color: #f87171; }
    </style>
  </head>
  <body>
    <header>
      <h1>🔊 CentralDark Voice</h1>
      <div class="sub">Voz premium PT-BR no botão do Claude</div>
    </header>
    <main>
      <div class="toggle">
        <div>
          <div style="font-weight:600">Interceptar botão</div>
          <div style="color:var(--mut);font-size:11px">Ligado = usa voz do bridge</div>
        </div>
        <label class="switch">
          <input id="ativo" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>

      <div>
        <label>Chave da bridge (x-api-key)</label>
        <input id="apiKey" type="password" placeholder="cd-webui-..." />
      </div>

      <div>
        <label>Voz</label>
        <div class="row">
          <select id="voz" class="grow">
            <option value="alloy">alloy · neutra padrão</option>
            <option value="nova">nova · feminina clara</option>
            <option value="onyx">onyx · masculina grave</option>
            <option value="shimmer">shimmer · feminina suave</option>
            <option value="echo">echo · masculina neutra</option>
            <option value="fable">fable · masculina jovem</option>
            <option value="ash">ash · masculina firme</option>
            <option value="coral">coral · feminina animada</option>
            <option value="sage">sage · feminina calma</option>
          </select>
          <button id="testar" class="ghost">🔊 testar</button>
        </div>
      </div>

      <div>
        <label>Instruções de estilo (opcional)</label>
        <textarea id="instrucoes"></textarea>
      </div>

      <button id="salvar">💾 Salvar configurações</button>
      <div id="status" class="status"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
