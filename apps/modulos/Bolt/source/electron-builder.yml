# #OBSERVACOES#
# @owner: apps/modulos/Bolt/source/electron-builder.yml
# @doc_ref: docs/INSTALADOR/32-builder-multiplataforma-centraldark.md
# @last_updated: 2026-11-03T18:31:00.000Z
# @implementado: empacotamento Linux .deb/AppImage com desktopName/KDE e Windows NSIS no mesmo aplicativo.
# @pendente: prova de build real no HEAD; sem VPS/deploy nesta missão.
# @estado: SOURCE_ONLY; LINUX_PACKAGING_CONFIGURED; BUILD_NOT_EXECUTED
# @next_cursor: alinhar install.sh, docs e testes; conferir diff.
appId: com.centraldark.desktop
productName: CentralDark
directories:
  buildResources: build
  output: dist
files:
  - build/**/*
  - package.json
  - node_modules/**/*
  - icons/**
  - resources/**
  - electron-update.yml
extraMetadata:
  main: build/electron/main/index.mjs
asarUnpack:
  - resources/**
  - build/client/**/*
  - build/server/**/*
  - electron-update.yml

mac:
  icon: assets/icons/icon.icns
  target:
    - dmg
  identity: null
  category: "public.app-category.developer-tools"
  type: "distribution"
  hardenedRuntime: true
  entitlements: "assets/entitlements.mac.plist"
  entitlementsInherit: "assets/entitlements.mac.plist"
  gatekeeperAssess: false

win:
  icon: assets/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: CentralDark-${version}-Windows-${arch}.${ext}

linux:
  icon: assets/icons/icon.png
  executableName: centraldark-desktop
  syncDesktopName: true
  target:
    - AppImage
    - deb
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
  category: Development

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icons/icon.ico
  uninstallerIcon: assets/icons/icon.ico
  installerHeaderIcon: assets/icons/icon.ico
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CentralDark
  runAfterFinish: true
  artifactName: CentralDark-Setup-${version}-${arch}.${ext}

npmRebuild: false

publish:
  provider: github
  owner: ServerVpss
  repo: CentralDark
  private: true
  releaseType: release

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
