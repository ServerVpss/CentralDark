schema_version: "1.0"
kind: CENTRALDARK_FIXED_POINT_FABRIC
status: CANDIDATE_REQUIRES_SAME_HEAD_PROOF
extends:
  - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/MEGAZORD-CENTRALDARK.yml
  - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/SCREENPIPE-BINDING.yml
  - docs/ARQUITETURA/PROOF-ARCHITECTURE/FIXED_POINT_PR.yml
activation:
  sequence: ["!CENTRALDARK", "#ACORDAR", "!CALIBRAR", "RECONCILIAR", "CONTRAPROVAR", "FIXED_POINT"]
method_bindings:
  fable_loop:
    owner: .agents/skills/fable-loop/SKILL.md
    mode: READ_ONLY_CALIBRATION
    default_routing: false
    may_write_canonical: false
    promotion_gate: META_LUPA_SAME_CONTROL
  meta_lupa:
    owner: .agents/skills/meta-lupa/SKILL.md
    role: FALSIFIER
  meta_multibussola:
    owner: docs/CONSCIENCIA/MULTIBUSSOLA.md
    aliases: ["Meta Bússola", "Meta Bussola", "META_MULTIBUSSOLA"]
    new_engine: false
  metacognicao:
    owner: docs/CONSCIENCIA/METACOGNICAO-OPERACIONAL.md
    role: BELIEF_DELTA_AND_METHOD_REVIEW
authority:
  source_of_truth: github_main
  sensor_only: screenpipe
  runtime_planes: [casa, vps]
  one_writer_per_scope: true
surface_convergence:
  canonical_public_origin: https://centralldark.com
  one_public_origin: true
  one_api_plane: true
  one_mcp_plane: true
  second_backend_for_builder: false
  paths:
    site: /
    app: /app
    builder: /builder
    admin: /admin
    api: /api
    mcp: /mcp
  builder:
    owner: apps/modulos/Bolt/
    public_route: /builder
    backend_authority: canonical_api
    direct_provider_credentials_in_renderer: forbidden
  api:
    existing_owner_to_reconcile: apps/modulos/arsenal-openai-adapter/
    canonical_public_route: /api
    all_external_capabilities_via_api: true
    examples: [models, tts, payments, status, builder-actions, runtime-actions]
    tts:
      canonical_route: /api/tts
      direct_provider_call_from_client: forbidden
      provider_selection: server_side_only
      provider_credentials: server_side_only
      default_language_intent: pt-BR
      provider_alias_key_mismatch: fail_closed
      current_runtime_status: UNKNOWN_UNTIL_REMEASURED
      observed_incident:
        event_type: TTS_PROVIDER_KEY_MISMATCH
        surface: hermes_local
        selected_provider: openai
        observed_key_prefix_class: openrouter_style
        observed_result: HTTP_401_INVALID_API_KEY
        proves:
          - TTS_REQUEST_FAILED
          - PROVIDER_CREDENTIAL_MISMATCH_OBSERVED
        does_not_prove:
          - CANONICAL_API_FAILED
          - OPENAI_PROVIDER_REQUIRED
          - CENTRALDARK_ROUTER_FAILED
  mcp:
    existing_owner: apps/modulos/mcp/
    canonical_public_route: /mcp
    one_server_only: true
    access_scopes: [normal, admin]
    admin_is_scope_not_second_mcp: true
    authorization_must_be_server_side: true
  legacy_routes:
    mode: COMPATIBILITY_ALIAS_UNTIL_PROVEN_UNUSED
    delete_before_consumer_inventory: false
    direct_cutover_without_counterproof: false
    examples:
      - builder.centralldark.com
      - mcp.centralldark.com
      - hub.centralldark.com
      - gateway.centralldark.com
  fixed_point_requires:
    - canonical_origin_reachable
    - builder_route_reachable
    - api_route_reachable
    - tts_via_canonical_api_pass
    - tts_pt_br_pass
    - provider_secret_absent_from_client
    - mcp_normal_scope_pass
    - mcp_admin_scope_pass
    - unauthorized_admin_denied
    - legacy_consumer_inventory_complete
    - no_material_regression
state_library:
  github_webhook:
    signature: hmac_sha256
    dedupe_key: X-GitHub-Delivery
    persisted_projection_only: true
  package_codec:
    encoding: base64
    integrity: sha256
    encryption: false
  consolidation_seal:
    tamper_evident: true
    fail_closed: true
    absolute_admin_immutability_claim: false
  randolf_meta_delta:
    human_alias: RANDOLF
    role: PR_LEDGER_BRIDGE
    new_owner: false
    durable_owner: apps/modulos/fixed-point-fabric/src/centraldark_fixed_point/store.py#record_audit_fact
    reference_owner: .agents/skills/centraldark-operational-method/references/PR-HOUSE-TEMPORAL-RECONCILIATION.md
    same_pr_first: true
    direct_main_write: false
    raw_chain_of_thought_persisted: false
    record_decision_rationale_only: true
    chat_delta_policy:
      every_material_chat_delta_must_be_reconciled: true
      commit_per_message: false
      coalesce_same_session_same_scope: true
      checkpoint_flush: true
      dedupe_before_write: true
      one_writer_per_scope: true
    commit_policy:
      canonical_subject: "🌐 feat(fixed-point): YYYY-MM-DD"
      one_canonical_subject_per_active_pr: true
      repeated_subject_commits_forbidden: true
      same_checkpoint_prefers_amend: true
      rewrite_only_if_head_matches_last_measurement: true
      force_update_requires_same_writer_scope: true
  audit_trail:
    owner: apps/modulos/fixed-point-fabric/src/centraldark_fixed_point/store.py#record_audit_fact
    event_kind: AUDIT_FACT
    hash_chained: true
    one_trail_only: true
    raw_chain_of_thought_persisted: false
    pass_requires_evidence: true
    allowed_statuses: [PASS, FAIL, UNKNOWN, BLOCKED, STALE, CONTRADICTION]
    capture:
      - event_type
      - claim
      - status
      - source
      - methods
      - head_sha
      - writer
      - provider
      - model
      - evidence_refs
      - counterproof_refs
      - blockers
      - belief_delta
    split_claims_required: true
    examples:
      - incident: MODEL_SWITCH_AFTER_ROUTER_API_FAILURE
        facts:
          - claim: SESSION_CONTINUITY
            status: PASS
          - claim: PROVIDER_VALIDATION
            status: BLOCKED
      - incident: TTS_PROVIDER_KEY_MISMATCH
        facts:
          - claim: TTS_REQUEST
            status: FAIL
          - claim: PROVIDER_CREDENTIAL_MATCH
            status: FAIL
          - claim: CANONICAL_API_TTS_PATH_ACTIVE
            status: UNKNOWN
    forbids:
      - raw_chain_of_thought
      - private_reasoning
      - hidden_reasoning
      - screenshot_as_global_truth
      - provider_selected_implies_provider_validated
fixed_point:
  requires:
    - same_candidate_head
    - local_pass
    - vps_pass
    - github_pass
    - screenpipe_recent_data_pass
    - no_unknown_blocked_or_stale
    - two_equal_material_samples
    - hash_chain_valid
    - counterproof_pass
  forbids:
    - unknown_to_pass
    - screenshot_as_global_truth
    - direct_secret_persistence
    - direct_main_write_without_receipt
baseline_guard:
  consolidated_state: READ_ONLY
  view_allowed: true
  candidate_mutation_only: true
  baseline_owner: apps/modulos/fixed-point-fabric/src/centraldark_fixed_point/store.py#last_good_state
  candidate_requires: [fixed_point_reached, counterproof_pass, no_material_regression]
  regression_action: [BLOCK, RECEIPT, ROLLBACK_REQUIRED, PRESERVE_BASELINE]
  rollback_target: LAST_GOOD_STATE
  cli_visibility: [status, rollback]
promotion:
  max_open_prs_to_main: 1
  tracker_reference_keyword: Refs
  tracker_close_keyword_forbidden: Closes
