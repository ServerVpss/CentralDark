schema_version: "1.0"
kind: CENTRALDARK_FIXED_POINT_FABRIC
status: CANDIDATE_REQUIRES_SAME_HEAD_PROOF
extends:
  - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/MEGAZORD-CENTRALDARK.yml
  - docs/ARQUITETURA/CENTRALDARK-TRIGGER-FABRIC/SCREENPIPE-BINDING.yml
  - docs/ARQUITETURA/PROOF-ARCHITECTURE/FIXED_POINT_PR.yml
activation:
  sequence: ["!CENTRALDARK", "#ACORDAR", "!CALIBRAR", "RECONCILIAR", "CONTRAPROVAR", "FIXED_POINT"]
method_bindings:
  fable_loop:
    owner: .agents/skills/fable-loop/SKILL.md
    mode: READ_ONLY_CALIBRATION
    default_routing: false
    may_write_canonical: false
    promotion_gate: META_LUPA_SAME_CONTROL
  meta_lupa:
    owner: .agents/skills/meta-lupa/SKILL.md
    role: FALSIFIER
  meta_multibussola:
    owner: docs/CONSCIENCIA/MULTIBUSSOLA.md
    aliases: ["Meta Bússola", "Meta Bussola", "META_MULTIBUSSOLA"]
    new_engine: false
  metacognicao:
    owner: docs/CONSCIENCIA/METACOGNICAO-OPERACIONAL.md
    role: BELIEF_DELTA_AND_METHOD_REVIEW
authority:
  source_of_truth: github_main
  sensor_only: screenpipe
  runtime_planes: [casa, vps]
  one_writer_per_scope: true
state_library:
  github_webhook:
    signature: hmac_sha256
    dedupe_key: X-GitHub-Delivery
    persisted_projection_only: true
  package_codec:
    encoding: base64
    integrity: sha256
    encryption: false
  consolidation_seal:
    tamper_evident: true
    fail_closed: true
    absolute_admin_immutability_claim: false
  audit_trail:
    owner: apps/modulos/fixed-point-fabric/src/centraldark_fixed_point/store.py#record_audit_fact
    event_kind: AUDIT_FACT
    hash_chained: true
    one_trail_only: true
    raw_chain_of_thought_persisted: false
    pass_requires_evidence: true
    allowed_statuses: [PASS, FAIL, UNKNOWN, BLOCKED, STALE, CONTRADICTION]
    capture:
      - event_type
      - claim
      - status
      - source
      - methods
      - head_sha
      - writer
      - provider
      - model
      - evidence_refs
      - counterproof_refs
      - blockers
      - belief_delta
    split_claims_required: true
    example:
      incident: MODEL_SWITCH_AFTER_ROUTER_API_FAILURE
      facts:
        - claim: SESSION_CONTINUITY
          status: PASS
        - claim: PROVIDER_VALIDATION
          status: BLOCKED
    forbids:
      - raw_chain_of_thought
      - private_reasoning
      - hidden_reasoning
      - screenshot_as_global_truth
      - provider_selected_implies_provider_validated
fixed_point:
  requires:
    - same_candidate_head
    - local_pass
    - vps_pass
    - github_pass
    - screenpipe_recent_data_pass
    - no_unknown_blocked_or_stale
    - two_equal_material_samples
    - hash_chain_valid
    - counterproof_pass
  forbids:
    - unknown_to_pass
    - screenshot_as_global_truth
    - direct_secret_persistence
    - direct_main_write_without_receipt
baseline_guard:
  consolidated_state: READ_ONLY
  view_allowed: true
  candidate_mutation_only: true
  baseline_owner: apps/modulos/fixed-point-fabric/src/centraldark_fixed_point/store.py#last_good_state
  candidate_requires: [fixed_point_reached, counterproof_pass, no_material_regression]
  regression_action: [BLOCK, RECEIPT, ROLLBACK_REQUIRED, PRESERVE_BASELINE]
  rollback_target: LAST_GOOD_STATE
  cli_visibility: [status, rollback]
promotion:
  max_open_prs_to_main: 1
  tracker_reference_keyword: Refs
  tracker_close_keyword_forbidden: Closes
