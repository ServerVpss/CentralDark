schema: centraldark.hub-credential-control-plane.v1
status: CANONICAL_HUB_KNOWLEDGE_CRYSTAL
authority: SEGREDO/CHEFE
owner: MODULES/HUB/
runtime_owner: apps/modulos/hub
mode: HUB_CREDENTIAL_CONTROL_PLANE
purpose: >-
  Fazer do Hub a entrada humana unica para conectar providers, OAuth, API keys,
  rotas publicas, Casa/VPS e auditoria sem espalhar login manual em cada plataforma.

observed_surface:
  source: CHEFE_SCREENSHOT
  hub_health: healthy
  mcp_version: "0.4.0"
  mcp_tools: 126
  mcp_gateway: CONNECTED
  supabase_hub: CONNECTED
  tailscale: OAUTH_ACTIVE
  abacus_api_key: ACTIVE_MASKED
  abacus_models: 180
  login_scopes: [publico, casa, ambos]
  policies: [read_tier1, write_approval_tier2, delete_blocked_tier4]

control_plane:
  one_human_entry: true
  providers_connected_by_hub: true
  direct_platform_login_not_default: true
  route_scope_visible: true
  status_and_logs_visible: true

secret_transit:
  use_secret_only_for_requested_owner: true
  no_secret_echo: true
  no_secret_commit: true
  no_secret_receipt_value: true
  no_secret_memory: true
  no_secret_log_value: true
  mask_suffix_only_when_needed: true
  scrub_controlled_logs_after_use: true
  rotate_or_discard_after_use: true

locks:
  HUB_CONNECTED_NE_PROVIDER_RUNTIME_PASS: true
  OAUTH_ACTIVE_NE_TOOL_CALL_PASS: true
  MODEL_COUNT_NE_MODEL_ROUTE_PASS: true
  HTTP_200_NE_FEATURE_READY: true
  SESSION_EXPIRED_IS_LOGIN_REQUIRED_NOT_FAILURE: true
  TOOL_LISTED_NE_TOOL_ACTIVE: true
  UNKNOWN_IS_NOT_PASS: true

owners:
  module_map: MODULES/HUB/
  runtime_visual: apps/modulos/hub
  connector_components: apps/modulos/hub/src/components/connectors/
  hub_services: apps/modulos/hub/src/services/
  mcp_owner: apps/modulos/mcp
  receipts: MODULES/HUB/receipts/
